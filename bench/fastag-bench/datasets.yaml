# URLs, sizes and sha1 come from the PRIDE Archive API v3
# (https://www.ebi.ac.uk/pride/ws/archive/v3/projects/<PXD>/files/all), resolved 2026-11-03.
# sha256 is given for the derived files used in this study (mzML, mzPeak); they were computed on node data
# (gate inputs.sha256 and a fresh sha256sum). Files without 'url' are derived: 'fastag-bench convert' builds
# them from 'derived_from' when the conversion is automatic (trfp, mzpeak-convert); 'manual' ones need the
# documented route. Species, enzyme and labels follow the PRIDE community-annotated SDRF where one exists.
# The per-run collections are listed outside this file: the species benchmark (48 runs, 37 PXDs) in
# config/species_runs.tsv and the digest/label/alkylation validation (254 runs: 244 validation + 10 added
# non-tryptic) in results/sdrf_truth_runs.tsv. config/public_runs.tsv (scripts/public_runs_manifest.py) gives the
# PRIDE file, https URL, size and PRIDE checksum (where PRIDE has one: 161 of 302) for every one of those runs.
# Checksums marked 'computed 2026-11-04' were taken on our copy because the PRIDE API lists none.
