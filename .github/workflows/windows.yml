name: windows

# Windows, separate from ci.yml on purpose.
#
# OpenMS is built from source here as on the other three platforms: the same
# pinned develop commit (OPENMS_REF, in lockstep with ci.yml), the same
# conda-forge libraries (.github/env/openms.yml), compiled with MSVC. The
# install is cached on the commit, the toolchain and that file's hash; a cold
# build takes about an hour, a cache hit a minute.
#
# The OpenMS cache is saved by an explicit actions/cache/save step right after
# the build, not by actions/cache's post-job hook. That hook is gated on the
# JOB having succeeded (continue-on-error does not change that): the first
# attempt cached OpenMS in the job that also built and tested FASTag, and every
# FASTag-side failure silently dropped the save ("Post Cache ... = skipped"),
# so the next push repaid the full OpenMS build. Up to 1.16.4 a separate job
# (windows-x64-openms) did the restore-or-build; ci.yml's explicit save does
# the same in one job and saves the separate job's runner start on every run.

on:
  push:
    branches: [main]
    tags: ['v*']
  # See ci.yml's identical input. It matters more here: the Windows desktop
  # app has never been built in CI, so a tag would be its first run ever.
  workflow_dispatch:
    inputs:
      gui_dry_run:
        description: 'Build the Windows desktop app without cutting a tag'
        type: boolean
        default: false
      # ci.yml's input of the same name: with gui_dry_run, embed the pinned
      # taxonomy index as a tag build does, so the dry run builds, installs
      # and tests the release-sized installer and zip.
      gui_full_payload:
        description: 'With gui_dry_run: embed the pinned taxonomy index (release-sized installer and zip)'
        type: boolean
        default: false
      # ci.yml's input of the same name: the promotion path of a tag build
      # (the release candidate's installer and zip attached to this DRAFT,
      # then smoke-tested), without a tag. Must start with ci-promotion-test-.
      promote_to:
        description: 'Promotion dry run: attach the release candidate of this tree to this DRAFT release (ci-promotion-test-*); empty = off'
        type: string
        default: ''
      # ci.yml's input of the same name: with promote_to, the full build and
      # test path attached to the draft (the fallback, end to end).
      force_rebuild:
        description: 'With promote_to: build everything as a tag without a candidate would (the fallback), attaching to the draft'
        type: boolean
        default: false
      # Builds and uploads the Windows assets of an EXISTING release from the
      # dispatched ref, e.g. after a Windows-only CI fix landed on main once the
      # tag was cut. The dispatched ref must have the tag's source tree; only
      # .github/ may differ.
      release_tag:
        description: 'Upload the Windows assets to this existing release (vX.Y.Z); empty = none'
        type: string
        default: ''
      # A test-signing policy usually auto-approves and issues from a
      # non-public root, so it proves the PIPELINE -- request, artifact
      # configuration, download, replace -- without burning a human's Approve
      # click or producing a binary anyone could mistake for shippable. Only
      # the HSM release certificate yields a Windows-trusted signature.
      # Empty selects release-signing on a v* tag and test-signing anywhere
      # else, so a plain gui_dry_run never asks for a release signature of a
      # branch build (the signpath-gate step resolves it).
      signing_policy:
        description: 'SignPath signing policy slug (empty: release-signing on a v* tag, test-signing otherwise)'
        type: string
        default: ''
      # Read time of the mzML path at 1, 2 and 4 threads with the mimalloc
      # redirection on and off (MIMALLOC_DISABLE_REDIRECT=1), on a 512 MiB
      # prefix of PXD063151 Proteome_EIF5A.mzML: the check that the allocator
      # still does what output/jpr-paper/WIN-READ-CONTENTION.md measured.
      # About 8 minutes, mostly the download.
      mimalloc_timing:
        description: 'Time the mzML read with the mimalloc redirection on and off'
        type: boolean
        default: false

# Read-only unless a job says otherwise (version and the uploaders read or
# write the release draft).
permissions:
  contents: read

concurrency:
  # A manual dispatch gets its OWN group. Sharing <workflow>-refs/heads/main
  # with ordinary pushes means cancel-in-progress lets the next push to main
  # kill a validation run mid-flight -- which is exactly what happened to the
  # first gui_dry_run on 2026-09-08: cancelled at 2m17s by a push that landed
  # 13 seconds earlier. A dispatch is user-initiated and bounded, so giving it
  # a unique group cannot reintroduce the head-of-line wedge described above.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # The OpenMS this binary is built against: OpenMS/OpenMS develop
  # (3.7.0-dev). Pinned by SHA -- a moving ref would silently change what a
  # release contains -- and part of the cache key. Keep in lockstep with
  # ci.yml.
  OPENMS_REF: 70cebcd14442cecd6bcd9794fb6786d3342cacc6
  # The .NET pins of ci.yml (vendor readers, 1.15.2): the SDK builds the Thermo
  # bridge's managed half (part of the OpenMS cache key), the runtime ships in
  # the bundle. Must move in lockstep with ci.yml.
  DOTNET_SDK_VERSION: "8.0.428"
  DOTNET_RUNTIME_VERSION: "8.0.34"
  THERMO_SMOKE_RAW_SHA256: ad87e20816a6383fa38f4991b3df012d8a05e92c1e67d8e9e1ef0b6a979330f2
  # SignPath PROJECT slug. Empty because no project exists yet.
  #
  # 'OpenMS_Apps' briefly lived here and was wrong: that is the slug of a
  # CERTIFICATE ("OpenMS Apps", X.509, software key store, CSR PENDING), and
  # SignPath's console reports it is "not used in any project". The signing
  # action addresses a project, an artifact configuration and a signing
  # policy; the certificate is bound to the policy inside the console and is
  # never named here.
  #
  # One place, not two: the CLI and the desktop installer both submit signing
  # requests, and they must not be able to drift apart.
  SIGNPATH_PROJECT_SLUG: ''
  # Taxonomy index pins -- MUST stay in lockstep with ci.yml (see the comment
  # there for the bump procedure: new data release first -- as a PRE-RELEASE,
  # or it steals the "Latest" slot and 404s every README download link --
  # then both files).
  TAXDB_TAG: taxonomy-k7-20260901
  TAXDB_SHA256: 520d93229df807e45b0e6fdf4d8d20c7aad95b73952749cb041c3e54de474a4b
  # 'true' where the zip and the installer carry the pinned k-mer index: a v*
  # tag, a release_tag upload, and a gui_dry_run with gui_full_payload.
  FULL_PAYLOAD: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.release_tag != '' || (inputs.promote_to != '' && inputs.force_rebuild) || (inputs.gui_dry_run && inputs.gui_full_payload) }}
  # A release CANDIDATE (ci.yml's RC_CANDIDATE): a full-payload dry run whose
  # installer and zip a v* tag of the same tree attaches instead of building
  # them again (job version, promote-assets).
  RC_CANDIDATE: ${{ inputs.gui_dry_run && inputs.gui_full_payload && 'true' || 'false' }}
jobs:
  # ------------------------------------------------------ release version
  # The ONE place this workflow decides the version the release files carry
  # in their names (FASTag-<version>-windows-x64.zip,
  # FASTag-<version>-gui-windows-x64-setup.exe): release_tag or the v* tag
  # without its v, else project(FASTag VERSION ...) in CMakeLists.txt (a dry
  # run). Same rule as ci.yml's job version: tools/release_assets.sh.
  version:
    name: release version
    runs-on: ubuntu-24.04
    permissions:
      # write: release drafts are visible only with write access
      contents: write
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.rc.outputs.publish }}
      release_id: ${{ steps.rc.outputs.release_id }}
      candidate_attempt: ${{ steps.rc.outputs.run_attempt }}
      manifest_sha256: ${{ steps.rc.outputs.manifest_sha256 }}
      # the signing a release of this run gets, which a candidate must match
      signing_policy: ${{ steps.rc.outputs.signing_policy }}
      # ci.yml's outputs of the same names: promote ('true': the candidate's
      # files are attached instead of built), its run, and the release.
      promote: ${{ steps.rc.outputs.promote }}
      candidate_run: ${{ steps.rc.outputs.run_id }}
      release: ${{ steps.rc.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            CMakeLists.txt
            tools/release_assets.sh
            .github/scripts
          sparse-checkout-cone-mode: false
          # the commit's whole tree, for release_tag's comparison
          fetch-depth: 1
      - id: v
        env:
          TAG: ${{ inputs.release_tag || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
        run: |
          set -euo pipefail
          v=$(tools/release_assets.sh version "$TAG")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "### Release files carry version $v (FASTag-$v-<variant>.<ext>)" >> "$GITHUB_STEP_SUMMARY"
      # ci.yml's release intent, promotion and draft, for Windows:
      #   release: a v* tag push, promote_to's draft, or release_tag (an
      #     upload of the Windows files to an existing, possibly published
      #     release: the explicit repair, whose dispatched ref must carry the
      #     tag's source -- checked here, before anything is built);
      #   promote: a release candidate of this tree whose installer was
      #     signed under the policy this run would sign under (none while
      #     SignPath is unconfigured; release-signing on a tag otherwise);
      #   release_id: the draft ci.yml's job version made (found, waited for,
      #     never created here).
      - name: Release intent, promotion and the draft
        id: rc
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
          IS_TAG_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          PROMOTE_TO: ${{ inputs.promote_to }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          FORCE: ${{ inputs.force_rebuild || (vars.RELEASE_FORCE_REBUILD != '' && vars.RELEASE_FORCE_REBUILD == github.ref_name) }}
          REPAIR: ${{ vars.RELEASE_REPAIR != '' && vars.RELEASE_REPAIR == github.ref_name }}
          DRY: ${{ inputs.gui_dry_run }}
          FULL: ${{ inputs.gui_full_payload }}
          FORCE_INPUT: ${{ inputs.force_rebuild }}
          POLICY_INPUT: ${{ inputs.signing_policy }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
        run: |
          set -euo pipefail
          signs=false
          [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORG_ID" ] && [ -n "$SIGNPATH_PROJECT_SLUG" ] && signs=true
          if [ -n "$PROMOTE_TO" ]; then
            [[ "$PROMOTE_TO" =~ ^ci-promotion-test-[A-Za-z0-9._-]+$ ]] \
              || { echo "::error::promote_to must be a ci-promotion-test-* draft, not '$PROMOTE_TO'"; exit 1; }
            [ "$DRY" != true ] && [ "$FULL" != true ] && [ -z "$RELEASE_TAG" ] \
              || { echo "::error::promote_to replays a tag run; it does not combine with gui_dry_run, gui_full_payload or release_tag"; exit 1; }
            REL=$PROMOTE_TO; PUBLISH=false; export RELEASE_DRAFT_ONLY=1
          elif [ -n "$RELEASE_TAG" ]; then
            [ "$FORCE_INPUT" != true ] || { echo "::error::force_rebuild needs promote_to"; exit 1; }
            # The repair: the dispatched ref has the tag's source (only .github/ may differ).
            git fetch -q --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            git diff --stat "$RELEASE_TAG" HEAD -- . ':(exclude).github' || true
            git diff --quiet "$RELEASE_TAG" HEAD -- . ':(exclude).github' \
              || { echo "::error::$GITHUB_REF differs from $RELEASE_TAG outside .github/"; exit 1; }
            REL=$RELEASE_TAG; PUBLISH=false; FORCE=true; export RELEASE_ALLOW_PUBLISHED=1
          elif [ "$IS_TAG_PUSH" = true ]; then
            REL=$GITHUB_REF_NAME; PUBLISH=true
            [ "$REPAIR" = true ] && export RELEASE_ALLOW_PUBLISHED=1
          else
            [ "$FORCE_INPUT" != true ] || { echo "::error::force_rebuild needs promote_to"; exit 1; }
            { echo "release="; echo "publish=false"; echo "promote=false"; echo "release_id="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The policy this run signs under; a candidate must match it.
          policy=none
          if [ "$signs" = true ]; then policy=${POLICY_INPUT:-release-signing}; fi
          { echo "release=$REL"; echo "publish=$PUBLISH"; echo "signing_policy=$policy"; } >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = true ]; then
            { echo "promote=false"; echo "run_id="; echo "run_attempt="; echo "manifest_sha256="; } >> "$GITHUB_OUTPUT"
          else
            RC_META="windows_signing_policy=$policy" bash .github/scripts/release-candidate.sh "$RUNNER_TEMP/rc"
            if [ -n "$PROMOTE_TO" ] && ! grep -qx 'promote=true' "$GITHUB_OUTPUT"; then
              echo "::error::promote_to: no release candidate of this tree (see above)"; exit 1
            fi
          fi
          id=$(RELEASE_WAIT=600 bash .github/scripts/release-draft.sh find "$REL")
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "### $REL: release $id (Windows signing: $policy)" >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------- FASTag
  #
  # Everything expensive is a cache restore here: the conda env and the
  # OpenMS install.
  windows-x64:
    name: windows-x64 build
    if: needs.version.outputs.promote != 'true'
    runs-on: windows-2022
    needs: [version]
    # read only: job release-assets attaches the assets, after job
    # installed-app checked them.
    permissions:
      contents: read
      # read: SignPath fetches the unsigned artifacts through the run's token
      actions: read
    outputs:
      signed: ${{ steps.signpath-gate.outputs.enabled }}
      signing_policy: ${{ steps.ship.outputs.policy }}
      signer: ${{ steps.ship.outputs.signer }}
    env:
      ASSET_VERSION: ${{ needs.version.outputs.version }}
      FASTAG_BUILD_TARGET: FASTag
    # SignPath's release signing policy requires a human to click Approve in
    # SignPath's own UI (wait-for-completion: true blocks on it, deliberately
    # -- an anti-supply-chain control, not a bug), twice per release, and each
    # signing step waits up to 30 minutes for it. An unsigned tag build takes
    # ~35 minutes, so both full waits fit beside a cold OpenMS build.
    # 240: a cold OpenMS build (about an hour, see "Build and install OpenMS")
    # on top of the run below.
    timeout-minutes: 240

    steps:
      - &w01
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: fastag

      - &w02
        name: Check the dispatched ref has the release tag's source
        if: inputs.release_tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git -C fastag fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git -C fastag diff --stat "$TAG" HEAD -- . ':(exclude).github'
          git -C fastag diff --quiet "$TAG" HEAD -- . ':(exclude).github' || {
            echo "::error::$GITHUB_REF differs from $TAG outside .github/"; exit 1; }

      # $GITHUB_WORKSPACE on Windows is backslash-separated (D:\a\FASTag\FASTag).
      # Concatenating it with a forward-slash suffix (as every path below does)
      # produces a path the filesystem tolerates fine but CMake does not
      # everywhere: CMake's string escaping rejects '\a' as an unknown escape
      # sequence -- "Invalid character escape '\a'". Every path derived from
      # GITHUB_WORKSPACE in this job uses $WS instead, normalized once here.
      - &w03
        name: Normalize workspace path to forward slashes
        shell: bash
        run: echo "WS=${GITHUB_WORKSPACE//\\//}" >> "$GITHUB_ENV"

      - &w04
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64

      # OpenMS: restored from the cache, or built from source (about an hour)
      # and saved at once, right after it is installed and before any FASTag
      # step (see "Save OpenMS" below).
      - &w05
        name: Restore OpenMS install
        id: openms-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: openms-install
          key: windows-x64-openms-${{ env.OPENMS_REF }}-msvc2022-${{ hashFiles('fastag/.github/env/openms.yml') }}-vendor-dotnet${{ env.DOTNET_SDK_VERSION }}-v1

      - &w06
        name: Install the dependencies
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: fastag/.github/env/openms.yml
          init-shell: bash
          cache-environment: true

      - &w07
        name: Check out OpenMS at the pinned commit
        if: steps.openms-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git init -q openms-src
          cd openms-src
          git remote add origin https://github.com/OpenMS/OpenMS.git
          # GitHub serves a reachable commit by SHA; if that is ever refused,
          # fetch develop shallow and deepen until the commit is there.
          if ! git fetch -q --depth 1 origin "$OPENMS_REF"; then
            git fetch -q --depth 1 origin develop
            for _ in 1 2 3 4 5 6 7 8; do
              git cat-file -e "$OPENMS_REF^{commit}" 2>/dev/null && break
              git fetch -q --deepen=500 origin develop
            done
          fi
          git checkout -q "$OPENMS_REF"
          test -f src/openms/include/OpenMS/FORMAT/MzPeakFile.h
          # libOpenMS turns MSVC's unused-parameter/-variable warnings into
          # errors, and LPWrapper.cpp includes the HiGHS headers OpenMS fetches,
          # which have unused parameters (C4100 in Highs.h). Warnings only:
          # they stay warnings here.
          grep -q '"/we4100"' src/openms/CMakeLists.txt
          sed -i -e 's#"/we4100"#"/w14100"#' -e 's#"/we4189"#"/w14189"#' src/openms/CMakeLists.txt

      # The .NET SDK the Thermo bridge's managed half is built with (ci.yml).
      - &w08
        name: Install the .NET SDK (OpenMS Thermo bridge)
        if: steps.openms-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP\dotnet-install.ps1"
          & "$env:RUNNER_TEMP\dotnet-install.ps1" -Version $env:DOTNET_SDK_VERSION -InstallDir "$env:RUNNER_TEMP\dotnet-sdk" -NoPath
          & "$env:RUNNER_TEMP\dotnet-sdk\dotnet.exe" --info | Select-Object -First 20

      - &w09
        name: Build and install OpenMS
        if: steps.openms-cache.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          DN="${RUNNER_TEMP//\\//}/dotnet-sdk"
          export DOTNET_ROOT="$DN" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1
          # conda's Windows packages live under Library/. Forward slashes:
          # CMake treats a backslash in a quoted path as an escape.
          # Not LIB: that is MSVC's library search path, and overwriting it
          # leaves link.exe without kernel32.lib.
          CLIB="${CONDA_PREFIX//\\//}/Library"
          WS="${GITHUB_WORKSPACE//\\//}"
          # Git's /usr/bin/link shadows MSVC's link.exe in this login shell.
          CLDIR=$(dirname "$(which cl)"); export PATH="$CLDIR:$PATH"
          # The flags of ci.yml's OpenMS build, with the conda prefix spelled
          # out for Windows. LibXml2 is named directly: CMake's FindLibXml2
          # does not find conda-forge's Windows layout on its own.
          cmake -S openms-src -B openms-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_INSTALL_PREFIX="$WS/openms-install" \
            -DCMAKE_PREFIX_PATH="$CLIB" \
            -DLIBXML2_INCLUDE_DIR="$CLIB/include/libxml2" \
            -DLIBXML2_LIBRARY="$CLIB/lib/libxml2.lib" \
            -DOPENMS_USE_VCPKG=OFF \
            -DOPENMS_ENABLE_MZPEAK=ON \
            -DARROW_USE_STATIC=OFF \
            -DWITH_GUI=OFF -DPYOPENMS=OFF -DENABLE_DOCS=OFF -DHAS_XSERVER=OFF \
            -DWITH_OPENTIMS=ON -DWITH_THERMO_RAW=ON \
            -DDOTNET_EXECUTABLE="$DN/dotnet.exe" \
            -DMT_ENABLE_OPENMP=ON -DMT_REQUIRE_OPENMP=ON \
            -DBUILD_TOPP_TOOLS=OFF \
            -DINSTALL_OPENMS_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF
          cmake --build openms-build --parallel
          cmake --install openms-build

      - &w10
        name: Verify the OpenMS install
        shell: bash
        run: |
          set -euo pipefail
          CFG=$(find openms-install -name 'OpenMSConfig.cmake' 2>/dev/null | head -1)
          [ -n "$CFG" ] || { echo "::error::No OpenMSConfig.cmake after install."; exit 1; }
          echo "found: $CFG"
          find openms-install -name 'OpenMSCLITargets.cmake' | grep -q . \
            || { echo "::error::No OpenMS_CLI targets after install."; exit 1; }
          HDR=$(find openms-install -name 'MzPeakFile.h' 2>/dev/null | head -1)
          [ -n "$HDR" ] || { echo "::error::OpenMS installed without MzPeakFile.h"; exit 1; }
          grep -q "void store(" "$HDR"
          find openms-install -type d -path '*/share/OpenMS' | grep -q . \
            || { echo "::error::No share/OpenMS after install."; exit 1; }
          # The vendor readers (1.15.2): the Thermo bridge's managed half and
          # Thermo's licence in share/OpenMS, which the bundle copies.
          find openms-install -path '*/share/OpenMS/openms_thermo_bridge/managed/ThermoWrapperManaged.dll' | grep -q . \
            || { echo "::error::No Thermo bridge managed files in share/OpenMS."; exit 1; }
          find openms-install -path '*/share/OpenMS/LICENSES/ThermoRawFileReader-License.doc' | grep -q . \
            || { echo "::error::No ThermoRawFileReader-License.doc in share/OpenMS."; exit 1; }
          find openms-install -name 'BrukerTimsFile.h' | grep -q . \
            || { echo "::error::OpenMS installed without the timsTOF reader."; exit 1; }

      # Saved at once, once verified and before anything of FASTag's runs: a later failure in
      # this job cannot throw the hour-long build away (actions/cache's own
      # post-job save runs only for a successful job -- the reason this was a
      # job of its own until 1.16.5).
      - &w11
        name: Save OpenMS
        if: steps.openms-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: openms-install
          key: windows-x64-openms-${{ env.OPENMS_REF }}-msvc2022-${{ hashFiles('fastag/.github/env/openms.yml') }}-vendor-dotnet${{ env.DOTNET_SDK_VERSION }}-v1

      - &w12
        name: Configure conda paths
        shell: bash -el {0}
        run: echo "CONDA_LIB_PREFIX=${CONDA_PREFIX//\\//}/Library" >> "$GITHUB_ENV"

      # The mzPeak fixture of OpenMS's own tests at the pinned commit (34 MS2
      # spectra, written by the reference converter): smoke runs and the
      # validator's control, as in ci.yml.
      - &w13
        name: Fetch the mzPeak test archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-data
          curl -fsSL --retry 3 -o ci-data/small.mzpeak \
            "https://raw.githubusercontent.com/OpenMS/OpenMS/$OPENMS_REF/src/tests/class_tests/openms/data/MzPeakFile_small.mzpeak"
          echo "5af157f1744d13502dbc8f7103ad0d01c4ba5ecc528087756aa09ed75d4b4087  ci-data/small.mzpeak" | sha256sum -c -
          # A Thermo .raw from OpenMS's test data (ci.yml's THERMO_SMOKE_RAW).
          curl -fsSL --retry 3 -o ci-data/thermo-smoke.raw \
            "https://raw.githubusercontent.com/OpenMS/OpenMS/$OPENMS_REF/src/tests/topp/THIRDPARTY/ginkgotoxin-ms-switching.raw"
          echo "$THERMO_SMOKE_RAW_SHA256  ci-data/thermo-smoke.raw" | sha256sum -c -

      # The .NET runtime the Thermo reader runs on, pinned, on every run
      # (ci.yml): ctest uses it through DOTNET_ROOT, the bundle copies it.
      - &w14
        name: Install the .NET runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP\dotnet-install.ps1"
          & "$env:RUNNER_TEMP\dotnet-install.ps1" -Runtime dotnet -Version $env:DOTNET_RUNTIME_VERSION -InstallDir "$env:RUNNER_TEMP\dotnet-rt" -NoPath
          Get-ChildItem "$env:RUNNER_TEMP\dotnet-rt\shared\Microsoft.NETCore.App"
          $rt = "$env:RUNNER_TEMP\dotnet-rt" -replace '\\', '/'
          "DOTNET_RT=$rt" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "DOTNET_ROOT=$env:RUNNER_TEMP\dotnet-rt" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "DOTNET_CLI_TELEMETRY_OPTOUT=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - &w15
        name: Locate OpenMSConfig.cmake
        shell: bash
        run: |
          set -euo pipefail
          # Wherever the install put the package (lib/cmake/OpenMS on the
          # other platforms; older OpenMS split it on Windows), the directory
          # holding OpenMSTargets.cmake is the one to hand to find_package:
          # the targets file computes its prefix from its own location.
          TARGETS_FILE=$(find "$WS/openms-install" -name 'OpenMSTargets.cmake' 2>/dev/null | head -1)
          [ -n "$TARGETS_FILE" ] || { echo "::error::No OpenMSTargets.cmake in the restored cache."; exit 1; }
          OPENMS_DIR=$(dirname "$TARGETS_FILE")
          CFG=$(find "$WS/openms-install" -name 'OpenMSConfig.cmake' 2>/dev/null | head -1)
          [ -n "$CFG" ] || { echo "::error::No OpenMSConfig.cmake in the restored cache."; exit 1; }
          CFG_DIR=$(dirname "$CFG")
          if [ "$CFG_DIR" != "$OPENMS_DIR" ]; then
            cp -v "$CFG" "$CFG_DIR/OpenMSConfigVersion.cmake" "$OPENMS_DIR/"
          fi
          echo "OPENMS_DIR=$OPENMS_DIR" >> "$GITHUB_ENV"

      - &w16
        name: Configure FASTag
        shell: bash -el {0}
        run: |
          if [ "${TESTS_REUSED:-}" = true ]; then echo "tests reused from an identical tree: nothing to build here"; exit 0; fi
          set -o pipefail
          CLDIR=$(dirname "$(which cl)"); export PATH="$CLDIR:$PATH"
          cmake -S fastag -B fastag/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DOpenMS_DIR="$OPENMS_DIR" \
            -DCMAKE_PREFIX_PATH="$WS/openms-install;$CONDA_LIB_PREFIX" \
            -DLIBXML2_INCLUDE_DIR="$CONDA_LIB_PREFIX/include/libxml2" \
            -DLIBXML2_LIBRARY="$CONDA_LIB_PREFIX/lib/libxml2.lib" 2>&1 | tee configure.log
          grep -q "FASTag: OpenMP" configure.log || { echo "::error::OpenMP was not found -- this build would be serial"; exit 1; }
          # FASTAG_MIMALLOC is on by default with MSVC; a configure that
          # silently lost it would ship the slow heap (see CMakeLists.txt).
          grep -q "FASTag: mimalloc" configure.log || { echo "::error::mimalloc is not linked (FASTAG_MIMALLOC off?)"; exit 1; }

      - &w17
        name: Build FASTag
        shell: bash -el {0}
        run: |
          # The build job builds the CLI alone (FASTAG_BUILD_TARGET=FASTag; its
          # mimalloc DLLs come with it); the test job builds everything ctest runs.
          if [ "${TESTS_REUSED:-}" = true ]; then echo "tests reused from an identical tree: nothing to build here"; exit 0; fi
          CLDIR=$(dirname "$(which cl)"); export PATH="$CLDIR:$PATH"
          cmake --build fastag/build --parallel ${FASTAG_BUILD_TARGET:+--target "$FASTAG_BUILD_TARGET"}

      # Windows has no RPATH: the loader searches only the .exe's own
      # directory and PATH, so every test binary that links OpenMS needs the
      # OpenMS and conda DLL directories on PATH (STATUS_DLL_NOT_FOUND,
      # 0xc0000135, otherwise).
      - &w18
        name: Add runtime DLL directories to PATH
        shell: bash
        run: |
          echo "$WS/openms-install/bin" >> "$GITHUB_PATH"
          echo "$CONDA_LIB_PREFIX/bin" >> "$GITHUB_PATH"

      # mzPeakValidator, for every archive this job writes: ctest's
      # mzpeak_validate (the round-trip archives) and the bundle check below.
      # Installed with setup-python's OWN interpreter into its own prefix,
      # deliberately not the conda env: pulling a Python pyarrow into that
      # solve would couple an unrelated tool to the build environment. The requirements file pins the
      # validator to a commit AND its engine to exact versions (see the file
      # for why and how to move the pin), and doubles as the pip cache key.
      # --only-binary: every compiled dependency has a wheel for all five
      # targets, and a source build here would be a silent multi-minute
      # detour on a runner without a compiler for it.
      - &w19
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: validator-python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fastag/test/mzpeak-validator-requirements.txt
      - &w20
        name: Install mzPeakValidator
        shell: bash
        env:
          PY: ${{ steps.validator-python.outputs.python-path }}
        run: |
          if [ "${TESTS_REUSED:-}" = true ]; then echo "tests reused from an identical tree: nothing to build here"; exit 0; fi
          set -euo pipefail
          PY="${PY//\\//}"
          for attempt in 1 2 3; do
            "$PY" -m pip install -q --only-binary=:all: -r fastag/test/mzpeak-validator-requirements.txt && break
            [ "$attempt" -lt 3 ] || { echo "::error::pip could not install mzPeakValidator after 3 attempts"; exit 1; }
            echo "pip install failed (attempt $attempt); retrying in 15 s"; sleep 15
          done
          # The console script sits next to the interpreter (bin/ on Unix,
          # Scripts/ on Windows). An absolute path goes into the environment
          # so the conda-activating test shell cannot resolve a different one.
          D=$(dirname "$PY")
          if [ -x "$D/mzpeak-validate" ]; then V="$D/mzpeak-validate"
          elif [ -x "$D/Scripts/mzpeak-validate.exe" ]; then V="$D/Scripts/mzpeak-validate.exe"
          else echo "::error::mzpeak-validate not found next to $PY"; ls "$D" "$D/Scripts" 2>/dev/null; exit 1; fi
          "$V" --help >/dev/null
          echo "MZPEAK_VALIDATE=$V" >> "$GITHUB_ENV"
          echo "validator: $V"

      # Not part of Test, so a tag build that reuses an earlier test run still
      # reads both vendor formats with the binary it built.
      - name: Read the vendor test files with the built binary
        shell: bash
        run: |
          set -o pipefail
          # The same OpenMS share data as the Test step.
          SHARE=$(find "$WS/openms-install" -type d -path '*/share/OpenMS' 2>/dev/null | head -1)
          [ -n "$SHARE" ] && export OPENMS_DATA_PATH="$SHARE" && echo "OPENMS_DATA_PATH=$SHARE"
          # The binary reads both formats for real.
          ./fastag/build/FASTag.exe -in fastag/test/fixtures/bruker/PXD040281_SA_02_trim.d -out /tmp/ci-bruker.tsv -threads 2 > /tmp/ci-bruker.log 2>&1 \
            || { cat /tmp/ci-bruker.log; echo "::error::the build cannot read the Bruker fixture"; exit 1; }
          grep -E "Bruker timsTOF input: [1-9][0-9]* MS2 spectra" /tmp/ci-bruker.log \
            || { cat /tmp/ci-bruker.log; echo "::error::no MS2 spectra read from the Bruker fixture"; exit 1; }
          ./fastag/build/FASTag.exe -in ci-data/thermo-smoke.raw -out /tmp/ci-thermo.tsv -threads 2 > /tmp/ci-thermo.log 2>&1 \
            || { cat /tmp/ci-thermo.log; echo "::error::the build cannot read a Thermo .raw"; exit 1; }
          grep -E "Thermo .raw input: [1-9][0-9]* scans indexed" /tmp/ci-thermo.log \
            || { cat /tmp/ci-thermo.log; echo "::error::no scans read from the Thermo .raw"; exit 1; }

      - name: Smoke-test the binary
        shell: bash
        run: |
          # The build-tree binary finds share/OpenMS only through the
          # environment, as in the Test step (the bundle is checked below).
          SHARE=$(find "$WS/openms-install" -type d -path '*/share/OpenMS' 2>/dev/null | head -1)
          [ -n "$SHARE" ] || { echo "::error::no share/OpenMS in the OpenMS install"; exit 1; }
          export OPENMS_DATA_PATH="$SHARE"
          ./fastag/build/FASTag.exe --help
          # mzPeak read, asserted exactly as on the other platforms: 34 MS2
          # spectra in OpenMS's own fixture.
          OUT=$(./fastag/build/FASTag.exe -in ci-data/small.mzpeak -out /tmp/smoke-mzpeak.tsv \
                  -threads 2 -fragment_tolerance 20 -fragment_tolerance_unit ppm 2>&1) || { echo "$OUT"; exit 1; }
          echo "$OUT" | grep -q "34 MS2 spectra" || { echo "$OUT"; echo "::error::expected 34 MS2 spectra from small.mzpeak"; exit 1; }

      # Dispatch input mimalloc_timing only: the read-path timing of
      # output/jpr-paper/WIN-READ-CONTENTION.md (exp/win-read-contention),
      # cut down to the build-tree binary with the redirection on ("mi") and
      # off ("off", MIMALLOC_DISABLE_REDIRECT=1, i.e. the CRT heap): read
      # thread-seconds at 1 thread (one logical CPU), 2 threads on two
      # physical cores, and 4 threads unpinned, 3 repetitions each, on the
      # first 512 MiB of PXD063151 Proteome_EIF5A.mzML (65,304 MS2 spectra,
      # uncompressed arrays). Tags must be identical across all runs.
      - name: Fetch a prefix of Proteome_EIF5A.mzML (mimalloc timing)
        if: inputs.mimalloc_timing
        shell: bash
        env:
          MZML_URL: https://ftp.pride.ebi.ac.uk/pride/data/archive/2025/08/PXD063151/Proteome_EIF5A.mzML
          PART_BYTES: '33554432'
          PARTS: '16'
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/data"; mkdir -p "$D/parts"
          start=$(date +%s); pids=()
          for i in $(seq 0 $((PARTS - 1))); do
            s=$((i * PART_BYTES)); e=$((s + PART_BYTES - 1))
            curl -fsS --retry 10 --retry-all-errors --connect-timeout 30 -r "$s-$e" -o "$D/parts/p$(printf %02d "$i")" "$MZML_URL" &
            pids+=($!)
          done
          fail=0; for p in "${pids[@]}"; do wait "$p" || fail=1; done
          [ "$fail" = 0 ] || { echo "::error::a range download failed"; exit 1; }
          for f in "$D"/parts/p*; do [ "$(stat -c %s "$f")" = "$PART_BYTES" ] || { echo "::error::$f has the wrong size"; exit 1; }; done
          cat "$D"/parts/p* > "$D/prefix.bin"; rm -rf "$D/parts"
          echo "download: $(( $(date +%s) - start )) s"
          cat > "$RUNNER_TEMP/cut.py" <<'PY'
          import hashlib, re, sys
          data = open(sys.argv[1], 'rb').read()
          end = data.rfind(b'</spectrum>')
          body = data[:end + len(b'</spectrum>')]
          n = body.count(b'<spectrum ')
          m = re.search(rb'<spectrumList count="(\d+)"', body[:200000])
          body = body[:m.start(1)] + str(n).encode() + body[m.end(1):]
          out = body + b'\n</spectrumList>\n</run>\n</mzML>\n'
          if b'<indexedmzML' in body[:4096]:
              out += b'</indexedmzML>\n'
          open(sys.argv[2], 'wb').write(out)
          print('prefix_sha256', hashlib.sha256(data).hexdigest(), 'subset_sha256', hashlib.sha256(out).hexdigest(), 'spectra', n)
          PY
          python -I "$RUNNER_TEMP/cut.py" "$D/prefix.bin" "$D/subset.mzML"
          rm -f "$D/prefix.bin"

      - name: Time the mzML read with mimalloc on and off
        if: inputs.mimalloc_timing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @'
          using System; using System.Runtime.InteropServices;
          public static class PM {
            [StructLayout(LayoutKind.Sequential)] public struct SLPI { public UIntPtr ProcessorMask; public int Relationship; public ulong R1; public ulong R2; }
            [DllImport("kernel32.dll", SetLastError=true)] public static extern bool GetLogicalProcessorInformation(IntPtr buf, ref uint len);
            public static long[] CoreMasks() {
              uint len = 0; GetLogicalProcessorInformation(IntPtr.Zero, ref len);
              IntPtr b = Marshal.AllocHGlobal((int)len);
              var res = new System.Collections.Generic.List<long>();
              if (GetLogicalProcessorInformation(b, ref len)) {
                int sz = Marshal.SizeOf(typeof(SLPI));
                for (int o = 0; o + sz <= len; o += sz) {
                  var s = (SLPI)Marshal.PtrToStructure(IntPtr.Add(b, o), typeof(SLPI));
                  if (s.Relationship == 0) res.Add((long)s.ProcessorMask.ToUInt64());
                }
              }
              Marshal.FreeHGlobal(b);
              return res.ToArray();
            }
          }
          '@
          $ws = $env:GITHUB_WORKSPACE
          $O = "$ws\mimalloc-timing"; New-Item -ItemType Directory -Force "$O\logs" | Out-Null
          $exe = "$ws\fastag\build\FASTag.exe"
          $IN = "$env:RUNNER_TEMP\data\subset.mzML"
          $share = (Get-ChildItem "$ws\openms-install" -Recurse -Directory | Where-Object { $_.FullName -match '\\share\\OpenMS$' } | Select-Object -First 1).FullName
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $cores = [PM]::CoreMasks()
          "cpu: $($cpu.Name) cores=$($cpu.NumberOfCores) logical=$($cpu.NumberOfLogicalProcessors); core masks: $(($cores | ForEach-Object { '0x{0:x}' -f $_ }) -join ' ')" | Tee-Object "$O\machine.txt"
          function Low([long]$m) { return $m -band (-$m) }
          $one = Low $cores[0]
          $two = if ($cores.Count -ge 2) { (Low $cores[0]) -bor (Low $cores[1]) } else { 0 }
          $matched = @('-tag_length', '3', '-gaps', '0', '-no_deisotope', '-max_tags', '50', '-max_peaks', '100', '-peaks_per_window', '0',
                       '-fragment_tolerance', '0.02', '-fragment_tolerance_unit', 'Da', '-fixed_modifications', '')
          $res = "$O\results.tsv"
          "variant`tthreads`tmask`trep`twall_s`tuser_s`tkernel_s`tread_s`ttag_s`tspectra`tredirected`tout_sha256" | Set-Content $res
          function Num([string]$t, [string]$pat) { $m = [regex]::Match($t, $pat); if ($m.Success) { $m.Groups[1].Value } else { '' } }
          function Run([string]$v, [int]$t, [long]$mask, [int]$rep) {
            $tag = "${v}_t${t}_r$rep"; $out = "$env:RUNNER_TEMP\$tag.tsv"
            $psi = [Diagnostics.ProcessStartInfo]::new($exe)
            foreach ($a in @('-in', $IN, '-out', $out, '-threads', "$t") + $matched) { $psi.ArgumentList.Add($a) }
            $psi.UseShellExecute = $false; $psi.RedirectStandardOutput = $true; $psi.RedirectStandardError = $true
            $psi.Environment['OPENMS_DATA_PATH'] = $share; $psi.Environment['OPENBLAS_NUM_THREADS'] = '1'; $psi.Environment['FASTAG_TIMING'] = '1'
            if ($v -eq 'off') { $psi.Environment['MIMALLOC_DISABLE_REDIRECT'] = '1' }
            $sw = [Diagnostics.Stopwatch]::StartNew(); $p = [Diagnostics.Process]::Start($psi)
            if ($mask -ne 0) { $p.ProcessorAffinity = [IntPtr]$mask }
            $so = $p.StandardOutput.ReadToEndAsync(); $se = $p.StandardError.ReadToEndAsync(); $p.WaitForExit(); $sw.Stop()
            $text = $so.Result + $se.Result; $text | Set-Content "$O\logs\$tag.log"
            if ($p.ExitCode -ne 0) { Write-Host $text; throw "$tag exited $($p.ExitCode)" }
            $sha = (Get-FileHash -Algorithm SHA256 $out).Hash.Substring(0, 16); Remove-Item $out
            $row = @($v, $t, ('0x{0:x}' -f $mask), $rep, [math]::Round($sw.Elapsed.TotalSeconds, 3), [math]::Round($p.UserProcessorTime.TotalSeconds, 3),
                     [math]::Round($p.PrivilegedProcessorTime.TotalSeconds, 3), (Num $text 'FASTAG_THREADS .*? read=([0-9.eE+-]+)'),
                     (Num $text 'FASTAG_THREADS .*? tag=([0-9.eE+-]+)'), (Num $text '([0-9]+) MS2 spectra'), (Num $text 'FASTAG_ALLOC .*? redirected=([01])'), $sha)
            ($row -join "`t") | Add-Content $res
            Write-Host ($row -join "  ")
          }
          Run 'mi' 4 0 0   # warm-up: file cache
          foreach ($rep in 1..3) { foreach ($v in 'mi', 'off') { Run $v 1 $one $rep; Run $v 2 $two $rep; Run $v 4 0 $rep } }
          $rows = Import-Csv $res -Delimiter "`t" | Where-Object { $_.rep -ne '0' }
          if (@($rows | Select-Object -ExpandProperty out_sha256 -Unique).Count -ne 1) { throw "tags differ between runs" }
          if (@($rows | Where-Object { $_.variant -eq 'mi' -and $_.redirected -ne '1' }).Count -or @($rows | Where-Object { $_.variant -eq 'off' -and $_.redirected -ne '0' }).Count) { throw "redirection state not as requested" }
          $sum = foreach ($g in ($rows | Group-Object variant, threads)) {
            $r = @($g.Group | ForEach-Object { [double]$_.read_s } | Sort-Object); $tg = @($g.Group | ForEach-Object { [double]$_.tag_s } | Sort-Object)
            $n = [double]$g.Group[0].spectra
            [pscustomobject]@{ variant = $g.Group[0].variant; threads = [int]$g.Group[0].threads; read_us_per_spectrum = [math]::Round($r[1] / $n * 1e6, 1); tag_us_per_spectrum = [math]::Round($tg[1] / $n * 1e6, 1); wall_s = ($g.Group | ForEach-Object { [double]$_.wall_s } | Sort-Object)[1] }
          }
          $sum | Sort-Object variant, threads | Format-Table | Out-String | Tee-Object "$O\summary.txt"
          "tags identical across all $($rows.Count) runs: $($rows[0].out_sha256)" | Tee-Object -Append "$O\summary.txt"
          Remove-Item $IN

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.mimalloc_timing && always()
        with:
          name: mimalloc-timing-windows-x64
          path: mimalloc-timing
          if-no-files-found: warn

      # SignPath signs FASTag.exe only when its ProductName and ProductVersion
      # match the artifact configuration, so check them on every push rather
      # than first at a release. The output is the version both signing
      # requests pass to that configuration.
      - name: Check the version resource
        id: version
        shell: pwsh
        run: |
          $want = (Select-String -Path fastag/CMakeLists.txt -Pattern '^project\(FASTag VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $info = (Get-Item fastag/build/FASTag.exe).VersionInfo
          Write-Host "FASTag.exe: ProductName '$($info.ProductName)', ProductVersion '$($info.ProductVersion)'"
          if ($info.ProductName -cne 'FASTag' -or $info.ProductVersion -cne $want) { Write-Host "::error::FASTag.exe must carry ProductName 'FASTag' and ProductVersion '$want' (src/FASTag.rc.in)"; exit 1 }
          "version=$want" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FASTag-windows-x64
          path: fastag/build/FASTag.exe
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Windows Authenticode signing via SignPath Foundation, release builds
      # only. Adapted from a working reference (BALL/BALLView's release.yml)
      # almost directly -- same gating pattern, same action.
      #
      # `secrets.X != ''` directly in an `if:` makes the WHOLE workflow
      # invalid (a 0-job startup_failure on every push), so the secret is
      # mapped into a step env: (legal) and the presence check becomes a step
      # OUTPUT every downstream step gates on -- never `secrets.*` directly.
      #
      # project-slug is SIGNPATH_PROJECT_SLUG at the top of this file.
      # artifact-configuration-slug 'initial' requires SignPath's own console
      # (not a repo file) to have an artifact configuration under that name
      # expecting a zipped .exe whose metadata it enforces, as the SignPath
      # Foundation terms require; `version` is passed by both requests:
      #   <artifact-configuration xmlns="http://signpath.io/artifact-configuration/v1">
      #     <parameters><parameter name="version" required="true" /></parameters>
      #     <zip-file>
      #       <pe-file path="*.exe" product-name="FASTag" product-version="${version}">
      #         <authenticode-sign />
      #       </pe-file>
      #     </zip-file>
      #   </artifact-configuration>
      # (actions/upload-artifact always zips, so SignPath receives a .zip
      # regardless -- an artifact-configuration expecting a bare .exe fails
      # with "file does not correspond to the specified file type".)
      #
      # UNTESTED until SIGNPATH_API_TOKEN, SIGNPATH_ORG_ID and the project
      # slug exist; without them every tag build takes the "not configured"
      # branch and ships unsigned. doc/SIGNING-macos-gui.md lists the steps.
      - name: Determine SignPath availability (Windows)
        if: (needs.version.outputs.release != '') || inputs.gui_dry_run
        id: signpath-gate
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
          SIGNING_POLICY: ${{ inputs.signing_policy || ((needs.version.outputs.release != '' || (inputs.gui_dry_run && inputs.gui_full_payload)) && 'release-signing' || 'test-signing') }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNPATH_API_TOKEN) -or [string]::IsNullOrEmpty($env:SIGNPATH_ORG_ID)) {
            Write-Host "::warning title=Unsigned Windows binary::SIGNPATH_API_TOKEN or SIGNPATH_ORG_ID is not set -- shipping this release unsigned. SmartScreen will warn on first run. See doc/SIGNING-macos-gui.md for what's needed."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          } elseif ([string]::IsNullOrEmpty($env:SIGNPATH_PROJECT_SLUG)) {
            # Checked HERE, not left to the signing action. A missing or wrong
            # project slug fails the REQUEST, which happens after OpenMS,
            # mzpeak, FASTag and the desktop app have all been built -- about
            # twenty minutes in. Refusing up front costs seconds instead.
            Write-Host "::warning title=Unsigned Windows binary::The SignPath secrets are set but SIGNPATH_PROJECT_SLUG in windows.yml is empty. Shipping unsigned. See doc/SIGNING-macos-gui.md."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          } else {
            Write-Host "SignPath signing policy: $env:SIGNING_POLICY"
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
            "policy=$env:SIGNING_POLICY" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          }

      - name: Upload unsigned binary for SignPath (Windows)
        if: steps.signpath-gate.outputs.enabled == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FASTag-windows-x64-unsigned
          path: fastag/build/FASTag.exe
          if-no-files-found: error

      - name: Sign via SignPath Foundation (Windows)
        if: steps.signpath-gate.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ steps.signpath-gate.outputs.policy }}
          artifact-configuration-slug: 'initial'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          wait-for-completion: true
          # The action's own default is 600 s, which fails a release whose
          # Approve click comes later than ten minutes after the request.
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: 'signed'

      - name: Replace unsigned binary with the signed one (Windows)
        if: steps.signpath-gate.outputs.enabled == 'true'
        shell: pwsh
        run: |
          # An error, not a warning: carrying on would ship the unsigned CLI in
          # the zip and inside an installer that is itself signed.
          $signed = Get-ChildItem -Path "signed" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signed) { Write-Host "::error::SignPath returned no signed FASTag.exe under signed/"; exit 1 }
          $sig = Get-AuthenticodeSignature $signed.FullName
          Write-Host "Authenticode: $($sig.Status) -- $($sig.SignerCertificate.Subject)"
          if (-not $sig.SignerCertificate -or $sig.Status -eq 'HashMismatch') { Write-Host "::error::$($signed.Name) from SignPath carries no intact signature"; exit 1 }
          Copy-Item -Path $signed.FullName -Destination "fastag/build/FASTag.exe" -Force
          Write-Host "Signed binary in place: $($signed.Name)"

      # ---------------------------------------------------------------------
      # Bundle runtime dependencies for portability -- EVERY run, not just
      # releases. FASTag.exe as built above depends on DLLs (OpenMS and
      # conda's Arrow, Parquet, Boost, libxml2, ...) that only exist in THIS
      # job's own build environment; Windows has no RPATH/RUNPATH, so
      # the loader only searches the .exe's own directory and PATH, and
      # nothing on a bare download provides either. The exact same class of
      # bug shipped once already on macOS/Linux (an RPATH pointing at
      # /Users/runner/micromamba/..., discovered only when a real user
      # downloaded the release and ran it) -- fixed there the same way:
      # bundle everything the runtime actually needs, verify it standalone,
      # every push.
      #
      # Order matters not at all here, unlike macOS: Authenticode signs the
      # .exe file itself, so copying unrelated DLLs into the same folder
      # afterward cannot invalidate a signature already applied above --
      # this step runs after signing purely because it needs whichever copy
      # (signed or not) is currently in fastag/build/FASTag.exe.
      #
      # DLL set is deliberately generous rather than minimal: every
      # directory this job itself already needed on PATH to run its OWN
      # ctest/smoke-test (see "Add runtime DLL directories to PATH" above)
      # is copied wholesale, rather than guessing a narrower set with no way
      # to verify it on a machine that actually has Windows.
      #
      # share/OpenMS's location is found by searching rather than assumed:
      # an earlier OpenMS split its CMake package across two unrelated
      # directories on this platform.
      - name: Bundle runtime dependencies for portability (Windows)
        shell: bash
        run: |
          set -e
          rm -rf dist && mkdir -p dist/FASTag
          cp fastag/build/FASTag.exe dist/FASTag/FASTag.core.exe
          # mimalloc and its CRT redirect DLL, beside the executable that
          # imports them (CMakeLists.txt, FASTAG_MIMALLOC). First, so the
          # cp -n below can never put another copy in their place.
          cp fastag/build/mimalloc.dll fastag/build/mimalloc-redirect.dll dist/FASTag/

          for d in "$WS/openms-install/bin" "$CONDA_LIB_PREFIX/bin"; do
            [ -d "$d" ] && cp -n "$d"/*.dll dist/FASTag/ 2>/dev/null || true
          done
          for f in mimalloc.dll mimalloc-redirect.dll; do
            cmp -s "fastag/build/$f" "dist/FASTag/$f" || { echo "::error::dist/FASTag/$f is not the one FASTag was linked with"; exit 1; }
          done

          SHARE_DIR=$(find "$WS/openms-install" -type d -path '*/share/OpenMS' 2>/dev/null | head -1)
          if [ -z "$SHARE_DIR" ]; then
            echo "::error::Could not find OpenMS's share/ data directory anywhere under openms-install."
            exit 1
          fi
          cp -r "$SHARE_DIR" dist/FASTag/share-OpenMS
          # The tag-time smoke input, vendored (OpenMS is installed without
          # its examples/ tree), asserted on every build as in ci.yml.
          mkdir -p dist/FASTag/share-OpenMS/examples/ID
          cp fastag/test/fixtures/Ecoli_MS2_small.mzML dist/FASTag/share-OpenMS/examples/ID/
          test -s dist/FASTag/share-OpenMS/examples/ID/Ecoli_MS2_small.mzML
          # -delta_out names its rows from these two (1.16 mass-shift survey).
          test -s dist/FASTag/share-OpenMS/CHEMISTRY/unimod.xml
          test -s dist/FASTag/share-OpenMS/CHEMISTRY/PSI-MOD.obo

          # The taxonomy -species resolves by default. The pruned NCBI dumps
          # (12 KB) go here for every build; on TAG builds the "Embed taxonomy
          # index" step below replaces this dir with the full pinned index, so
          # the release zip is -species-complete. `share-FASTag-taxonomy` (not
          # share/FASTag/taxonomy) because this layout is FLAT -- the executable
          # sits at the root, so there is no ../share to resolve; FASTag looks for
          # both spellings, see taxonomyDir_() in src/FASTag.cpp.
          # fastag/data, not data: this workflow checks the repo out into fastag/
          # (`path: fastag` on actions/checkout), unlike ci.yml which uses the root.
          cp -r fastag/data/taxonomy dist/FASTag/share-FASTag-taxonomy
          # The -digest_out models and -massgap_out modifications, found the
          # same way (share-FASTag-digest in this flat layout).
          cp -r fastag/data/digest dist/FASTag/share-FASTag-digest
          # 1.13 (#24): the -alkylation_proteome proteomes (UniProt, CC BY 4.0).
          cp -r fastag/data/alkylation dist/FASTag/share-FASTag-alkylation
          test -s dist/FASTag/share-FASTag-alkylation/proteomes.tsv
          # The example run (examples/README.md), next to the executable.
          cp -r fastag/examples dist/FASTag/examples
          test -s dist/FASTag/examples/Ecoli_MS2_small.mzML && test -s dist/FASTag/examples/README.md
          # FASTag's licence and the redistributed DLLs' notices (see ci.yml).
          cp fastag/LICENSE dist/FASTag/LICENSE
          PY=$(command -v python3 || command -v python)
          "$PY" fastag/tools/third_party_notices.py "$CONDA_LIB_PREFIX/.." dist/FASTag/THIRD-PARTY-NOTICES.txt dist/FASTag
          test -s dist/FASTag/THIRD-PARTY-NOTICES.txt
          # mimalloc is built from source by FASTag's CMake, not a conda
          # package, so the script above lists its DLLs as unowned; its MIT
          # notice is appended from the pinned source tree.
          {
            printf '\n%s\n' "=============================================================================="
            echo "mimalloc 2.2.4 -- MIT (mimalloc.dll, mimalloc-redirect.dll)"
            echo "https://github.com/microsoft/mimalloc, built from the v2.2.4 source; mimalloc-redirect.dll is the binary that source ships in bin/"
            echo "=============================================================================="
            cat fastag/build/mimalloc-LICENSE.txt
          } >> dist/FASTag/THIRD-PARTY-NOTICES.txt
          grep -q "Copyright (c) 2018-2025 Microsoft Corporation, Daan Leijen" dist/FASTag/THIRD-PARTY-NOTICES.txt \
            || { echo "::error::mimalloc's licence did not reach THIRD-PARTY-NOTICES.txt"; exit 1; }
          # The vendor readers (1.15.2): the .NET runtime beside
          # FASTag.core.exe, Thermo's licence (LICENSES/), the RawFileReader
          # terms and the .NET and opentims notices; checked as a set.
          "$PY" fastag/tools/vendor_bundle.py add --root dist/FASTag --exe-dir dist/FASTag \
            --share dist/FASTag/share-OpenMS --runtime "$DOTNET_RT"
          "$PY" fastag/tools/vendor_bundle.py check --root dist/FASTag --exe-dir dist/FASTag --share dist/FASTag/share-OpenMS
          du -sh dist/FASTag dist/FASTag/dotnet

          # A .bat wrapper, not a shell script: this is Windows. The real
          # exe is named FASTag.core.exe (not FASTag.exe) specifically so
          # typing the bare command `FASTag` at a prompt resolves to this
          # wrapper via PATHEXT rather than racing it -- if both
          # FASTag.exe and FASTag.bat existed side by side, PATHEXT's
          # default order tries .EXE before .BAT and would silently skip
          # the wrapper.
          # OPENBLAS_NUM_THREADS: an OpenMS built against OpenBLAS starts a
          # spinning thread per core when the library loads, which costs real
          # CPU even for --help; FASTag never calls BLAS. Set here for the same
          # reason as in ci.yml's wrappers, and harmless when the build carries
          # no OpenBLAS. `if not defined` is the batch spelling of ${VAR:-1}:
          # a value the user set wins.
          # MIMALLOC_DISABLE_REDIRECT on Windows on ARM64: the x64 binary runs
          # emulated there and mimalloc-redirect.dll fails its DllMain, so the
          # process dies before main() with 0xC0000142 (the 1.13.2 GUI crash;
          # the GUI sets the same, gui/src-tauri/src/fastag.rs cli_env).
          # cmd.exe on ARM64 is native (PROCESSOR_ARCHITECTURE=ARM64); the
          # PROCESSOR_IDENTIFIER test covers a caller that is itself x64.
          printf '%s\r\n' \
            '@echo off' \
            'set "OPENMS_DATA_PATH=%~dp0share-OpenMS"' \
            'if not defined OPENBLAS_NUM_THREADS set "OPENBLAS_NUM_THREADS=1"' \
            'if not defined MIMALLOC_DISABLE_REDIRECT if /i "%PROCESSOR_ARCHITECTURE%"=="ARM64" set "MIMALLOC_DISABLE_REDIRECT=1"' \
            'if not defined MIMALLOC_DISABLE_REDIRECT if /i "%PROCESSOR_IDENTIFIER:~0,3%"=="ARM" set "MIMALLOC_DISABLE_REDIRECT=1"' \
            '"%~dp0FASTag.core.exe" %*' \
            > dist/FASTag/FASTag.bat
          ls dist/FASTag | wc -l

      # Same regression guard as ci.yml, adapted for Windows: no RPATH to
      # strip, so the honest test is running with the DLL search directories
      # this job added to PATH earlier explicitly removed, from a directory
      # outside the build tree. Reaching OpenMS's own "file not found" error
      # proves every DLL AND the shared data directory resolved from the
      # bundle itself, not from this job's PATH.
      - name: Verify the bundle is portable (regression guard)
        shell: bash
        run: |
          set -e
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -viE "openms-install|conda|micromamba" | tr '\n' ':')
          OUT=$(cd /tmp && PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" -in nonexistent.mzML -out /tmp/portability-check.tsv 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -qiE "0xc0000135|not found.*\.dll|shared data"; then
            echo "::error::Bundle is NOT portable -- still resolves something from the build environment. See output above."
            exit 1
          fi
          echo "$OUT" | grep -q "File not found" || { echo "::error::Unexpected output -- never reached the expected 'file not found' error."; exit 1; }
          # And mzPeak through the bundle: arrow.dll, parquet.dll and zip.dll
          # must all have travelled.
          OUT2=$(cd /tmp && PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" \
                   -in "$WS/ci-data/small.mzpeak" -out /tmp/portability-mzpeak.tsv \
                   -threads 2 -fragment_tolerance 20 -fragment_tolerance_unit ppm 2>&1) || true
          echo "$OUT2" | grep -q "34 MS2 spectra" || { echo "$OUT2"; echo "::error::Shipped bundle cannot read mzPeak -- expected 34 MS2 spectra from small.mzpeak."; exit 1; }
          # ...and WRITES one, then reads its own output back, on the same
          # scrubbed PATH. Writing needs the Parquet writer and zip
          # finalisation -- code a read-only smoke never touches -- so a bundle
          # could read mzPeak and still fail every user who asks for
          # -out_spectra. Byte-identical tags, as ctest's mzpeak_roundtrip
          # demands of the unbundled binary; the archive is validated next.
          # -tolerance_by_analyzer off: this example is ion trap by its filter
          # strings, which the archive loses at OPENMS_REF (no OpenMS/OpenMS#10955
          # yet), so the mzML would be tagged at 0.5 Da and the archive not.
          # Drop the pin when OPENMS_REF includes #10955.
          BW=/tmp/bundle-mzpeak; rm -rf "$BW"; mkdir -p "$BW"
          MZ="$GITHUB_WORKSPACE/dist/FASTag/share-OpenMS/examples/ID/Ecoli_MS2_small.mzML"
          PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" \
            -in "$MZ" -out "$BW/ml.tsv" -out_spectra "$BW/bundle.mzpeak" -threads 2 \
            -fragment_tolerance 20 -fragment_tolerance_unit ppm -tolerance_by_analyzer off > "$BW/write.log" 2>&1 \
            || { cat "$BW/write.log"; echo "::error::the shipped bundle cannot WRITE mzPeak"; exit 1; }
          grep -q "Wrote [0-9]* spectra" "$BW/write.log" || { cat "$BW/write.log"; echo "::error::the bundle wrote no spectra"; exit 1; }
          PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" \
            -in "$BW/bundle.mzpeak" -out "$BW/mp.tsv" -threads 2 \
            -fragment_tolerance 20 -fragment_tolerance_unit ppm -tolerance_by_analyzer off > "$BW/read.log" 2>&1 \
            || { cat "$BW/read.log"; echo "::error::the shipped bundle cannot read the archive it just wrote"; exit 1; }
          cmp -s "$BW/ml.tsv" "$BW/mp.tsv" || { echo "::error::tags from the bundle-written archive differ from the mzML tags"; diff "$BW/ml.tsv" "$BW/mp.tsv" | head; exit 1; }
          [ "$(grep -c . "$BW/mp.tsv")" -gt 1 ] || { echo "::error::the bundle round trip produced no tags"; exit 1; }
          echo "bundle round trip: $(grep -o 'Wrote [0-9]* spectra' "$BW/write.log"), tags byte-identical"
          # ...and finds its shipped digest data: -digest_out without
          # -digest_models must report the shipped background.
          PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" \
            -in "$MZ" -out "$BW/dg.tsv" -digest_out "$BW/digest.tsv" -threads 2 > "$BW/digest.log" 2>&1 \
            || { cat "$BW/digest.log"; echo "::error::the shipped bundle cannot write -digest_out"; exit 1; }
          grep -q $'^run\tbackground\tshipped_human\t' "$BW/digest.tsv" \
            || { cat "$BW/digest.log"; echo "::error::-digest_out did not find the shipped digest data"; exit 1; }
          # ...and its shipped proteomes (1.13 #24). The default auto needs no
          # proteome (feedback 202dbcf4): the call is read off the tags.
          PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" \
            -in "$MZ" -out "$BW/al.tsv" -alkylation_out "$BW/alk.tsv" -threads 2 > "$BW/alk.log" 2>&1 \
            || { cat "$BW/alk.log"; echo "::error::the shipped bundle cannot write -alkylation_out without a database"; exit 1; }
          tr -d '\r' < "$BW/alk.tsv" | grep -q $'^alk_run\tdatabase_source\tnone\t' \
            && tr -d '\r' < "$BW/alk.tsv" | grep -q $'^alkylation_call\tsource\ttags\t' \
            || { cat "$BW/alk.log"; echo "::error::-alkylation_out at auto is not a tag-only report"; exit 1; }
          # -alkylation_proteome human resolves the shipped human proteome; at
          # the default -tag_length nothing places (tags_too_short).
          PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" \
            -in "$MZ" -out "$BW/alh.tsv" -alkylation_out "$BW/alkh.tsv" -alkylation_proteome human -threads 2 > "$BW/alkh.log" 2>&1 \
            || { cat "$BW/alkh.log"; echo "::error::the shipped bundle cannot write -alkylation_out with the shipped proteome"; exit 1; }
          tr -d '\r' < "$BW/alkh.tsv" | grep -q $'^alk_run\tdatabase_source\tbundled:human\t' \
            && tr -d '\r' < "$BW/alkh.tsv" | grep -q $'^alk_run\tdatabase_release\tUniProt ' \
            && tr -d '\r' < "$BW/alkh.tsv" | grep -q $'^alkylation_placement_call\treason\ttags_too_short\t' \
            || { cat "$BW/alkh.log"; echo "::error::-alkylation_out did not find the shipped human proteome"; exit 1; }
          # Placement on a shipped file: E. coli data on the shipped ecoli
          # proteome at -tag_length 8 must place tags (the placements the
          # alk_cys excluded.* rows count; the example is too small for
          # single-Cys votes, alk_run spectra, at this length).
          PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" \
            -in "$MZ" -out "$BW/al8.tsv" -alkylation_out "$BW/alk8.tsv" -alkylation_proteome ecoli -tag_length 8 \
            -fragment_tolerance 0.5 -fragment_tolerance_unit Da -threads 2 > "$BW/alk8.log" 2>&1 \
            || { cat "$BW/alk8.log"; echo "::error::-alkylation_out on the shipped ecoli proteome failed"; exit 1; }
          alk8=$(tr -d '\r' < "$BW/alk8.tsv" | awk -F'\t' '$1 == "alk_cys" && $2 == "excluded.no_cys" { print $4 }')
          [ "${alk8:-0}" -gt 0 ] && ! grep -q $'^alkylation_placement_call\treason\ttags_too_short' "$BW/alk8.tsv" \
            || { cat "$BW/alk8.log" "$BW/alk8.tsv"; echo "::error::no tag placed on the shipped ecoli proteome at -tag_length 8"; exit 1; }
          # ...and allocates from mimalloc in the shipped layout, for every
          # module: mi_is_redirected() via FASTAG_TIMING, and mimalloc's own
          # MIMALLOC_VERBOSE report.
          FASTAG_TIMING=1 MIMALLOC_VERBOSE=1 PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" \
            -in "$MZ" -out "$BW/mi.tsv" -threads 2 \
            -fragment_tolerance 20 -fragment_tolerance_unit ppm -tolerance_by_analyzer off > "$BW/mi.log" 2>&1 \
            || { cat "$BW/mi.log"; echo "::error::the shipped bundle failed with MIMALLOC_VERBOSE=1"; exit 1; }
          grep -E "FASTAG_ALLOC|mimalloc: malloc" "$BW/mi.log"
          if ! grep -q "FASTAG_ALLOC allocator=mimalloc version=[0-9]* redirected=1" "$BW/mi.log" \
             || ! grep -q "mimalloc: malloc is redirected" "$BW/mi.log"; then
            cat "$BW/mi.log"; echo "::error::the shipped bundle does not redirect the CRT heap to mimalloc"; exit 1
          fi
          # Same options as the ml.tsv run above (the example is ion trap since 1.15.7).
          cmp -s "$BW/ml.tsv" "$BW/mi.tsv" || { echo "::error::bundle tags differ between runs"; exit 1; }
          # The vendor readers through the shipped bundle, without the job's
          # DOTNET_ROOT: the bundle's own dotnet/ must serve.
          (unset DOTNET_ROOT; PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" \
            -in "$WS/ci-data/thermo-smoke.raw" -out "$BW/raw.tsv" -threads 2 > "$BW/raw.log" 2>&1) \
            || { cat "$BW/raw.log"; echo "::error::the shipped bundle cannot read a Thermo .raw"; exit 1; }
          grep -E "Thermo .raw input: [1-9][0-9]* scans indexed" "$BW/raw.log" \
            || { cat "$BW/raw.log"; echo "::error::the shipped bundle read no scans from the .raw"; exit 1; }
          PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" \
            -in "$WS/fastag/test/fixtures/bruker/PXD040281_SA_02_trim.d" -out "$BW/bruker.tsv" -threads 2 > "$BW/bruker.log" 2>&1 \
            || { cat "$BW/bruker.log"; echo "::error::the shipped bundle cannot read a Bruker .d"; exit 1; }
          grep -E "Bruker timsTOF input: [1-9][0-9]* MS2 spectra" "$BW/bruker.log" \
            || { cat "$BW/bruker.log"; echo "::error::the shipped bundle read no spectra from the .d"; exit 1; }
          echo "Portability check passed: runs standalone, no build-environment leakage, reads and writes mzPeak, mimalloc redirected, reads .raw and .d."

      # Every mzPeak archive this job wrote, through mzPeakValidator in full
      # mode. ctest's mzpeak_validate already covered the round-trip archives
      # (its reports are collected here); this covers the bundle's. OpenMS's
      # small.mzpeak goes first as a CONTROL: written by the reference
      # converter, it passes the pinned validator, so a failure on it means
      # the validator or its pin is broken, not FASTag.
      #
      # A hard failure on EVERY run, not only tags. The validator and its
      # engine are pinned, so the verdict can only change when FASTag's
      # writer changes -- and an archive other readers reject is a silent
      # failure for every user, exactly the kind this repository's history
      # says must fail a cheap main push rather than a release. The one
      # accepted gap (run references MzPeakFile does not write) is named in
      # test/mzpeak_validate.sh.
      - name: Validate every mzPeak archive this job wrote
        shell: bash
        run: |
          set -euo pipefail
          R=validator-reports; rm -rf "$R"; mkdir -p "$R"
          bash fastag/test/mzpeak_validate.sh "$R/control" ci-data/small.mzpeak \
            || { echo "::error::the CONTROL archive (reference converter) fails the pinned validator -- the validator or its pin is broken, not FASTag"; exit 1; }
          bash fastag/test/mzpeak_validate.sh "$R/bundle" /tmp/bundle-mzpeak/bundle.mzpeak \
            || { echo "::error::the archive the shipped bundle wrote is not a valid mzPeak archive"; exit 1; }
          # ctest's round-trip reports are the test job's (mzpeak-validator-ctest-windows-x64).
          ls -R "$R" | head -40

      # The reports, pass or fail: a red validator run is only useful with
      # the findings attached, and `always()` is what makes a failed step's
      # output reach the artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mzpeak-validator-windows-x64
          path: validator-reports
          if-no-files-found: warn

      # Tag builds only -- see ci.yml's identical step for the full rationale
      # (pinned data release, loud failure, smoke semantics). --repo on every
      # gh call: this workflow's checkout lives at fastag/, so the default cwd
      # has no .git to infer the repo from.
      - name: Embed taxonomy index (tag builds)
        if: env.FULL_PAYLOAD == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAXDB_TAG" -p 'FASTag-taxonomy-k7.tar.gz' -D /tmp/taxdb \
            --repo "${{ github.repository }}"
          got=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" /tmp/taxdb/FASTag-taxonomy-k7.tar.gz)
          [ "$got" = "$TAXDB_SHA256" ] || { echo "taxonomy sha256 mismatch: $got"; exit 1; }
          rm -rf dist/FASTag/share-FASTag-taxonomy
          # linux-1: the pinned tarball was packed on a Mac; GNU tar would unpack its
          # AppleDouble files (._*) into every package. bsdtar turns them into xattrs.
          tar --exclude='._*' -xzf /tmp/taxdb/FASTag-taxonomy-k7.tar.gz -C dist/FASTag
          test -s dist/FASTag/share-FASTag-taxonomy/tax_k7.taxdb
          # The asset predates -species_call (1.12 #1): put its frozen
          # parameters back beside the index, or -species_call decoy refuses.
          cp fastag/data/taxonomy/species_call.tsv dist/FASTag/share-FASTag-taxonomy/
          test -s dist/FASTag/share-FASTag-taxonomy/species_call.tsv
          # Its provenance, checked (see ci.yml's identical step).
          python fastag/tools/check_taxonomy_manifest.py dist/FASTag/share-FASTag-taxonomy "fastag/data/taxonomy/manifests/$TAXDB_TAG.json"
          MZ=dist/FASTag/share-OpenMS/examples/ID/Ecoli_MS2_small.mzML
          test -s "$MZ" || { echo "smoke fixture missing from bundle"; exit 1; }
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -viE "openms-install|conda|micromamba" | tr '\n' ':')
          PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" -in "$MZ" -out /tmp/smoke.tsv \
            -species -species_out /tmp/smoke.species.tsv \
            -tag_length 7 -extension 2 \
            -fragment_tolerance 0.3 -fragment_tolerance_unit Da
          [ "$(wc -l < /tmp/smoke.species.tsv)" -ge 2 ] || { echo "species smoke wrote an empty report"; exit 1; }
          # -species_call decoy must find the shipped parameters (no
          # -species_call_params) and write the 15-column report. Da
          # tolerance makes every row a low_resolution no_call by design.
          PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" -in "$MZ" -out /tmp/smoke_call.tsv \
            -species -species_call decoy -species_out /tmp/smoke_call.species.tsv \
            -tag_length 7 -extension 2 \
            -fragment_tolerance 0.3 -fragment_tolerance_unit Da
          nf=$(head -1 /tmp/smoke_call.species.tsv | tr -d '\r' | awk -F'\t' '{print NF}')
          [ "$nf" = 15 ] || { echo "species_call smoke: $nf header fields, expected 15"; exit 1; }

      # ----------------------------------------------- desktop app (Windows)
      # Builds the Tauri app around the CLI bundle assembled above and signs
      # the INSTALLER through SignPath. The CLI inside it is already signed by
      # the steps further up, which matters: Authenticode, like notarization,
      # is per-executable, and an installer that drops an unsigned .exe on
      # disk gets SmartScreen-flagged the moment a user runs the thing it
      # installed rather than the installer itself.
      #
      # This is a SECOND SignPath signing request, so a release signs twice
      # and needs the Approve click in SignPath's console twice.
      #
      # Runs on a v* tag, or on a workflow_dispatch with gui_dry_run set. Take
      # the dry run seriously here: the Windows desktop app has never been
      # built in CI at all, so unlike macOS this path has no working precedent
      # behind it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: (needs.version.outputs.release != '') || inputs.gui_dry_run
        with:
          node-version: 24

      - name: Stage the CLI as the app's bundled resources (Windows)
        if: (needs.version.outputs.release != '') || inputs.gui_dry_run
        shell: bash
        run: |
          set -euo pipefail
          # Same layout resolve_binary() expects on every platform:
          # <resources>/fastag/bin/<exe>, share/OpenMS, share/FASTag/taxonomy.
          # This job checks out into fastag/ (actions/checkout `path:`), so every
          # GUI path needs that prefix. Without it `mkdir -p` cheerfully built a
          # second, EMPTY gui/ tree beside the checkout, every cp and test -s
          # passed against it, and the failure only surfaced two steps later as
          # `npm ci` finding no package.json. Assert the real source is there
          # before creating anything.
          test -f fastag/gui/package.json
          R=fastag/gui/src-tauri/resources/fastag
          rm -rf "$R"; mkdir -p "$R/bin" "$R/share/FASTag"
          cp dist/FASTag/FASTag.core.exe "$R/bin/FASTag.exe"
          # Windows has no RPATH: every DLL must sit in the SAME directory as
          # the .exe that loads it. So bin/ is flat here, where macOS puts the
          # closure in bin/lib -- the difference is the loader's, not a
          # packaging preference.
          cp dist/FASTag/*.dll "$R/bin/"
          cp -r dist/FASTag/share-OpenMS "$R/share/OpenMS"
          cp -r dist/FASTag/share-FASTag-taxonomy "$R/share/FASTag/taxonomy"
          # A release carries the k-mer index (embedded above), as the macOS
          # and Linux staging steps require.
          if [ "$FULL_PAYLOAD" = "true" ]; then
            python fastag/tools/check_taxonomy_manifest.py --pinned "fastag/data/taxonomy/manifests/$TAXDB_TAG.json" "$R/share/FASTag/taxonomy" \
              || { echo "::error::the Windows app bundle does not carry the pinned taxonomy index -- -species would fail in the shipped app"; exit 1; }
          fi
          cp -r dist/FASTag/share-FASTag-digest "$R/share/FASTag/digest"
          cp -r dist/FASTag/share-FASTag-alkylation "$R/share/FASTag/alkylation"
          cp dist/FASTag/LICENSE dist/FASTag/THIRD-PARTY-NOTICES.txt "$R/"
          # The vendor readers (1.15.2): the .NET runtime beside the CLI and
          # the licences; the installer shows the licence page
          # (tauri.conf.json bundle.licenseFile, installer-license.txt).
          cp -r dist/FASTag/dotnet "$R/bin/dotnet"
          cp -r dist/FASTag/LICENSES "$R/LICENSES"
          PY=$(command -v python3 || command -v python)
          "$PY" fastag/tools/vendor_bundle.py check --root "$R" --exe-dir "$R/bin" --share "$R/share/OpenMS"
          # File > Open Example Data (gui/src-tauri/src/examples.rs).
          cp -r dist/FASTag/examples "$R/examples"
          test -s "$R/examples/Ecoli_MS2_small.mzML"
          test -s "$R/bin/FASTag.exe"
          test -s "$R/share/OpenMS/examples/ID/Ecoli_MS2_small.mzML"
          # The CLI the app runs redirects its heap to mimalloc as the zip's
          # does: both DLLs beside it, and the redirection reported from the
          # staged copy on a scrubbed PATH.
          test -s "$R/bin/mimalloc.dll" && test -s "$R/bin/mimalloc-redirect.dll"
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -viE "openms-install|conda|micromamba" | tr '\n' ':')
          OUT=$(FASTAG_TIMING=1 MIMALLOC_VERBOSE=1 OPENMS_DATA_PATH="$R/share/OpenMS" PATH="$CLEAN_PATH" \
                  "$R/bin/FASTag.exe" -in "$R/share/OpenMS/examples/ID/Ecoli_MS2_small.mzML" \
                  -out /tmp/gui-staged.tsv -threads 2 2>&1) || { echo "$OUT"; exit 1; }
          echo "$OUT" | grep -E "FASTAG_ALLOC|mimalloc: malloc"
          echo "$OUT" | grep -q "FASTAG_ALLOC allocator=mimalloc version=[0-9]* redirected=1" \
            || { echo "::error::the GUI's bundled CLI does not redirect the CRT heap to mimalloc"; exit 1; }

      # The release profile's compiled crates (Cargo registry, deps/, build/,
      # .fingerprint/ -- never bundle/, the staged resources or the app
      # binary), keyed on the image, the architecture, rustc and Cargo.lock,
      # falling back to the newest of the same toolchain. Saved right after
      # the build that filled it.
      - name: Cargo cache key
        if: (needs.version.outputs.release != '') || inputs.gui_dry_run
        id: cargo-key
        shell: bash
        run: echo "key=cargo-release-${{ runner.os }}-${{ runner.arch }}-${ImageOS:-img}-$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore the Cargo cache
        if: (needs.version.outputs.release != '') || inputs.gui_dry_run
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            fastag/gui/src-tauri/target/release/deps
            fastag/gui/src-tauri/target/release/build
            fastag/gui/src-tauri/target/release/.fingerprint
          key: ${{ steps.cargo-key.outputs.key }}-${{ hashFiles('fastag/gui/src-tauri/Cargo.lock') }}
          restore-keys: ${{ steps.cargo-key.outputs.key }}-

      # pwsh, NOT bash: Git Bash prepends its /usr/bin at startup, and that
      # directory has a link.exe -- coreutils' hard-link command -- which then
      # shadows MSVC's linker for every cargo invocation. rustc finds `link.exe`
      # by PATH name, so the whole Rust build died on its first build script
      # with "/usr/bin/link: extra operand". CMake never hit this because it
      # resolves the linker from cl.exe's own directory. msvc-dev-cmd's PATH,
      # with the MSVC bin dir first, survives intact in pwsh.
      - name: Build the desktop app (Windows)
        if: (needs.version.outputs.release != '') || inputs.gui_dry_run
        timeout-minutes: 90
        working-directory: fastag/gui
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A bash step's GITHUB_PATH entries land ahead of msvc-dev-cmd's
          # MSVC bin dir, and Git's usr/bin (coreutils link.exe) with them.
          # Put cl.exe's directory, which holds MSVC's link.exe, first.
          $env:PATH = (Split-Path (Get-Command cl.exe).Source) + ';' + $env:PATH
          # Prove the right linker wins before spending ten minutes finding out.
          $link = (Get-Command link.exe).Source
          if ($link -like '*\Git\usr\bin\*') { throw "coreutils link.exe shadows MSVC's: $link" }
          Write-Host "linker: $link"
          npm ci;              if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # GUI-THIRD-PARTY-NOTICES.txt beside the CLI's notices in the app's
          # resources: the Rust crates of this target, the npm production
          # packages, the fonts and the NSIS stub, each with its licence text
          # (tools/gui_third_party_notices.py fails on a missing text).
          $target = ((rustc -vV) | Select-String '^host: ').ToString().Substring(6).Trim()
          python ../tools/gui_third_party_notices.py --gui . --target $target --platform windows --out src-tauri/resources/fastag/GUI-THIRD-PARTY-NOTICES.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The NSIS installer only: it is what ships and what job installed-app
          # tests. tauri.conf.json's bundle.targets "all" would add an MSI
          # through WiX, which nothing uses and which compresses the whole
          # payload (the taxonomy index included) a second time.
          npm run tauri build -- --bundles nsis --verbose; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem src-tauri/target/release/bundle/nsis/ -ErrorAction SilentlyContinue

      - name: Save the Cargo cache
        if: (needs.version.outputs.release != '') || inputs.gui_dry_run && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            fastag/gui/src-tauri/target/release/deps
            fastag/gui/src-tauri/target/release/build
            fastag/gui/src-tauri/target/release/.fingerprint
          key: ${{ steps.cargo-key.outputs.key }}-${{ hashFiles('fastag/gui/src-tauri/Cargo.lock') }}

      # bundle.windows.nsis.compression is "lzma" in tauri.conf.json, set
      # explicitly rather than left to Tauri's default. This records what
      # that produced: the installer size (in the job summary, so releases
      # can be compared) and the compression method 7-Zip reads from the
      # NSIS header. Informational: a method other than LZMA is a warning,
      # since 7-Zip's NSIS reader is a heuristic, not a contract.
      - name: Record the installer size and compression (Windows)
        if: (needs.version.outputs.release != '') || inputs.gui_dry_run
        working-directory: fastag/gui
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $nsis) { throw "tauri produced no NSIS installer" }
          $mib = [math]::Round($nsis.Length / 1MB, 1)
          Write-Host "installer: $($nsis.Name), $($nsis.Length) bytes ($mib MiB)"
          "### Windows installer: $mib MiB ($($nsis.Name))" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $sevenzip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenzip) { $sevenzip = 'C:\Program Files\7-Zip\7z.exe' }
          if (Test-Path $sevenzip) {
            # Capture the whole listing first, then search it. Piping 7z into
            # Select-Object -First 1 stops the pipeline while 7z is still
            # writing (the listing runs to ~100k lines), and a stopped or
            # failing native command leaves a non-zero $LASTEXITCODE that the
            # pwsh wrapper's trailing `exit $LASTEXITCODE` turns into a red
            # step. 7-Zip's NSIS reader is a heuristic and may exit 1 or 2 on a
            # variant it half-understands; that is a warning here, never a
            # failure, since this step only records.
            $ErrorActionPreference = 'Continue'
            $out = & $sevenzip l -slt $nsis.FullName 2>&1
            $code = $LASTEXITCODE
            $method = $out | Select-String -Pattern '^Method = ' | Select-Object -First 1
            if ($code) { Write-Host "::warning::7z exited $code while listing the installer" }
            Write-Host "7-Zip: $method"
            "7-Zip reads: $method" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            if ("$method" -notmatch 'LZMA') { Write-Host "::warning::7-Zip does not report LZMA for the installer ($method)" }
          } else {
            Write-Host "::warning::7-Zip not found; compression method not recorded"
          }
          # Informational only: never let a native exit code fail the job.
          $global:LASTEXITCODE = 0
          exit 0

      # Only before SignPath signing (it spares an Approve click on a broken
      # build): job installed-app runs this and more on the final installer.
      # The installer as a user gets it: installed silently into a fresh
      # directory, the app's own start-up probe of its bundled CLI (fastag.exe
      # with FASTAG_SELFTEST_OUT: the GUI's resolution, environment and spawn
      # path), then the bundled FASTag.exe --help, -write_ini and a tagging run
      # from the installed layout. Before signing and attaching, so a CLI that
      # cannot start from the installed app (1.13.2: 0xC0000142 on Windows on
      # ARM64) fails the run instead of shipping; job installed-app repeats it
      # on x64 and ARM64 runners before job release-assets attaches anything.
      - name: Installed-app check (Windows x64)
        if: steps.signpath-gate.outputs.enabled == 'true' && ((needs.version.outputs.release != '') || inputs.gui_dry_run)
        shell: pwsh
        run: |
          $i = Get-ChildItem fastag/gui/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $i) { Write-Host "::error::no NSIS installer was built"; exit 1 }
          ./fastag/tools/windows_installed_check.ps1 -Installer $i.FullName -Scope AllUsers -Out "$env:RUNNER_TEMP\installed-check" -ThermoRaw "$env:GITHUB_WORKSPACE\ci-data\thermo-smoke.raw" -RequireTaxonomyIndex:$${{ env.FULL_PAYLOAD == 'true' }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The release zip, packed here so that job installed-app checks the
      # very file job release-assets attaches. Compress-Archive, not zip:
      # zip.exe was never confirmed present in this runner's Git-for-Windows
      # bundle; every Windows box has PowerShell. Users run FASTag.bat (or
      # bare `FASTag`), not the FASTag.core.exe it calls.
      - name: Pack the release zip
        if: (needs.version.outputs.release != '') || inputs.gui_dry_run
        shell: pwsh
        run: |
          $zip = "FASTag-$($env:ASSET_VERSION)-windows-x64.zip"
          Compress-Archive -Path dist/FASTag -DestinationPath $zip -Force
          # A release zip carries the pinned k-mer index: each file the
          # manifest pins, checked in the zip itself by size and sha256.
          if ($env:FULL_PAYLOAD -eq 'true') {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $pin = Get-Content -Raw "fastag/data/taxonomy/manifests/$($env:TAXDB_TAG).json" | ConvertFrom-Json
            $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
            try {
              foreach ($f in $pin.files.PSObject.Properties) {
                $want = [regex]::Escape($f.Name)
                $e = @($z.Entries | Where-Object { ($_.FullName -replace '\\', '/') -match "(^|/)share-FASTag-taxonomy/$want$" })
                if ($e.Count -ne 1) { Write-Host "::error::$zip carries $($e.Count) share-FASTag-taxonomy/$($f.Name), expected one"; exit 1 }
                if ($e[0].Length -ne [int64]$f.Value.bytes) { Write-Host "::error::${zip}: $($f.Name) is $($e[0].Length) bytes, the manifest pins $($f.Value.bytes)"; exit 1 }
                $sha = [System.Security.Cryptography.SHA256]::Create()
                $st = $e[0].Open()
                try { $got = -join ($sha.ComputeHash($st) | ForEach-Object { $_.ToString('x2') }) } finally { $st.Dispose(); $sha.Dispose() }
                if ($got -ne $f.Value.sha256) { Write-Host "::error::${zip}: $($f.Name) has sha256 $got, the manifest pins $($f.Value.sha256)"; exit 1 }
                Write-Host "taxonomy in the zip: $($e[0].FullName), $($e[0].Length) bytes, sha256 as pinned"
              }
            }
            finally { $z.Dispose() }
          }

      # SignPath's 'initial' artifact configuration expects a ZIP containing
      # *.exe -- upload-artifact always zips, and the NSIS installer is an
      # .exe, so the same configuration covers it without a new one.
      - name: Upload unsigned installer for SignPath (Windows)
        if: steps.signpath-gate.outputs.enabled == 'true'
        id: upload-unsigned-gui
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FASTag-gui-windows-x64-unsigned
          path: fastag/gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Sign the installer via SignPath Foundation (Windows)
        if: steps.signpath-gate.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ steps.signpath-gate.outputs.policy }}
          artifact-configuration-slug: 'initial'
          github-artifact-id: ${{ steps.upload-unsigned-gui.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          # The default 300 s bounds the WHOLE download, not idle time, and the
          # signed installer of a tag build (taxonomy index included) is
          # ~305 MB: 1200 s still fits the job timeout.
          download-signed-artifact-timeout-in-seconds: 1200
          output-artifact-directory: 'signed-gui'

      # On dry runs too: the dry run exists to prove what a tag run would
      # ship.
      - name: Check the signed installer (Windows)
        if: steps.signpath-gate.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "signed-gui" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signed) { Write-Host "::error::SignPath returned no signed installer"; exit 1 }
          $sig = Get-AuthenticodeSignature $signed.FullName
          Write-Host "Authenticode: $($sig.Status) -- $($sig.SignerCertificate.Subject)"
          if (-not $sig.SignerCertificate -or $sig.Status -eq 'HashMismatch') { Write-Host "::error::$($signed.Name) from SignPath carries no intact signature"; exit 1 }

      # THE installer that ships -- the SignPath-signed one when signing ran --
      # and the zip, under their release names, in ONE artifact: job
      # installed-app tests exactly these bytes on x64 and ARM64, and
      # release-assets attaches them, or a tag promotes them. The signing
      # policy and the signer are recorded (a candidate's manifest carries
      # them).
      - name: Stage the installer and the zip that ship
        id: ship
        if: (needs.version.outputs.release != '') || inputs.gui_dry_run
        shell: pwsh
        env:
          SIGNED: ${{ steps.signpath-gate.outputs.enabled }}
          POLICY: ${{ steps.signpath-gate.outputs.policy }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force ship | Out-Null
          $src = if ($env:SIGNED -eq 'true') { Get-ChildItem signed-gui -Filter *.exe | Select-Object -First 1 } else { Get-ChildItem fastag/gui/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1 }
          if (-not $src) { Write-Host "::error::no installer to ship"; exit 1 }
          Copy-Item $src.FullName "ship/FASTag-$($env:ASSET_VERSION)-gui-windows-x64-setup.exe"
          Copy-Item "FASTag-$($env:ASSET_VERSION)-windows-x64.zip" ship/
          $signer = 'none'
          if ($env:SIGNED -eq 'true') { $signer = (Get-AuthenticodeSignature $src.FullName).SignerCertificate.Subject }
          $policy = if ($env:SIGNED -eq 'true') { $env:POLICY } else { 'none' }
          "policy=$policy" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signer=$signer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-ChildItem ship | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }
          Write-Host "signing policy: $policy; signer: $signer"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: (needs.version.outputs.release != '') || inputs.gui_dry_run
        with:
          name: FASTag-gui-windows-x64-installer
          path: ship/*
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      # A release candidate's two files (ci.yml's parts).
      - name: Release-candidate part (Windows)
        if: env.RC_CANDIDATE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PY=$(command -v python3 || command -v python)
          "$PY" fastag/.github/scripts/rc-manifest.py part --job windows-x64 --group windows-x64 \
            --artifact FASTag-gui-windows-x64-installer --out rc-part-windows.json \
            "FASTag-${ASSET_VERSION}-windows-x64.zip=ship/FASTag-${ASSET_VERSION}-windows-x64.zip" \
            "FASTag-${ASSET_VERSION}-gui-windows-x64-setup.exe=ship/FASTag-${ASSET_VERSION}-gui-windows-x64-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: env.RC_CANDIDATE == 'true'
        with:
          name: rc-part-windows-x64
          path: rc-part-windows.json
          if-no-files-found: error

  # ------------------------------------------------------------ tests
  # ctest in a job of its own, beside windows-x64 (which goes on to bundle,
  # sign and build the app meanwhile). It compiles FASTag and its tests from
  # the same tree and toolchain, and keeps the name windows-x64 that
  # tested-tree.sh looks for in an earlier run on a v* tag. release-assets
  # and release-complete need it.
  windows-x64-test:
    name: windows-x64
    if: needs.version.outputs.promote != 'true'
    runs-on: windows-2022
    needs: [version]
    permissions:
      contents: read
      # read: the Test step's reuse lookup on a v* tag (fastag/.github/scripts/tested-tree.sh)
      # lists this workflow's earlier runs and their jobs.
      actions: read
    # 240: a cold OpenMS build (about an hour) on top of the suite.
    timeout-minutes: 240
    steps:
      - *w01
      # A v* tag push does not re-run ctest when an earlier push or dispatch
      # run of this workflow with the SAME git tree passed the Test step of
      # this job (ci.yml has the same step; .github/scripts/tested-tree.sh).
      # Any API error, a main push or a dispatch (release_tag included): the
      # tests run as before.
      - name: Look for an identical tree that already passed the tests (tag builds)
        id: test-reuse
        if: needs.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash fastag/.github/scripts/tested-tree.sh windows-x64
          # The shared Configure, Build and validator steps read this.
          grep -q '^reuse=true$' "$GITHUB_OUTPUT" && echo "TESTS_REUSED=true" >> "$GITHUB_ENV" || true

      - *w02
      - *w03
      - *w04
      - *w05
      - *w06
      - *w07
      - *w08
      - *w09
      - *w10
      - *w11
      - *w12
      - *w13
      - *w14
      - *w15
      - *w16
      - *w17
      - *w18
      - *w19
      - *w20
      - name: Test
        if: steps.test-reuse.outputs.reuse != 'true'
        shell: bash
        env:
          FASTAG_PYTHON: ${{ steps.validator-python.outputs.python-path }}
        run: |
          # An explicit `shell: bash` runs as bash -eo pipefail: a failing ctest
          # fails the step through the tee below.
          set -o pipefail
          # The setup-python interpreter, so gui_cli_test and shipped_data_test
          # (which skip without a Python 3) run: python3 may be missing here.
          FASTAG_PYTHON="${FASTAG_PYTHON//\\//}"; export FASTAG_PYTHON
          # OpenMS resolves share/OpenMS (ResidueDB, ModificationsDB, unimod)
          # via OPENMS_DATA_PATH, then a compiled-in path, then exe-relative.
          # A unit-test binary in the build tree is not FASTag.exe and must not
          # depend on the install layout to find it: point it at the OpenMS
          # this workflow built; the shipped bundle's own resolution is tested
          # separately, with a scrubbed environment, further down.
          SHARE=$(find "$WS/openms-install" -type d -path '*/share/OpenMS' 2>/dev/null | head -1)
          [ -n "$SHARE" ] && export OPENMS_DATA_PATH="$SHARE" && echo "OPENMS_DATA_PATH=$SHARE"
          # One test per core: the tests are independent (their own temp
          # directories; fixtures, RUN_SERIAL and COST in CMakeLists.txt).
          NJ="${NUMBER_OF_PROCESSORS:-$(nproc 2>/dev/null || echo 2)}"
          # Idle OpenMP workers sleep instead of spinning: with -j tests side by
          # side, each FASTag's spinning workers (libomp: 200 ms after every
          # parallel region) take the cores the other tests need. Output is
          # unchanged; only the wait between regions differs.
          export OMP_WAIT_POLICY=PASSIVE KMP_BLOCKTIME=0
          echo "ctest -j $NJ (OMP_WAIT_POLICY=$OMP_WAIT_POLICY)"
          ctest --test-dir fastag/build --output-on-failure -j "$NJ" 2>&1 | tee ctest.log
          # The mzPeak tests SKIP themselves in a build without mzPeak support
          # or without the validator. This job has both, so a skip here would
          # be a broken harness presenting as green -- the very class of
          # failure this coverage exists for. Require a Passed line for each,
          # for indexed_mzml_test, the mzML reader's and the direct peak
          # decoder's spectrum-by-spectrum check against OpenMS, and for
          # mimalloc_redirect_test.
          # bruker_cli_test and thermo_cli_test: the vendor readers (1.15.2).
          # gui_cli_test and shipped_data_test: the shipped data in every
          # layout and the build tree's copy staging (they skip without Python).
          # The four parts of charge_cli_test (#6), which skip on a binary that
          # cannot start.
          for t in mzpeak_roundtrip mzpeak_validate mzpeak_stream_test indexed_mzml_test mimalloc_redirect_test bruker_cli_test thermo_cli_test gui_cli_test shipped_data_test charge_cli_test_defaults charge_cli_test_calls charge_cli_test_threads charge_cli_test_species; do
            grep -E "Test +#[0-9]+: $t " ctest.log | grep -q 'Passed' \
              || { echo "::error::$t did not pass (skipped, not run or missing)"; grep -E "$t" ctest.log || true; exit 1; }
          done

      - name: Collect the ctest validator reports
        if: always() && steps.test-reuse.outputs.reuse != 'true'
        shell: bash
        run: |
          mkdir -p validator-reports
          cp -r fastag/build/mzpeak-roundtrip/validator validator-reports/ctest 2>/dev/null || echo "no ctest validator reports"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.test-reuse.outputs.reuse != 'true'
        with:
          name: mzpeak-validator-ctest-windows-x64
          path: validator-reports
          if-no-files-found: warn

  # ------------------------------------------- installed app, x64 + ARM64
  # The installer as users get it, on x64 and on Windows on ARM64 (where the
  # x64 app and CLI run emulated; 1.13.0-1.13.2 shipped a CLI that died there
  # before main() with 0xC0000142, invisible on x64 runners):
  #   - tools/windows_install_scopes.ps1: the v1.13.3 installer (per user),
  #     then this one (all users: the per-user copy must go), per user over
  #     all users, and uninstalls that must leave no file, folder, Apps entry
  #     or shortcut;
  #   - tools/windows_installed_check.ps1, per user and for all users: silent
  #     install, the app's own start-up probe, the bundled FASTag.exe --help,
  #     -write_ini and a tagging run from the installed layout;
  #   - the release zip's FASTag.bat against that CLI;
  #   - gui/e2e-tauri/windows.test.mjs through tauri-driver: Generate tags on
  #     the mzML and MGF fixtures (tags TSV identical to the CLI's own run),
  #     the Tags table, the spectrum inspector, Characterize with its Overview
  #     and reports, and a refused run quoting FASTag's reason. Screenshots
  #     and the record are uploaded.
  installed-app:
    if: ${{ !cancelled() && needs.version.outputs.promote != 'true' && ((needs.version.outputs.release != '') || inputs.gui_dry_run) }}
    needs: [version, windows-x64]
    env:
      ASSET_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            tools
            test/fixtures
            gui/e2e-tauri
            CMakeLists.txt
            data/taxonomy/manifests
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 10
        with:
          name: FASTag-gui-windows-x64-installer
          path: installer
      # A Thermo .raw for the installed-app checks (ci.yml's THERMO_SMOKE_RAW):
      # each installed CLI reads it through the app's own .NET runtime.
      - name: Fetch a Thermo .raw
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/thermo-smoke.raw" \
            "https://raw.githubusercontent.com/OpenMS/OpenMS/$OPENMS_REF/src/tests/topp/THIRDPARTY/ginkgotoxin-ms-switching.raw"
          echo "$THERMO_SMOKE_RAW_SHA256  $RUNNER_TEMP/thermo-smoke.raw" | sha256sum -c -
          echo "FASTAG_THERMO_SMOKE_RAW=$RUNNER_TEMP/thermo-smoke.raw" >> "$GITHUB_ENV"
      - name: Installed-app check (per user)
        shell: pwsh
        run: |
          $i = Get-ChildItem installer -Recurse -Filter *-setup.exe | Select-Object -First 1
          ./tools/windows_installed_check.ps1 -Installer $i.FullName -Scope CurrentUser -Out "$env:RUNNER_TEMP\installed-check\per-user" -RequireTaxonomyIndex:$${{ env.FULL_PAYLOAD == 'true' }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Kept installed for the end-to-end specs.
      - name: Installed-app check (all users)
        shell: pwsh
        run: |
          $i = Get-ChildItem installer -Recurse -Filter *-setup.exe | Select-Object -First 1
          ./tools/windows_installed_check.ps1 -Installer $i.FullName -Scope AllUsers -Out "$env:RUNNER_TEMP\installed-check\all-users" -Keep -DirOut "$env:RUNNER_TEMP\fastag-app-dir.txt" -RequireTaxonomyIndex:$${{ env.FULL_PAYLOAD == 'true' }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "FASTAG_APP_DIR=$((Get-Content "$env:RUNNER_TEMP\fastag-app-dir.txt" -Raw).Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # The release zip as a zip user runs it: unpacked, FASTag.bat --help
      # and a tagging run on the bundled fixture.
      - name: The release zip
        shell: pwsh
        run: |
          $z = Get-ChildItem installer -Recurse -Filter "FASTag-$($env:ASSET_VERSION)-windows-x64.zip" | Select-Object -First 1
          if (-not $z) { Write-Host "::error::no FASTag-$($env:ASSET_VERSION)-windows-x64.zip in the artifact"; exit 1 }
          Expand-Archive $z.FullName -DestinationPath "$env:RUNNER_TEMP\zip" -Force
          $bat = "$env:RUNNER_TEMP\zip\FASTag\FASTag.bat"
          $o = & $bat --help 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host ("FASTag.bat --help: exit {0} (0x{0:X8}); PROCESSOR_ARCHITECTURE={1}; PROCESSOR_IDENTIFIER={2}" -f $code, $env:PROCESSOR_ARCHITECTURE, $env:PROCESSOR_IDENTIFIER)
          if ($code -ne 0 -or $o -notmatch 'Version:\s*[0-9]') { Write-Host $o; Write-Host "::error::FASTag.bat cannot start the CLI"; exit 1 }
          $mz = "$env:RUNNER_TEMP\zip\FASTag\share-OpenMS\examples\ID\Ecoli_MS2_small.mzML"
          $tsv = "$env:RUNNER_TEMP\zip-tags.tsv"
          $o = & $bat -in $mz -out $tsv 2>&1 | Out-String
          $code = $LASTEXITCODE
          $rows = if (Test-Path $tsv) { @(Get-Content $tsv | Where-Object { $_ -and -not $_.StartsWith('#') }).Count - 1 } else { 0 }
          Write-Host "FASTag.bat tagging run: exit $code, $rows tag rows"
          if ($code -ne 0 -or $rows -le 0) { Write-Host $o; Write-Host "::error::the zip's FASTag.bat tagging run failed"; exit 1 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # tauri-driver from the cache when this image and architecture have it
      # (runner.arch last, as in ci.yml: a key that is a prefix of another
      # would restore the other architecture's binary), else built and saved
      # at once, so a failure further down still keeps it.
      - name: Restore tauri-driver
        id: tauri-driver
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-2.1.0-${{ matrix.os }}-${{ runner.arch }}
      - name: tauri-driver
        shell: pwsh
        env:
          CACHED: ${{ steps.tauri-driver.outputs.cache-hit }}
        run: |
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          if ($env:CACHED -eq 'true' -and (Test-Path "$env:USERPROFILE\.cargo\bin\tauri-driver.exe")) {
            Write-Host "tauri-driver from the cache"
            exit 0
          }
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/$(if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }) -OutFile rustup-init.exe
            ./rustup-init.exe -y --profile minimal
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          cargo install tauri-driver --version 2.1.0 --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Save tauri-driver
        if: steps.tauri-driver.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-2.1.0-${{ matrix.os }}-${{ runner.arch }}
      # The taxonomy index for Characterize, for an installer without one (a
      # plain dry run). Where the payload carries it (a tag, release_tag, a
      # full-payload dry run) the installed-app checks above have required it
      # in the installed app, and the specs use that copy.
      - name: Taxonomy index
        if: env.FULL_PAYLOAD != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAXDB_TAG: ${{ env.TAXDB_TAG }}
          TAXDB_SHA256: ${{ env.TAXDB_SHA256 }}
        run: |
          set -euo pipefail
          gh release download "$TAXDB_TAG" -p 'FASTag-taxonomy-k7.tar.gz' -D "$RUNNER_TEMP/taxdb" --repo "${{ github.repository }}"
          got=$(sha256sum < "$RUNNER_TEMP/taxdb/FASTag-taxonomy-k7.tar.gz" | cut -d" " -f1)
          [ "$got" = "$TAXDB_SHA256" ] || { echo "::error::taxonomy sha256 mismatch: $got"; exit 1; }
          # relative paths: GNU tar reads "D:..." as a remote host
          (cd "$RUNNER_TEMP/taxdb" && tar -xzf FASTag-taxonomy-k7.tar.gz share-FASTag-taxonomy/tax_k7.taxdb)
          test -s "$RUNNER_TEMP/taxdb/share-FASTag-taxonomy/tax_k7.taxdb"
      - name: GUI end-to-end (installed app, real CLI)
        shell: pwsh
        run: |
          $tax = "$env:RUNNER_TEMP\taxdb\share-FASTag-taxonomy\tax_k7.taxdb"
          if (-not (Test-Path $tax)) { $tax = '' }
          ./gui/e2e-tauri/run-windows.ps1 -App "$env:FASTAG_APP_DIR\fastag.exe" -Out "$env:RUNNER_TEMP\e2e" -TaxDb $tax
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: FASTag-gui-e2e-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/e2e/screens
            ${{ runner.temp }}/e2e/windows-e2e.json
            ${{ runner.temp }}/e2e/tauri-driver.log*
            ${{ runner.temp }}/installed-check
          if-no-files-found: warn
      # After the specs. A tag build's installer includes the taxonomy index
      # and the uninstaller removes it with the rest; a dry-run installer has
      # none, so the specs copied it into the install as a user would, and
      # that copy is the only file allowed to stay (the uninstaller keeps
      # what it did not install). Any other leftover fails.
      - name: Uninstall
        shell: pwsh
        run: |
          . ./tools/windows_install_lib.ps1
          $all = Get-FastagInstalls
          if ($all.Count -ne 1) { Fail "$($all.Count) FASTag installs before the uninstall" }
          Uninstall-Fastag $all[0] @('resources\fastag\share\FASTag\taxonomy\tax_k7.taxdb')

  # The install scopes, the upgrade from the previous release and the
  # uninstalls (tools/windows_install_scopes.ps1) on the same shipped
  # installer, on x64 and ARM64, beside job installed-app (which installs,
  # checks and drives the GUI): the two halves on fresh runners at once.
  installed-app-scopes:
    name: install scopes (${{ matrix.os }})
    if: ${{ !cancelled() && needs.version.outputs.promote != 'true' && ((needs.version.outputs.release != '') || inputs.gui_dry_run) }}
    needs: [version, windows-x64]
    env:
      ASSET_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            test/fixtures
            CMakeLists.txt
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 10
        with:
          name: FASTag-gui-windows-x64-installer
          path: installer
      - name: Fetch a Thermo .raw
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/thermo-smoke.raw" \
            "https://raw.githubusercontent.com/OpenMS/OpenMS/$OPENMS_REF/src/tests/topp/THIRDPARTY/ginkgotoxin-ms-switching.raw"
          echo "$THERMO_SMOKE_RAW_SHA256  $RUNNER_TEMP/thermo-smoke.raw" | sha256sum -c -
          echo "FASTAG_THERMO_SMOKE_RAW=$RUNNER_TEMP/thermo-smoke.raw" >> "$GITHUB_ENV"
      # The previous release's installer (per user only), for the upgrade.
      # The pattern takes both names: FASTag-gui-windows-x64-setup.exe up to
      # 1.14.0, FASTag-<version>-gui-windows-x64-setup.exe after.
      - name: Previous release installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_GUI_TAG: v1.13.3
        run: |
          set -euo pipefail
          gh release download "$PREV_GUI_TAG" -p 'FASTag-*gui-windows-x64-setup.exe' -D "$RUNNER_TEMP/prev" --repo "${{ github.repository }}"
          n=$(find "$RUNNER_TEMP/prev" -name '*-setup.exe' | wc -l)
          [ "$n" -eq 1 ] || { echo "::error::expected one installer on $PREV_GUI_TAG, found $n"; exit 1; }
      - name: Install scopes, upgrade and uninstall
        shell: pwsh
        run: |
          $i = Get-ChildItem installer -Recurse -Filter *-setup.exe | Select-Object -First 1
          $p = Get-ChildItem "$env:RUNNER_TEMP\prev" -Filter *-setup.exe | Select-Object -First 1
          ./tools/windows_install_scopes.ps1 -Installer $i.FullName -Previous $p.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  # ------------------------------------------------------- release assets
  # Attaches the installer and the zip only when job installed-app passed on
  # x64 AND ARM64 (no status function in `if`, so every `needs` must have
  # succeeded): an app or CLI that cannot start where users run it never
  # reaches the release. The files are the ones installed-app checked.
  # Unsigned fallback: without SignPath the installer would be built on
  # every tag and thrown away; SmartScreen warns until the certificate
  # exists, the same trade the platform tarballs make.
  release-assets:
    if: needs.version.outputs.release != '' && needs.version.outputs.promote != 'true'
    needs: [version, windows-x64, windows-x64-test, installed-app, installed-app-scopes]
    runs-on: ubuntu-24.04
    # A ceiling: the job takes about a minute. v1.16.4's sat 53 minutes in a
    # stalled artifact download (its rerun took one).
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            CMakeLists.txt
            tools/release_assets.sh
            tools/check_no_appledouble.sh
            .github/scripts
          sparse-checkout-cone-mode: false
      # The installer and the zip installed-app and installed-app-scopes
      # checked (one artifact), attached by release id with their digests
      # checked (release-upload.sh), and recorded for release-complete.
      - name: Attach the installer and the zip to the draft
        env:
          ID: ${{ needs.version.outputs.release_id }}
          SIGNED: ${{ needs.windows-x64.outputs.signed }}
        run: |
          set -euo pipefail
          FETCH_BUDGET=600 bash .github/scripts/fetch-artifact.sh "$GITHUB_RUN_ID" FASTag-gui-windows-x64-installer ship 3 280
          [ "$SIGNED" = true ] || echo "::warning title=Unsigned Windows installer::Shipping the installer unsigned -- SmartScreen will warn on first run."
          find ship -type f -exec basename {} \; | tools/release_assets.sh check "$V"
          bash tools/check_no_appledouble.sh ship/*.zip
          bash .github/scripts/release-upload.sh "$ID" "ship/FASTag-$V-gui-windows-x64-setup.exe" "ship/FASTag-$V-windows-x64.zip"
          python3 .github/scripts/rc-manifest.py part --job release-assets --group windows-x64 --artifact release \
            --out rel-part-windows.json "FASTag-$V-gui-windows-x64-setup.exe=ship/FASTag-$V-gui-windows-x64-setup.exe" \
            "FASTag-$V-windows-x64.zip=ship/FASTag-$V-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rel-part-windows
          path: rel-part-windows.json
          if-no-files-found: error

  # ------------------------------------------------------ release candidate
  # ci.yml's job of the same name for the Windows files: on a gui_dry_run +
  # gui_full_payload dispatch, when the build, the suite and the installed-app
  # checks on x64 and ARM64 passed, the manifest of the installer and the zip.
  release-candidate:
    name: release candidate
    if: ${{ !cancelled() && inputs.gui_dry_run && inputs.gui_full_payload }}
    needs: [version, windows-x64, windows-x64-test, installed-app, installed-app-scopes]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Every gate passed
        env:
          RESULTS: >-
            windows-x64=${{ needs.windows-x64.result }} windows-x64-test=${{ needs.windows-x64-test.result }}
            installed-app=${{ needs.installed-app.result }} installed-app-scopes=${{ needs.installed-app-scopes.result }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [ "${r#*=}" = success ] || { echo "::error::${r%%=*} was ${r#*=}: no release candidate"; exit 1; }
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 10
        with:
          name: rc-part-windows-x64
          path: parts
      - name: Write the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY: ${{ needs.windows-x64.outputs.signing_policy }}
          SIGNER: ${{ needs.windows-x64.outputs.signer }}
        run: |
          set -euo pipefail
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          wid=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          mkdir -p rc
          python3 .github/scripts/rc-manifest.py merge --out rc/manifest.json \
            --require "FASTag-$V-windows-x64.zip" --require "FASTag-$V-gui-windows-x64-setup.exe" \
            --meta "tree=$tree" --meta "version=$V" --meta "run_id=$GITHUB_RUN_ID" --meta "run_attempt=$GITHUB_RUN_ATTEMPT" \
            --meta "workflow_id=$wid" --meta "workflow=$GITHUB_WORKFLOW" --meta "commit=$GITHUB_SHA" --meta "ref=$GITHUB_REF" \
            --meta "windows_signing_policy=$POLICY" --meta "windows_signer=$SIGNER" parts/*.json
          { echo "### Release candidate $V (tree \`$tree\`), Windows signing: $POLICY ($SIGNER)"; echo; echo '| file | sha256 |'; echo '|---|---|'
            python3 .github/scripts/rc-manifest.py list rc/manifest.json | awk -F'\t' '{ print "| " $3 " | `" $4 "` |" }'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-manifest
          path: rc/manifest.json
          retention-days: 30
          if-no-files-found: error

  # ------------------------------------------------------ promotion
  # ci.yml's promote-assets for the installer and the zip.
  promote-assets:
    if: needs.version.outputs.promote == 'true'
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      RUN: ${{ needs.version.outputs.candidate_run }}
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            tools/release_assets.sh
            tools/check_no_appledouble.sh
          sparse-checkout-cone-mode: false
      - name: Fetch the candidate's files, check them, attach them by id, check the release's digests
        env:
          ID: ${{ needs.version.outputs.release_id }}
          MSHA: ${{ needs.version.outputs.manifest_sha256 }}
          ATTEMPT: ${{ needs.version.outputs.candidate_attempt }}
          POLICY: ${{ needs.version.outputs.signing_policy }}
        run: |
          set -euo pipefail
          export FETCH_BUDGET=1200
          bash .github/scripts/fetch-artifact.sh "$RUN" release-candidate-manifest "$RUNNER_TEMP/m" 3 120
          M="$RUNNER_TEMP/m/manifest.json"
          [ "$(sha256sum "$M" | cut -d' ' -f1)" = "$MSHA" ] || { echo "::error::the manifest is not the one job version selected"; exit 1; }
          tree=$(gh api "repos/$GH_REPO/git/commits/$GITHUB_SHA" --jq .tree.sha)
          wid=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          python3 .github/scripts/rc-manifest.py verify "$M" --tree "$tree" --version "$V" --run-id "$RUN" \
            --workflow-id "$wid" --meta "run_attempt=$ATTEMPT" --meta "windows_signing_policy=$POLICY"
          for a in $(python3 .github/scripts/rc-manifest.py list "$M" | cut -f1 | sort -u); do
            bash .github/scripts/fetch-artifact.sh "$RUN" "$a" "$RUNNER_TEMP/a/$a" 3 600
          done
          python3 .github/scripts/rc-manifest.py check "$M" --dir "$RUNNER_TEMP/a" --out promoted
          find promoted -type f -exec basename {} \; | tools/release_assets.sh check "$V"
          bash tools/check_no_appledouble.sh promoted/*.zip
          bash .github/scripts/release-upload.sh "$ID" promoted/*
          gh api "repos/$GH_REPO/releases/$ID" > "$RUNNER_TEMP/release.json"
          python3 .github/scripts/rc-manifest.py release "$M" "$RUNNER_TEMP/release.json"
          cp "$M" promoted-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: promoted-manifest
          path: promoted-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: promoted-windows-x64
          path: promoted/*
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  # The promoted installer and zip (staged by promote-assets), on x64 and
  # ARM64: silent per-user install, the app's start-up probe and the bundled
  # CLI (windows_installed_check.ps1, with the pinned index required), and
  # the zip's FASTag.bat. The scopes, the upgrade and the GUI specs ran on
  # these same bytes in the candidate run. Read access only; the token only
  # in the download step.
  promoted-smoke:
    name: promoted installer on ${{ matrix.os }}
    if: needs.version.outputs.promote == 'true'
    needs: [version, promote-assets]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            test/fixtures
            CMakeLists.txt
            data/taxonomy/manifests
            .github/scripts
          sparse-checkout-cone-mode: false
      - name: The promoted files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/fetch-artifact.sh "$GITHUB_RUN_ID" promoted-windows-x64 installer 3 600
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/thermo-smoke.raw" \
            "https://raw.githubusercontent.com/OpenMS/OpenMS/$OPENMS_REF/src/tests/topp/THIRDPARTY/ginkgotoxin-ms-switching.raw"
          echo "$THERMO_SMOKE_RAW_SHA256  $RUNNER_TEMP/thermo-smoke.raw" | sha256sum -c -
          echo "FASTAG_THERMO_SMOKE_RAW=$RUNNER_TEMP/thermo-smoke.raw" >> "$GITHUB_ENV"
      - name: Installed-app check (per user)
        shell: pwsh
        run: |
          ./tools/windows_installed_check.ps1 -Installer "installer\FASTag-$($env:V)-gui-windows-x64-setup.exe" -Scope CurrentUser -Out "$env:RUNNER_TEMP\installed-check" -RequireTaxonomyIndex:$true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: The release zip
        shell: pwsh
        run: |
          Expand-Archive "installer\FASTag-$($env:V)-windows-x64.zip" -DestinationPath "$env:RUNNER_TEMP\zip" -Force
          $bat = "$env:RUNNER_TEMP\zip\FASTag\FASTag.bat"
          $o = & $bat --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $o -notmatch "Version:\s*$([regex]::Escape($env:V))") { Write-Host $o; Write-Host "::error::the promoted zip's FASTag.bat does not start the CLI $($env:V)"; exit 1 }
          $mz = "$env:RUNNER_TEMP\zip\FASTag\share-OpenMS\examples\ID\Ecoli_MS2_small.mzML"
          $tsv = "$env:RUNNER_TEMP\zip-tags.tsv"
          $o = & $bat -in $mz -out $tsv 2>&1 | Out-String
          $rows = if (Test-Path $tsv) { @(Get-Content $tsv | Where-Object { $_ -and -not $_.StartsWith('#') }).Count - 1 } else { 0 }
          if ($LASTEXITCODE -ne 0 -or $rows -le 0) { Write-Host $o; Write-Host "::error::the promoted zip's tagging run failed"; exit 1 }
          Write-Host "promoted zip: FASTag.bat runs, $rows tag rows"

  # ------------------------------------------------- release completeness
  # Asserts the Windows zip only; ci.yml's mirror job asserts the unix
  # tarballs and taxonomy assets. Split because GitHub has no cross-workflow
  # `needs:` and either workflow can finish first.
  release-complete:
    # !cancelled() for the same reason as ci.yml's job.
    if: ${{ !cancelled() && needs.version.outputs.release != '' && needs.version.result == 'success' }}
    needs: [version, windows-x64, windows-x64-test, installed-app, installed-app-scopes, release-assets, promote-assets, promoted-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # write: the release is a draft until ci.yml publishes it.
    permissions:
      contents: write
      actions: read
    env:
      V: ${{ needs.version.outputs.version }}
      REL: ${{ needs.version.outputs.release }}
      ID: ${{ needs.version.outputs.release_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            CMakeLists.txt
            tools/release_assets.sh
            .github/scripts
          sparse-checkout-cone-mode: false
      # The jobs that made, checked and attached the two files succeeded.
      - name: Every Windows job of this release passed
        env:
          PROMOTED: ${{ needs.version.outputs.promote }}
          PROMOTION: promote-assets=${{ needs.promote-assets.result }} promoted-smoke=${{ needs.promoted-smoke.result }}
          REBUILD: >-
            windows-x64=${{ needs.windows-x64.result }} windows-x64-test=${{ needs.windows-x64-test.result }}
            installed-app=${{ needs.installed-app.result }} installed-app-scopes=${{ needs.installed-app-scopes.result }}
            release-assets=${{ needs.release-assets.result }}
        run: |
          list=$REBUILD; [ "$PROMOTED" = true ] && list=$PROMOTION
          echo "$list"
          for r in $list; do
            [ "${r#*=}" = success ] || { echo "::error::${r%%=*} was ${r#*=}"; exit 1; }
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 10
        with:
          name: ${{ needs.version.outputs.promote == 'true' && 'promoted-manifest' || 'rel-part-windows' }}
          path: expect
      # The two files on the release are exactly those (name, size, sha256);
      # then the release gates for ci.yml, which publishes only after them
      # (wait-release-gates.sh): this release, this commit, this run, and
      # the two files' digests.
      - name: The installer and the zip are on the release, as gated
        run: |
          set -euo pipefail
          f=$(find expect -name '*.json' | head -1)
          gh api "repos/$GH_REPO/releases/$ID" > "$RUNNER_TEMP/release.json"
          python3 .github/scripts/rc-manifest.py release "$f" "$RUNNER_TEMP/release.json"
          for a in "FASTag-$V-windows-x64.zip" "FASTag-$V-gui-windows-x64-setup.exe"; do
            jq -e --arg n "$a" '.files | any(.name == $n)' "$f" > /dev/null || { echo "MISSING from what this run gated: $a"; exit 1; }
          done
          mkdir -p gates
          jq --arg r "$REL" --arg c "$GITHUB_SHA" --argjson run "$GITHUB_RUN_ID" \
            '{release: $r, commit: $c, run: $run, files: [.files[] | {name, size, sha256}]}' "$f" > gates/gates.json
          cat gates/gates.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-gates-${{ needs.version.outputs.release }}
          path: gates/gates.json
          if-no-files-found: error

