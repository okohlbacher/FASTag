name: windows

# Windows, separate from ci.yml on purpose.
#
# OpenMS is built from source here as on the other three platforms: the same
# pinned develop commit (OPENMS_REF, in lockstep with ci.yml), the same
# conda-forge libraries (.github/env/openms.yml), compiled with MSVC. The
# install is cached on the commit, the toolchain and that file's hash; a cold
# build takes about an hour, a cache hit a minute.
#
# TWO JOBS, not one -- learned the hard way, not designed in up front.
#
# actions/cache's save (a post-hook) is gated on the JOB having succeeded, and
# that check is NOT overridden by continue-on-error at the job level --
# continue-on-error only changes how the WORKFLOW reports the job's outcome,
# not the runtime success() a post-hook's own condition evaluates. The first
# attempt cached OpenMS in the same job as FASTag's own configure/build/test;
# every time FASTag's side failed, the cache silently failed to save
# (visible as "Post Cache ... = skipped" in the log), so the next push repaid
# the full OpenMS build to test a one-line CMake flag change.

on:
  push:
    branches: [main]
    tags: ['v*']
  # See ci.yml's identical input. It matters more here: the Windows desktop
  # app has never been built in CI, so a tag would be its first run ever.
  workflow_dispatch:
    inputs:
      gui_dry_run:
        description: 'Build the Windows desktop app without cutting a tag'
        type: boolean
        default: false
      # A test-signing policy usually auto-approves and issues from a
      # non-public root, so it proves the PIPELINE -- request, artifact
      # configuration, download, replace -- without burning a human's Approve
      # click or producing a binary anyone could mistake for shippable. Only
      # the HSM release certificate yields a Windows-trusted signature.
      # Empty selects release-signing on a v* tag and test-signing anywhere
      # else, so a plain gui_dry_run never asks for a release signature of a
      # branch build (the signpath-gate step resolves it).
      signing_policy:
        description: 'SignPath signing policy slug (empty: release-signing on a v* tag, test-signing otherwise)'
        type: string
        default: ''

concurrency:
  # A manual dispatch gets its OWN group. Sharing <workflow>-refs/heads/main
  # with ordinary pushes means cancel-in-progress lets the next push to main
  # kill a validation run mid-flight -- which is exactly what happened to the
  # first gui_dry_run on 2026-09-08: cancelled at 2m17s by a push that landed
  # 13 seconds earlier. A dispatch is user-initiated and bounded, so giving it
  # a unique group cannot reintroduce the head-of-line wedge described above.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # The OpenMS this binary is built against: OpenMS/OpenMS develop
  # (3.7.0-dev). Pinned by SHA -- a moving ref would silently change what a
  # release contains -- and part of the cache key. Keep in lockstep with
  # ci.yml.
  OPENMS_REF: 70cebcd14442cecd6bcd9794fb6786d3342cacc6
  # SignPath PROJECT slug. Empty because no project exists yet.
  #
  # 'OpenMS_Apps' briefly lived here and was wrong: that is the slug of a
  # CERTIFICATE ("OpenMS Apps", X.509, software key store, CSR PENDING), and
  # SignPath's console reports it is "not used in any project". The signing
  # action addresses a project, an artifact configuration and a signing
  # policy; the certificate is bound to the policy inside the console and is
  # never named here.
  #
  # One place, not two: the CLI and the desktop installer both submit signing
  # requests, and they must not be able to drift apart.
  SIGNPATH_PROJECT_SLUG: ''
  # Taxonomy index pins -- MUST stay in lockstep with ci.yml (see the comment
  # there for the bump procedure: new data release first -- as a PRE-RELEASE,
  # or it steals the "Latest" slot and 404s every README download link --
  # then both files).
  TAXDB_TAG: taxonomy-k7-20260901
  TAXDB_SHA256: 520d93229df807e45b0e6fdf4d8d20c7aad95b73952749cb041c3e54de474a4b
jobs:
  # ---------------------------------------------------------- OpenMS itself
  #
  # Builds and caches the OpenMS install. Touches nothing FASTag-specific
  # beyond the dependency file, so a FASTag-side failure downstream can never
  # suppress this cache's save step the way the single-job version did.
  windows-x64-openms:
    name: windows-x64-openms
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v7
        with:
          path: fastag

      # cl.exe, link.exe and the Windows SDK on PATH for every later step
      # (written to GITHUB_PATH/GITHUB_ENV), whatever the shell.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Restore OpenMS
        id: cache-openms
        uses: actions/cache@v6
        with:
          path: openms-install
          key: windows-x64-openms-${{ env.OPENMS_REF }}-msvc2022-${{ hashFiles('fastag/.github/env/openms.yml') }}-v1

      - name: Install OpenMS's dependencies
        if: steps.cache-openms.outputs.cache-hit != 'true'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: fastag/.github/env/openms.yml
          init-shell: bash
          cache-environment: true

      - name: Check out OpenMS at the pinned commit
        if: steps.cache-openms.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git init -q openms-src
          cd openms-src
          git remote add origin https://github.com/OpenMS/OpenMS.git
          # GitHub serves a reachable commit by SHA; if that is ever refused,
          # fetch develop shallow and deepen until the commit is there.
          if ! git fetch -q --depth 1 origin "$OPENMS_REF"; then
            git fetch -q --depth 1 origin develop
            for _ in 1 2 3 4 5 6 7 8; do
              git cat-file -e "$OPENMS_REF^{commit}" 2>/dev/null && break
              git fetch -q --deepen=500 origin develop
            done
          fi
          git checkout -q "$OPENMS_REF"
          test -f src/openms/include/OpenMS/FORMAT/MzPeakFile.h
          # libOpenMS turns MSVC's unused-parameter/-variable warnings into
          # errors, and LPWrapper.cpp includes the HiGHS headers OpenMS fetches,
          # which have unused parameters (C4100 in Highs.h). Warnings only:
          # they stay warnings here.
          grep -q '"/we4100"' src/openms/CMakeLists.txt
          sed -i -e 's#"/we4100"#"/w14100"#' -e 's#"/we4189"#"/w14189"#' src/openms/CMakeLists.txt

      - name: Build and install OpenMS
        if: steps.cache-openms.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # conda's Windows packages live under Library/. Forward slashes:
          # CMake treats a backslash in a quoted path as an escape.
          # Not LIB: that is MSVC's library search path, and overwriting it
          # leaves link.exe without kernel32.lib.
          CLIB="${CONDA_PREFIX//\\//}/Library"
          WS="${GITHUB_WORKSPACE//\\//}"
          # Git's /usr/bin/link shadows MSVC's link.exe in this login shell.
          CLDIR=$(dirname "$(which cl)"); export PATH="$CLDIR:$PATH"
          # The flags of ci.yml's OpenMS build, with the conda prefix spelled
          # out for Windows. LibXml2 is named directly: CMake's FindLibXml2
          # does not find conda-forge's Windows layout on its own.
          cmake -S openms-src -B openms-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_INSTALL_PREFIX="$WS/openms-install" \
            -DCMAKE_PREFIX_PATH="$CLIB" \
            -DLIBXML2_INCLUDE_DIR="$CLIB/include/libxml2" \
            -DLIBXML2_LIBRARY="$CLIB/lib/libxml2.lib" \
            -DOPENMS_USE_VCPKG=OFF \
            -DOPENMS_ENABLE_MZPEAK=ON \
            -DARROW_USE_STATIC=OFF \
            -DWITH_GUI=OFF -DPYOPENMS=OFF -DENABLE_DOCS=OFF -DHAS_XSERVER=OFF \
            -DWITH_OPENTIMS=OFF -DWITH_THERMO_RAW=OFF \
            -DMT_ENABLE_OPENMP=ON -DMT_REQUIRE_OPENMP=ON \
            -DBUILD_TOPP_TOOLS=OFF \
            -DINSTALL_OPENMS_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF
          cmake --build openms-build --parallel
          cmake --install openms-build

      - name: Verify the OpenMS install
        shell: bash
        run: |
          set -euo pipefail
          CFG=$(find openms-install -name 'OpenMSConfig.cmake' 2>/dev/null | head -1)
          [ -n "$CFG" ] || { echo "::error::No OpenMSConfig.cmake after install."; exit 1; }
          echo "found: $CFG"
          find openms-install -name 'OpenMSCLITargets.cmake' | grep -q . \
            || { echo "::error::No OpenMS_CLI targets after install."; exit 1; }
          HDR=$(find openms-install -name 'MzPeakFile.h' 2>/dev/null | head -1)
          [ -n "$HDR" ] || { echo "::error::OpenMS installed without MzPeakFile.h"; exit 1; }
          grep -q "void store(" "$HDR"
          find openms-install -type d -path '*/share/OpenMS' | grep -q . \
            || { echo "::error::No share/OpenMS after install."; exit 1; }

  # ----------------------------------------------------------------- FASTag
  #
  # Everything expensive is a cache restore here: the conda env and the
  # OpenMS install.
  windows-x64:
    name: windows-x64
    runs-on: windows-2022
    needs: windows-x64-openms
    # write, not the default: needed only for the tag-triggered release-asset
    # upload below; see ci.yml's identical comment for why this is safe on
    # pull_request runs from forks.
    permissions:
      contents: write
    # 120, not 45: SignPath's release signing policy requires a human to click
    # Approve in SignPath's own UI (wait-for-completion: true blocks on it,
    # deliberately -- an anti-supply-chain control, not a bug), twice per
    # release, and each signing step waits up to 30 minutes for it. An
    # unsigned tag build takes ~35 minutes, so both full waits still fit.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          path: fastag

      # $GITHUB_WORKSPACE on Windows is backslash-separated (D:\a\FASTag\FASTag).
      # Concatenating it with a forward-slash suffix (as every path below does)
      # produces a path the filesystem tolerates fine but CMake does not
      # everywhere: CMake's string escaping rejects '\a' as an unknown escape
      # sequence -- "Invalid character escape '\a'". Every path derived from
      # GITHUB_WORKSPACE in this job uses $WS instead, normalized once here.
      - name: Normalize workspace path to forward slashes
        shell: bash
        run: echo "WS=${GITHUB_WORKSPACE//\\//}" >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      # Same key as the prep job, which saved it before this job started.
      - name: Restore OpenMS install
        uses: actions/cache/restore@v6
        with:
          path: openms-install
          key: windows-x64-openms-${{ env.OPENMS_REF }}-msvc2022-${{ hashFiles('fastag/.github/env/openms.yml') }}-v1
          fail-on-cache-miss: true

      - name: Install the dependencies
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: fastag/.github/env/openms.yml
          init-shell: bash
          cache-environment: true

      - name: Configure conda paths
        shell: bash -el {0}
        run: echo "CONDA_LIB_PREFIX=${CONDA_PREFIX//\\//}/Library" >> "$GITHUB_ENV"

      # The mzPeak fixture of OpenMS's own tests at the pinned commit (34 MS2
      # spectra, written by the reference converter): smoke runs and the
      # validator's control, as in ci.yml.
      - name: Fetch the mzPeak test archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-data
          curl -fsSL --retry 3 -o ci-data/small.mzpeak \
            "https://raw.githubusercontent.com/OpenMS/OpenMS/$OPENMS_REF/src/tests/class_tests/openms/data/MzPeakFile_small.mzpeak"
          echo "5af157f1744d13502dbc8f7103ad0d01c4ba5ecc528087756aa09ed75d4b4087  ci-data/small.mzpeak" | sha256sum -c -

      - name: Locate OpenMSConfig.cmake
        shell: bash
        run: |
          set -euo pipefail
          # Wherever the install put the package (lib/cmake/OpenMS on the
          # other platforms; older OpenMS split it on Windows), the directory
          # holding OpenMSTargets.cmake is the one to hand to find_package:
          # the targets file computes its prefix from its own location.
          TARGETS_FILE=$(find "$WS/openms-install" -name 'OpenMSTargets.cmake' 2>/dev/null | head -1)
          [ -n "$TARGETS_FILE" ] || { echo "::error::No OpenMSTargets.cmake in the restored cache."; exit 1; }
          OPENMS_DIR=$(dirname "$TARGETS_FILE")
          CFG=$(find "$WS/openms-install" -name 'OpenMSConfig.cmake' 2>/dev/null | head -1)
          [ -n "$CFG" ] || { echo "::error::No OpenMSConfig.cmake in the restored cache."; exit 1; }
          CFG_DIR=$(dirname "$CFG")
          if [ "$CFG_DIR" != "$OPENMS_DIR" ]; then
            cp -v "$CFG" "$CFG_DIR/OpenMSConfigVersion.cmake" "$OPENMS_DIR/"
          fi
          echo "OPENMS_DIR=$OPENMS_DIR" >> "$GITHUB_ENV"

      - name: Configure FASTag
        shell: bash -el {0}
        run: |
          set -o pipefail
          CLDIR=$(dirname "$(which cl)"); export PATH="$CLDIR:$PATH"
          cmake -S fastag -B fastag/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DOpenMS_DIR="$OPENMS_DIR" \
            -DCMAKE_PREFIX_PATH="$WS/openms-install;$CONDA_LIB_PREFIX" \
            -DLIBXML2_INCLUDE_DIR="$CONDA_LIB_PREFIX/include/libxml2" \
            -DLIBXML2_LIBRARY="$CONDA_LIB_PREFIX/lib/libxml2.lib" 2>&1 | tee configure.log
          grep -q "FASTag: OpenMP" configure.log || { echo "::error::OpenMP was not found -- this build would be serial"; exit 1; }

      - name: Build FASTag
        shell: bash -el {0}
        run: |
          CLDIR=$(dirname "$(which cl)"); export PATH="$CLDIR:$PATH"
          cmake --build fastag/build --parallel

      # Windows has no RPATH: the loader searches only the .exe's own
      # directory and PATH, so every test binary that links OpenMS needs the
      # OpenMS and conda DLL directories on PATH (STATUS_DLL_NOT_FOUND,
      # 0xc0000135, otherwise).
      - name: Add runtime DLL directories to PATH
        shell: bash
        run: |
          echo "$WS/openms-install/bin" >> "$GITHUB_PATH"
          echo "$CONDA_LIB_PREFIX/bin" >> "$GITHUB_PATH"

      # mzPeakValidator, for every archive this job writes: ctest's
      # mzpeak_validate (the round-trip archives) and the bundle check below.
      # Installed with setup-python's OWN interpreter into its own prefix,
      # deliberately not the conda env: pulling a Python pyarrow into that
      # solve would couple an unrelated tool to the build environment. The requirements file pins the
      # validator to a commit AND its engine to exact versions (see the file
      # for why and how to move the pin), and doubles as the pip cache key.
      # --only-binary: every compiled dependency has a wheel for all five
      # targets, and a source build here would be a silent multi-minute
      # detour on a runner without a compiler for it.
      - uses: actions/setup-python@v5
        id: validator-python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fastag/test/mzpeak-validator-requirements.txt
      - name: Install mzPeakValidator
        shell: bash
        env:
          PY: ${{ steps.validator-python.outputs.python-path }}
        run: |
          set -euo pipefail
          PY="${PY//\\//}"
          for attempt in 1 2 3; do
            "$PY" -m pip install -q --only-binary=:all: -r fastag/test/mzpeak-validator-requirements.txt && break
            [ "$attempt" -lt 3 ] || { echo "::error::pip could not install mzPeakValidator after 3 attempts"; exit 1; }
            echo "pip install failed (attempt $attempt); retrying in 15 s"; sleep 15
          done
          # The console script sits next to the interpreter (bin/ on Unix,
          # Scripts/ on Windows). An absolute path goes into the environment
          # so the conda-activating test shell cannot resolve a different one.
          D=$(dirname "$PY")
          if [ -x "$D/mzpeak-validate" ]; then V="$D/mzpeak-validate"
          elif [ -x "$D/Scripts/mzpeak-validate.exe" ]; then V="$D/Scripts/mzpeak-validate.exe"
          else echo "::error::mzpeak-validate not found next to $PY"; ls "$D" "$D/Scripts" 2>/dev/null; exit 1; fi
          "$V" --help >/dev/null
          echo "MZPEAK_VALIDATE=$V" >> "$GITHUB_ENV"
          echo "validator: $V"

      - name: Test
        shell: bash
        run: |
          # OpenMS resolves share/OpenMS (ResidueDB, ModificationsDB, unimod)
          # via OPENMS_DATA_PATH, then a compiled-in path, then exe-relative.
          # A unit-test binary in the build tree is not FASTag.exe and must not
          # depend on the install layout to find it: point it at the OpenMS
          # this workflow built; the shipped bundle's own resolution is tested
          # separately, with a scrubbed environment, further down.
          SHARE=$(find "$WS/openms-install" -type d -path '*/share/OpenMS' 2>/dev/null | head -1)
          [ -n "$SHARE" ] && export OPENMS_DATA_PATH="$SHARE" && echo "OPENMS_DATA_PATH=$SHARE"
          ctest --test-dir fastag/build --output-on-failure 2>&1 | tee ctest.log
          # The mzPeak tests SKIP themselves in a build without mzPeak support
          # or without the validator. This job has both, so a skip here would
          # be a broken harness presenting as green -- the very class of
          # failure this coverage exists for. Require a Passed line for each.
          for t in mzpeak_roundtrip mzpeak_validate mzpeak_stream_test; do
            grep -E "Test +#[0-9]+: $t " ctest.log | grep -q 'Passed' \
              || { echo "::error::$t did not pass (skipped, not run or missing)"; grep -E "$t" ctest.log || true; exit 1; }
          done

      - name: Smoke-test the binary
        shell: bash
        run: |
          ./fastag/build/FASTag.exe --help
          # mzPeak read, asserted exactly as on the other platforms: 34 MS2
          # spectra in OpenMS's own fixture.
          OUT=$(./fastag/build/FASTag.exe -in ci-data/small.mzpeak -out /tmp/smoke-mzpeak.tsv \
                  -threads 2 -fragment_tolerance 20 -fragment_tolerance_unit ppm 2>&1) || { echo "$OUT"; exit 1; }
          echo "$OUT" | grep -q "34 MS2 spectra" || { echo "$OUT"; echo "::error::expected 34 MS2 spectra from small.mzpeak"; exit 1; }

      # SignPath signs FASTag.exe only when its ProductName and ProductVersion
      # match the artifact configuration, so check them on every push rather
      # than first at a release. The output is the version both signing
      # requests pass to that configuration.
      - name: Check the version resource
        id: version
        shell: pwsh
        run: |
          $want = (Select-String -Path fastag/CMakeLists.txt -Pattern '^project\(FASTag VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $info = (Get-Item fastag/build/FASTag.exe).VersionInfo
          Write-Host "FASTag.exe: ProductName '$($info.ProductName)', ProductVersion '$($info.ProductVersion)'"
          if ($info.ProductName -cne 'FASTag' -or $info.ProductVersion -cne $want) { Write-Host "::error::FASTag.exe must carry ProductName 'FASTag' and ProductVersion '$want' (src/FASTag.rc.in)"; exit 1 }
          "version=$want" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: FASTag-windows-x64
          path: fastag/build/FASTag.exe
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Windows Authenticode signing via SignPath Foundation, release builds
      # only. Adapted from a working reference (BALL/BALLView's release.yml)
      # almost directly -- same gating pattern, same action.
      #
      # `secrets.X != ''` directly in an `if:` makes the WHOLE workflow
      # invalid (a 0-job startup_failure on every push), so the secret is
      # mapped into a step env: (legal) and the presence check becomes a step
      # OUTPUT every downstream step gates on -- never `secrets.*` directly.
      #
      # project-slug is SIGNPATH_PROJECT_SLUG at the top of this file.
      # artifact-configuration-slug 'initial' requires SignPath's own console
      # (not a repo file) to have an artifact configuration under that name
      # expecting a zipped .exe whose metadata it enforces, as the SignPath
      # Foundation terms require; `version` is passed by both requests:
      #   <artifact-configuration xmlns="http://signpath.io/artifact-configuration/v1">
      #     <parameters><parameter name="version" required="true" /></parameters>
      #     <zip-file>
      #       <pe-file path="*.exe" product-name="FASTag" product-version="${version}">
      #         <authenticode-sign />
      #       </pe-file>
      #     </zip-file>
      #   </artifact-configuration>
      # (actions/upload-artifact always zips, so SignPath receives a .zip
      # regardless -- an artifact-configuration expecting a bare .exe fails
      # with "file does not correspond to the specified file type".)
      #
      # UNTESTED until SIGNPATH_API_TOKEN, SIGNPATH_ORG_ID and the project
      # slug exist; without them every tag build takes the "not configured"
      # branch and ships unsigned. doc/SIGNING-macos-gui.md lists the steps.
      - name: Determine SignPath availability (Windows)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.gui_dry_run
        id: signpath-gate
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
          SIGNING_POLICY: ${{ inputs.signing_policy || (startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing') }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNPATH_API_TOKEN) -or [string]::IsNullOrEmpty($env:SIGNPATH_ORG_ID)) {
            Write-Host "::warning title=Unsigned Windows binary::SIGNPATH_API_TOKEN or SIGNPATH_ORG_ID is not set -- shipping this release unsigned. SmartScreen will warn on first run. See doc/SIGNING-macos-gui.md for what's needed."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          } elseif ([string]::IsNullOrEmpty($env:SIGNPATH_PROJECT_SLUG)) {
            # Checked HERE, not left to the signing action. A missing or wrong
            # project slug fails the REQUEST, which happens after OpenMS,
            # mzpeak, FASTag and the desktop app have all been built -- about
            # twenty minutes in. Refusing up front costs seconds instead.
            Write-Host "::warning title=Unsigned Windows binary::The SignPath secrets are set but SIGNPATH_PROJECT_SLUG in windows.yml is empty. Shipping unsigned. See doc/SIGNING-macos-gui.md."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          } else {
            Write-Host "SignPath signing policy: $env:SIGNING_POLICY"
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
            "policy=$env:SIGNING_POLICY" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          }

      - name: Upload unsigned binary for SignPath (Windows)
        if: steps.signpath-gate.outputs.enabled == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: FASTag-windows-x64-unsigned
          path: fastag/build/FASTag.exe
          if-no-files-found: error

      - name: Sign via SignPath Foundation (Windows)
        if: steps.signpath-gate.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ steps.signpath-gate.outputs.policy }}
          artifact-configuration-slug: 'initial'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          wait-for-completion: true
          # The action's own default is 600 s, which fails a release whose
          # Approve click comes later than ten minutes after the request.
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: 'signed'

      - name: Replace unsigned binary with the signed one (Windows)
        if: steps.signpath-gate.outputs.enabled == 'true'
        shell: pwsh
        run: |
          # An error, not a warning: carrying on would ship the unsigned CLI in
          # the zip and inside an installer that is itself signed.
          $signed = Get-ChildItem -Path "signed" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signed) { Write-Host "::error::SignPath returned no signed FASTag.exe under signed/"; exit 1 }
          $sig = Get-AuthenticodeSignature $signed.FullName
          Write-Host "Authenticode: $($sig.Status) -- $($sig.SignerCertificate.Subject)"
          if (-not $sig.SignerCertificate -or $sig.Status -eq 'HashMismatch') { Write-Host "::error::$($signed.Name) from SignPath carries no intact signature"; exit 1 }
          Copy-Item -Path $signed.FullName -Destination "fastag/build/FASTag.exe" -Force
          Write-Host "Signed binary in place: $($signed.Name)"

      # ---------------------------------------------------------------------
      # Bundle runtime dependencies for portability -- EVERY run, not just
      # releases. FASTag.exe as built above depends on DLLs (OpenMS and
      # conda's Arrow, Parquet, Boost, libxml2, ...) that only exist in THIS
      # job's own build environment; Windows has no RPATH/RUNPATH, so
      # the loader only searches the .exe's own directory and PATH, and
      # nothing on a bare download provides either. The exact same class of
      # bug shipped once already on macOS/Linux (an RPATH pointing at
      # /Users/runner/micromamba/..., discovered only when a real user
      # downloaded the release and ran it) -- fixed there the same way:
      # bundle everything the runtime actually needs, verify it standalone,
      # every push.
      #
      # Order matters not at all here, unlike macOS: Authenticode signs the
      # .exe file itself, so copying unrelated DLLs into the same folder
      # afterward cannot invalidate a signature already applied above --
      # this step runs after signing purely because it needs whichever copy
      # (signed or not) is currently in fastag/build/FASTag.exe.
      #
      # DLL set is deliberately generous rather than minimal: every
      # directory this job itself already needed on PATH to run its OWN
      # ctest/smoke-test (see "Add runtime DLL directories to PATH" above)
      # is copied wholesale, rather than guessing a narrower set with no way
      # to verify it on a machine that actually has Windows.
      #
      # share/OpenMS's location is found by searching rather than assumed:
      # an earlier OpenMS split its CMake package across two unrelated
      # directories on this platform.
      - name: Bundle runtime dependencies for portability (Windows)
        shell: bash
        run: |
          set -e
          rm -rf dist && mkdir -p dist/FASTag
          cp fastag/build/FASTag.exe dist/FASTag/FASTag.core.exe

          for d in "$WS/openms-install/bin" "$CONDA_LIB_PREFIX/bin"; do
            [ -d "$d" ] && cp -n "$d"/*.dll dist/FASTag/ 2>/dev/null || true
          done

          SHARE_DIR=$(find "$WS/openms-install" -type d -path '*/share/OpenMS' 2>/dev/null | head -1)
          if [ -z "$SHARE_DIR" ]; then
            echo "::error::Could not find OpenMS's share/ data directory anywhere under openms-install."
            exit 1
          fi
          cp -r "$SHARE_DIR" dist/FASTag/share-OpenMS
          # The tag-time smoke input, vendored (OpenMS is installed without
          # its examples/ tree), asserted on every build as in ci.yml.
          mkdir -p dist/FASTag/share-OpenMS/examples/ID
          cp fastag/test/fixtures/Ecoli_MS2_small.mzML dist/FASTag/share-OpenMS/examples/ID/
          test -s dist/FASTag/share-OpenMS/examples/ID/Ecoli_MS2_small.mzML

          # The taxonomy -species resolves by default. The pruned NCBI dumps
          # (12 KB) go here for every build; on TAG builds the "Embed taxonomy
          # index" step below replaces this dir with the full pinned index, so
          # the release zip is -species-complete. `share-FASTag-taxonomy` (not
          # share/FASTag/taxonomy) because this layout is FLAT -- the executable
          # sits at the root, so there is no ../share to resolve; FASTag looks for
          # both spellings, see taxonomyDir_() in src/FASTag.cpp.
          # fastag/data, not data: this workflow checks the repo out into fastag/
          # (`path: fastag` on actions/checkout), unlike ci.yml which uses the root.
          cp -r fastag/data/taxonomy dist/FASTag/share-FASTag-taxonomy
          # The -digest_out models and -massgap_out modifications, found the
          # same way (share-FASTag-digest in this flat layout).
          cp -r fastag/data/digest dist/FASTag/share-FASTag-digest

          # A .bat wrapper, not a shell script: this is Windows. The real
          # exe is named FASTag.core.exe (not FASTag.exe) specifically so
          # typing the bare command `FASTag` at a prompt resolves to this
          # wrapper via PATHEXT rather than racing it -- if both
          # FASTag.exe and FASTag.bat existed side by side, PATHEXT's
          # default order tries .EXE before .BAT and would silently skip
          # the wrapper.
          # OPENBLAS_NUM_THREADS: an OpenMS built against OpenBLAS starts a
          # spinning thread per core when the library loads, which costs real
          # CPU even for --help; FASTag never calls BLAS. Set here for the same
          # reason as in ci.yml's wrappers, and harmless when the build carries
          # no OpenBLAS. `if not defined` is the batch spelling of ${VAR:-1}:
          # a value the user set wins.
          printf '%s\r\n' \
            '@echo off' \
            'set "OPENMS_DATA_PATH=%~dp0share-OpenMS"' \
            'if not defined OPENBLAS_NUM_THREADS set "OPENBLAS_NUM_THREADS=1"' \
            '"%~dp0FASTag.core.exe" %*' \
            > dist/FASTag/FASTag.bat
          ls dist/FASTag | wc -l

      # Same regression guard as ci.yml, adapted for Windows: no RPATH to
      # strip, so the honest test is running with the DLL search directories
      # this job added to PATH earlier explicitly removed, from a directory
      # outside the build tree. Reaching OpenMS's own "file not found" error
      # proves every DLL AND the shared data directory resolved from the
      # bundle itself, not from this job's PATH.
      - name: Verify the bundle is portable (regression guard)
        shell: bash
        run: |
          set -e
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -viE "openms-install|conda|micromamba" | tr '\n' ':')
          OUT=$(cd /tmp && PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" -in nonexistent.mzML -out /tmp/portability-check.tsv 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -qiE "0xc0000135|not found.*\.dll|shared data"; then
            echo "::error::Bundle is NOT portable -- still resolves something from the build environment. See output above."
            exit 1
          fi
          echo "$OUT" | grep -q "File not found" || { echo "::error::Unexpected output -- never reached the expected 'file not found' error."; exit 1; }
          # And mzPeak through the bundle: arrow.dll, parquet.dll and zip.dll
          # must all have travelled.
          OUT2=$(cd /tmp && PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" \
                   -in "$WS/ci-data/small.mzpeak" -out /tmp/portability-mzpeak.tsv \
                   -threads 2 -fragment_tolerance 20 -fragment_tolerance_unit ppm 2>&1) || true
          echo "$OUT2" | grep -q "34 MS2 spectra" || { echo "$OUT2"; echo "::error::Shipped bundle cannot read mzPeak -- expected 34 MS2 spectra from small.mzpeak."; exit 1; }
          # ...and WRITES one, then reads its own output back, on the same
          # scrubbed PATH. Writing needs the Parquet writer and zip
          # finalisation -- code a read-only smoke never touches -- so a bundle
          # could read mzPeak and still fail every user who asks for
          # -out_spectra. Byte-identical tags, as ctest's mzpeak_roundtrip
          # demands of the unbundled binary; the archive is validated next.
          BW=/tmp/bundle-mzpeak; rm -rf "$BW"; mkdir -p "$BW"
          MZ="$GITHUB_WORKSPACE/dist/FASTag/share-OpenMS/examples/ID/Ecoli_MS2_small.mzML"
          PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" \
            -in "$MZ" -out "$BW/ml.tsv" -out_spectra "$BW/bundle.mzpeak" -threads 2 \
            -fragment_tolerance 20 -fragment_tolerance_unit ppm > "$BW/write.log" 2>&1 \
            || { cat "$BW/write.log"; echo "::error::the shipped bundle cannot WRITE mzPeak"; exit 1; }
          grep -q "Wrote [0-9]* spectra" "$BW/write.log" || { cat "$BW/write.log"; echo "::error::the bundle wrote no spectra"; exit 1; }
          PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" \
            -in "$BW/bundle.mzpeak" -out "$BW/mp.tsv" -threads 2 \
            -fragment_tolerance 20 -fragment_tolerance_unit ppm > "$BW/read.log" 2>&1 \
            || { cat "$BW/read.log"; echo "::error::the shipped bundle cannot read the archive it just wrote"; exit 1; }
          cmp -s "$BW/ml.tsv" "$BW/mp.tsv" || { echo "::error::tags from the bundle-written archive differ from the mzML tags"; diff "$BW/ml.tsv" "$BW/mp.tsv" | head; exit 1; }
          [ "$(grep -c . "$BW/mp.tsv")" -gt 1 ] || { echo "::error::the bundle round trip produced no tags"; exit 1; }
          echo "bundle round trip: $(grep -o 'Wrote [0-9]* spectra' "$BW/write.log"), tags byte-identical"
          # ...and finds its shipped digest data: -digest_out without
          # -digest_models must report the shipped background.
          PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" \
            -in "$MZ" -out "$BW/dg.tsv" -digest_out "$BW/digest.tsv" -threads 2 > "$BW/digest.log" 2>&1 \
            || { cat "$BW/digest.log"; echo "::error::the shipped bundle cannot write -digest_out"; exit 1; }
          grep -q $'^run\tbackground\tshipped_human\t' "$BW/digest.tsv" \
            || { cat "$BW/digest.log"; echo "::error::-digest_out did not find the shipped digest data"; exit 1; }
          echo "Portability check passed: runs standalone, no build-environment leakage, reads and writes mzPeak."

      # Every mzPeak archive this job wrote, through mzPeakValidator in full
      # mode. ctest's mzpeak_validate already covered the round-trip archives
      # (its reports are collected here); this covers the bundle's. OpenMS's
      # small.mzpeak goes first as a CONTROL: written by the reference
      # converter, it passes the pinned validator, so a failure on it means
      # the validator or its pin is broken, not FASTag.
      #
      # A hard failure on EVERY run, not only tags. The validator and its
      # engine are pinned, so the verdict can only change when FASTag's
      # writer changes -- and an archive other readers reject is a silent
      # failure for every user, exactly the kind this repository's history
      # says must fail a cheap main push rather than a release. The one
      # accepted gap (run references MzPeakFile does not write) is named in
      # test/mzpeak_validate.sh.
      - name: Validate every mzPeak archive this job wrote
        shell: bash
        run: |
          set -euo pipefail
          R=validator-reports; rm -rf "$R"; mkdir -p "$R"
          bash fastag/test/mzpeak_validate.sh "$R/control" ci-data/small.mzpeak \
            || { echo "::error::the CONTROL archive (reference converter) fails the pinned validator -- the validator or its pin is broken, not FASTag"; exit 1; }
          bash fastag/test/mzpeak_validate.sh "$R/bundle" /tmp/bundle-mzpeak/bundle.mzpeak \
            || { echo "::error::the archive the shipped bundle wrote is not a valid mzPeak archive"; exit 1; }
          cp -r fastag/build/mzpeak-roundtrip/validator "$R/ctest"
          ls -R "$R" | head -40

      # The reports, pass or fail: a red validator run is only useful with
      # the findings attached, and `always()` is what makes a failed step's
      # output reach the artifact.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mzpeak-validator-windows-x64
          path: validator-reports
          if-no-files-found: warn

      # Tag builds only -- see ci.yml's identical step for the full rationale
      # (pinned data release, loud failure, smoke semantics). --repo on every
      # gh call: this workflow's checkout lives at fastag/, so the default cwd
      # has no .git to infer the repo from.
      - name: Embed taxonomy index (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAXDB_TAG" -p 'FASTag-taxonomy-k7.tar.gz' -D /tmp/taxdb \
            --repo "${{ github.repository }}"
          got=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" /tmp/taxdb/FASTag-taxonomy-k7.tar.gz)
          [ "$got" = "$TAXDB_SHA256" ] || { echo "taxonomy sha256 mismatch: $got"; exit 1; }
          rm -rf dist/FASTag/share-FASTag-taxonomy
          tar -xzf /tmp/taxdb/FASTag-taxonomy-k7.tar.gz -C dist/FASTag
          test -s dist/FASTag/share-FASTag-taxonomy/tax_k7.taxdb
          MZ=dist/FASTag/share-OpenMS/examples/ID/Ecoli_MS2_small.mzML
          test -s "$MZ" || { echo "smoke fixture missing from bundle"; exit 1; }
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -viE "openms-install|conda|micromamba" | tr '\n' ':')
          PATH="$CLEAN_PATH" "$GITHUB_WORKSPACE/dist/FASTag/FASTag.bat" -in "$MZ" -out /tmp/smoke.tsv \
            -species -species_out /tmp/smoke.species.tsv \
            -tag_length 7 -extension 2 \
            -fragment_tolerance 0.3 -fragment_tolerance_unit Da
          [ "$(wc -l < /tmp/smoke.species.tsv)" -ge 2 ] || { echo "species smoke wrote an empty report"; exit 1; }

      # ----------------------------------------------- desktop app (Windows)
      # Builds the Tauri app around the CLI bundle assembled above and signs
      # the INSTALLER through SignPath. The CLI inside it is already signed by
      # the steps further up, which matters: Authenticode, like notarization,
      # is per-executable, and an installer that drops an unsigned .exe on
      # disk gets SmartScreen-flagged the moment a user runs the thing it
      # installed rather than the installer itself.
      #
      # This is a SECOND SignPath signing request, so a release signs twice
      # and needs the Approve click in SignPath's console twice.
      #
      # Runs on a v* tag, or on a workflow_dispatch with gui_dry_run set. Take
      # the dry run seriously here: the Windows desktop app has never been
      # built in CI at all, so unlike macOS this path has no working precedent
      # behind it.
      - uses: actions/setup-node@v7
        if: startsWith(github.ref, 'refs/tags/v') || inputs.gui_dry_run
        with:
          node-version: 24

      - name: Stage the CLI as the app's bundled resources (Windows)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.gui_dry_run
        shell: bash
        run: |
          set -euo pipefail
          # Same layout resolve_binary() expects on every platform:
          # <resources>/fastag/bin/<exe>, share/OpenMS, share/FASTag/taxonomy.
          # This job checks out into fastag/ (actions/checkout `path:`), so every
          # GUI path needs that prefix. Without it `mkdir -p` cheerfully built a
          # second, EMPTY gui/ tree beside the checkout, every cp and test -s
          # passed against it, and the failure only surfaced two steps later as
          # `npm ci` finding no package.json. Assert the real source is there
          # before creating anything.
          test -f fastag/gui/package.json
          R=fastag/gui/src-tauri/resources/fastag
          rm -rf "$R"; mkdir -p "$R/bin" "$R/share/FASTag"
          cp dist/FASTag/FASTag.core.exe "$R/bin/FASTag.exe"
          # Windows has no RPATH: every DLL must sit in the SAME directory as
          # the .exe that loads it. So bin/ is flat here, where macOS puts the
          # closure in bin/lib -- the difference is the loader's, not a
          # packaging preference.
          cp dist/FASTag/*.dll "$R/bin/"
          cp -r dist/FASTag/share-OpenMS "$R/share/OpenMS"
          cp -r dist/FASTag/share-FASTag-taxonomy "$R/share/FASTag/taxonomy"
          cp -r dist/FASTag/share-FASTag-digest "$R/share/FASTag/digest"
          test -s "$R/bin/FASTag.exe"
          test -s "$R/share/OpenMS/examples/ID/Ecoli_MS2_small.mzML"

      # pwsh, NOT bash: Git Bash prepends its /usr/bin at startup, and that
      # directory has a link.exe -- coreutils' hard-link command -- which then
      # shadows MSVC's linker for every cargo invocation. rustc finds `link.exe`
      # by PATH name, so the whole Rust build died on its first build script
      # with "/usr/bin/link: extra operand". CMake never hit this because it
      # resolves the linker from cl.exe's own directory. msvc-dev-cmd's PATH,
      # with the MSVC bin dir first, survives intact in pwsh.
      - name: Build the desktop app (Windows)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.gui_dry_run
        timeout-minutes: 90
        working-directory: fastag/gui
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Prove the right linker wins before spending ten minutes finding out.
          $link = (Get-Command link.exe).Source
          if ($link -like '*\Git\usr\bin\*') { throw "coreutils link.exe shadows MSVC's: $link" }
          Write-Host "linker: $link"
          npm ci;              if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run tauri build; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem src-tauri/target/release/bundle/nsis/ -ErrorAction SilentlyContinue

      # SignPath's 'initial' artifact configuration expects a ZIP containing
      # *.exe -- upload-artifact always zips, and the NSIS installer is an
      # .exe, so the same configuration covers it without a new one.
      - name: Upload unsigned installer for SignPath (Windows)
        if: steps.signpath-gate.outputs.enabled == 'true'
        id: upload-unsigned-gui
        uses: actions/upload-artifact@v7
        with:
          name: FASTag-gui-windows-x64-unsigned
          path: fastag/gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Sign the installer via SignPath Foundation (Windows)
        if: steps.signpath-gate.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ steps.signpath-gate.outputs.policy }}
          artifact-configuration-slug: 'initial'
          github-artifact-id: ${{ steps.upload-unsigned-gui.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          # The default 300 s bounds the WHOLE download, not idle time, and the
          # signed installer is ~365 MB: 1200 s still fits the job timeout.
          download-signed-artifact-timeout-in-seconds: 1200
          output-artifact-directory: 'signed-gui'

      # On dry runs too, unlike the attach step below: the dry run exists to
      # prove what a tag run would ship.
      - name: Check the signed installer (Windows)
        if: steps.signpath-gate.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "signed-gui" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signed) { Write-Host "::error::SignPath returned no signed installer"; exit 1 }
          $sig = Get-AuthenticodeSignature $signed.FullName
          Write-Host "Authenticode: $($sig.Status) -- $($sig.SignerCertificate.Subject)"
          if (-not $sig.SignerCertificate -or $sig.Status -eq 'HashMismatch') { Write-Host "::error::$($signed.Name) from SignPath carries no intact signature"; exit 1 }

      - name: Attach the signed installer to the release (Windows)
        if: steps.signpath-gate.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $signed = Get-ChildItem -Path "signed-gui" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signed) { Write-Host "::error::SignPath returned no signed installer"; exit 1 }
          Copy-Item $signed.FullName -Destination "FASTag-gui-windows-x64-setup.exe" -Force
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" `
            --notes "Automated binary upload; release notes pending." 2>$null
          gh release upload "${{ github.ref_name }}" "FASTag-gui-windows-x64-setup.exe" --clobber

      # Unsigned fallback. Without this the installer would be BUILT on every tag
      # and then thrown away whenever SignPath is not configured, which is the
      # current state -- users would see a .zip of loose files and no installer
      # at all. SmartScreen will warn until the certificate exists; that is the
      # same trade the platform tarballs already make.
      - name: Attach the UNSIGNED installer to the release (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signpath-gate.outputs.enabled != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $nsis = Get-ChildItem -Path "fastag/gui/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { Write-Host "::warning::no NSIS installer was produced"; exit 0 }
          Write-Host "::warning title=Unsigned Windows installer::Shipping the installer unsigned -- SmartScreen will warn on first run."
          Copy-Item $nsis.FullName -Destination "FASTag-gui-windows-x64-setup.exe" -Force
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" `
            --notes "Automated binary upload; release notes pending." 2>$null
          gh release upload "${{ github.ref_name }}" "FASTag-gui-windows-x64-setup.exe" --clobber

      # A dry run has no release to attach to; the installer comes back as a
      # workflow artifact so the bundle can be installed and checked -- the
      # SignPath-signed one when signing ran, so its signature can be too.
      - uses: actions/upload-artifact@v7
        if: inputs.gui_dry_run
        with:
          name: FASTag-gui-windows-x64-dryrun
          path: ${{ steps.signpath-gate.outputs.enabled == 'true' && 'signed-gui/*.exe' || 'fastag/gui/src-tauri/target/release/bundle/nsis/*.exe' }}
          if-no-files-found: error

      # Same mechanism as ci.yml's identical step -- see there for why the
      # filename carries no version and why the create-or-fail-harmlessly
      # pattern is safe across two independent workflows racing to attach to
      # the same release. Archives the WHOLE dist/FASTag/ folder now, not a
      # single file: users run FASTag.bat (or bare `FASTag`), not the
      # FASTag.core.exe it calls.
      - name: Attach binary to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --repo explicitly: this job's checkout lives at $WS/fastag (the
          # "path: fastag" above), so $GITHUB_WORKSPACE itself -- this step's
          # default cwd -- has no .git for gh to auto-detect the repo from.
          # Without --repo, both calls below fail with "not a git repository".
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Automated binary upload; release notes pending." \
            2>/dev/null || true
          # Compress-Archive, not zip: unlike every other tool this workflow
          # already leans on (find, dirname, grep), zip.exe was never actually
          # confirmed present in this runner's Git-for-Windows bundle. Every
          # Windows box has PowerShell, so this has no such gap.
          powershell -NoProfile -Command \
            "Compress-Archive -Path '$WS/dist/FASTag' -DestinationPath 'FASTag-windows-x64.zip' -Force"
          gh release upload "${{ github.ref_name }}" FASTag-windows-x64.zip --clobber \
            --repo "${{ github.repository }}"

  # ------------------------------------------------- release completeness
  # Asserts the Windows zip only; ci.yml's mirror job asserts the unix
  # tarballs and taxonomy assets. Split because GitHub has no cross-workflow
  # `needs:` and either workflow can finish first.
  release-complete:
    # !cancelled() for the same reason as ci.yml's job.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [windows-x64]
    runs-on: ubuntu-24.04
    steps:
      # Own asset ONLY: there is no cross-workflow `needs:`, and "Windows is
      # the long pole" is a heuristic, not a guarantee -- on warm caches the
      # unix legs can lag and a healthy release would go red here. Each
      # workflow asserts what it owns; together they cover the full list.
      - name: Assert this workflow's asset is on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          have=$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name')
          echo "$have" | grep -qx "FASTag-windows-x64.zip" || { echo "MISSING: FASTag-windows-x64.zip"; exit 1; }
