# TEMPORARY diagnosis (post1131/win-crash): the released installers on x64 and
# arm64 Windows runners. Removed again before the branch is proposed.
name: win-installed-probe
on:
  push:
    branches: [post1131/win-crash]
    paths: ['.github/workflows/win-installed-probe.yml', 'tools/windows_installed_check.ps1']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        tag: [v1.13.2, v1.13.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - name: Download the released installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download ${{ matrix.tag }} -R ${{ github.repository }} -p FASTag-gui-windows-x64-setup.exe -D dl
      - name: Installed-app check
        id: check
        continue-on-error: true
        shell: pwsh
        run: ./tools/windows_installed_check.ps1 -Installer dl/FASTag-gui-windows-x64-setup.exe -Dest "$env:RUNNER_TEMP\FASTag-app" -Keep
      - name: Diagnose (redirect verbose / disabled)
        shell: pwsh
        run: |
          $R = "$env:RUNNER_TEMP\FASTag-app\resources\fastag"
          $env:OPENMS_DATA_PATH = "$R\share\OpenMS"
          foreach ($v in @(@{MIMALLOC_VERBOSE='1'}, @{MIMALLOC_VERBOSE='1'; MIMALLOC_DISABLE_REDIRECT='1'})) {
            foreach ($k in $v.Keys) { Set-Item "env:$k" $v[$k] }
            $o = & "$R\bin\FASTag.exe" --help 2>&1 | Out-String
            "{0}: exit {1} (0x{1:X8}) version={2}" -f (($v.Keys | % { "$_=$($v[$_])" }) -join ' '), $LASTEXITCODE, ([regex]::Match($o,'Version:\s*\S+').Value)
            ($o -split "`n" | Select-String -Pattern 'mimalloc' | Select-Object -First 12) -join "`n"
          }
          Get-CimInstance Win32_Processor | Select-Object Name, Architecture | Format-List
          $m = (Get-Item "$env:windir\System32\ucrtbase.dll").VersionInfo.FileVersion; "system ucrtbase $m"
      - name: Result
        if: steps.check.outcome != 'success'
        shell: pwsh
        run: exit 1
