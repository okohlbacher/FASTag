name: build

# Linux x64/arm64 and macOS arm64/x64, tests included.
#
# FASTag 1.7 builds against OpenMS develop at a pinned commit (OPENMS_REF), the
# first OpenMS with MzPeakFile and the OpenMS_CLI library. There is no package
# of it, so each platform's job builds that commit from source against the
# conda-forge libraries in .github/env/openms.yml and caches the install; the
# key is the commit, the platform, the toolchain and that file's hash. A cold
# build takes about an hour; afterwards it is a cache hit. The install is saved
# explicitly right after it is built, so a FASTag failure later in the job
# cannot throw it away, and one platform's failure does not hold back the
# others. Windows builds the same commit in windows.yml.
#
# The shipped bundle is then made to READ and WRITE an mzPeak archive before
# it is accepted; every previous silent loss of that feature presented as a
# green build, and that check is what closes the gap.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # gui_dry_run exists because every desktop-app step below runs ONLY on a v*
  # tag, so their first execution would otherwise be a real release -- the one
  # run where a mistake is expensive. Dispatch this workflow with the switch on
  # to build (and, when the MACOS_* secrets exist, sign and notarize) the .app
  # without cutting a tag. Nothing is uploaded to a release in that mode; the
  # .dmg comes back as a workflow artifact instead.
  workflow_dispatch:
    inputs:
      gui_dry_run:
        description: 'Build the macOS and Linux desktop apps without cutting a tag'
        type: boolean
        default: false
      # Exercises the homebrew-tap job without a tag: checks HOMEBREW_TAP_TOKEN
      # exists and can see the tap's workflow; dispatches nothing.
      tap_dry_run:
        description: 'Check the Homebrew tap token without dispatching the tap'
        type: boolean
        default: false
      # A plain dry run ships no taxonomy index (~450 MB), so its dmg is far
      # smaller than a release dmg and the size reported by the ULMO step says
      # nothing about the real payload. With this switch on as well, the
      # macos-arm64 and linux-x64 legs embed the same pinned index a tag build
      # embeds, and the dry run builds, notarizes and measures the real
      # release image -- and builds, smoke-tests and size-checks the
      # release-sized Linux .deb, tarball and AppImage (gui-linux).
      gui_full_payload:
        description: 'With gui_dry_run: embed the pinned taxonomy index (release-sized dmg and Linux bundles)'
        type: boolean
        default: false
      # The tag build's promotion path, without a tag: finds the release
      # candidate (a gui_dry_run + gui_full_payload run of this tree, below)
      # and attaches its files to this DRAFT release instead of a tag's,
      # runs the smoke jobs against them and checks every digest. Nothing is
      # built, nothing is published, the tap is not touched. The name must
      # start with ci-promotion-test-.
      promote_to:
        description: 'Promotion dry run: attach the release candidate of this tree to this DRAFT release (ci-promotion-test-*); empty = off'
        type: string
        default: ''
      # With promote_to: no promotion -- the full build and test path of a
      # tag, attached to the draft instead (the fallback, end to end). A tag
      # push gets the same through the repository variable
      # RELEASE_FORCE_REBUILD=<tag> (then re-run the tag's workflows).
      force_rebuild:
        description: 'With promote_to: build everything as a tag without a candidate would (the fallback), attaching to the draft'
        type: boolean
        default: false

# cancel-in-progress is ON, after turning it off caused something worse.
#
# The history is worth keeping, because the first diagnosis was wrong. macos-x64
# never executed across six consecutive runs, and that was read as aggressive
# cancellation starving a scarce runner -- so this was set to `false`.
#
# The real cause was that `macos-13` is RETIRED and no runner would ever pick the
# job up. Turning cancellation off did not fix that; it converted a job that
# could not run into a permanent head-of-line block. Run 29857387912 sat `queued`
# on its macos-x64 job holding the refs/heads/main concurrency group, and EVERY
# subsequent push to main was blocked behind it for about a day. The v0.9.0 tag
# build passed only because tags land in a different group.
#
# Two lessons, both encoded below: an unschedulable runner label is a wedge, not
# a delay; and `cancel-in-progress: false` turns any wedge into an outage.
# Read-only unless a job says otherwise: only the jobs that write to a
# release (version, which creates the draft; the uploaders; promote-assets;
# release-notes; the publisher) get contents: write.
permissions:
  contents: read

concurrency:
  # A manual dispatch gets its OWN group. Sharing <workflow>-refs/heads/main
  # with ordinary pushes means cancel-in-progress lets the next push to main
  # kill a validation run mid-flight -- which is exactly what happened to the
  # first gui_dry_run on 2026-09-08: cancelled at 2m17s by a push that landed
  # 13 seconds earlier. A dispatch is user-initiated and bounded, so giving it
  # a unique group cannot reintroduce the head-of-line wedge described above.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # The platform-independent ~430 MB taxonomy k-mer index, embedded into every
  # release tarball at tag time and copied onto each release as a standalone
  # asset. Pinned to a DATA-ONLY release tag + sha256 -- a moving ref would
  # silently change what a release contains (the pinning lesson), and
  # assets under an existing data tag are never mutated. To ship a rebuilt
  # index: create a new taxonomy-k7-YYYYMMDD release carrying the new tarball
  # + .sha256 FIRST, then bump BOTH values here in one commit, then tag.
  #
  # THE DATA RELEASE MUST BE A PRE-RELEASE (`gh release create --prerelease`,
  # or `gh release edit <tag> --prerelease` after the fact). GitHub hands the
  # "Latest" slot to the newest NON-prerelease, and the README and the
  # project page send every download to /releases/latest (the page through
  # the API's releases/latest) -- publishing this data tag as a normal
  # release hides every platform download until it is demoted. That
  # happened once, on 2026-09-01, and this is the fix.
  # windows.yml carries the same two pins and must stay in lockstep.
  TAXDB_TAG: taxonomy-k7-20260901
  TAXDB_SHA256: 520d93229df807e45b0e6fdf4d8d20c7aad95b73952749cb041c3e54de474a4b
  # The OpenMS this binary is built against: OpenMS/OpenMS develop
  # (3.7.0-dev), after the mzPeak merge. Pinned by SHA -- a moving ref would
  # silently change what a release contains -- and part of the cache key.
  # windows.yml carries the same pin and must move in lockstep.
  OPENMS_REF: 70cebcd14442cecd6bcd9794fb6786d3342cacc6
  # The macOS floor, CHOSEN rather than inherited from whatever SDK the runner
  # image happens to ship. v1.4.2 went out with minos 14.0 on arm64 (macos-14)
  # and 15.0 on x64, while the libOpenMS.dylib bundled beside it asked for
  # 11.3 and the app's Info.plist promised 11.0. dyld refuses to load a
  # Mach-O on a macOS older than its minos -- and the floor moved on its own
  # each time GitHub retired a runner image.
  #
  # 13.4: the floating-point std::to_chars the TSV writer formats numbers with
  # (instead of snprintf, whose macOS implementation serialises every thread
  # on a global locale lock), and that OpenMS develop's std::format uses, is
  # available from 13.4 on in conda-forge's libc++ 19 -- below it the build
  # fails with "'to_chars' is unavailable". Still above every bundled
  # conda-forge dependency's own floor. gui/src-tauri/tauri.conf.json's minimumSystemVersion
  # carries the same value -- the Homebrew casks in okohlbacher/homebrew-fastag
  # read the floor off that plist. OpenMS is built here with the same floor,
  # and the floor is part of its cache key.
  MACOS_MIN_VERSION: "13.4"
  # Vendor readers (1.15.2): OpenMS is built WITH_OPENTIMS=ON (Bruker .d,
  # opentims, MIT) and WITH_THERMO_RAW=ON (Thermo .raw through
  # openms-thermo-bridge and Thermo's RawFileReader assemblies). The bridge's
  # managed half is compiled by this .NET SDK (part of the OpenMS cache key);
  # the bundles carry the matching .NET runtime (MIT), which the CLI finds
  # beside itself (src/ThermoInput.h, useBundledRuntime). Both pinned:
  # dotnet-install takes an exact version. windows.yml carries the same pins.
  DOTNET_SDK_VERSION: "8.0.428"
  DOTNET_RUNTIME_VERSION: "8.0.34"
  # A Thermo .raw from OpenMS's own test data at OPENMS_REF (2 MB, small
  # molecules: it has MS2 but no peptide tags). It proves a bundle's
  # Thermo reader starts its .NET runtime and reads scans.
  THERMO_SMOKE_RAW_SHA256: ad87e20816a6383fa38f4991b3df012d8a05e92c1e67d8e9e1ef0b6a979330f2
  # A RELEASE CANDIDATE: a dispatch with gui_dry_run and gui_full_payload
  # builds every release file at release size, signed as a tag signs them,
  # and tests them as a tag tests them. Every job that makes a release file
  # then records it (name, artifact, sha256: .github/scripts/rc-manifest.py
  # part), and job "release candidate", which runs only when every gate
  # passed, writes the manifest. A v* tag of the same git tree attaches
  # those files instead of building them again (job version, promote).
  RC_CANDIDATE: ${{ inputs.gui_dry_run && inputs.gui_full_payload && 'true' || 'false' }}

jobs:
  # ------------------------------------------------------ release version
  # The ONE place this workflow decides the version the release files carry
  # in their names (FASTag-<version>-<variant>.<ext>): the tag without its v
  # on a v* tag, project(FASTag VERSION ...) in CMakeLists.txt otherwise (a
  # dry run, a branch). A tag that disagrees with CMakeLists.txt fails here,
  # before anything is built. Every job that names a release file reads
  # needs.version.outputs.version; tools/release_assets.sh holds the rule.
  version:
    name: release version
    runs-on: ubuntu-24.04
    permissions:
      # write: the one creator of the release draft (release-draft.sh create)
      contents: write
      # read: the release-candidate lookup (.github/scripts/release-candidate.sh)
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      # 'false': a documentation-only change (step changes); build and test skip
      code: ${{ steps.changes.outputs.code }}
      # 'true' only on a v* tag push: the one run that publishes.
      publish: ${{ steps.rc.outputs.publish }}
      # the draft's id; every writer uses it, never the tag name
      release_id: ${{ steps.rc.outputs.release_id }}
      candidate_attempt: ${{ steps.rc.outputs.run_attempt }}
      manifest_sha256: ${{ steps.rc.outputs.manifest_sha256 }}
      # 'true' when a v* tag (or a promote_to dry run) attaches the files of
      # release candidate run candidate_run instead of building them; every
      # build job then skips, the promote and promoted-smoke jobs run.
      promote: ${{ steps.rc.outputs.promote }}
      candidate_run: ${{ steps.rc.outputs.run_id }}
      # The release this run writes to: the tag, or promote_to's draft.
      release: ${{ steps.rc.outputs.release }}
      legs: ${{ steps.legs.outputs.legs }}
      linux_legs: ${{ steps.legs.outputs.linux_legs }}
      linux_x64_leg: ${{ steps.legs.outputs.linux_x64_leg }}
      linux_arm64_leg: ${{ steps.legs.outputs.linux_arm64_leg }}
      macos_legs: ${{ steps.legs.outputs.macos_legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            CMakeLists.txt
            tools/release_assets.sh
            .github/docs-only.txt
            .github/scripts
          sparse-checkout-cone-mode: false
      # A pull request or main push that changes only files of
      # .github/docs-only.txt (screenshots, the manual, ...) skips every build
      # and test job: they report as skipped, the run stays green. Tags,
      # dispatches and anything else: code=true.
      - name: Documentation-only change?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          files=""
          if [ "$EVENT" = pull_request ] && [ -n "$PR" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --paginate --jq '.[].filename') || files=""
          elif [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename') || files=""
          fi
          code=true
          if [ -n "$files" ] && [ -f .github/docs-only.txt ]; then
            mapfile -t pats < <(grep -v '^#' .github/docs-only.txt | grep .)
            code=false
            while IFS= read -r f; do
              hit=0
              for p in "${pats[@]}"; do
                # shellcheck disable=SC2053  # the patterns are globs
                if [[ "$f" == $p ]]; then hit=1; break; fi
              done
              [ "$hit" = 1 ] || { code=true; echo "code change: $f"; break; }
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = true ] || echo "### Documentation only ($(wc -l <<< "$files") files): build and test jobs skipped" >> "$GITHUB_STEP_SUMMARY"
      - id: v
        env:
          TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          v=$(tools/release_assets.sh version "$TAG")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "### Release files carry version $v (FASTag-$v-<variant>.<ext>)" >> "$GITHUB_STEP_SUMMARY"

      # The build matrix (job `build`). JSON here rather than YAML there,
      # because a YAML matrix cannot drop an `include` entry by event.
      - id: legs
        run: |
          set -euo pipefail
          # linux-x64 / linux-arm64: gcc 14 against a glibc 2.28 sysroot.
          #
          # macos-arm64: dylibbundler (the macOS equivalent of patchelf) is a
          # Homebrew package, not a conda-forge one, and is installed by brew
          # in its own step. macos-15, not macos-14: GitHub retired every
          # macOS 14 image on 2026-11-02, and the label then failed at once
          # ("The configuration 'macos-14-arm64-us-default' is not supported";
          # PR #11 run 42170681139 was cancelled within a second). The image
          # only supplies the SDK and the host; the floor is MACOS_MIN_VERSION
          # (13.4), set explicitly, and the "Assert the macOS deployment
          # target" step checks every Mach-O against it, so a newer image
          # cannot raise it silently. The OpenMS cache key carries the floor
          # and the conda toolchain, not the image, so it stays warm.
          legs='[
            {"name":"linux-x64","runner":"ubuntu-24.04","compilers":"gxx_linux-64=14.* sysroot_linux-64=2.28.*","toolchain":"gcc14-glibc2.28","extra":"patchelf"},
            {"name":"linux-arm64","runner":"ubuntu-24.04-arm","compilers":"gxx_linux-aarch64=14.* sysroot_linux-aarch64=2.28.*","toolchain":"gcc14-glibc2.28","extra":"patchelf"},
            {"name":"macos-arm64","runner":"macos-15","arch":"arm64","compilers":"clangxx_osx-arm64=19.* llvm-openmp=19.*","toolchain":"clang19","extra":""}
          ]'
          # macos-x64 (Intel) was dropped in 1.16.2: GitHub's Intel runners were the
          # slowest leg, lost their runner twice, and end in 2027. 1.16.1 is the
          # last Intel release.
          legs=$(jq -c . <<<"$legs")
          # A build job per leg (build-linux-x64, build-linux-arm64,
          # build-macos), so each GUI job needs only its own leg's CLI: x64
          # never waits for arm64, nor either for a macOS runner.
          {
            echo "legs=$legs"
            echo "linux_legs=$(jq -c 'map(select(.name | startswith("linux")))' <<<"$legs")"
            echo "linux_x64_leg=$(jq -c 'map(select(.name == "linux-x64"))' <<<"$legs")"
            echo "linux_arm64_leg=$(jq -c 'map(select(.name == "linux-arm64"))' <<<"$legs")"
            echo "macos_legs=$(jq -c 'map(select(.name | startswith("macos")))' <<<"$legs")"
          } >> "$GITHUB_OUTPUT"
          echo "build legs: $(jq -r 'map(.name) | join(", ")' <<<"$legs")" | tee -a "$GITHUB_STEP_SUMMARY"

      # Release intent, promotion and the draft, decided once, here.
      #   release: a v* TAG PUSH (a dispatch on a tag is an ordinary dispatch:
      #     it never writes to a release), or promote_to's draft; else empty.
      #   publish: only the tag push publishes (release-complete).
      #   promote: a release candidate of this exact tree
      #     (release-candidate.sh: a completed gui_dry_run + gui_full_payload
      #     dispatch of this workflow whose "release candidate" job passed in
      #     its latest attempt, whose manifest names this tree, version, run,
      #     attempt and workflow with the macOS files signed, and whose every
      #     payload artifact is still there); then its files are attached and
      #     smoke-tested instead of built. No candidate, an API error,
      #     force_rebuild (promote_to) or the repository variable
      #     RELEASE_FORCE_REBUILD naming the tag: everything is built and
      #     tested as before.
      #   release_id: the draft (release-draft.sh create: the one creator;
      #     a published release is refused unless the repository variable
      #     RELEASE_REPAIR names the tag; promote_to only ever a draft).
      # Incompatible inputs are refused before anything runs.
      - name: Release intent, promotion and the draft
        id: rc
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          RC_META: macos_signed=true
          IS_TAG_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          PROMOTE_TO: ${{ inputs.promote_to }}
          FORCE: ${{ inputs.force_rebuild || (vars.RELEASE_FORCE_REBUILD != '' && vars.RELEASE_FORCE_REBUILD == github.ref_name) }}
          REPAIR: ${{ vars.RELEASE_REPAIR != '' && vars.RELEASE_REPAIR == github.ref_name }}
          DRY: ${{ inputs.gui_dry_run }}
          FULL: ${{ inputs.gui_full_payload }}
          FORCE_INPUT: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail
          if [ -n "$PROMOTE_TO" ]; then
            [[ "$PROMOTE_TO" =~ ^ci-promotion-test-[A-Za-z0-9._-]+$ ]] \
              || { echo "::error::promote_to must be a ci-promotion-test-* draft, not '$PROMOTE_TO'"; exit 1; }
            [ "$DRY" != true ] && [ "$FULL" != true ] \
              || { echo "::error::promote_to replays a tag run; it does not combine with gui_dry_run or gui_full_payload"; exit 1; }
            REL=$PROMOTE_TO; PUBLISH=false; export RELEASE_DRAFT_ONLY=1
          elif [ "$IS_TAG_PUSH" = true ]; then
            REL=$GITHUB_REF_NAME; PUBLISH=true
            [ "$REPAIR" = true ] && export RELEASE_ALLOW_PUBLISHED=1
          else
            [ "$FORCE_INPUT" != true ] || { echo "::error::force_rebuild needs promote_to"; exit 1; }
            { echo "release="; echo "publish=false"; echo "promote=false"; echo "release_id="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { echo "release=$REL"; echo "publish=$PUBLISH"; } >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = true ]; then
            { echo "promote=false"; echo "run_id="; echo "run_attempt="; echo "manifest_sha256="; } >> "$GITHUB_OUTPUT"
            echo "### $REL: forced rebuild (no promotion)" >> "$GITHUB_STEP_SUMMARY"
          else
            bash .github/scripts/release-candidate.sh "$RUNNER_TEMP/rc"
            if [ -n "$PROMOTE_TO" ] && ! grep -qx 'promote=true' "$GITHUB_OUTPUT"; then
              echo "::error::promote_to: no release candidate of this tree (see above)"; exit 1
            fi
          fi
          id=$(bash .github/scripts/release-draft.sh create "$REL")
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "### $REL: draft release $id (publish: $PUBLISH)" >> "$GITHUB_STEP_SUMMARY"

  build-linux-x64:
    name: ${{ matrix.name }} build
    if: (needs.version.outputs.promote != 'true') && needs.version.outputs.code != 'false'
    runs-on: ${{ matrix.runner }}
    needs: [version]
    env:
      ASSET_VERSION: ${{ needs.version.outputs.version }}
      FASTAG_BUILD_TARGET: FASTag
    # Read-only: the build jobs make artifacts; the uploader jobs
    # (gui-linux-release, gui-linux-arm64-release, macos-release) attach them.
    permissions:
      contents: read
    # A ceiling, not an estimate. Linux finishes in minutes once OpenMS is
    # cached; this exists so a job that hangs dies rather than holding a
    # concurrency group. It does NOT cover a job stuck waiting for a runner --
    # GitHub only starts this clock once the job is picked up. The protection
    # against that is not naming labels that do not exist.
    #
    # 330: up to 240 minutes for a cold OpenMS build on a 3-4 core runner,
    # plus 90 for FASTag, of which the macOS notarization step below may take
    # 60 on its own.
    # NOTE: this does not cover the one-time exception where a brand-new
    # bundle ID's FIRST notarization submission can take 8-12 hours
    # -- that has to be primed manually, out of band,
    # before the first real signed release.
    timeout-minutes: 330
    # The legs come from job `version` (outputs.legs), where the list and the
    # reasons for each runner are written down.
    #
    # This job runs the Linux legs; build-macos runs the macOS ones with the
    # same steps (the YAML alias build-steps), so gui-linux and gui-linux-arm64
    # start as soon as the Linux legs are done.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.linux_x64_leg) }}

    steps: &build-steps
      - &s01
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The same libraries OpenMS was built against (.github/env/openms.yml),
      # the same compilers, plus what packaging needs.
      - &s02
        name: Install the toolchain and dependencies
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: .github/env/openms.yml
          create-args: ${{ matrix.compilers }} ${{ matrix.extra }}
          init-shell: bash
          cache-environment: true

      # OpenMS: restored from the cache, or built from source and saved at once,
      # so a later FASTag failure in this job cannot keep the build from the
      # cache (actions/cache would save only from a successful job).
      - &s03
        name: Restore OpenMS
        id: openms-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: openms-install
          key: openms-${{ env.OPENMS_REF }}-${{ matrix.name }}-${{ matrix.toolchain }}-${{ hashFiles('.github/env/openms.yml') }}-osx${{ env.MACOS_MIN_VERSION }}-vendor-dotnet${{ env.DOTNET_SDK_VERSION }}-v1

      # A cache miss (an eviction, a new pin): the same install as a prebuilt
      # asset of the deps release (deps-openms-<OPENMS_REF, 8>: a prerelease,
      # never Latest, written only by main and tag pushes), sha256-checked, in
      # seconds; only when that is missing too is OpenMS built from source.
      - &s03b
        name: Fetch the prebuilt OpenMS (cache miss)
        id: openms-prebuilt
        if: steps.openms-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: openms-${{ env.OPENMS_REF }}-${{ matrix.name }}-${{ matrix.toolchain }}-${{ hashFiles('.github/env/openms.yml') }}-osx${{ env.MACOS_MIN_VERSION }}-vendor-dotnet${{ env.DOTNET_SDK_VERSION }}-v1
        run: |
          set -uo pipefail
          sha() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          rel=${OPENMS_DEPS_RELEASE:-deps-openms-${OPENMS_REF:0:8}}
          d="$RUNNER_TEMP/openms-prebuilt"; rm -rf "$d"; mkdir -p "$d"
          start=$(date +%s)
          if gh release download "$rel" --repo "$GITHUB_REPOSITORY" -p "$KEY.tar.gz" -p "$KEY.tar.gz.sha256" -D "$d"; then
            (cd "$d" && sha -c "$KEY.tar.gz.sha256") || { echo "::error::the prebuilt OpenMS in $rel does not match its sha256"; exit 1; }
            # Relative archive path: GNU tar reads "D:..." as a remote host.
            ws=$PWD; rm -rf openms-install
            (cd "$d" && tar -xzf "$KEY.tar.gz" -C "$ws") || { echo "::error::the prebuilt OpenMS did not unpack"; exit 1; }
            rm -rf "$d"
            echo "got=true" >> "$GITHUB_OUTPUT"
            echo "prebuilt OpenMS from $rel in $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "got=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no prebuilt OpenMS $KEY in $rel: building it from source (about an hour)"
          fi

      - &s04
        name: Check out OpenMS at the pinned commit
        if: steps.openms-cache.outputs.cache-hit != 'true' && steps.openms-prebuilt.outputs.got != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git init -q openms-src
          cd openms-src
          git remote add origin https://github.com/OpenMS/OpenMS.git
          # GitHub serves a reachable commit by SHA; if that is ever refused,
          # fetch develop shallow and deepen until the commit is there.
          if ! git fetch -q --depth 1 origin "$OPENMS_REF"; then
            git fetch -q --depth 1 origin develop
            for _ in 1 2 3 4 5 6 7 8; do
              git cat-file -e "$OPENMS_REF^{commit}" 2>/dev/null && break
              git fetch -q --deepen=500 origin develop
            done
          fi
          git checkout -q "$OPENMS_REF"
          test -f src/openms/include/OpenMS/FORMAT/MzPeakFile.h

      # The .NET SDK the Thermo bridge's managed half is built with (only
      # when OpenMS is built; the runtime the CLI uses is installed below on
      # every run).
      - &s05
        name: Install the .NET SDK (OpenMS Thermo bridge)
        if: steps.openms-cache.outputs.cache-hit != 'true' && steps.openms-prebuilt.outputs.got != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dotnet-install.sh" https://dot.net/v1/dotnet-install.sh
          bash "$RUNNER_TEMP/dotnet-install.sh" --version "$DOTNET_SDK_VERSION" --install-dir "$RUNNER_TEMP/dotnet-sdk" --no-path
          "$RUNNER_TEMP/dotnet-sdk/dotnet" --info | head -20

      - &s06
        name: Build and install OpenMS
        if: steps.openms-cache.outputs.cache-hit != 'true' && steps.openms-prebuilt.outputs.got != 'true'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # The flags the cluster build of this commit used, minus the TOPP
          # tools: FASTag links libOpenMS and OpenMS_CLI, which build without
          # them. No GUI, pyOpenMS, docs or tests. The vendor readers ON
          # (1.15.2): timsTOF (opentims) and Thermo (bridge, built by the SDK
          # above; DOTNET_ROOT for its build-time runs).
          # mzPeak ON (the vendored library); Arrow shared, from conda.
          export DOTNET_ROOT="$RUNNER_TEMP/dotnet-sdk" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1
          OSX_MIN=()
          if [ "$RUNNER_OS" = macOS ]; then
            export MACOSX_DEPLOYMENT_TARGET="$MACOS_MIN_VERSION"
            OSX_MIN=(-DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_MIN_VERSION")
          fi
          cmake -S openms-src -B openms-build -G Ninja "${OSX_MIN[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/openms-install" \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DOPENMS_USE_VCPKG=OFF \
            -DOPENMS_ENABLE_MZPEAK=ON \
            -DARROW_USE_STATIC=OFF \
            -DWITH_GUI=OFF -DPYOPENMS=OFF -DENABLE_DOCS=OFF -DHAS_XSERVER=OFF \
            -DWITH_OPENTIMS=ON -DWITH_THERMO_RAW=ON \
            -DDOTNET_EXECUTABLE="$RUNNER_TEMP/dotnet-sdk/dotnet" \
            -DMT_ENABLE_OPENMP=ON -DMT_REQUIRE_OPENMP=ON \
            -DBUILD_TOPP_TOOLS=OFF \
            -DINSTALL_OPENMS_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF
          # One job per core: some OpenMS translation units need well over
          # a gigabyte, and the macOS runner has 7 GB for 3 cores.
          cmake --build openms-build --parallel "$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"
          cmake --install openms-build

      - &s08
        name: Verify the OpenMS install
        shell: bash
        run: |
          set -euo pipefail
          test -f openms-install/lib/cmake/OpenMS/OpenMSConfig.cmake
          test -f openms-install/lib/cmake/OpenMS/OpenMSCLITargets.cmake
          test -f openms-install/include/OpenMS/FORMAT/MzPeakFile.h
          test -f openms-install/include/OpenMS/APPLICATIONS/TOPPBase.h
          test -d openms-install/share/OpenMS
          # The vendor readers (1.15.2): the Thermo bridge's managed half and
          # Thermo's licence in share/OpenMS (the bundles copy that tree), and
          # the readers' headers.
          test -s openms-install/share/OpenMS/openms_thermo_bridge/managed/ThermoWrapperManaged.dll
          test -s openms-install/share/OpenMS/openms_thermo_bridge/managed/ThermoFisher.CommonCore.RawFileReader.dll
          test -s openms-install/share/OpenMS/LICENSES/ThermoRawFileReader-License.doc
          test -f openms-install/include/OpenMS/FORMAT/OnDiscThermoRawExperiment.h
          find openms-install/include -name 'BrukerTimsFile.h' | grep -q .
          grep -m1 -oE 'PACKAGE_VERSION "[^"]+"' openms-install/lib/cmake/OpenMS/OpenMSConfigVersion.cmake

      # Saved once verified, at once (before anything of FASTag's runs).
      - &s07
        name: Save OpenMS
        if: steps.openms-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: openms-install
          key: openms-${{ env.OPENMS_REF }}-${{ matrix.name }}-${{ matrix.toolchain }}-${{ hashFiles('.github/env/openms.yml') }}-osx${{ env.MACOS_MIN_VERSION }}-vendor-dotnet${{ env.DOTNET_SDK_VERSION }}-v1

      # Main and tag pushes only: the install this job has (from the cache or
      # just built) becomes the deps release's asset when that lacks it, so a
      # later miss downloads it instead of building (job deps-openms uploads).
      - name: Stage the OpenMS install for the deps release (main and tag pushes)
        id: openms-stage
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: openms-${{ env.OPENMS_REF }}-${{ matrix.name }}-${{ matrix.toolchain }}-${{ hashFiles('.github/env/openms.yml') }}-osx${{ env.MACOS_MIN_VERSION }}-vendor-dotnet${{ env.DOTNET_SDK_VERSION }}-v1
        run: |
          set -euo pipefail
          sha() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          rel=${OPENMS_DEPS_RELEASE:-deps-openms-${OPENMS_REF:0:8}}
          if gh release view "$rel" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qxF "$KEY.tar.gz"; then
            echo "$rel has $KEY.tar.gz"; echo "stage=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p openms-prebuilt
          tar -czf "openms-prebuilt/$KEY.tar.gz" openms-install
          (cd openms-prebuilt && sha "$KEY.tar.gz" > "$KEY.tar.gz.sha256")
          ls -l openms-prebuilt
          echo "stage=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.openms-stage.outputs.stage == 'true'
        with:
          name: openms-prebuilt-${{ matrix.name }}
          path: openms-prebuilt/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - &s09
        name: Point the build at OpenMS
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # Every downstream step needs the library and its shared-data
          # directory; the tests and the smoke run both load CV terms.
          echo "OPENMS_DIR=$GITHUB_WORKSPACE/openms-install/lib/cmake/OpenMS" >> "$GITHUB_ENV"
          echo "OPENMS_INSTALL=$GITHUB_WORKSPACE/openms-install" >> "$GITHUB_ENV"
          echo "OPENMS_DATA_PATH=$GITHUB_WORKSPACE/openms-install/share/OpenMS" >> "$GITHUB_ENV"

      # The .NET runtime the Thermo reader runs on (1.15.2): pinned, on every
      # run. ctest and the smoke runs use it through DOTNET_ROOT; the bundle
      # steps copy it into dist/FASTag/dotnet (tools/vendor_bundle.py), where
      # the shipped CLI finds it itself. And a .raw to read: OpenMS's own
      # 2 MB test file at OPENMS_REF, checked by its sha256.
      - &s10
        name: Install the .NET runtime and fetch a Thermo .raw
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dotnet-install.sh" https://dot.net/v1/dotnet-install.sh
          bash "$RUNNER_TEMP/dotnet-install.sh" --runtime dotnet --version "$DOTNET_RUNTIME_VERSION" \
            --install-dir "$RUNNER_TEMP/dotnet-rt" --no-path
          ls "$RUNNER_TEMP/dotnet-rt/shared/Microsoft.NETCore.App"
          echo "DOTNET_RT=$RUNNER_TEMP/dotnet-rt" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet-rt" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
          mkdir -p ci-data
          curl -fsSL --retry 3 -o ci-data/thermo-smoke.raw \
            "https://raw.githubusercontent.com/OpenMS/OpenMS/$OPENMS_REF/src/tests/topp/THIRDPARTY/ginkgotoxin-ms-switching.raw"
          echo "$THERMO_SMOKE_RAW_SHA256  ci-data/thermo-smoke.raw" > ci-data/thermo-smoke.sha256
          if command -v sha256sum >/dev/null; then sha256sum -c ci-data/thermo-smoke.sha256; else shasum -a 256 -c ci-data/thermo-smoke.sha256; fi

      # The mzPeak fixture of OpenMS's own tests at the pinned commit: 34 MS2
      # spectra, written by the reference converter. The smoke runs read it,
      # and the validator step uses it as its control.
      - &s11
        name: Fetch the mzPeak test archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-data
          curl -fsSL --retry 3 -o ci-data/small.mzpeak \
            "https://raw.githubusercontent.com/OpenMS/OpenMS/$OPENMS_REF/src/tests/class_tests/openms/data/MzPeakFile_small.mzpeak"
          echo "5af157f1744d13502dbc8f7103ad0d01c4ba5ecc528087756aa09ed75d4b4087  ci-data/small.mzpeak" > ci-data/small.sha256
          if command -v sha256sum >/dev/null; then sha256sum -c ci-data/small.sha256; else shasum -a 256 -c ci-data/small.sha256; fi

      - &s12
        name: Configure
        shell: bash -el {0}
        run: |
          if [ "${TESTS_REUSED:-}" = true ]; then echo "tests reused from an identical tree: nothing to build here"; exit 0; fi
          # pipefail, because the cmake line below is piped into tee. This
          # shell is `bash -el`, which has errexit but NOT pipefail, so a
          # failed configure would otherwise be swallowed by tee.
          set -o pipefail
          # Same floor, same reason (MACOS_MIN_VERSION at the top of this file).
          OSX_MIN=()
          if [ "$RUNNER_OS" = macOS ]; then
            export MACOSX_DEPLOYMENT_TARGET="$MACOS_MIN_VERSION"
            OSX_MIN=(-DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_MIN_VERSION")
          fi
          cmake -S . -B build -G Ninja "${OSX_MIN[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenMS_DIR="$OPENMS_DIR" \
            -DCMAKE_PREFIX_PATH="$OPENMS_INSTALL;$CONDA_PREFIX" 2>&1 | tee configure.log

      - &s13
        name: Verify OpenMP was found
        shell: bash -el {0}
        run: |
          if [ "${TESTS_REUSED:-}" = true ]; then echo "tests reused from an identical tree: nothing to build here"; exit 0; fi
          # Without this, macOS goes GREEN while shipping a serial binary.
          #
          # Missing OpenMP is not a build error. CMakeLists.txt warns and carries
          # on, the #pragmas become no-ops, the omp_* fallback stubs return 1, and
          # the result is a correct tool that ignores -threads while README.md
          # still advertises its scaling. Every test passes. Apple's clang ships
          # no OpenMP runtime, so macOS is precisely where this would happen.
          # (OpenMS is built with MT_REQUIRE_OPENMP, so its config fails first
          # in practice; this checks FASTag's own find_package too.)
          if ! grep -q "FASTag: OpenMP" configure.log; then
            echo "::error::OpenMP was not found. The binary would be serial and"
            echo "::error::the performance claims would not hold. Configure said:"
            grep -i "openmp" configure.log || echo "(no OpenMP line at all)"
            exit 1
          fi
          grep "FASTag: OpenMP" configure.log

      # The build jobs build the CLI alone (FASTAG_BUILD_TARGET=FASTag: the
      # bundles take build/FASTag and data/ from the source tree); the test
      # jobs build everything ctest runs.
      - &s14
        name: Build
        shell: bash -el {0}
        run: |
          if [ "${TESTS_REUSED:-}" = true ]; then echo "tests reused from an identical tree: nothing to build here"; exit 0; fi
          cmake --build build --parallel ${FASTAG_BUILD_TARGET:+--target "$FASTAG_BUILD_TARGET"}

      # mzPeakValidator, for every archive this job writes: ctest's
      # mzpeak_validate (the round-trip archives) and the bundle check below.
      # Installed with setup-python's OWN interpreter into its own prefix,
      # deliberately not the conda env: pulling a Python pyarrow into that
      # solve would couple an unrelated tool to the build environment. The requirements file pins the
      # validator to a commit AND its engine to exact versions (see the file
      # for why and how to move the pin), and doubles as the pip cache key.
      # --only-binary: every compiled dependency has a wheel for all five
      # targets, and a source build here would be a silent multi-minute
      # detour on a runner without a compiler for it.
      - &s15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: validator-python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/mzpeak-validator-requirements.txt
      - &s16
        name: Install mzPeakValidator
        shell: bash
        env:
          PY: ${{ steps.validator-python.outputs.python-path }}
        run: |
          if [ "${TESTS_REUSED:-}" = true ]; then echo "tests reused from an identical tree: nothing to build here"; exit 0; fi
          set -euo pipefail
          PY="${PY//\\//}"
          for attempt in 1 2 3; do
            "$PY" -m pip install -q --only-binary=:all: -r test/mzpeak-validator-requirements.txt && break
            [ "$attempt" -lt 3 ] || { echo "::error::pip could not install mzPeakValidator after 3 attempts"; exit 1; }
            echo "pip install failed (attempt $attempt); retrying in 15 s"; sleep 15
          done
          # The console script sits next to the interpreter (bin/ on Unix,
          # Scripts/ on Windows). An absolute path goes into the environment
          # so the conda-activating test shell cannot resolve a different one.
          D=$(dirname "$PY")
          if [ -x "$D/mzpeak-validate" ]; then V="$D/mzpeak-validate"
          elif [ -x "$D/Scripts/mzpeak-validate.exe" ]; then V="$D/Scripts/mzpeak-validate.exe"
          else echo "::error::mzpeak-validate not found next to $PY"; ls "$D" "$D/Scripts" 2>/dev/null; exit 1; fi
          "$V" --help >/dev/null
          echo "MZPEAK_VALIDATE=$V" >> "$GITHUB_ENV"
          echo "validator: $V"

      # Not part of Test, so a tag build that reuses an earlier test run still
      # reads both vendor formats with the binary it built.
      - name: Read the vendor test files with the built binary
        shell: bash -el {0}
        run: |
          set -o pipefail
          # The binary reads both for real, not only their refusals.
          ./build/FASTag -in test/fixtures/bruker/PXD040281_SA_02_trim.d -out /tmp/ci-bruker.tsv -threads 2 > /tmp/ci-bruker.log 2>&1 \
            || { cat /tmp/ci-bruker.log; echo "::error::the build cannot read the Bruker fixture"; exit 1; }
          grep -E "Bruker timsTOF input: [1-9][0-9]* MS2 spectra" /tmp/ci-bruker.log \
            || { cat /tmp/ci-bruker.log; echo "::error::no MS2 spectra read from the Bruker fixture"; exit 1; }
          ./build/FASTag -in ci-data/thermo-smoke.raw -out /tmp/ci-thermo.tsv -threads 2 > /tmp/ci-thermo.log 2>&1 \
            || { cat /tmp/ci-thermo.log; echo "::error::the build cannot read a Thermo .raw"; exit 1; }
          grep -E "Thermo .raw input: [1-9][0-9]* scans indexed" /tmp/ci-thermo.log \
            || { cat /tmp/ci-thermo.log; echo "::error::no scans read from the Thermo .raw"; exit 1; }

      # A real mzPeak read. The count is asserted exactly: 34 MS2 in that
      # archive, and a reader that dropped spectra or precursors would report
      # fewer.
      - name: Smoke-test the binary on a real mzPeak archive
        shell: bash -el {0}
        run: |
          set -euo pipefail
          ./build/FASTag --help >/dev/null
          OUT=$(./build/FASTag -in ci-data/small.mzpeak -out /tmp/smoke-mzpeak.tsv \
                  -threads 2 -fragment_tolerance 20 -fragment_tolerance_unit ppm 2>&1)
          echo "$OUT" | grep -E "MS2 spectra" || { echo "$OUT"; exit 1; }
          echo "$OUT" | grep -q "34 MS2 spectra" || { echo "::error::expected 34 MS2 spectra from small.mzpeak"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FASTag-${{ matrix.name }}
          path: build/FASTag
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Bundle runtime dependencies for portability -- EVERY run, not just
      # releases. This is what a real user's download of an earlier release
      # failed on:
      #
      #   dyld: Library not loaded: @rpath/libOpenMS.dylib
      #     tried: '/Users/runner/micromamba/envs/fastag/lib/libOpenMS.dylib'
      #
      # `build/FASTag` as produced above carries an RPATH pointing at THIS
      # JOB's own conda environment, which obviously does not exist on a
      # machine that only downloaded the release tarball -- true on Linux
      # (RPATH /home/runner/micromamba/envs/fastag/lib) exactly as much as
      # macOS. Running this on every push, not just tags, means a regression
      # here fails CI immediately instead of shipping silently to the next
      # release, which is exactly what happened once already.
      #
      # Two things needed bundling that are easy to miss from a single
      # `ldd`/`otool -L` on the executable alone, both found only by actually
      # running the result and reading the error, not by static inspection:
      #   - Linux only: libblas.so.3/libcblas.so.3/liblapack.so.3/
      #     liblapacke.so.3 are all symlinks to ONE real OpenBLAS file,
      #     loaded via dlopen() rather than a normal NEEDED entry -- invisible
      #     to ldd. conda-forge's BLAS/LAPACK "mutex" package pattern.
      #   - Both platforms: OpenMS's own share/ data directory (enzyme,
      #     modification and CV databases) -- needed even just to fail
      #     cleanly on a missing input file, at least on Linux; bundled on
      #     macOS too rather than relying on an unexplained platform
      #     difference (real local testing showed macOS did not hit this,
      #     but the underlying reason is not understood well enough to trust
      #     it holding on a future OpenMS rebuild). A wrapper script
      #     (FASTag -> FASTag.bin) sets OPENMS_DATA_PATH relative to itself
      #     before exec'ing the real binary, rather than assuming an install
      #     location that does not exist on a bare download.
      - name: Bundle runtime dependencies for portability (Linux)
        if: runner.os == 'Linux'
        shell: bash -el {0}
        run: |
          set -e
          rm -rf dist && mkdir -p dist/FASTag/lib
          cp build/FASTag dist/FASTag/FASTag.bin

          # TWO source prefixes. libOpenMS, libOpenMS_CLI and libOpenSwathAlgo
          # come from the OpenMS install built above; everything they in turn
          # need (Arrow, Boost, libxml2, ...) from the conda env. Missing
          # either would bundle every dependency EXCEPT a library the tool is
          # actually built around.
          LIBDIR="$CONDA_PREFIX/lib"
          OMSLIB="$OPENMS_INSTALL/lib"

          # Match on ldd's RESOLVED path rather than the soname, so a library
          # is attributed to whichever prefix it actually came from instead of
          # being looked up in a prefix that may not hold it.
          ldd dist/FASTag/FASTag.bin \
            | sed -n 's/.*=> \(\/[^ ]*\).*/\1/p' \
            | grep -E "^($LIBDIR|$OMSLIB)/" | sort -u > /tmp/needed.txt

          while read -r path; do
            [ -z "$path" ] && continue
            name=$(basename "$path")
            if [ -L "$path" ]; then
              real=$(readlink -f "$path")
              realname=$(basename "$real")
              [ -f "dist/FASTag/lib/$realname" ] || cp -L "$real" "dist/FASTag/lib/$realname"
              [ -e "dist/FASTag/lib/$name" ] || ln -s "$realname" "dist/FASTag/lib/$name"
            else
              [ -f "dist/FASTag/lib/$name" ] || cp -L "$path" "dist/FASTag/lib/$name"
            fi
          done < /tmp/needed.txt

          # dlopen-only BLAS/LAPACK backend aliases -- see the comment above.
          for alias in libblas.so.3 libcblas.so.3 liblapack.so.3 liblapacke.so.3; do
            if [ -L "$LIBDIR/$alias" ] && [ ! -e "dist/FASTag/lib/$alias" ]; then
              real=$(readlink -f "$LIBDIR/$alias")
              realname=$(basename "$real")
              [ -f "dist/FASTag/lib/$realname" ] || cp -L "$real" "dist/FASTag/lib/$realname"
              ln -s "$realname" "dist/FASTag/lib/$alias"
            fi
          done

          patchelf --set-rpath '$ORIGIN/lib' dist/FASTag/FASTag.bin
          for so in dist/FASTag/lib/*.so*; do
            [ -L "$so" ] && continue
            patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
          done

          cp -r "$OPENMS_INSTALL/share/OpenMS" dist/FASTag/share-OpenMS
          # The tag-time taxonomy smoke needs this fixture. It is vendored
          # (test/fixtures) because OpenMS is installed without its examples/
          # tree; assert it on EVERY build so its disappearance fails a cheap
          # main push, not a release.
          mkdir -p dist/FASTag/share-OpenMS/examples/ID
          cp test/fixtures/Ecoli_MS2_small.mzML dist/FASTag/share-OpenMS/examples/ID/
          test -s dist/FASTag/share-OpenMS/examples/ID/Ecoli_MS2_small.mzML
          # -delta_out names its rows from these two (1.16 mass-shift survey).
          test -s dist/FASTag/share-OpenMS/CHEMISTRY/unimod.xml
          test -s dist/FASTag/share-OpenMS/CHEMISTRY/PSI-MOD.obo

          # The taxonomy -species resolves by default. The pruned NCBI dumps
          # (12 KB) go here for every build; on TAG builds the "Embed taxonomy
          # index" step below replaces this dir with the full pinned index
          # (dumps + tax_k7.taxdb), so release tarballs are -species-complete
          # out of the box. `share-FASTag-taxonomy` (not
          # share/FASTag/taxonomy) because this layout is FLAT -- the executable
          # sits at the root, so there is no ../share to resolve; FASTag looks for
          # both spellings, see taxonomyDir_() in src/FASTag.cpp.
          cp -r data/taxonomy dist/FASTag/share-FASTag-taxonomy
          # The -digest_out models and -massgap_out modifications, found the
          # same way (share-FASTag-digest in this flat layout).
          cp -r data/digest dist/FASTag/share-FASTag-digest
          # 1.13 (#24): the -alkylation_proteome proteomes (UniProt, CC BY 4.0;
          # data/alkylation/README.md), beside the digest data (share-FASTag-alkylation).
          cp -r data/alkylation dist/FASTag/share-FASTag-alkylation
          test -s dist/FASTag/share-FASTag-alkylation/proteomes.tsv
          # The example run (examples/README.md), next to the executable.
          cp -r examples dist/FASTag/examples
          test -s dist/FASTag/examples/Ecoli_MS2_small.mzML && test -s dist/FASTag/examples/README.md
          # FASTag's own licence and the notices of every redistributed
          # library, which BSD/MIT/Apache-2.0 require in a binary
          # distribution (tools/third_party_notices.py maps each bundled
          # library to the conda package that installed it).
          cp LICENSE dist/FASTag/LICENSE
          python3 tools/third_party_notices.py "$CONDA_PREFIX" dist/FASTag/THIRD-PARTY-NOTICES.txt dist/FASTag/lib
          test -s dist/FASTag/THIRD-PARTY-NOTICES.txt
          # The vendor readers (1.15.2): the .NET runtime beside FASTag.bin,
          # Thermo's licence (LICENSES/) and the RawFileReader terms, .NET and
          # opentims notices; then checked, so a bundle cannot ship the Thermo
          # reader without them.
          du -sh dist/FASTag
          python3 tools/vendor_bundle.py add --root dist/FASTag --exe-dir dist/FASTag \
            --share dist/FASTag/share-OpenMS --runtime "$DOTNET_RT"
          python3 tools/vendor_bundle.py check --root dist/FASTag --exe-dir dist/FASTag --share dist/FASTag/share-OpenMS
          # The installers' and disk images' licence page is generated from
          # LICENSE and LICENSES/ (tools/vendor_bundle.py); a stale copy fails.
          python3 tools/vendor_bundle.py installer-license gui/src-tauri/installer-license.txt --check
          # printf, not a heredoc: a heredoc's body has to be indented to
          # satisfy YAML's block-scalar rules, but leading whitespace before
          # `#!` breaks shebang recognition -- the kernel requires it at byte
          # offset 0. Each argument is single-quoted so $HERE/$0/$@ are
          # written LITERALLY, meant for the wrapper script to expand when
          # IT runs later, not for this outer shell to expand now.
          # OPENBLAS_NUM_THREADS: libOpenMS pulls in OpenBLAS, which starts a
          # spinning thread per core at load (~2 s CPU on 128 threads, even for
          # --help); FASTag never calls BLAS. A user's own setting still wins.
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)' \
            'export OPENMS_DATA_PATH="$HERE/share-OpenMS"' \
            'export OPENBLAS_NUM_THREADS="${OPENBLAS_NUM_THREADS:-1}"' \
            'exec "$HERE/FASTag.bin" "$@"' \
            > dist/FASTag/FASTag
          chmod +x dist/FASTag/FASTag dist/FASTag/FASTag.bin
          du -sh dist/FASTag

      - name: Install dylibbundler (macOS)
        if: runner.os == 'macOS'
        run: brew install dylibbundler

      - name: Bundle runtime dependencies for portability (macOS)
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: |
          set -e
          rm -rf dist && mkdir -p dist/FASTag
          cp build/FASTag dist/FASTag/FASTag.bin

          dylibbundler -od -b \
            -x dist/FASTag/FASTag.bin \
            -d dist/FASTag/lib \
            -p '@executable_path/lib/' \
            -s "$OPENMS_INSTALL/lib" \
            -s "$CONDA_PREFIX/lib"

          # Deduplicate LC_RPATH on EVERY Mach-O in the bundle, or dyld
          # refuses to launch:
          #
          #   Library not loaded: @executable_path/lib/libOpenMS.dylib
          #   tried: '.../dist/FASTag/lib/libOpenMS.dylib'
          #         (duplicate LC_RPATH '@executable_path/lib/')
          #
          # dylibbundler rewrites each existing rpath to its -p prefix
          # INDIVIDUALLY, so a file carrying several collapses to several
          # identical entries. libOpenMS.dylib had three:
          #
          #   -rpath ".../envs/omsbuild/lib"    "@executable_path/lib/"
          #   -rpath ".../openms-build/lib"     "@executable_path/lib/"
          #   -rpath "@executable_path/../lib/" "@executable_path/lib/"
          #
          # and a duplicate LC_RPATH is fatal, not cosmetic. This got worse
          # with the move to a separately-installed OpenMS, which is simply
          # one more prefix for dylibbundler to collapse. The first fix here
          # only cleaned the executable and missed the library that actually
          # had the problem -- hence "every Mach-O", not a list of suspects.
          dedup_rpath() {
            local f="$1"
            while [ "$(otool -l "$f" \
                        | awk '/LC_RPATH/{g=1;next} g&&/^ *path /{print $2; g=0}' \
                        | grep -cx '@executable_path/lib/')" -gt 1 ]; do
              install_name_tool -delete_rpath '@executable_path/lib/' "$f"
            done
            # install_name_tool invalidates the signature it just edited, and
            # arm64 will not run an improperly signed Mach-O at all. Re-sign
            # ad-hoc; the real Developer ID signing step downstream overwrites
            # this anyway when it is configured.
            codesign --force --sign - "$f" 2>/dev/null || true
          }
          dedup_rpath dist/FASTag/FASTag.bin
          for so in dist/FASTag/lib/*.dylib; do
            [ -e "$so" ] || continue
            [ -L "$so" ] && continue
            dedup_rpath "$so"
          done
          echo "LC_RPATH on FASTag.bin after dedup:"
          otool -l dist/FASTag/FASTag.bin \
            | awk '/LC_RPATH/{g=1;next} g&&/^ *path /{print "  " $2; g=0}'
          echo "LC_RPATH on libOpenMS.dylib after dedup:"
          otool -l dist/FASTag/lib/libOpenMS.dylib \
            | awk '/LC_RPATH/{g=1;next} g&&/^ *path /{print "  " $2; g=0}'

          cp -r "$OPENMS_INSTALL/share/OpenMS" dist/FASTag/share-OpenMS
          # The tag-time taxonomy smoke needs this fixture. It is vendored
          # (test/fixtures) because OpenMS is installed without its examples/
          # tree; assert it on EVERY build so its disappearance fails a cheap
          # main push, not a release.
          mkdir -p dist/FASTag/share-OpenMS/examples/ID
          cp test/fixtures/Ecoli_MS2_small.mzML dist/FASTag/share-OpenMS/examples/ID/
          test -s dist/FASTag/share-OpenMS/examples/ID/Ecoli_MS2_small.mzML
          # -delta_out names its rows from these two (1.16 mass-shift survey).
          test -s dist/FASTag/share-OpenMS/CHEMISTRY/unimod.xml
          test -s dist/FASTag/share-OpenMS/CHEMISTRY/PSI-MOD.obo

          # Same taxonomy copy as the Linux step above. It lives in BOTH because
          # Linux and macOS have separate bundle steps; adding it to only one
          # shipped two of the four tarballs without it.
          cp -r data/taxonomy dist/FASTag/share-FASTag-taxonomy
          # The -digest_out models and -massgap_out modifications, found the
          # same way (share-FASTag-digest in this flat layout).
          cp -r data/digest dist/FASTag/share-FASTag-digest
          # 1.13 (#24): the -alkylation_proteome proteomes (UniProt, CC BY 4.0;
          # data/alkylation/README.md), beside the digest data (share-FASTag-alkylation).
          cp -r data/alkylation dist/FASTag/share-FASTag-alkylation
          test -s dist/FASTag/share-FASTag-alkylation/proteomes.tsv
          # The example run (examples/README.md), next to the executable.
          cp -r examples dist/FASTag/examples
          test -s dist/FASTag/examples/Ecoli_MS2_small.mzML && test -s dist/FASTag/examples/README.md
          # FASTag's own licence and the notices of every redistributed
          # library, which BSD/MIT/Apache-2.0 require in a binary
          # distribution (tools/third_party_notices.py maps each bundled
          # library to the conda package that installed it).
          cp LICENSE dist/FASTag/LICENSE
          python3 tools/third_party_notices.py "$CONDA_PREFIX" dist/FASTag/THIRD-PARTY-NOTICES.txt dist/FASTag/lib
          test -s dist/FASTag/THIRD-PARTY-NOTICES.txt
          # The vendor readers (1.15.2): the .NET runtime beside FASTag.bin,
          # Thermo's licence (LICENSES/) and the RawFileReader terms, .NET and
          # opentims notices; then checked, so a bundle cannot ship the Thermo
          # reader without them.
          du -sh dist/FASTag
          python3 tools/vendor_bundle.py add --root dist/FASTag --exe-dir dist/FASTag \
            --share dist/FASTag/share-OpenMS --runtime "$DOTNET_RT"
          python3 tools/vendor_bundle.py check --root dist/FASTag --exe-dir dist/FASTag --share dist/FASTag/share-OpenMS
          # printf, not a heredoc: a heredoc's body has to be indented to
          # satisfy YAML's block-scalar rules, but leading whitespace before
          # `#!` breaks shebang recognition -- the kernel requires it at byte
          # offset 0. Each argument is single-quoted so $HERE/$0/$@ are
          # written LITERALLY, meant for the wrapper script to expand when
          # IT runs later, not for this outer shell to expand now.
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)' \
            'export OPENMS_DATA_PATH="$HERE/share-OpenMS"' \
            'export OPENBLAS_NUM_THREADS="${OPENBLAS_NUM_THREADS:-1}"' \
            'exec "$HERE/FASTag.bin" "$@"' \
            > dist/FASTag/FASTag
          chmod +x dist/FASTag/FASTag dist/FASTag/FASTag.bin
          du -sh dist/FASTag

      # A floor nobody reads is a floor that moves. This reads it off the
      # Mach-Os that are about to be shipped, because everything that sets it
      # can fail silently: a toolchain that ignores the variable, a runner
      # image upgrade, a cached dylib built before the floor was chosen.
      - name: Assert the macOS deployment target (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          fail=0
          # FASTag and the OpenMS libraries built in this workflow carry the
          # chosen floor; conda-forge's own dylibs carry theirs (lower).
          for f in dist/FASTag/FASTag.bin dist/FASTag/lib/libOpenMS.dylib dist/FASTag/lib/libOpenMS_CLI.dylib; do
            [ -f "$f" ] || { echo "::error::$f is not in the bundle"; fail=1; continue; }
            # LC_BUILD_VERSION's own minos, not the LC_VERSION_MIN_MACOSX an
            # older linker would have emitted -- these are all built by clang
            # on a modern SDK, which emits the former.
            # || true: this shell has -eo pipefail, and a Mach-O with no
            # LC_BUILD_VERSION at all is exactly the case the error below is
            # meant to report -- not one to die on with grep's bare exit 1.
            minos=$(otool -l "$f" | grep -A4 LC_BUILD_VERSION | awk '$1 == "minos" { print $2; exit }') || true
            echo "$f: minos ${minos:-<none>}"
            [ "$minos" = "$MACOS_MIN_VERSION" ] || {
              echo "::error::$f targets ${minos:-nothing} -- expected macOS $MACOS_MIN_VERSION. dyld will refuse to load it below that."
              fail=1
            }
          done
          # And the architecture: every Mach-O in the bundle is exactly this
          # leg's, with no other slice. An x86_64 binary also runs on an arm64
          # runner (Rosetta), so no run-time check tells the two bundles apart.
          for f in dist/FASTag/FASTag.bin dist/FASTag/lib/*.dylib; do
            [ -L "$f" ] && continue
            archs=$(lipo -archs "$f" 2>/dev/null) || true
            [ "$archs" = "${{ matrix.arch }}" ] || {
              echo "::error::$f is '${archs:-unreadable}', expected ${{ matrix.arch }}"
              fail=1
            }
          done
          echo "every Mach-O in dist/FASTag is ${{ matrix.arch }}"
          exit $fail

      # The macOS bundle as a workflow artifact, so a release candidate's macOS
      # CLI can be compared with the released one on a Mac without a tag build
      # (tools/baseline_identity.sh). tar keeps the dylib symlinks and the exec
      # bits that a plain artifact upload would drop. Unsigned on a dispatch.
      - name: Pack the bundle as an artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: tar -C dist -czf FASTag-bundle-${{ matrix.name }}.tar.gz FASTag

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'macOS'
        with:
          name: FASTag-bundle-${{ matrix.name }}
          path: FASTag-bundle-${{ matrix.name }}.tar.gz
          if-no-files-found: error

      # The actual regression guard: run the bundle exactly the way a user
      # who only downloaded the tarball would, and fail the build if it
      # resolves anything from this job's own build environment. Deliberately
      # NOT `bash -el {0}` -- that activates the conda env, which is exactly
      # the crutch a real download does not have. `-in nonexistent.mzML`
      # needs no test fixture: reaching OpenMS's own "file not found" error
      # proves every library AND the shared data directory resolved
      # correctly, since both are needed before that check ever runs.
      - name: Verify the bundle is portable (regression guard)
        shell: bash
        run: |
          set -e
          unset LD_LIBRARY_PATH DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH CONDA_PREFIX
          OUT=$(cd /tmp && "$GITHUB_WORKSPACE/dist/FASTag/FASTag" -in nonexistent.mzML -out /tmp/portability-check.tsv 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -qiE "library not loaded|cannot open shared object|shared data|dyld|error while loading"; then
            echo "::error::Bundle is NOT portable -- still resolves something from the build environment. See output above."
            exit 1
          fi
          echo "$OUT" | grep -q "File not found" || { echo "::error::Unexpected output -- never reached the expected 'file not found' error."; exit 1; }

          # And that the SHIPPED artifact reads mzPeak, by reading one: OpenMS's
          # own fixture, 34 MS2 spectra, run exactly as a download would.
          # Everything above only exercises mzML, and a bundle whose Arrow or
          # Parquet failed to travel would fail HERE with a loader error rather
          # than in a user's terminal.
          OUT2=$(cd /tmp && "$GITHUB_WORKSPACE/dist/FASTag/FASTag" \
                   -in "$GITHUB_WORKSPACE/ci-data/small.mzpeak" \
                   -out /tmp/mzpeak-check.tsv -threads 2 \
                   -fragment_tolerance 20 -fragment_tolerance_unit ppm 2>&1) || true
          echo "$OUT2"
          echo "$OUT2" | grep -q "34 MS2 spectra" || {
            echo "::error::Shipped bundle cannot read mzPeak -- expected 34 MS2 spectra from small.mzpeak."
            exit 1
          }
          # ...and WRITES one, then reads its own output back, still as a bare
          # download would (env -i: nothing of this runner's environment; a
          # minimal PATH only so the wrapper's /bin/sh can resolve dirname
          # and pwd). Reading exercises Parquet's reader and libzip's inflate;
          # writing needs the Parquet writer and zip finalisation -- code a
          # read-only smoke never touches -- so a bundle could read mzPeak and
          # still fail every user who asks for -out_spectra.
          # The tags from the archive must be byte-identical to the tags from
          # the mzML, exactly as ctest's mzpeak_roundtrip demands of the
          # unbundled binary. The archive is validated in the next step.
          # -tolerance_by_analyzer off: this example is ion trap by its filter
          # strings, which the archive loses at OPENMS_REF (no OpenMS/OpenMS#10955
          # yet), so the mzML would be tagged at 0.5 Da and the archive not.
          # Drop the pin when OPENMS_REF includes #10955.
          BW=/tmp/bundle-mzpeak; rm -rf "$BW"; mkdir -p "$BW"
          MZ="$GITHUB_WORKSPACE/dist/FASTag/share-OpenMS/examples/ID/Ecoli_MS2_small.mzML"
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/FASTag/FASTag" \
            -in "$MZ" -out "$BW/ml.tsv" -out_spectra "$BW/bundle.mzpeak" -threads 2 \
            -fragment_tolerance 20 -fragment_tolerance_unit ppm -tolerance_by_analyzer off > "$BW/write.log" 2>&1 \
            || { cat "$BW/write.log"; echo "::error::the shipped bundle cannot WRITE mzPeak"; exit 1; }
          grep -q "Wrote [0-9]* spectra" "$BW/write.log" || { cat "$BW/write.log"; echo "::error::the bundle wrote no spectra"; exit 1; }
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/FASTag/FASTag" \
            -in "$BW/bundle.mzpeak" -out "$BW/mp.tsv" -threads 2 \
            -fragment_tolerance 20 -fragment_tolerance_unit ppm -tolerance_by_analyzer off > "$BW/read.log" 2>&1 \
            || { cat "$BW/read.log"; echo "::error::the shipped bundle cannot read the archive it just wrote"; exit 1; }
          cmp -s "$BW/ml.tsv" "$BW/mp.tsv" || { echo "::error::tags from the bundle-written archive differ from the mzML tags"; diff "$BW/ml.tsv" "$BW/mp.tsv" | head; exit 1; }
          [ "$(grep -c . "$BW/mp.tsv")" -gt 1 ] || { echo "::error::the bundle round trip produced no tags"; exit 1; }
          echo "bundle round trip: $(grep -o 'Wrote [0-9]* spectra' "$BW/write.log"), tags byte-identical"
          # ...and finds its shipped digest data: -digest_out without
          # -digest_models must report the shipped background.
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/FASTag/FASTag" \
            -in "$MZ" -out "$BW/dg.tsv" -digest_out "$BW/digest.tsv" -threads 2 > "$BW/digest.log" 2>&1 \
            || { cat "$BW/digest.log"; echo "::error::the shipped bundle cannot write -digest_out"; exit 1; }
          grep -q $'^run\tbackground\tshipped_human\t' "$BW/digest.tsv" \
            || { cat "$BW/digest.log"; echo "::error::-digest_out did not find the shipped digest data"; exit 1; }
          # ...and its shipped proteomes (1.13 #24). The default auto needs no
          # proteome (feedback 202dbcf4): the call is read off the tags.
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/FASTag/FASTag" \
            -in "$MZ" -out "$BW/al.tsv" -alkylation_out "$BW/alk.tsv" -threads 2 > "$BW/alk.log" 2>&1 \
            || { cat "$BW/alk.log"; echo "::error::the shipped bundle cannot write -alkylation_out without a database"; exit 1; }
          grep -q $'^alk_run\tdatabase_source\tnone\t' "$BW/alk.tsv" \
            && grep -q $'^alkylation_call\tsource\ttags\t' "$BW/alk.tsv" \
            || { cat "$BW/alk.log"; echo "::error::-alkylation_out at auto is not a tag-only report"; exit 1; }
          # -alkylation_proteome human resolves the shipped human proteome; at
          # the default -tag_length nothing places (tags_too_short).
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/FASTag/FASTag" \
            -in "$MZ" -out "$BW/alh.tsv" -alkylation_out "$BW/alkh.tsv" -alkylation_proteome human -threads 2 > "$BW/alkh.log" 2>&1 \
            || { cat "$BW/alkh.log"; echo "::error::the shipped bundle cannot write -alkylation_out with the shipped proteome"; exit 1; }
          grep -q $'^alk_run\tdatabase_source\tbundled:human\t' "$BW/alkh.tsv" \
            && grep -q $'^alk_run\tdatabase_release\tUniProt ' "$BW/alkh.tsv" \
            && grep -q $'^alkylation_placement_call\treason\ttags_too_short\t' "$BW/alkh.tsv" \
            || { cat "$BW/alkh.log"; echo "::error::-alkylation_out did not find the shipped human proteome"; exit 1; }
          # Placement on a shipped file: E. coli data on the shipped ecoli
          # proteome at -tag_length 8 must place tags (the placements the
          # alk_cys excluded.* rows count; the example is too small for
          # single-Cys votes, alk_run spectra, at this length).
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/FASTag/FASTag" \
            -in "$MZ" -out "$BW/al8.tsv" -alkylation_out "$BW/alk8.tsv" -alkylation_proteome ecoli -tag_length 8 \
            -fragment_tolerance 0.5 -fragment_tolerance_unit Da -threads 2 > "$BW/alk8.log" 2>&1 \
            || { cat "$BW/alk8.log"; echo "::error::-alkylation_out on the shipped ecoli proteome failed"; exit 1; }
          alk8=$(awk -F'\t' '$1 == "alk_cys" && $2 == "excluded.no_cys" { print $4 }' "$BW/alk8.tsv")
          [ "${alk8:-0}" -gt 0 ] && ! grep -q $'^alkylation_placement_call\treason\ttags_too_short' "$BW/alk8.tsv" \
            || { cat "$BW/alk8.log" "$BW/alk8.tsv"; echo "::error::no tag placed on the shipped ecoli proteome at -tag_length 8"; exit 1; }

          # The vendor readers through the shipped bundle, as a download runs
          # it (env -i: no DOTNET_ROOT, so the bundle's own dotnet/ serves).
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/FASTag/FASTag" \
            -in "$GITHUB_WORKSPACE/ci-data/thermo-smoke.raw" -out "$BW/raw.tsv" -threads 2 > "$BW/raw.log" 2>&1 \
            || { cat "$BW/raw.log"; echo "::error::the shipped bundle cannot read a Thermo .raw"; exit 1; }
          grep -E "Thermo .raw input: [1-9][0-9]* scans indexed" "$BW/raw.log" \
            || { cat "$BW/raw.log"; echo "::error::the shipped bundle read no scans from the .raw"; exit 1; }
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/FASTag/FASTag" --version > "$BW/version.txt" 2>&1
          grep -qF "RawFileReader reading tool. Copyright" "$BW/version.txt" \
            || { cat "$BW/version.txt"; echo "::error::--version lacks the RawFileReader notice"; exit 1; }
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/FASTag/FASTag" \
            -in "$GITHUB_WORKSPACE/test/fixtures/bruker/PXD040281_SA_02_trim.d" -out "$BW/bruker.tsv" -threads 2 > "$BW/bruker.log" 2>&1 \
            || { cat "$BW/bruker.log"; echo "::error::the shipped bundle cannot read a Bruker .d"; exit 1; }
          grep -E "Bruker timsTOF input: [1-9][0-9]* MS2 spectra" "$BW/bruker.log" \
            || { cat "$BW/bruker.log"; echo "::error::the shipped bundle read no spectra from the .d"; exit 1; }
          echo "vendor input through the bundle: $(grep -oE '[0-9]+ scans indexed' "$BW/raw.log") (.raw), $(grep -oE '[0-9]+ MS2 spectra' "$BW/bruker.log" | head -1) (.d)"
          du -sh "$GITHUB_WORKSPACE/dist/FASTag" "$GITHUB_WORKSPACE/dist/FASTag/dotnet"

          # Listed once into a variable, not `ls | grep -q` three times: this step
          # runs under `shell: bash`, which is pipefail, and grep -q exits at the
          # first match -- so ls dies of SIGPIPE and the pipeline reports failure
          # even though the library IS there. It is a race on how much ls has
          # written, and it failed the Arrow check once with the bundle correct.
          BUNDLED_LIBS=$(ls dist/FASTag/lib)
          for lib in OpenMS arrow parquet; do
            grep -qi "$lib" <<< "$BUNDLED_LIBS" \
              || { echo "::error::no $lib library in the bundle"; echo "$BUNDLED_LIBS"; exit 1; }
          done

          echo "Portability check passed: runs standalone, no build-environment leakage, reads and writes mzPeak."

      # The GUI's parameter manifest (gui/src/params.generated.json) is
      # generated from the CLI's own -write_ini, because the CLI is the source
      # of truth for names, types, defaults and bounds. A committed manifest
      # that lags the CLI is how the GUI drifts: 1.11.0 shipped with one that
      # still said 1.10.0. This regenerates it from the bundle built above and
      # fails on any difference. It needs the full CLI leg, so it runs here,
      # on linux-x64 only (the manifest is platform-independent). On a version
      # bump or a parameter change, run `npm run params` in gui/ (or
      # `node scripts/gen-params.mjs <FASTag> src/params.generated.json`) and
      # commit the result.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.name == 'linux-x64'
        with:
          node-version: 24

      - name: Check the GUI parameter manifest against the built CLI
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          node gui/scripts/gen-params.mjs dist/FASTag/FASTag "$RUNNER_TEMP/params.generated.json"
          if ! diff -u gui/src/params.generated.json "$RUNNER_TEMP/params.generated.json"; then
            echo "::error file=gui/src/params.generated.json::the parameter manifest differs from the built CLI's -write_ini; regenerate it with 'npm run params' in gui/ and commit it"
            exit 1
          fi
          echo "parameter manifest matches the built CLI ($(grep -c '"name":' gui/src/params.generated.json) parameters)"

      # Every mzPeak archive this job wrote, through mzPeakValidator in full
      # mode. ctest's mzpeak_validate already covered the round-trip archives
      # (its reports are collected here); this covers the bundle's. OpenMS's
      # small.mzpeak goes first as a CONTROL: written by the reference
      # converter, it passes the pinned validator, so a failure on it means
      # the validator or its pin is broken, not FASTag.
      #
      # A hard failure on EVERY run, not only tags. The validator and its
      # engine are pinned, so the verdict can only change when FASTag's
      # writer changes -- and an archive other readers reject is a silent
      # failure for every user, exactly the kind this repository's history
      # says must fail a cheap main push rather than a release. The one
      # accepted gap (run references MzPeakFile does not write) is named in
      # test/mzpeak_validate.sh.
      - name: Validate every mzPeak archive this job wrote
        shell: bash
        run: |
          set -euo pipefail
          R=validator-reports; rm -rf "$R"; mkdir -p "$R"
          bash test/mzpeak_validate.sh "$R/control" ci-data/small.mzpeak \
            || { echo "::error::the CONTROL archive (reference converter) fails the pinned validator -- the validator or its pin is broken, not FASTag"; exit 1; }
          bash test/mzpeak_validate.sh "$R/bundle" /tmp/bundle-mzpeak/bundle.mzpeak \
            || { echo "::error::the archive the shipped bundle wrote is not a valid mzPeak archive"; exit 1; }
          # ctest's round-trip reports are the test job's (mzpeak-validator-ctest-<leg>).
          ls -R "$R" | head -40

      # The reports, pass or fail: a red validator run is only useful with
      # the findings attached, and `always()` is what makes a failed step's
      # output reach the artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mzpeak-validator-${{ matrix.name }}
          path: validator-reports
          if-no-files-found: warn

      # ---------------------------------------------------------------------
      # macOS code signing + notarization, release builds only.
      #
      # Adapted from a working reference (BALL/BALLView's release.yml), not
      # invented -- but that project ships a Qt .app bundle via macdeployqt
      # and a signed .dmg via create-dmg; FASTag ships a bundled folder, not
      # an .app, so none of that packaging machinery applies, and one thing
      # does NOT carry over: `stapler staple` only works on .app bundles,
      # .pkg installers and disk images, never a lone Mach-O binary or a
      # plain folder -- Apple's own documented limitation, not an oversight
      # here. A notarized standalone binary is verified by Gatekeeper via an
      # ONLINE ticket lookup on first run instead, which needs network
      # access that one time. There is no staple step below because there is
      # nothing for it to attach to.
      #
      # Gated the same way as the release-upload step above and the
      # SignPath step in windows.yml: `secrets.X != ''` directly in an `if:`
      # makes the WHOLE workflow invalid (a 0-job startup_failure on every
      # push), so the secret is mapped into a step env: (legal) and the
      # presence check becomes a step OUTPUT that downstream steps gate on.
      #
      # The MACOS_* secrets exist on this repo since 2026-11; the first run
      # that took the signed branch was the gui_dry_run dispatch of PR #12.
      # Without them a tag build takes the "not configured" branch and ships
      # unsigned. doc/SIGNING-macos-gui.md names the secrets.
      - name: Detect macOS signing readiness
        if: runner.os == 'macOS' && (needs.version.outputs.release != '' || inputs.gui_dry_run)
        id: mac-signing
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            echo "::warning title=Unsigned macOS binary::MACOS_CERTIFICATE_BASE64 is not set -- shipping this release unsigned. Gatekeeper will warn on first run. See doc/SIGNING-macos-gui.md for what's needed."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple Developer ID cert into CI keychain (macOS)
        if: steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          # Ephemeral keychain, never the runner's login keychain.
          KEYCHAIN_PATH="${RUNNER_TEMP}/fastag-signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/cert.p12"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # The search list as words: one argument per keychain.
          # shellcheck disable=SC2046
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"' | xargs)
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -p codesigning -v "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      # Every dylib first, THEN the executable: codesigning it checks its
      # dependencies' own signatures too, so they need a real signature in
      # place beforehand -- dylibbundler's own internal codesign call uses an
      # ad-hoc identity ("-"), which notarization does not accept.
      - name: Codesign FASTag with Developer ID + hardened runtime (macOS)
        if: steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          for dylib in dist/FASTag/lib/*.dylib; do
            [ -L "$dylib" ] && continue
            codesign --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" --timestamp "$dylib"
          done
          # The .NET runtime (1.15.2): every Mach-O in it, re-signed with this
          # identity, so the hardened CLI loads it with library validation on.
          find dist/FASTag/dotnet -type f | while read -r f; do
            file -b "$f" | grep -q Mach-O || continue
            codesign --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" --timestamp "$f"
          done
          # Entitlements: CoreCLR's JIT (tools/macos-cli.entitlements).
          codesign --force --options runtime --entitlements tools/macos-cli.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" --timestamp dist/FASTag/FASTag.bin
          codesign --verify --strict --verbose=2 dist/FASTag/FASTag.bin
          codesign -d --entitlements - dist/FASTag/FASTag.bin
          # The signed, hardened bundle still reads .raw (the JIT entitlements).
          env -i HOME="$HOME" PATH=/usr/bin:/bin dist/FASTag/FASTag -in ci-data/thermo-smoke.raw \
            -out "$RUNNER_TEMP/signed-raw.tsv" -threads 2 > "$RUNNER_TEMP/signed-raw.log" 2>&1 \
            || { cat "$RUNNER_TEMP/signed-raw.log"; echo "::error::the signed CLI cannot read a Thermo .raw"; exit 1; }
          grep -E "scans indexed" "$RUNNER_TEMP/signed-raw.log"

      # No notarization of the bare CLI folder here (it was submitted as a zip
      # up to 1.16.4): a signed release ships the CLI only inside its disk
      # image and inside the app, and each of those is notarized, with the
      # CLI's Mach-Os in it, and stapled (below). A build without the signing
      # secrets ships the unsigned tarball, which was never notarized.

      # MOVED AHEAD OF THE DESKTOP APP, and that is the whole point: the app's
      # resources are staged from dist/FASTag, so embedding the index after that
      # shipped an .app carrying the 12 KB dumps-only directory and no k-mer
      # index at all. -species then failed inside the installed app with "the
      # taxonomy dumps are present ... but the k-mer index (tax_k7.taxdb) is
      # not" -- reported from /Applications/FASTag.app on 2026-09-09.
      #
      # The index is unsigned data, embedded after the codesign step; the disk
      # images that carry it are notarized with it.
      # Embed the full taxonomy index into the tarball -- tag builds only;
      # main pushes keep the fast dumps-only bundles nobody installs.
      #
      # Placed AFTER the macOS signing/notarization steps on purpose: the
      # index is unsigned data, and embedding earlier would balloon the
      # notarytool upload by ~450 MB. (That ordering stays theoretical until
      # the MACOS_* secrets exist -- revisit on the first signed run.)
      #
      # Fails the release loudly on ANY error -- a tarball whose -species is
      # silently broken is worse than a red build. The smoke run uses the
      # ion-trap tolerance because the bundled example file is ion-trap MS2;
      # it asserts the taxdb LOADS and a non-empty report is written, not any
      # particular taxon ranking (139 spectra cannot rank stably).
      #
      # A gui_dry_run dispatch with gui_full_payload also runs it, on the
      # macOS legs, linux-x64 and linux-arm64 (the ones that feed a
      # desktop app), so
      # the release-sized dmg and Linux bundles can be built and checked
      # before the tag (see the input's comment). linux-x64 embeds it before
      # the portable-CLI pack below, which gui-linux stages.
      - name: Embed taxonomy index (tag builds)
        if: needs.version.outputs.release != '' || (inputs.gui_dry_run && inputs.gui_full_payload && (runner.os == 'macOS' || matrix.name == 'linux-x64' || matrix.name == 'linux-arm64'))
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAXDB_TAG" -p 'FASTag-taxonomy-k7.tar.gz' -D /tmp/taxdb
          got=$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" /tmp/taxdb/FASTag-taxonomy-k7.tar.gz)
          [ "$got" = "$TAXDB_SHA256" ] || { echo "taxonomy sha256 mismatch: $got"; exit 1; }
          # The asset's dumps replace the repo copies: they are the ones the
          # index was built against.
          rm -rf dist/FASTag/share-FASTag-taxonomy
          # linux-1: the pinned tarball was packed on a Mac; GNU tar would unpack its
          # AppleDouble files (._*) into every package. bsdtar turns them into xattrs.
          tar --exclude='._*' -xzf /tmp/taxdb/FASTag-taxonomy-k7.tar.gz -C dist/FASTag
          test -s dist/FASTag/share-FASTag-taxonomy/tax_k7.taxdb
          # The asset predates -species_call (1.12 #1): put its frozen
          # parameters back beside the index, or -species_call decoy refuses.
          cp data/taxonomy/species_call.tsv dist/FASTag/share-FASTag-taxonomy/
          test -s dist/FASTag/share-FASTag-taxonomy/species_call.tsv
          # Its provenance: the tarball's own MANIFEST.json, or for an index
          # that predates it the reconstructed one (data/taxonomy/manifests/),
          # and every file checked against it.
          python3 tools/check_taxonomy_manifest.py dist/FASTag/share-FASTag-taxonomy "data/taxonomy/manifests/$TAXDB_TAG.json"
          MZ=dist/FASTag/share-OpenMS/examples/ID/Ecoli_MS2_small.mzML
          test -s "$MZ" || { echo "smoke fixture missing from bundle"; exit 1; }
          dist/FASTag/FASTag -in "$MZ" -out /tmp/smoke.tsv \
            -species -species_out /tmp/smoke.species.tsv \
            -tag_length 7 -extension 2 \
            -fragment_tolerance 0.3 -fragment_tolerance_unit Da
          [ "$(wc -l < /tmp/smoke.species.tsv)" -ge 2 ] || { echo "species smoke wrote an empty report"; exit 1; }
          # -species_call decoy must find the shipped parameters (no
          # -species_call_params) and write the 15-column report. Da
          # tolerance makes every row a low_resolution no_call by design.
          dist/FASTag/FASTag -in "$MZ" -out /tmp/smoke_call.tsv \
            -species -species_call decoy -species_out /tmp/smoke_call.species.tsv \
            -tag_length 7 -extension 2 \
            -fragment_tolerance 0.3 -fragment_tolerance_unit Da
          nf=$(head -1 /tmp/smoke_call.species.tsv | tr -d '\r' | awk -F'\t' '{print NF}')
          [ "$nf" = 15 ] || { echo "species_call smoke: $nf header fields, expected 15"; exit 1; }

      # ------------------------------------- portable CLI for the Linux GUI
      # The gui-linux job and the release tauri-driver run take the CLI from
      # here (GUI-DESIGN section 8, Linux). Not build/FASTag, the artifact
      # above, which is the unbundled binary with this job's conda RPATH: the
      # verified portable dist/FASTag (wrapper, FASTag.bin, lib/, share-*),
      # after the portability guard and, on a tag, with the taxonomy index
      # embedded by the step above. As a tar archive because upload-artifact
      # drops exec bits and symlinks (lib/ holds soname links). Pull requests
      # consume it too, in the real-CLI GUI consistency check below.
      # Both Linux legs: gui-linux stages linux-x64, gui-linux-arm64 stages
      # linux-arm64.
      - name: Pack the portable CLI for the Linux GUI (${{ matrix.name }})
        if: matrix.name == 'linux-x64' || matrix.name == 'linux-arm64'
        shell: bash
        run: |
          set -euo pipefail
          tar -C dist -czf FASTag-${{ matrix.name }}-portable.tar.gz FASTag
          ls -l FASTag-${{ matrix.name }}-portable.tar.gz
          # linux-1: the release tarball and both GUI packages are made from it.
          bash tools/check_no_appledouble.sh FASTag-${{ matrix.name }}-portable.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.name == 'linux-x64' || matrix.name == 'linux-arm64'
        with:
          name: FASTag-${{ matrix.name }}-portable
          path: FASTag-${{ matrix.name }}-portable.tar.gz
          # Already gzip: a second compression pass only costs time.
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      # A release candidate's Linux CLI tarball: the portable tarball above,
      # byte for byte (the release attaches it as FASTag-<version>-<leg>.tar.gz).
      - name: Release-candidate part (${{ matrix.name }})
        if: env.RC_CANDIDATE == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          python3 .github/scripts/rc-manifest.py part --job "${{ matrix.name }}" --group "${{ matrix.name }}" \
            --artifact "FASTag-${{ matrix.name }}-portable" --out "rc-part-${{ matrix.name }}.json" \
            "FASTag-${ASSET_VERSION}-${{ matrix.name }}.tar.gz=FASTag-${{ matrix.name }}-portable.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: env.RC_CANDIDATE == 'true' && runner.os == 'Linux'
        with:
          name: rc-part-${{ matrix.name }}
          path: rc-part-${{ matrix.name }}.json
          if-no-files-found: error

      # A signed, notarized, STAPLED disk image of the CLI.
      #
      # Why a .dmg when the tarball already carries the same signed binaries:
      # Apple staples a notarization ticket only to app bundles, installers and
      # DISK IMAGES -- never a lone Mach-O or a plain folder. The tarball is
      # therefore verified by an ONLINE Gatekeeper lookup on first run, which
      # fails for a user who is offline or behind a proxy that blocks Apple.
      # The disk image can carry its ticket, so it opens with no network at all.
      # Both ship: the .dmg for people installing by hand, the tarball for
      # scripts and CI, where mounting an image is a nuisance.
      #
      # Built AFTER the taxonomy embed so the image contains a complete,
      # -species-capable install, and BEFORE the desktop app: the image goes to
      # Apple's notary here and is stapled after the app's build, so the two
      # notarizations overlap instead of queueing one after the other. On a
      # tag and on a full-payload dry run (the release candidate, which keeps
      # the image as an artifact).
      - name: Make the CLI disk image and submit it for notarization (macOS)
        if: steps.mac-signing.outputs.enabled == 'true' && (needs.version.outputs.release != '' || (inputs.gui_dry_run && inputs.gui_full_payload))
        timeout-minutes: 30
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="FASTag-${ASSET_VERSION}-${{ matrix.name }}.dmg"
          STAGE="${RUNNER_TEMP}/dmgroot"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R dist/FASTag "$STAGE/FASTag"
          python3 tools/check_taxonomy_manifest.py --pinned "data/taxonomy/manifests/$TAXDB_TAG.json" "$STAGE/FASTag/share-FASTag-taxonomy" \
            || { echo "::error::the CLI disk image would not carry the pinned taxonomy index"; exit 1; }

          # A custom volume icon needs THREE things, and missing any one leaves
          # the generic white disk: the icon at the volume root named
          # .VolumeIcon.icns, the volume's "has custom icon" Finder flag, and a
          # writable image while both are set -- a UDZO image is read-only, so
          # this builds UDRW first and converts afterwards.
          cp gui/src-tauri/icons/icon.icns "$STAGE/.VolumeIcon.icns"
          RW="${RUNNER_TEMP}/FASTag-rw.dmg"
          rm -f "$RW"
          hdiutil create -volname "FASTag" -srcfolder "$STAGE" -ov -format UDRW "$RW"
          MNT=$(hdiutil attach -readwrite -noverify -noautoopen "$RW" | grep -o '/Volumes/.*' | head -1)
          SetFile -a C "$MNT" || echo "::warning::SetFile unavailable; the disk image will use the generic icon"
          hdiutil detach "$MNT" -quiet
          rm -f "$DMG"
          hdiutil convert "$RW" -format UDZO -o "$DMG"
          rm -f "$RW"
          # The licence agreement (Thermo's RawFileReader terms, section 3.3).
          python3 tools/dmg_license.py "$DMG" gui/src-tauri/installer-license.txt

          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$DMG"
          # To Apple now; job time goes on with the app while it is checked.
          bash .github/scripts/notarize.sh submit "$DMG" cli-dmg

      # ------------------------------------------------- desktop app (macOS)
      # The .app is a SECOND artifact needing its OWN signature: notarization
      # rejects a bundle containing any unsigned Mach-O, and the CLI plus its
      # whole dylib closure travel inside this one. Those are already signed
      # by the step above, so this restages the finished dist/ tree into the
      # layout the Rust backend expects and lets Tauri do the outer signing,
      # notarization and stapling in one shot.
      #
      # Unlike the CLI, a .app and a .dmg CAN be stapled -- so the desktop app
      # needs no online Gatekeeper lookup on first run, which the CLI does.
      #
      # Runs on a v* tag, or on a workflow_dispatch with gui_dry_run set: see
      # the comment on that input for why an untested tag-only path is a trap.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.mac-signing.outputs.enabled == 'true' || (inputs.gui_dry_run && runner.os == 'macOS')
        with:
          node-version: 24

      - name: Stage the signed CLI as the app's bundled resources (macOS)
        if: steps.mac-signing.outputs.enabled == 'true' || (inputs.gui_dry_run && runner.os == 'macOS')
        shell: bash
        run: |
          set -e
          # resolve_binary() in gui/src-tauri/src/fastag.rs looks for
          # <resources>/fastag/bin/FASTag, share/OpenMS and
          # share/FASTag/taxonomy -- match it exactly or the app falls back to
          # whatever `FASTag` is on PATH, which on a user's machine is nothing.
          R=gui/src-tauri/resources/fastag
          rm -rf "$R"; mkdir -p "$R/bin" "$R/share/FASTag"
          cp dist/FASTag/FASTag.bin "$R/bin/FASTag"
          # lib/ goes NEXT TO the executable, not one level up. dist/ was
          # bundled with `-p @executable_path/lib/`, so the loader looks beside
          # the binary; a tidier bin/../lib would break every dylib reference
          # and only show up at first launch on someone else's Mac.
          cp -RL dist/FASTag/lib "$R/bin/lib"
          cp -RL dist/FASTag/share-OpenMS "$R/share/OpenMS"
          cp -RL dist/FASTag/share-FASTag-taxonomy "$R/share/FASTag/taxonomy"
          cp -RL dist/FASTag/share-FASTag-digest "$R/share/FASTag/digest"
          cp -RL dist/FASTag/share-FASTag-alkylation "$R/share/FASTag/alkylation"
          cp dist/FASTag/LICENSE dist/FASTag/THIRD-PARTY-NOTICES.txt "$R/"
          # The vendor readers (1.15.2): the .NET runtime beside the CLI (it
          # looks in <its dir>/dotnet) and the licences; checked as a set.
          cp -RL dist/FASTag/dotnet "$R/bin/dotnet"
          cp -RL dist/FASTag/LICENSES "$R/LICENSES"
          python3 tools/vendor_bundle.py check --root "$R" --exe-dir "$R/bin" --share "$R/share/OpenMS"
          env -i HOME="$HOME" OPENMS_DATA_PATH="$R/share/OpenMS" "$R/bin/FASTag" -in ci-data/thermo-smoke.raw \
            -out "$RUNNER_TEMP/app-raw.tsv" -threads 2 > "$RUNNER_TEMP/app-raw.log" 2>&1 \
            || { cat "$RUNNER_TEMP/app-raw.log"; echo "::error::the app's CLI cannot read a Thermo .raw"; exit 1; }
          grep -E "scans indexed" "$RUNNER_TEMP/app-raw.log"
          # File > Open Example Data (gui/src-tauri/src/examples.rs).
          cp -R dist/FASTag/examples "$R/examples"
          test -s "$R/examples/Ecoli_MS2_small.mzML"
          # -L throughout: Tauri's resource bundler silently SKIPS symlinked
          # directories, so a symlink here becomes a missing file in the .app
          # with no error at build time.
          test -x "$R/bin/FASTag"
          # The same fixture the dist/ step above asserts -- proves share/
          # arrived whole, not just that the directory exists.
          test -s "$R/share/OpenMS/examples/ID/Ecoli_MS2_small.mzML"

          # HARD failure on a tag, not a warning. v1.4.1's app shipped with the
          # dumps but no k-mer index, so -species failed for anyone who
          # installed it -- and a warning in a green log is exactly how that
          # reached users. A gui_full_payload dry run embeds the index too and
          # is held to the same rule; a plain dry run stays a warning, because
          # it embeds no index.
          if [ -s "$R/share/FASTag/taxonomy/tax_k7.taxdb" ]; then
            echo "taxonomy index present: $(du -h "$R/share/FASTag/taxonomy/tax_k7.taxdb" | cut -f1)"
          elif [ "${{ needs.version.outputs.release != '' || (inputs.gui_dry_run && inputs.gui_full_payload) }}" = "true" ]; then
            echo "::error::the app bundle has no tax_k7.taxdb -- -species would fail in the shipped app"
            exit 1
          else
            echo "::warning::no taxonomy index (not a tag or full-payload build); -species unavailable in this app"
          fi

          # Run the CLI exactly as the app will: from inside the staged bundle,
          # with nothing from this runner's environment on PATH. A bundle that
          # cannot execute its own binary is the other half of the same class of
          # bug, and it is invisible to any check that only looks at file names.
          env -i HOME="$HOME" "$R/bin/FASTag" --help > /tmp/bundle-help.txt 2>&1 \
            || { echo "::error::the bundled CLI does not run"; cat /tmp/bundle-help.txt; exit 1; }
          # ...and that the version it reports is FASTAG'S, not OpenMS's. A
          # TOPPBase tool inherits VersionInfo::getVersion() unless the
          # constructor overrides version_, so v1.4.1 shipped announcing
          # "3.6.0-pre" to every user. Checking only that SOME version line
          # exists would have passed that build.
          want=$(sed -n 's/^project(FASTag VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$want" || { echo "::error::cannot read the project version"; exit 1; }
          grep -q "^Version: $want" /tmp/bundle-help.txt || {
            echo "::error::bundled CLI reports the wrong version (want $want, likely OpenMS's)"
            grep '^Version: ' /tmp/bundle-help.txt; exit 1; }
          echo "bundled CLI: $(grep '^Version: ' /tmp/bundle-help.txt)"

          # The update check phones home through Qt and prints QIODevice noise
          # on stderr for anyone offline or behind a proxy. main() disables it;
          # this is the regression test for that.
          ! grep -q "QIODevice" /tmp/bundle-help.txt \
            || { echo "::error::update check is live -- QIODevice noise on a plain --help"; exit 1; }
          du -sh "$R"

      # Installed in a step of its own, WITHOUT the signing secrets: npm
      # lifecycle scripts run during `npm ci`, and none of them needs the
      # Developer ID certificate or the notary password in its environment.
      # --ignore-scripts: the lockfile's only install script is fsevents'.
      - name: Install the desktop app's npm dependencies (macOS)
        if: steps.mac-signing.outputs.enabled == 'true' || (inputs.gui_dry_run && runner.os == 'macOS')
        working-directory: gui
        run: npm ci --ignore-scripts

      # GUI-THIRD-PARTY-NOTICES.txt beside the CLI's notices in the app's
      # resources: the Rust crates of this target, the npm production
      # packages and the fonts, each with its licence text
      # (tools/gui_third_party_notices.py fails on a missing text).
      - name: Third-party notices of the desktop app (macOS)
        if: steps.mac-signing.outputs.enabled == 'true' || (inputs.gui_dry_run && runner.os == 'macOS')
        shell: bash
        run: |
          set -euo pipefail
          target=$(rustc -vV | sed -n 's/^host: //p')
          python3 tools/gui_third_party_notices.py --gui gui --target "$target" --platform macos \
            --out gui/src-tauri/resources/fastag/GUI-THIRD-PARTY-NOTICES.txt

      # The release profile's compiled DEPENDENCIES (Cargo registry, deps/, build/,
      # .fingerprint/ -- never bundle/, the staged resources or the app
      # binary), keyed on the image, the architecture, rustc and Cargo.lock,
      # falling back to the newest of the same toolchain. Restored only: job
      # cargo-warm writes it from main pushes (cache budget: GitHub evicts at 10 GB).
      - name: Cargo cache key
        if: steps.mac-signing.outputs.enabled == 'true' || (inputs.gui_dry_run && runner.os == 'macOS')
        id: cargo-key
        shell: bash
        run: echo "key=cargo-release-${{ runner.os }}-${{ runner.arch }}-${ImageOS:-img}-$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore the Cargo cache
        if: steps.mac-signing.outputs.enabled == 'true' || (inputs.gui_dry_run && runner.os == 'macOS')
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            gui/src-tauri/target/release/deps
            gui/src-tauri/target/release/build
            gui/src-tauri/target/release/.fingerprint
            !gui/src-tauri/target/release/deps/*fastag*
            !gui/src-tauri/target/release/build/fastag-*
            !gui/src-tauri/target/release/.fingerprint/fastag-*
          key: ${{ steps.cargo-key.outputs.key }}-${{ hashFiles('gui/src-tauri/Cargo.lock') }}
          restore-keys: ${{ steps.cargo-key.outputs.key }}-
      - name: Build, sign and notarize the desktop app (macOS)
        if: steps.mac-signing.outputs.enabled == 'true' || (inputs.gui_dry_run && runner.os == 'macOS')
        timeout-minutes: 120
        working-directory: gui
        # Tauri reads these directly; APPLE_PASSWORD is the app-specific
        # password, never the Apple ID password. When the secrets are absent
        # (a dry run before they are configured) every value is empty, Tauri
        # skips signing, and the build still proves the bundle assembles.
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MACOS_MIN_VERSION }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -e -o pipefail
          # Tauri notarizes the .app itself (its own submit-and-wait); a lost
          # connection there (-1001 / -1005, the failure notarize.sh absorbs
          # for the two disk images) gets one more build, which reuses the
          # compiled target and submits the app again. Any other failure
          # fails at once.
          for i in 1 2; do
            if npm run tauri build 2>&1 | tee "$RUNNER_TEMP/tauri-build.log"; then break; fi
            if [ "$i" = 1 ] && grep -qE 'NSURLErrorDomain|-100[15]|network connection was lost|The request timed out' "$RUNNER_TEMP/tauri-build.log"; then
              echo "::warning::Tauri's app notarization lost its connection; building once more"
              continue
            fi
            exit 1
          done
          ls -la src-tauri/target/release/bundle/dmg/
          # Assert the ticket is attached, HERE rather than at upload time: a
          # dry run skips the upload, and the staple is what the dry run
          # exists to prove.
          #
          # Validate the .APP, not the .dmg. Tauri notarizes and staples the
          # app bundle, then builds the disk image from the stapled app and
          # only SIGNS that -- so `stapler validate` on the .dmg fails on a
          # perfectly good build ("does not have a ticket stapled to it",
          # exit 65), which is how it failed the v1.4.0 tag. Gatekeeper checks
          # the app the user drags out, and that one carries the ticket.
          if [ "${{ steps.mac-signing.outputs.enabled }}" = "true" ]; then
            shopt -s nullglob
            apps=(src-tauri/target/release/bundle/macos/*.app)
            [ ${#apps[@]} -gt 0 ] || { echo "::error::tauri produced no .app"; exit 1; }
            xcrun stapler validate "${apps[0]}"
            dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
            [ ${#dmgs[@]} -gt 0 ] || { echo "::error::tauri produced no .dmg"; exit 1; }
            codesign --verify --strict --verbose=2 "${dmgs[0]}"
          fi


      # Tauri's dmg is UDZO (zlib). Recompressed as ULMO (LZMA) it is about
      # 42% smaller (516.8 MB -> 300.4 MB measured with the full taxonomy
      # index), and ULMO opens on every macOS from 10.15, below the 13.4
      # floor. The conversion writes a new image, so the signature Tauri put
      # on the UDZO one is gone: the ULMO image is signed again, then
      # notarized and stapled AS A DMG. That makes `stapler validate` on the
      # .dmg meaningful for the first time (the step above still validates
      # the .app, which Tauri stapled). The converted image replaces Tauri's
      # in bundle/dmg/, so the release upload and the dry-run artifact below
      # pick it up unchanged.
      #
      # Then the image a user downloads is mounted and its CLI run from
      # there, with an empty environment: the portability check on the
      # shipped artifact, not on the staging folder. The image size is
      # reported in the log and the step summary; there is no size ceiling
      # (the 330 MB ceiling was dropped in 1.15). A plain dry run carries no
      # taxonomy index; dispatch with gui_full_payload as well to see the
      # real release payload's size before the tag.
      - name: Recompress the desktop app's dmg as ULMO, sign, notarize, staple (macOS)
        if: steps.mac-signing.outputs.enabled == 'true' || (inputs.gui_dry_run && runner.os == 'macOS')
        timeout-minutes: 75
        shell: bash
        env:
          SIGNED: ${{ steps.mac-signing.outputs.enabled }}
          ARCH: ${{ matrix.arch }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(gui/src-tauri/target/release/bundle/dmg/*.dmg)
          [ ${#dmgs[@]} -eq 1 ] || { echo "::error::expected one .dmg from tauri, found ${#dmgs[@]}"; exit 1; }
          DMG="${dmgs[0]}"
          before=$(stat -f %z "$DMG")
          echo "tauri dmg: $(hdiutil imageinfo "$DMG" | awk '/^Format:/ {print $2}'), $before bytes"

          ULMO="$RUNNER_TEMP/FASTag-ulmo.dmg"
          rm -f "$ULMO"
          hdiutil convert "$DMG" -format ULMO -o "$ULMO"
          fmt=$(hdiutil imageinfo "$ULMO" | awk '/^Format:/ {print $2}')
          [ "$fmt" = "ULMO" ] || { echo "::error::converted image is $fmt, not ULMO"; exit 1; }
          hdiutil verify "$ULMO"
          # The licence agreement Finder shows before mounting (Thermo's
          # RawFileReader terms, section 3.3; tools/dmg_license.py).
          python3 tools/dmg_license.py "$ULMO" gui/src-tauri/installer-license.txt
          mv -f "$ULMO" "$DMG"

          if [ "$SIGNED" = "true" ]; then
            codesign --force --sign "$MACOS_SIGNING_IDENTITY" --timestamp "$DMG"
            codesign --verify --strict --verbose=2 "$DMG"
            # Submitted, waited for by submission ID, stapled, validated
            # (.github/scripts/notarize.sh).
            bash .github/scripts/notarize.sh "$DMG" app-dmg
            spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          else
            echo "::warning::unsigned dry run: the ULMO dmg is neither signed nor notarized"
          fi

          # Portability on the shipped image: mount it read-only, run the
          # bundled CLI from inside it with nothing from this runner on PATH.
          MNT="$RUNNER_TEMP/fastag-dmg-mnt"
          mkdir -p "$MNT"
          # The image asks for the licence agreement: answered here, as a
          # user (or Homebrew) does.
          PAGER='cat' hdiutil attach "$DMG" -readonly -nobrowse -noautoopen -mountpoint "$MNT" < <(yes) > /dev/null
          trap 'hdiutil detach "$MNT" -force >/dev/null 2>&1 || true' EXIT
          apps=("$MNT"/*.app)
          [ ${#apps[@]} -eq 1 ] || { echo "::error::expected one .app in the dmg, found ${#apps[@]}"; exit 1; }
          CLI="${apps[0]}/Contents/Resources/resources/fastag/bin/FASTag"
          [ -x "$CLI" ] || CLI=$(find "${apps[0]}/Contents/Resources" -path '*/fastag/bin/FASTag' -type f -perm -u+x | head -1)
          [ -n "$CLI" ] && [ -x "$CLI" ] || { echo "::error::no bundled CLI in the mounted app"; exit 1; }
          # The notices (non-trivial, naming the app's own stack) and the
          # example data travel in the app's resources.
          bash tools/check_bundle_notices.sh "$(dirname "$(dirname "$CLI")")"
          # The k-mer index travels in the shipped image, not only in the
          # staged resources (checked again here, where a user gets it):
          # each pinned file a regular file with the manifest's size and
          # sha256, so a truncated or substituted index fails too.
          if [ "${{ needs.version.outputs.release != '' || (inputs.gui_dry_run && inputs.gui_full_payload) }}" = "true" ]; then
            python3 tools/check_taxonomy_manifest.py --pinned "data/taxonomy/manifests/$TAXDB_TAG.json" "$(dirname "$(dirname "$CLI")")/share/FASTag/taxonomy" \
              || { echo "::error::the app in the dmg does not carry the pinned taxonomy index"; exit 1; }
          fi
          env -i HOME="$HOME" "$CLI" --help > "$RUNNER_TEMP/dmg-help.txt" 2>&1 \
            || { echo "::error::the CLI inside the mounted dmg does not run"; cat "$RUNNER_TEMP/dmg-help.txt"; exit 1; }
          want=$(sed -n 's/^project(FASTag VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          grep -q "^Version: $want" "$RUNNER_TEMP/dmg-help.txt" \
            || { echo "::error::the CLI inside the dmg does not report version $want"; grep '^Version: ' "$RUNNER_TEMP/dmg-help.txt" || true; exit 1; }
          # The app's own executable and its bundled CLI are this leg's arch.
          for m in "${apps[0]}"/Contents/MacOS/* "$CLI"; do
            a=$(lipo -archs "$m" 2>/dev/null) || true
            [ "$a" = "$ARCH" ] || { echo "::error::$m is '${a:-unreadable}', expected $ARCH"; exit 1; }
            echo "$m: $a"
          done
          # The shipped app itself starts (on Intel for the first time in CI) and
          # runs its start-up probe (fastag.rs self_test, FASTAG_SELFTEST_OUT):
          # the GUI's resolution, environment and spawn path run the bundled
          # CLI from the mounted, signed image; exit 0 only if it ran. perl's
          # alarm is the timeout (no coreutils timeout on the runner).
          exe="${apps[0]}/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${apps[0]}/Contents/Info.plist")"
          st="$RUNNER_TEMP/selftest.json"; rm -f "$st"
          set +e
          FASTAG_SELFTEST_OUT="$st" perl -e 'alarm 180; exec @ARGV or die "exec: $!"' "$exe" > "$RUNNER_TEMP/selftest.log" 2>&1
          rc=$?
          set -e
          echo "app self-test: exit $rc"; cat "$st" 2>/dev/null || { echo '(no self-test output)'; cat "$RUNNER_TEMP/selftest.log"; }
          if [ "$rc" -ne 0 ] || ! grep -q '"ok": true' "$st"; then
            echo "::error::the app in the dmg did not start or could not run its bundled CLI (exit $rc)"; exit 1
          fi
          echo "- ${{ matrix.name }}: the app in the dmg starts and its self-test runs the bundled CLI" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIGNED" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "${apps[0]}"
            # The .app inside the dmg carries no stapled ticket of its own (only the dmg is
            # stapled), so this validate looks the ticket up online in Apple's CloudKit. That
            # lookup failed with NSURLErrorDomain -1005 on every v1.12.0 attempt after the dmg
            # itself was notarized, stapled and validated. Retry it; a lost connection after
            # three tries is a warning, any other stapler error still fails the job.
            ok=0
            for i in 1 2 3; do
              if out=$(xcrun stapler validate "${apps[0]}" 2>&1); then ok=1; echo "$out"; break; fi
              echo "$out"
              grep -q -- '-1005\|network connection was lost' <<<"$out" || { echo "::error::stapler validate of the app failed"; exit 1; }
              sleep $((i * 30))
            done
            [ "$ok" = 1 ] || echo "::warning::stapler validate of the mounted app could not reach CloudKit (-1005) after 3 tries; the dmg itself was stapled and validated above"
          fi
          hdiutil detach "$MNT"
          trap - EXIT

          size=$(stat -f %z "$DMG")
          mb() { awk -v b="$1" 'BEGIN { printf "%.1f", b / 1000000 }'; }
          echo "ULMO dmg: $size bytes ($(mb "$size") MB), was $before bytes"
          echo "### Desktop dmg: $(mb "$size") MB (ULMO), from $(mb "$before") MB (UDZO)" >> "$GITHUB_STEP_SUMMARY"

      # The CLI image's notarization, submitted before the app: waited for by
      # its submission ID, stapled -- a stapled, validated ticket or a red
      # step, that is the entire reason this artifact exists -- and checked as
      # a user gets it, mounted read-only with the licence answered: the
      # pinned taxonomy index in it and its CLI reporting this version.
      - name: Staple the CLI disk image and check it (macOS)
        if: steps.mac-signing.outputs.enabled == 'true' && (needs.version.outputs.release != '' || (inputs.gui_dry_run && inputs.gui_full_payload))
        timeout-minutes: 75
        shell: bash
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="FASTag-${ASSET_VERSION}-${{ matrix.name }}.dmg"
          bash .github/scripts/notarize.sh wait "$DMG" cli-dmg
          CMNT="$RUNNER_TEMP/fastag-cli-dmg-mnt"
          mkdir -p "$CMNT"
          env PAGER='cat' hdiutil attach "$DMG" -readonly -nobrowse -noautoopen -mountpoint "$CMNT" < <(yes) > /dev/null
          pinned=yes; runs=yes
          python3 tools/check_taxonomy_manifest.py --pinned "data/taxonomy/manifests/$TAXDB_TAG.json" "$CMNT/FASTag/share-FASTag-taxonomy" || pinned=no
          want=$(sed -n 's/^project(FASTag VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$CMNT/FASTag/FASTag" --help 2>&1 | grep -q "^Version: $want" || runs=no
          hdiutil detach "$CMNT" -force > /dev/null 2>&1 || true
          [ "$pinned" = yes ] || { echo "::error::the CLI disk image does not carry the pinned taxonomy index"; exit 1; }
          [ "$runs" = yes ] || { echo "::error::the CLI in the disk image does not run or does not report version $want"; exit 1; }
          echo "- ${{ matrix.name }}: the CLI disk image is notarized, stapled, carries the pinned index and runs" >> "$GITHUB_STEP_SUMMARY"
      # The CLI image as an artifact: job macos-release attaches it; a
      # full-payload dry run keeps it as the release would attach it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.mac-signing.outputs.enabled == 'true' && (needs.version.outputs.release != '' || (inputs.gui_dry_run && inputs.gui_full_payload))
        with:
          name: FASTag-${{ matrix.name }}-cli-dmg
          path: FASTag-${{ env.ASSET_VERSION }}-${{ matrix.name }}.dmg
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      # The release file name, given on a tag and on a dry run alike, so the
      # dry run's artifact holds the very name a release would attach.
      - name: Name the desktop app's disk image (macOS)
        if: runner.os == 'macOS' && ((steps.mac-signing.outputs.enabled == 'true' && needs.version.outputs.release != '') || inputs.gui_dry_run)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(gui/src-tauri/target/release/bundle/dmg/*.dmg)
          [ ${#dmgs[@]} -gt 0 ] || { echo "::error::tauri produced no .dmg"; exit 1; }
          cp "${dmgs[0]}" "FASTag-${ASSET_VERSION}-gui-${{ matrix.name }}.dmg"
          tools/release_assets.sh check "$ASSET_VERSION" "FASTag-${ASSET_VERSION}-gui-${{ matrix.name }}.dmg"

      # The desktop app's disk image as an artifact: job macos-release attaches
      # it on a release run, a dry run's is opened and checked by hand.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'macOS' && ((steps.mac-signing.outputs.enabled == 'true' && needs.version.outputs.release != '') || inputs.gui_dry_run)
        with:
          name: FASTag-gui-${{ matrix.name }}-dmg
          path: FASTag-${{ env.ASSET_VERSION }}-gui-${{ matrix.name }}.dmg
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      # A release candidate's two macOS images (signed builds only: the
      # manifest of a candidate requires them).
      - name: Release-candidate part (macOS)
        if: env.RC_CANDIDATE == 'true' && runner.os == 'macOS' && steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/rc-manifest.py part --job "${{ matrix.name }}" --group "${{ matrix.name }}" \
            --artifact "FASTag-gui-${{ matrix.name }}-dmg" --out "rc-part-${{ matrix.name }}-gui.json" \
            "FASTag-${ASSET_VERSION}-gui-${{ matrix.name }}.dmg=FASTag-${ASSET_VERSION}-gui-${{ matrix.name }}.dmg"
          python3 .github/scripts/rc-manifest.py part --job "${{ matrix.name }}" --group "${{ matrix.name }}" \
            --artifact "FASTag-${{ matrix.name }}-cli-dmg" --out "rc-part-${{ matrix.name }}-cli.json" \
            "FASTag-${ASSET_VERSION}-${{ matrix.name }}.dmg=FASTag-${ASSET_VERSION}-${{ matrix.name }}.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: env.RC_CANDIDATE == 'true' && runner.os == 'macOS' && steps.mac-signing.outputs.enabled == 'true'
        with:
          name: rc-part-${{ matrix.name }}
          path: rc-part-${{ matrix.name }}-*.json
          if-no-files-found: error

      # Filenames carry the version (FASTag-<version>-<platform>.<ext>, from
      # job version), so a downloaded file says which release it is. Up to
      # 1.14.0 they carried none, for /releases/latest/download/<name> links;
      # the README and the project page now link the releases/latest page
      # instead, and the page resolves the newest files through the API.
      #
      # Releases: job version makes the one DRAFT (release-draft.sh create);
      # the uploader jobs attach files to it by id (release-upload.sh, after
      # every gate of their files), and release-complete publishes it once the
      # whole inventory, Windows included, is on it with the right digests.
      # ---------------------------------------------------------------------
      # Placed last on purpose: everything above that needs the identity has
      # run. `always()` so a failure earlier still tears the keychain down.
      - name: Delete signing keychain (macOS)
        if: always() && steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        run: security delete-keychain "${RUNNER_TEMP}/fastag-signing.keychain-db" || true

      # A release run without the macOS signing secrets ships the CLI as a
      # tarball (an unsigned .dmg cannot be made); job macos-release attaches it.
      - name: The unsigned macOS CLI tarball (release runs without signing)
        if: runner.os == 'macOS' && needs.version.outputs.release != '' && steps.mac-signing.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar -C dist -czf "FASTag-${ASSET_VERSION}-${{ matrix.name }}.tar.gz" FASTag
          bash tools/check_no_appledouble.sh "FASTag-${ASSET_VERSION}-${{ matrix.name }}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'macOS' && needs.version.outputs.release != '' && steps.mac-signing.outputs.enabled != 'true'
        with:
          name: FASTag-${{ matrix.name }}-tarball
          path: FASTag-${{ env.ASSET_VERSION }}-${{ matrix.name }}.tar.gz
          compression-level: 0
          if-no-files-found: error

  # The arm64 Linux leg: build-linux-x64's steps, a job of its own so that
  # gui-linux-arm64 needs only it.
  build-linux-arm64:
    name: ${{ matrix.name }} build
    if: (needs.version.outputs.promote != 'true') && needs.version.outputs.code != 'false'
    runs-on: ${{ matrix.runner }}
    needs: [version]
    env:
      ASSET_VERSION: ${{ needs.version.outputs.version }}
      FASTAG_BUILD_TARGET: FASTag
    permissions:
      contents: read
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.linux_arm64_leg) }}
    steps: *build-steps

  # The macOS legs of build: the same steps, a job of their own so that the
  # Linux GUI jobs do not wait for them (release-complete still needs both).
  build-macos:
    name: ${{ matrix.name }} build
    if: (needs.version.outputs.promote != 'true') && needs.version.outputs.code != 'false'
    runs-on: ${{ matrix.runner }}
    needs: [version]
    outputs:
      signed: ${{ steps.mac-signing.outputs.enabled }}
    env:
      ASSET_VERSION: ${{ needs.version.outputs.version }}
      FASTAG_BUILD_TARGET: FASTag
    permissions:
      contents: read
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.macos_legs) }}
    steps: *build-steps

  # ---------------------------------------------------------------- tests
  # ctest, in jobs of their own that start with the build jobs below rather
  # than inside them: the build jobs go on to bundle, sign and package (and
  # the GUI jobs wait only for them) while the tests run. Each test job
  # compiles FASTag and its tests itself from the same tree and toolchain.
  # The job keeps the leg's name (linux-x64, ...): tested-tree.sh, on a v*
  # tag, looks for an earlier run whose job of that name passed its "Test"
  # step. release-complete needs these jobs.
  test:
    name: ${{ matrix.name }}
    if: (needs.version.outputs.promote != 'true') && needs.version.outputs.code != 'false'
    runs-on: ${{ matrix.runner }}
    needs: [version]
    permissions:
      contents: read
      # read: the Test step's reuse lookup on a v* tag (.github/scripts/tested-tree.sh)
      # lists this workflow's earlier runs and their jobs.
      actions: read
    # 330: a cold OpenMS build (up to 240 minutes) plus the suite.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.linux_legs) }}
    steps: &test-steps
      - *s01
      # A v* tag build does not re-run ctest when an earlier push or dispatch
      # run of this workflow (the release dry run, the main push of the merge
      # commit) has the SAME git tree and a successful Test step in the job of
      # the same name. Any API error, a PR, a main push or a dispatch: the
      # tests run as before. The run it relied on is named in the log and the
      # job summary.
      - name: Look for an identical tree that already passed the tests (tag builds)
        id: test-reuse
        if: needs.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/tested-tree.sh "${{ matrix.name }}"
          # The shared Configure, Build and validator steps read this.
          grep -q '^reuse=true$' "$GITHUB_OUTPUT" && echo "TESTS_REUSED=true" >> "$GITHUB_ENV" || true

      - *s02
      - *s03
      - *s03b
      - *s04
      - *s05
      - *s06
      - *s08
      - *s07
      - *s09
      - *s10
      - *s11
      - *s12
      - *s13
      - *s14
      - *s15
      - *s16
      - name: Test
        if: steps.test-reuse.outputs.reuse != 'true'
        shell: bash -el {0}
        run: |
          # pipefail, as in Configure: this shell has errexit but not pipefail.
          set -o pipefail
          # One test per core: the tests are independent (their own temp
          # directories; fixtures, RUN_SERIAL and COST in CMakeLists.txt).
          # The required-test checks below read the per-test result lines,
          # which ctest prints the same way with -j.
          NJ=$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          # Idle OpenMP workers sleep instead of spinning: with -j tests side by
          # side, each FASTag's spinning workers (libomp: 200 ms after every
          # parallel region) take the cores the other tests need. Output is
          # unchanged; only the wait between regions differs.
          export OMP_WAIT_POLICY=PASSIVE KMP_BLOCKTIME=0
          echo "ctest -j $NJ (OMP_WAIT_POLICY=$OMP_WAIT_POLICY)"
          ctest --test-dir build --output-on-failure -j "$NJ" 2>&1 | tee ctest.log
          # The mzPeak tests SKIP themselves in a build without mzPeak support
          # or without the validator. This job has both, so a skip here would
          # be a broken harness presenting as green -- the very class of
          # failure this coverage exists for. Require a Passed line for each.
          # The vendor readers (1.15.2) likewise: bruker_cli_test reads the
          # trimmed timsTOF fixture, thermo_cli_test checks the reader's gate
          # and notice (its data part needs a peptide .raw, which CI has not).
          # gui_cli_test and shipped_data_test: the shipped data in every
          # layout and the build tree's staging (they skip without Python).
          # The four parts of charge_cli_test (#6), which skip on a binary that
          # cannot start.
          for t in mzpeak_roundtrip mzpeak_validate mzpeak_stream_test bruker_cli_test thermo_cli_test gui_cli_test shipped_data_test charge_cli_test_defaults charge_cli_test_calls charge_cli_test_threads charge_cli_test_species; do
            grep -E "Test +#[0-9]+: $t " ctest.log | grep -q 'Passed' \
              || { echo "::error::$t did not pass (skipped, not run or missing)"; grep -E "$t" ctest.log || true; exit 1; }
          done

      # ctest's mzpeak_validate reports (the round-trip archives), pass or fail.
      - name: Collect the ctest validator reports
        if: always() && steps.test-reuse.outputs.reuse != 'true'
        shell: bash
        run: |
          mkdir -p validator-reports
          cp -r build/mzpeak-roundtrip/validator validator-reports/ctest 2>/dev/null || echo "no ctest validator reports"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.test-reuse.outputs.reuse != 'true'
        with:
          name: mzpeak-validator-ctest-${{ matrix.name }}
          path: validator-reports
          if-no-files-found: warn

  test-macos:
    name: ${{ matrix.name }}
    if: (needs.version.outputs.promote != 'true') && needs.version.outputs.code != 'false'
    runs-on: ${{ matrix.runner }}
    needs: [version]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.macos_legs) }}
    steps: *test-steps

  # ----------------------------------------------------------- GUI checks
  # On pull requests, main pushes, release candidates (whose job "release
  # candidate" requires them, so a promoted tag has them green on its exact
  # tree) and rebuilt releases (release-complete requires them); not on a
  # plain dry run or a promoted tag, where they would only queue in front of
  # the build jobs (20 concurrent jobs on this plan).
  # Independent on purpose: no `needs:` -- waiting for OpenMS to test
  # TypeScript would make nobody run it. webkit2gtk/rsvg are what the tauri
  # crate links on Linux; without them cargo cannot even typecheck the backend.
  gui:
    needs: [version]
    if: ${{ needs.version.outputs.promote != 'true' && (github.event_name != 'workflow_dispatch' || (inputs.gui_dry_run && inputs.gui_full_payload) || needs.version.outputs.release != '') && needs.version.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Tauri build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev
      # The de novo golden files (P3): the repository's own
      # tools/tags_to_denovo.py, called as it is, writes each case of
      # gui/src/fixtures/denovo/cases.json, and its output must equal the
      # committed golden files byte for byte (and pass the script's --check).
      # The vitest suite below then holds export/denovo.ts to the same files.
      # The release scripts against written API responses (stub-gh): test
      # reuse on a tag, the release-candidate lookup and manifest, the one
      # draft per tag, notarization by submission ID. Seconds; they decide
      # what a release attaches, so they run on every PR.
      - name: Release scripts (stub tests)
        run: |
          bash .github/scripts/tests/release_scripts_test.sh
          bash .github/scripts/tests/notarize_test.sh
      - name: De novo golden files from tools/tags_to_denovo.py
        working-directory: gui
        run: |
          python3 --version
          node scripts/denovo-golden.mjs
      - name: Frontend typecheck + tests + build
        working-directory: gui
        run: |
          npm ci
          npm run typecheck
          # The Playwright specs too (suite-1 of 1.16.1: a removed helper went unnoticed).
          npx tsc -p e2e-web
          npm test
          npm run build
      # Tauri's build script refuses to compile unless every path in
      # tauri.conf.json's bundle.resources exists -- and resources/fastag is
      # the machine-specific 1.4 GB CLI+dylib+taxonomy bundle, gitignored by
      # gui/src-tauri/.gitignore and absent from a fresh checkout. The library
      # tests are pure logic (arg building, settings, species/taxdb parsing,
      # the results browser) and never read it, so an empty placeholder is
      # exactly enough. Verified locally by reproducing the CI condition:
      # without the directory cargo fails with "resource path
      # `resources/fastag` doesn't exist"; with an empty one the lib tests pass
      # (122 on macOS after P1 PRs a and b, 108 from P1 PR a, 100 from P1 PR b, 91 from P0b, 73 from P0a, 54 before). The run lifecycle tests drive
      # gui/testing/stub-fastag, a sh script, instead of the CLI. The process
      # lifetime tests (lifetime.rs, P1 PR b) have three Linux-only ones
      # (PDEATHSIG, the getppid check): this job is where they run. Two
      # ignored tests are the helper processes of the kill -9 tests.
      - name: Backend unit tests
        working-directory: gui/src-tauri
        run: |
          mkdir -p resources/fastag
          cargo test --lib
          # The browser bench (P0b) is not run here, only kept compiling.
          cargo check --example browser_bench
      # The P1 gate "IPC message rate during a chatty phase" (GUI-DESIGN 10),
      # measured on this Linux runner against the stub CLI and printed into
      # the job summary. The bound itself is asserted by the tests above.
      - name: IPC message rate of a chatty phase (recorded)
        working-directory: gui/src-tauri
        run: |
          cargo test --lib ipc_rate -- --nocapture --test-threads=1 2>&1 | tee ipc-rate.txt
          { echo '### IPC message rate (stub CLI, ubuntu-24.04)'; echo '```'; grep -o 'IPC rate.*' ipc-rate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The backend on Windows. Two parts:
  # - the Windows half of the process lifetime (P1 PR b): the kill-on-close
  #   job object each run is started in (lifetime.rs), including the kill of
  #   a stand-in GUI process with a .bat-like grandchild. windows.yml builds
  #   the app only on tags, so without this step the cfg(windows) code would
  #   first compile at a release. Required.
  # - every lib test (P1 PR a): path handling differs there (a root-relative
  #   \data\x.tsv is not absolute; ResolvedOutputs, GUI-DESIGN 6.3), and the
  #   GUI ships for Windows. No OpenMS and no CLI: the run-lifecycle tests that
  #   drive the sh stub are cfg(unix). Informational (step-level
  #   continue-on-error) until it has been green once, except the Open and
  #   Reveal tests (reveal::), which are required.
  # pwsh, not bash: Git Bash's link.exe shadows MSVC's linker (windows.yml,
  # "Build the desktop app").
  gui-windows:
    needs: [version]
    if: ${{ needs.version.outputs.promote != 'true' && (github.event_name != 'workflow_dispatch' || (inputs.gui_dry_run && inputs.gui_full_payload) || needs.version.outputs.release != '') && needs.version.outputs.code != 'false' }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # tauri's generate_context! embeds frontendDist (../dist), which must exist.
      - name: Frontend build (for the embedded assets)
        working-directory: gui
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Backend lifetime tests (Windows)
        working-directory: gui/src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force resources/fastag | Out-Null
          cargo test --lib --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib lifetime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Required: Reveal and Open compare canonical paths, which Windows
      # spells two ways (C:\... and the verbatim \\?\C:\...); the History
      # Open regression (Codex6 finding 6) only shows there. Each named test
      # must report ok, so a rename or a filter that matches nothing fails.
      - name: Backend Open and Reveal tests (Windows)
        working-directory: gui/src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = cargo test --lib reveal::
          $code = $LASTEXITCODE
          $log | Out-Host
          if ($code -ne 0) { exit $code }
          foreach ($t in 'a_committed_output_opens_after_a_restart_from_its_run_record', 'open_identities_use_the_plain_canonical_spelling') {
            if (-not ($log | Select-String -SimpleMatch "reveal::tests::$t ... ok")) { Write-Error "required test $t did not pass"; exit 1 }
          }
      # Required (codex7 review n5): the browser module's reads and exports
      # depend on the Windows share modes (open_read: no writer while a read
      # holds the file). The whole module must pass, and each named test must
      # report ok, so a rename or a filter that matches nothing fails; the
      # full suite below stays informational.
      - name: Backend browser tests (Windows)
        working-directory: gui/src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = cargo test --lib browser::
          $code = $LASTEXITCODE
          $log | Out-Host
          if ($code -ne 0) { exit $code }
          foreach ($t in 'an_export_whose_source_changes_while_it_is_read_is_not_committed', 'windows_reads_exclude_writers_but_not_renames') {
            if (-not ($log | Select-String -SimpleMatch "browser::tests::$t ... ok")) { Write-Error "required test $t did not pass"; exit 1 }
          }
      - name: Backend unit tests (Windows)
        working-directory: gui/src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ------------------------------------------------ tauri-driver (Linux)
  # GUI-DESIGN section 9, layer 4: the real debug app in WebKitGTK through
  # tauri-driver + WebKitWebDriver under xvfb, on ubuntu-22.04 (the oldest
  # supported base). Every push and PR runs gui/e2e-tauri against the stub
  # CLI (gui/testing/stub-fastag); before a tag, gui-linux-smoke-deb runs
  # the same specs against the installed .deb and its real CLI. Probe, run,
  # table, cancel, a Tags row opened in the Spectrum tab (P4: the stub serves
  # the G1 CLI's real --helphelp and -dump_spectrum output), and two recorded
  # WebKitGTK gates: time to first rows on a generated 1M-row file and the
  # IPC message rate of a chatty run.
  # Blocking from P5 (informational with continue-on-error in P1-P4): a
  # failing spec fails the run. Making it a required check of main is a
  # branch-protection setting, not part of this file.
  # Independent of the CLI build, like the gui job.
  tauri-driver:
    needs: [version]
    if: ${{ needs.version.outputs.promote != 'true' && (github.event_name != 'workflow_dispatch' || (inputs.gui_dry_run && inputs.gui_full_payload) || needs.version.outputs.release != '') && needs.version.outputs.code != 'false' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Tauri build deps, WebKitWebDriver, a display and a session bus
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev \
            webkit2gtk-driver xvfb dbus-x11
          command -v WebKitWebDriver
      - name: Restore tauri-driver
        id: tauri-driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-ubuntu-22.04-${{ runner.arch }}
      - name: Install tauri-driver
        if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: |
          rustup update stable --no-self-update
          cargo +stable install tauri-driver --version 2.1.0 --locked
      # The debug app with the stub as its CLI (FASTAG_BIN, set by run.sh):
      # resources/fastag only has to exist, as in the gui job.
      - name: Build the debug app
        working-directory: gui
        run: |
          npm ci
          mkdir -p src-tauri/resources/fastag
          npx tauri build --debug --no-bundle
          test -x src-tauri/target/debug/fastag
      - name: tauri-driver specs (stub CLI)
        working-directory: gui
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" bash e2e-tauri/run.sh stub
      - name: Record the WebKitGTK gates
        if: always()
        run: |
          f=gui/e2e-tauri/results/tauri-driver-stub.json
          if [ -f "$f" ]; then
            { echo '### tauri-driver (stub CLI, ubuntu-22.04)'; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: tauri-driver-stub
          path: gui/e2e-tauri/results
          if-no-files-found: ignore
          retention-days: 30

  # ------------------------------------------------- desktop app (Linux)
  # GUI-DESIGN section 8, Linux (D4). NOT on the linux-x64 leg: that leg runs
  # every step in the micromamba env with conda's pkg-config, compilers and
  # sysroot 2.28, and webkit2gtk-sys / gtk-sys would resolve against those,
  # not apt's libwebkit2gtk-4.1-dev. This job runs outside conda on
  # ubuntu-22.04 (glibc 2.35, the oldest base Tauri supports with
  # webkit2gtk-4.1, which is the floor the README states) with plain apt.
  #
  # The CLI comes from the linux-x64 leg's portable tarball and is staged in
  # the layout resolve_binary() in gui/src-tauri/src/fastag.rs expects, as
  # the macOS leg stages its signed CLI. Assets: a .deb and a tarball (the
  # .deb's /usr tree, relocatable: tauri finds resources in
  # <exe>/../lib/FASTag), then a best-effort AppImage. Runs on a v* tag and
  # on a gui_dry_run dispatch; nothing is attached here -- the smoke jobs
  # below test the artifact first, and gui-linux-release attaches it.
  gui-linux:
    name: gui-linux-x64
    if: ${{ !cancelled() && needs.version.outputs.promote != 'true' && (needs.version.outputs.release != '' || inputs.gui_dry_run) }}
    needs: [version, build-linux-x64]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # GUI_ARCH names the FASTag files (linux-<GUI_ARCH>), DEB_ARCH the
    # Debian architecture. gui-linux-arm64 below runs these same steps (a
    # YAML alias of the anchor) with arm64/arm64 on ubuntu-22.04-arm.
    env:
      GUI_ARCH: x64
      DEB_ARCH: amd64
    outputs:
      deb: ${{ steps.assets.outputs.deb }}
      tarball: ${{ steps.assets.outputs.tarball }}
    steps: &gui-linux-steps
      - &gl-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - &gl-download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FASTag-linux-${{ env.GUI_ARCH }}-portable
          path: ${{ runner.temp }}/cli
      # See gui-linux-release: a tag without P1 PR b's process lifetime gets
      # no Linux assets. A dry run only says so.
      - name: Process lifetime (P1 PR b) present?
        run: |
          if grep -rqs 'libc::PR_SET_PDEATHSIG' gui/src-tauri/src; then
            echo "libc::PR_SET_PDEATHSIG found in gui/src-tauri/src"
          else
            echo "::warning::no libc::PR_SET_PDEATHSIG call in gui/src-tauri/src (P1 PR b not merged): a tag build would not attach the Linux desktop app"
          fi
      - &gl-stage
        name: Stage the portable CLI as the app's bundled resources
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/cli/FASTag-linux-$GUI_ARCH-portable.tar.gz" -C "$RUNNER_TEMP/cli"
          D="$RUNNER_TEMP/cli/FASTag"
          R=gui/src-tauri/resources/fastag
          rm -rf "$R"; mkdir -p "$R/bin" "$R/share/FASTag"
          # bin/FASTag is the real binary, not the wrapper: the app sets
          # OPENMS_DATA_PATH itself. Its RPATH is $ORIGIN/lib, so lib/ goes
          # beside it. -L throughout: Tauri's resource bundler skips
          # symlinks, and lib/ carries soname links.
          cp "$D/FASTag.bin" "$R/bin/FASTag"
          cp -RL "$D/lib" "$R/bin/lib"
          cp -RL "$D/share-OpenMS" "$R/share/OpenMS"
          cp -RL "$D/share-FASTag-taxonomy" "$R/share/FASTag/taxonomy"
          cp -RL "$D/share-FASTag-digest" "$R/share/FASTag/digest"
          cp -RL "$D/share-FASTag-alkylation" "$R/share/FASTag/alkylation"
          cp "$D/LICENSE" "$D/THIRD-PARTY-NOTICES.txt" "$R/"
          # The vendor readers (1.15.2): the .NET runtime beside the CLI and
          # the licences. The .deb and the tarball carry them; the AppImage
          # does not (the step before it removes them).
          cp -RL "$D/dotnet" "$R/bin/dotnet"
          cp -RL "$D/LICENSES" "$R/LICENSES"
          python3 tools/vendor_bundle.py check --root "$R" --exe-dir "$R/bin" --share "$R/share/OpenMS"
          # File > Open Example Data (gui/src-tauri/src/examples.rs).
          cp -RL "$D/examples" "$R/examples"
          test -s "$R/examples/Ecoli_MS2_small.mzML"
          test -x "$R/bin/FASTag"
          test -s "$R/share/OpenMS/examples/ID/Ecoli_MS2_small.mzML"
          # A tag build, and a gui_full_payload dry run, carry the k-mer index
          # (the linux-x64 leg embeds it in both); a plain dry run has none.
          # The same rule as the macOS staging step: a hard failure where the
          # index is due, so the release-sized bundle is what gets tested.
          if [ -s "$R/share/FASTag/taxonomy/tax_k7.taxdb" ]; then
            echo "taxonomy index present: $(du -h "$R/share/FASTag/taxonomy/tax_k7.taxdb" | cut -f1)"
          elif [ "${{ needs.version.outputs.release != '' || (inputs.gui_dry_run && inputs.gui_full_payload) }}" = "true" ]; then
            echo "::error::the Linux app bundle has no tax_k7.taxdb -- -species would fail in the shipped app"
            exit 1
          else
            echo "::warning::no taxonomy index (not a tag or full-payload build); -species unavailable in this app"
          fi
          # Run the CLI as the app will, with nothing of this runner's
          # environment, and check it reports FASTag's version.
          env -i HOME="$HOME" OPENMS_DATA_PATH="$R/share/OpenMS" "$R/bin/FASTag" --help > /tmp/bundle-help.txt 2>&1 \
            || { echo "::error::the staged CLI does not run"; cat /tmp/bundle-help.txt; exit 1; }
          want=$(sed -n 's/^project(FASTag VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          grep -q "^Version: $want" /tmp/bundle-help.txt \
            || { echo "::error::the staged CLI does not report version $want"; grep '^Version: ' /tmp/bundle-help.txt || true; exit 1; }
          du -sh "$R"
          # The staged copy is all the build needs: free the extracted CLI and
          # its tarball (about 1 GB each at release size) before the bundlers
          # make three more copies.
          rm -rf "$RUNNER_TEMP/cli"
          df -h / "$RUNNER_TEMP" | tee -a /tmp/disk.txt
      - &gl-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - &gl-deps
        name: Tauri build deps (apt, no conda)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev file xdg-utils squashfs-tools pigz
          ldd --version | head -1
          pkg-config --modversion webkit2gtk-4.1
      # GUI-THIRD-PARTY-NOTICES.txt beside the CLI's notices in the app's
      # resources: the Rust crates of this target, the npm production
      # packages and the fonts, each with its licence text. The .deb and the
      # tarball bundle no system library; the AppImage step below adds the
      # libraries linuxdeploy bundles to the AppImage's copy.
      - &gl-npm
        name: Install the npm dependencies, write the desktop app's notices
        working-directory: gui
        run: |
          set -euo pipefail
          npm ci
          target=$(rustc -vV | sed -n 's/^host: //p')
          python3 ../tools/gui_third_party_notices.py --gui . --target "$target" --platform linux \
            --out src-tauri/resources/fastag/GUI-THIRD-PARTY-NOTICES.txt
      # The release profile's compiled DEPENDENCIES (Cargo registry, deps/, build/,
      # .fingerprint/ -- never bundle/, the staged resources or the app
      # binary), keyed on the image, the architecture, rustc and Cargo.lock,
      # falling back to the newest of the same toolchain. Restored only: job
      # cargo-warm writes it from main pushes (cache budget: GitHub evicts at 10 GB).
      - name: Cargo cache key
        id: cargo-key
        shell: bash
        run: echo "key=cargo-release-${{ runner.os }}-${{ runner.arch }}-${ImageOS:-img}-$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore the Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            gui/src-tauri/target/release/deps
            gui/src-tauri/target/release/build
            gui/src-tauri/target/release/.fingerprint
            !gui/src-tauri/target/release/deps/*fastag*
            !gui/src-tauri/target/release/build/fastag-*
            !gui/src-tauri/target/release/.fingerprint/fastag-*
          key: ${{ steps.cargo-key.outputs.key }}-${{ hashFiles('gui/src-tauri/Cargo.lock') }}
          restore-keys: ${{ steps.cargo-key.outputs.key }}-
      - name: Build the .deb
        working-directory: gui
        run: |
          npx tauri build --bundles deb
          ls -la src-tauri/target/release/bundle/deb/
          df -h / | tail -1
      # The Debian package is named fastag-gui, not the `fas-tag` Tauri
      # derives from productName: tauri.conf.json has no option for it, so
      # the .deb is repacked with only the Package field changed. The name
      # has to be right before the first Linux release -- dpkg treats a
      # renamed package as a different one, so a later rename breaks
      # upgrades. The download is fastag-gui_<version>_amd64.deb (GUI-DESIGN
      # section 8, decision of 2026-11-07), Debian's own file name; the
      # tarball and the AppImage are FASTag-<version>-gui-linux-x64.tar.gz
      # and .AppImage, the version from job version.
      - name: Name the assets, make the tarball, check the .deb
        id: assets
        shell: bash
        env:
          DEB_PACKAGE: fastag-gui
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "$VER" ] || { echo "::error::job version gave no version"; exit 1; }
          DEB="${DEB_PACKAGE}_${VER}_${DEB_ARCH}.deb"
          TGZ="FASTag-${VER}-gui-linux-${GUI_ARCH}.tar.gz"
          B=gui/src-tauri/target/release/bundle
          shopt -s nullglob
          debs=("$B"/deb/*.deb)
          [ ${#debs[@]} -eq 1 ] || { echo "::error::expected one .deb from tauri, found ${#debs[@]}"; exit 1; }
          # Only the control member changes (Package), so only it is rebuilt: the
          # .deb's ar members are taken apart and put back in their order
          # (debian-binary, control.tar.gz, data.tar.*), Tauri's compressed
          # data member untouched. A full dpkg-deb repack recompressed the
          # whole ~1 GB payload single-threaded (3.4 min).
          X="$RUNNER_TEMP/debx"; W="$RUNNER_TEMP/debar"; rm -rf "$X" "$W"; mkdir -p "$W/c"
          deb_in=$(realpath "${debs[0]}")
          (cd "$W" && ar x "$deb_in")
          ls -l "$W"
          ctrl=$(find "$W" -maxdepth 1 -name 'control.tar*'); data=$(find "$W" -maxdepth 1 -name 'data.tar*')
          [ -n "$ctrl" ] && [ -n "$data" ] && [ "$(cat "$W/debian-binary")" = 2.0 ] || { echo "::error::Tauri's .deb is not debian-binary 2.0 + control + data"; exit 1; }
          tar -xf "$ctrl" -C "$W/c"
          echo "Tauri's package name: $(sed -n 's/^Package: //p' "$W/c/control")"
          sed -i "s/^Package: .*/Package: $DEB_PACKAGE/" "$W/c/control"
          rm -f "$ctrl"
          (cd "$W/c" && tar --owner=0 --group=0 --numeric-owner --sort=name -czf ../control.tar.gz ./*)
          rm -f "$DEB"
          (cd "$W" && ar rcD "$GITHUB_WORKSPACE/$DEB" debian-binary control.tar.gz "$(basename "$data")")
          rm -rf "$W" "${debs[0]}"
          # Every content check below reads the generated $DEB itself, not
          # the repack input: an omission or corruption introduced by the
          # repack cannot pass them.
          rm -rf "$X"
          dpkg-deb -R "$DEB" "$X"
          dpkg-deb -I "$DEB"
          [ "$(dpkg-deb -f "$DEB" Package)" = "$DEB_PACKAGE" ] \
            || { echo "::error::the .deb is not named $DEB_PACKAGE"; exit 1; }
          [ "$(dpkg-deb -f "$DEB" Version)" = "$VER" ] \
            || { echo "::error::the .deb's Version is $(dpkg-deb -f "$DEB" Version), not $VER"; exit 1; }
          [ "$(dpkg-deb -f "$DEB" Architecture)" = "$DEB_ARCH" ] \
            || { echo "::error::the .deb is for $(dpkg-deb -f "$DEB" Architecture), not $DEB_ARCH"; exit 1; }
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          dep=$(dpkg-deb -f "$DEB" Depends)
          for want in libwebkit2gtk-4.1-0 libgtk-3-0; do
            grep -q "$want" <<< "$dep" || { echo "::error::the .deb does not depend on $want (Depends: $dep)"; exit 1; }
          done
          cli=$(find "$X" -path '*/resources/fastag/bin/FASTag' -type f -perm -u+x | head -1)
          [ -n "$cli" ] || { echo "::error::the .deb carries no executable resources/fastag/bin/FASTag"; exit 1; }
          echo "CLI in the .deb: ${cli#"$X"}"
          bash tools/check_bundle_notices.sh "$(dirname "$(dirname "$cli")")"
          # The k-mer index in the package itself, as extracted from $DEB
          # above (the tarball is its /usr tree).
          if [ "${{ needs.version.outputs.release != '' || (inputs.gui_dry_run && inputs.gui_full_payload) }}" = "true" ]; then
            python3 tools/check_taxonomy_manifest.py --pinned "data/taxonomy/manifests/$TAXDB_TAG.json" "$(dirname "$(dirname "$cli")")/share/FASTag/taxonomy" \
              || { echo "::error::the .deb does not carry the pinned taxonomy index in resources/fastag/share/FASTag/taxonomy"; exit 1; }
          fi
          # bundle.category in tauri.conf.json sets the menu category;
          # without it Categories= is empty and menus file FASTag under
          # "Other".
          desk="$X/usr/share/applications/FASTag.desktop"
          grep -qx 'Categories=Education;' "$desk" \
            || { echo "::error::the .deb's FASTag.desktop has $(grep '^Categories=' "$desk" || echo 'no Categories='), not Categories=Education;"; exit 1; }
          # The tarball is the .deb's /usr tree, renamed; moved, not copied,
          # as the repacked .deb already holds it.
          T="$RUNNER_TEMP/guitar"; rm -rf "$T"; mkdir -p "$T"
          mv "$X/usr" "$T/FASTag-gui"
          rm -rf "$X"
          # gzip on every core (pigz): the same .tar.gz format.
          tar -C "$T" -cf - FASTag-gui | pigz -6 > "$TGZ"
          rm -rf "$T"
          echo "tarball=$TGZ" >> "$GITHUB_OUTPUT"
          # The names the release would attach, checked on a dry run too.
          names=("$DEB" "$TGZ")
          tools/release_assets.sh check "$VER" "${names[@]}"
          # linux-1: no package carries macOS AppleDouble files (._*).
          bash tools/check_no_appledouble.sh "${names[@]}"
          # GitHub refuses a release asset of 2 GiB or more.
          mb() { awk -v b="$1" 'BEGIN { printf "%.1f", b / 1000000 }'; }
          echo "### Linux desktop app, $GUI_ARCH (ubuntu $(. /etc/os-release && echo "$VERSION_ID"), glibc $(ldd --version | head -1 | awk '{print $NF}'), WebKitGTK $(pkg-config --modversion webkit2gtk-4.1))" >> "$GITHUB_STEP_SUMMARY"
          for f in "${names[@]}"; do
            size=$(stat -c %s "$f")
            echo "- $f: $(mb "$size") MB" >> "$GITHUB_STEP_SUMMARY"
            [ "$size" -lt 2147483648 ] || { echo "::error::$f is $(mb "$size") MB, at or above GitHub's 2 GiB asset limit"; exit 1; }
          done
          # The headroom at release size is a gate input (a full disk would
          # first show up on the tag): the free space after staging, and now.
          { echo '- disk after staging:'; echo '```'; cat /tmp/disk.txt; echo '```'
            echo '- disk with every asset written:'; echo '```'; df -h / "$RUNNER_TEMP"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # The .deb and the tarball, as their own artifact: the .deb smoke jobs
      # download these two, not the AppImage (job gui-linux-appimage).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FASTag-gui-linux-${{ env.GUI_ARCH }}-deb
          path: |
            fastag-gui_*_${{ env.DEB_ARCH }}.deb
            FASTag-*-gui-linux-${{ env.GUI_ARCH }}.tar.gz
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Release-candidate part (.deb, tarball)
        if: env.RC_CANDIDATE == 'true'
        env:
          DEB: ${{ steps.assets.outputs.deb }}
          TGZ: ${{ steps.assets.outputs.tarball }}
        run: |
          python3 .github/scripts/rc-manifest.py part --job "gui-linux-$GUI_ARCH" --group "linux-$GUI_ARCH-gui" \
            --artifact "FASTag-gui-linux-$GUI_ARCH-deb" --out "rc-part-gui-linux-$GUI_ARCH.json" "$DEB=$DEB" "$TGZ=$TGZ"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: env.RC_CANDIDATE == 'true'
        with:
          name: rc-part-gui-linux-${{ env.GUI_ARCH }}
          path: rc-part-gui-linux-${{ env.GUI_ARCH }}.json
          if-no-files-found: error

  # The same app for Linux on arm64 (aarch64): gui-linux's steps (the YAML
  # alias below) on GitHub's ubuntu-22.04-arm runner, so the floor is the
  # same glibc 2.35 / WebKitGTK 4.1, with the linux-arm64 leg's portable CLI.
  # Assets: fastag-gui_<version>_arm64.deb, FASTag-<version>-gui-linux-arm64
  # .tar.gz and a best-effort .AppImage, artifact FASTag-gui-linux-arm64.
  # Independent of the x64 jobs: a failure here holds back only arm64.
  gui-linux-arm64:
    name: gui-linux-arm64
    if: ${{ !cancelled() && needs.version.outputs.promote != 'true' && (needs.version.outputs.release != '' || inputs.gui_dry_run) }}
    needs: [version, build-linux-arm64]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    env:
      GUI_ARCH: arm64
      DEB_ARCH: arm64
    outputs:
      deb: ${{ steps.assets.outputs.deb }}
      tarball: ${{ steps.assets.outputs.tarball }}
    steps: *gui-linux-steps

  # The AppImage, best-effort (GUI-DESIGN section 8), in a job of its own:
  # beside the .deb job rather than after it, so the required .deb and
  # tarball and their smoke jobs never wait for it, and a failure here holds
  # back only the AppImage (continue-on-error: the run stays green, the
  # AppImage smoke jobs and the upload skip it). The same staged CLI and
  # notices as the .deb job (its steps by alias), then the Thermo reader
  # removed, the AppImage built and checked, named, and uploaded as its own
  # artifact, which only the AppImage smoke jobs download.
  gui-linux-appimage:
    name: gui-linux-x64 AppImage
    if: ${{ !cancelled() && needs.version.outputs.promote != 'true' && (needs.version.outputs.release != '' || inputs.gui_dry_run) }}
    needs: [version, build-linux-x64]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    continue-on-error: true
    env:
      GUI_ARCH: x64
    outputs:
      appimage: ${{ steps.name.outputs.built }}
      appimage_file: ${{ steps.name.outputs.appimage_file }}
    steps: &gui-linux-appimage-steps
      - *gl-checkout
      - *gl-download
      - *gl-stage
      - *gl-node
      - *gl-deps
      - *gl-npm
      # Best-effort (GUI-DESIGN section 8): linuxdeploy also bundles
      # WebKitGTK and GStreamer on top of the resources, and a failure here
      # must not hold back the .deb and the tarball. NO_STRIP: linuxdeploy's
      # bundled strip cannot read the newer ELF sections of the libraries.
      # The AppImage ships WITHOUT the Thermo reader: RawFileReader's licence
      # (section 4.3) bars distributing it with GPL-type software in a way
      # that makes a combined work, and the AppImage packs the LGPL GTK and
      # WebKitGTK stack into the same image. The .deb and the tarball, built
      # above, keep it. Removed from the staged resources here, after the
      # .deb, and checked absent in the AppImage (check_bundle_notices.sh).
      - name: Remove the Thermo reader from the AppImage's resources
        shell: bash
        run: |
          set -euo pipefail
          R=gui/src-tauri/resources/fastag
          python3 tools/vendor_bundle.py strip --root "$R" --exe-dir "$R/bin" --share "$R/share/OpenMS"
          python3 tools/vendor_bundle.py check --absent --root "$R" --exe-dir "$R/bin" --share "$R/share/OpenMS"
      # The release profile's compiled DEPENDENCIES (Cargo registry, deps/, build/,
      # .fingerprint/ -- never bundle/, the staged resources or the app
      # binary), keyed on the image, the architecture, rustc and Cargo.lock,
      # falling back to the newest of the same toolchain. Restored only: job
      # cargo-warm writes it from main pushes (cache budget: GitHub evicts at 10 GB).
      - name: Cargo cache key
        id: cargo-key
        shell: bash
        run: echo "key=cargo-release-${{ runner.os }}-${{ runner.arch }}-${ImageOS:-img}-$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore the Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            gui/src-tauri/target/release/deps
            gui/src-tauri/target/release/build
            gui/src-tauri/target/release/.fingerprint
            !gui/src-tauri/target/release/deps/*fastag*
            !gui/src-tauri/target/release/build/fastag-*
            !gui/src-tauri/target/release/.fingerprint/fastag-*
          key: ${{ steps.cargo-key.outputs.key }}-${{ hashFiles('gui/src-tauri/Cargo.lock') }}
          restore-keys: ${{ steps.cargo-key.outputs.key }}-
      - name: Build the AppImage
        id: appimage
        working-directory: gui
        env:
          NO_STRIP: 'true'
        run: |
          set -euo pipefail
          npx tauri build --bundles appimage
          ls -la src-tauri/target/release/bundle/appimage/
          df -h / | tail -1
          compgen -G 'src-tauri/target/release/bundle/appimage/*.AppImage' > /dev/null
          # The notices of what linuxdeploy bundled: listed from the
          # AppImage's squashfs (nothing extracted), each library mapped to
          # its Ubuntu package with the copyright file, the licence texts and
          # the (L)GPL source links; then built once more with that notice in
          # the resources (linuxdeploy bundles the same libraries again), and
          # the second AppImage checked to carry it and to list every library.
          app=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          chmod +x "$app"
          L="$RUNNER_TEMP/appimage.lls"
          unsquashfs -o "$("$app" --appimage-offset)" -lls "$app" > "$L"
          target=$(rustc -vV | sed -n 's/^host: //p')
          python3 ../tools/gui_third_party_notices.py --gui . --target "$target" --platform linux \
            --appimage-listing "$L" --out src-tauri/resources/fastag/GUI-THIRD-PARTY-NOTICES.txt
          npx tauri build --bundles appimage
          app=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          chmod +x "$app"
          unsquashfs -o "$("$app" --appimage-offset)" -lls "$app" > "$L"
          inside=$(awk '{print $NF}' "$L" | grep '/resources/fastag/GUI-THIRD-PARTY-NOTICES.txt$' | head -1)
          [ -n "$inside" ] || { echo "::error::the AppImage carries no resources/fastag/GUI-THIRD-PARTY-NOTICES.txt"; exit 1; }
          # The k-mer index in the AppImage's squashfs, where the index is due:
          # its taxonomy folder unpacked and each pinned file checked (a
          # regular file with the manifest's size and sha256), not a name in
          # the listing.
          if [ "${{ needs.version.outputs.release != '' || (inputs.gui_dry_run && inputs.gui_full_payload) }}" = "true" ]; then
            tdir=$(awk '{print $NF}' "$L" | grep '/resources/fastag/share/FASTag/taxonomy/tax_k7.taxdb$' | head -1)
            [ -n "$tdir" ] || { echo "::error::the AppImage carries no resources/fastag/share/FASTag/taxonomy/tax_k7.taxdb"; exit 1; }
            tdir=$(dirname "${tdir#squashfs-root/}")
            TX="$RUNNER_TEMP/appimage-taxonomy"; rm -rf "$TX"
            unsquashfs -o "$("$app" --appimage-offset)" -d "$TX" "$app" "$tdir" > /dev/null
            python3 ../tools/check_taxonomy_manifest.py --pinned "../data/taxonomy/manifests/$TAXDB_TAG.json" "$TX/$tdir" \
              || { echo "::error::the AppImage does not carry the pinned taxonomy index"; exit 1; }
            rm -rf "$TX"
          fi
          # No Thermo reader and no .NET runtime in the AppImage (see above).
          if grep -E 'ThermoFisher\.CommonCore|/resources/fastag/bin/dotnet/|ThermoRawFileReader-License' "$L"; then
            echo "::error::the AppImage carries the Thermo reader"; exit 1
          fi
          X="$RUNNER_TEMP/appimage-notice"; rm -rf "$X"
          unsquashfs -o "$("$app" --appimage-offset)" -d "$X" "$app" "${inside#squashfs-root/}" \
            "$(dirname "${inside#squashfs-root/}")/LICENSE" \
            "$(dirname "${inside#squashfs-root/}")/THIRD-PARTY-NOTICES.txt" \
            "$(dirname "${inside#squashfs-root/}")/examples" > /dev/null
          python3 ../tools/gui_third_party_notices.py --appimage-listing "$L" --check-appimage "$X/${inside#squashfs-root/}"
          bash ../tools/check_bundle_notices.sh "$X/$(dirname "${inside#squashfs-root/}")" appimage
          rm -rf "$X"
      - name: Name and check the AppImage
        id: name
        shell: bash
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          APPIMAGE="FASTag-${VER}-gui-linux-${GUI_ARCH}.AppImage"
          shopt -s nullglob
          apps=(gui/src-tauri/target/release/bundle/appimage/*.AppImage)
          [ ${#apps[@]} -eq 1 ] || { echo "::error::expected one AppImage, found ${#apps[@]}"; exit 1; }
          cp "${apps[0]}" "$APPIMAGE"
          tools/release_assets.sh check "$VER" "$APPIMAGE"
          bash tools/check_no_appledouble.sh "$APPIMAGE"
          size=$(stat -c %s "$APPIMAGE")
          [ "$size" -lt 2147483648 ] || { echo "::error::$APPIMAGE is $size bytes, at or above GitHub's 2 GiB asset limit"; exit 1; }
          echo "- $APPIMAGE: $(awk -v b="$size" 'BEGIN { printf "%.1f", b / 1000000 }') MB" >> "$GITHUB_STEP_SUMMARY"
          echo "appimage_file=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FASTag-gui-linux-${{ env.GUI_ARCH }}-appimage
          path: FASTag-*-gui-linux-${{ env.GUI_ARCH }}.AppImage
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Release-candidate part (AppImage)
        if: env.RC_CANDIDATE == 'true'
        env:
          APPIMAGE: ${{ steps.name.outputs.appimage_file }}
        run: |
          python3 .github/scripts/rc-manifest.py part --job "gui-linux-$GUI_ARCH-appimage" --group "linux-$GUI_ARCH-appimage" \
            --artifact "FASTag-gui-linux-$GUI_ARCH-appimage" --out "rc-part-gui-linux-$GUI_ARCH-appimage.json" "$APPIMAGE=$APPIMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: env.RC_CANDIDATE == 'true'
        with:
          name: rc-part-gui-linux-${{ env.GUI_ARCH }}-appimage
          path: rc-part-gui-linux-${{ env.GUI_ARCH }}-appimage.json
          if-no-files-found: error

  gui-linux-arm64-appimage:
    name: gui-linux-arm64 AppImage
    if: ${{ !cancelled() && needs.version.outputs.promote != 'true' && (needs.version.outputs.release != '' || inputs.gui_dry_run) }}
    needs: [version, build-linux-arm64]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    continue-on-error: true
    env:
      GUI_ARCH: arm64
    outputs:
      appimage: ${{ steps.name.outputs.built }}
      appimage_file: ${{ steps.name.outputs.appimage_file }}
    steps: *gui-linux-appimage-steps

  # The tarball, then the .deb, on the oldest and the newest supported Ubuntu
  # LTS (P1 acceptance).
  #
  # The tarball first, while no /usr/lib/FASTag exists to mask a failure:
  # extracted into an arbitrary prefix with only the two runtime libraries
  # the README names, its bundled CLI runs the fixture, the app starts under
  # xvfb and stays up, and the tauri-driver probe asserts that the app
  # resolved the CLI in its own resources (<exe>/../lib/FASTag), not on
  # PATH or in /usr.
  #
  # Then the .deb: apt resolves its dependencies, the bundled CLI runs the
  # E. coli fixture from the installed path with an empty environment, and
  # the app starts under xvfb and stays up. Then the tauri-driver specs run
  # against the installed app and its real CLI (informational, as in the
  # tauri-driver job).
  gui-linux-smoke-deb:
    name: gui-linux .deb on ${{ matrix.os }}
    if: ${{ !cancelled() && needs.gui-linux.result == 'success' }}
    needs: [gui-linux]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GUI_ARCH: x64
      DEB: ${{ needs.gui-linux.outputs.deb }}
      TGZ: ${{ needs.gui-linux.outputs.tarball }}
    steps: &gui-linux-smoke-deb-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # This run's artifact (bounded, retried: .github/scripts/fetch-artifact.sh):
      # the .deb job's, or in a promoted run the promoted files promote-assets
      # attached and staged (SMOKE_ARTIFACT).
      - name: Fetch the .deb and the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/fetch-artifact.sh "$GITHUB_RUN_ID" "${SMOKE_ARTIFACT:-FASTag-gui-linux-$GUI_ARCH-deb}" "$RUNNER_TEMP/gui" 3 600
          ls -l "$RUNNER_TEMP/gui"
      - name: The tarball runs from an arbitrary prefix
        run: |
          set -euo pipefail
          sudo apt-get update -q
          # Only what the README tells a tarball user to install, plus the
          # display and the session bus of the check itself.
          sudo apt-get install -y -q libwebkit2gtk-4.1-0 libgtk-3-0 xvfb dbus dbus-x11
          P="$RUNNER_TEMP/some where/prefix"; mkdir -p "$P"
          tar -xzf "$RUNNER_TEMP/gui/$TGZ" -C "$P"
          T="$P/FASTag-gui"
          [ -x "$T/bin/fastag" ] || { echo "::error::the tarball has no FASTag-gui/bin/fastag"; ls -la "$T" "$T/bin" || true; exit 1; }
          [ ! -e /usr/lib/FASTag ] || { echo "::error::/usr/lib/FASTag exists before the .deb is installed"; exit 1; }
          CLI="$T/lib/FASTag/resources/fastag/bin/FASTag"
          [ -x "$CLI" ] || { echo "::error::the tarball has no $CLI"; exit 1; }
          W="$RUNNER_TEMP/tarfixture"; mkdir -p "$W"
          cp test/fixtures/Ecoli_MS2_small.mzML "$W/"
          env -i HOME="$HOME" PATH=/usr/bin:/bin OPENMS_DATA_PATH="$T/lib/FASTag/resources/fastag/share/OpenMS" "$CLI" \
            -in "$W/Ecoli_MS2_small.mzML" -out "$W/ecoli.tags.tsv" -threads 2
          n=$(($(wc -l < "$W/ecoli.tags.tsv") - 1))
          [ "$n" -gt 0 ] || { echo "::error::the tarball's CLI wrote no tags"; exit 1; }
          echo "TARAPP=$T/bin/fastag" >> "$GITHUB_ENV"
          echo "TARPREFIX=$T/" >> "$GITHUB_ENV"
          echo "tarball CLI: $n tags from the E. coli fixture"
      - name: The tarball's app starts and stays up
        run: |
          # The default shell is bash -e: without +e the expected 124 from
          # timeout would end the step before rc is read.
          set +e -uo pipefail
          dbus-run-session -- xvfb-run -a timeout 20 "$TARAPP" > "$RUNNER_TEMP/tarapp.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/tarapp.log"
          [ "$rc" -eq 124 ] || { echo "::error::$TARAPP exited with $rc within 20 s"; exit 1; }
          if grep -qiE 'error while loading shared libraries|cannot open shared object|panicked|Gdk-ERROR|bwrap:' "$RUNNER_TEMP/tarapp.log"; then
            echo "::error::$TARAPP logged a fatal start-up error"; exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: WebKitWebDriver
        run: sudo apt-get install -y -q webkit2gtk-driver
      - name: Restore tauri-driver
        id: tauri-driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/tauri-driver
          # runner.arch last: actions/cache also restores a key that merely
          # starts with this one, and tauri-driver-2.1.0-ubuntu-24.04 was a
          # prefix of the arm64 leg's ...-ubuntu-24.04-arm (dry run
          # 43741885636 restored the arm64 binary on x64).
          key: tauri-driver-2.1.0-${{ matrix.os }}-${{ runner.arch }}
      - name: Install tauri-driver
        if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: |
          rustup update stable --no-self-update
          cargo +stable install tauri-driver --version 2.1.0 --locked
      # Not informational: this is the check that the tarball finds its own
      # resources from wherever it is unpacked.
      - name: The tarball's app resolves its bundled CLI (tauri-driver probe)
        working-directory: gui
        env:
          FASTAG_APP: ${{ env.TARAPP }}
          E2E_BIN_PREFIX: ${{ env.TARPREFIX }}
          E2E_ONLY: '^probe'
          E2E_OUT: ${{ runner.temp }}/tarball-results
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" bash e2e-tauri/run.sh real
          cat "$E2E_OUT/tauri-driver-real.json"
          echo "### tarball on ${{ matrix.os }}: runs the fixture, the app stays up and runs $(sed -n 's/.*"bin": "\(.*\)".*/\1/p' "$E2E_OUT/tauri-driver-real.json")" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the .deb
        run: |
          set -euo pipefail
          [ -n "$DEB" ] && [ -f "$RUNNER_TEMP/gui/$DEB" ] || { echo "::error::no .deb '$DEB' in the artifact"; ls -la "$RUNNER_TEMP/gui"; exit 1; }
          sudo apt-get install -y -q "$RUNNER_TEMP/gui/$DEB" xvfb dbus dbus-x11
          PKG=$(dpkg-deb -f "$RUNNER_TEMP/gui/$DEB" Package)
          dpkg -s "$PKG" | head -12
          APP=$(dpkg -L "$PKG" | grep '^/usr/bin/' | head -1)
          [ -x "$APP" ] || { echo "::error::the package installs no program in /usr/bin"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
      - name: The installed CLI runs a fixture
        run: |
          set -euo pipefail
          CLI=$(dpkg -L "$PKG" | grep '/resources/fastag/bin/FASTag$')
          DATA="$(dirname "$(dirname "$CLI")")/share/OpenMS"
          want=$(sed -n 's/^project(FASTag VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          env -i HOME="$HOME" OPENMS_DATA_PATH="$DATA" "$CLI" --help > "$RUNNER_TEMP/help.txt" 2>&1 || true
          grep -q "^Version: $want" "$RUNNER_TEMP/help.txt" \
            || { cat "$RUNNER_TEMP/help.txt"; echo "::error::the installed CLI does not report version $want"; exit 1; }
          W="$RUNNER_TEMP/fixture"; mkdir -p "$W"
          cp test/fixtures/Ecoli_MS2_small.mzML "$W/"
          env -i HOME="$HOME" PATH=/usr/bin:/bin OPENMS_DATA_PATH="$DATA" "$CLI" \
            -in "$W/Ecoli_MS2_small.mzML" -out "$W/ecoli.tags.tsv" -threads 2
          n=$(($(wc -l < "$W/ecoli.tags.tsv") - 1))
          [ "$n" -gt 0 ] || { echo "::error::the installed CLI wrote no tags"; exit 1; }
          echo "installed CLI ($CLI): $n tags from the E. coli fixture"
      - name: The installed app starts and stays up
        run: |
          # The default shell is bash -e: without +e the expected 124 from
          # timeout would end the step before rc is read.
          set +e -uo pipefail
          dbus-run-session -- xvfb-run -a timeout 20 "$APP" > "$RUNNER_TEMP/app.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/app.log"
          [ "$rc" -eq 124 ] || { echo "::error::$APP exited with $rc within 20 s"; exit 1; }
          if grep -qiE 'error while loading shared libraries|cannot open shared object|panicked|Gdk-ERROR|bwrap:' "$RUNNER_TEMP/app.log"; then
            echo "::error::$APP logged a fatal start-up error"; exit 1
          fi
          echo "### .deb on ${{ matrix.os }}: installs, runs the fixture, the app stays up" >> "$GITHUB_STEP_SUMMARY"
      # The installed app's own start-up probe (fastag.rs self_test), the check
      # tools/windows_installed_check.ps1 runs on Windows: the GUI's resolution,
      # environment and spawn path run the bundled CLI; exit 0 only if it ran.
      - name: The installed app runs its start-up self-test
        run: |
          set +e -uo pipefail
          out="$RUNNER_TEMP/selftest.json"; rm -f "$out"
          FASTAG_SELFTEST_OUT="$out" dbus-run-session -- xvfb-run -a timeout 180 "$APP" > "$RUNNER_TEMP/selftest.log" 2>&1
          rc=$?
          echo "app self-test: exit $rc"; cat "$out" 2>/dev/null || { echo '(no self-test output)'; cat "$RUNNER_TEMP/selftest.log"; }
          if [ "$rc" -ne 0 ] || ! grep -q '"ok": true' "$out"; then echo "::error::the installed app could not run its bundled CLI (exit $rc)"; exit 1; fi
          echo "- the installed app's start-up self-test runs its bundled CLI" >> "$GITHUB_STEP_SUMMARY"
      # Blocking since 1.16.2 (ci-1: the Cancel spec raced the input probe).
      - name: tauri-driver specs against the installed app (real CLI)
        id: real-specs
        working-directory: gui
        env:
          FASTAG_APP: ${{ env.APP }}
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" bash e2e-tauri/run.sh real
      - name: Record the WebKitGTK gates
        if: always()
        run: |
          f=gui/e2e-tauri/results/tauri-driver-real.json
          if [ -f "$f" ]; then
            { echo "### tauri-driver (real CLI, installed .deb, ${{ matrix.os }}): ${{ steps.real-specs.outcome }}"; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: tauri-driver-real-${{ matrix.os }}
          path: gui/e2e-tauri/results
          if-no-files-found: ignore
          retention-days: 30

  # gui-linux-smoke-deb's steps for the arm64 bundles, on the arm64 runners
  # of the same two Ubuntu LTS releases.
  gui-linux-arm64-smoke-deb:
    name: gui-linux-arm64 .deb on ${{ matrix.os }}
    if: ${{ !cancelled() && needs.gui-linux-arm64.result == 'success' }}
    needs: [gui-linux-arm64]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm, ubuntu-24.04-arm]
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GUI_ARCH: arm64
      DEB: ${{ needs.gui-linux-arm64.outputs.deb }}
      TGZ: ${{ needs.gui-linux-arm64.outputs.tarball }}
    steps: *gui-linux-smoke-deb-steps

  # The AppImage launches on 22.04 and 24.04 with FUSE 2 (libfuse2 /
  # libfuse2t64, absent on a fresh 24.04).
  gui-linux-smoke-appimage:
    name: gui-linux AppImage on ${{ matrix.os }}
    if: ${{ !cancelled() && needs.gui-linux-appimage.outputs.appimage == 'true' }}
    needs: [gui-linux-appimage]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            fuse: libfuse2
          - os: ubuntu-24.04
            fuse: libfuse2t64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GUI_ARCH: x64
      APPIMAGE_FILE: ${{ needs.gui-linux-appimage.outputs.appimage_file }}
    steps: &gui-linux-smoke-appimage-steps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 10
        with:
          name: FASTag-gui-linux-${{ env.GUI_ARCH }}-appimage
          path: ${{ runner.temp }}/gui
      - name: The AppImage launches
        run: |
          # The default shell is bash -e: without +e the expected 124 from
          # timeout would end the step before rc is read.
          set +e -uo pipefail
          sudo apt-get update -q
          # libegl1/libgles2/libgl1: the AppImage takes EGL and GL from the
          # host, as every desktop has them; a bare runner does not (dry runs
          # 42314786620 and 42317242897: libEGL.so.1, then libGLESv2.so.2).
          sudo apt-get install -y -q ${{ matrix.fuse }} libegl1 libgles2 libgl1 xvfb dbus dbus-x11
          A="$RUNNER_TEMP/gui/$APPIMAGE_FILE"
          chmod +x "$A"
          dbus-run-session -- xvfb-run -a timeout 30 "$A" > "$RUNNER_TEMP/app.log" 2>&1
          rc=$?
          tail -100 "$RUNNER_TEMP/app.log"
          [ "$rc" -eq 124 ] || { echo "::error::the AppImage exited with $rc within 30 s"; exit 1; }
          if grep -qiE 'error while loading shared libraries|cannot open shared object|panicked|Gdk-ERROR|bwrap:' "$RUNNER_TEMP/app.log"; then
            echo "::error::the AppImage logged a fatal start-up error"; exit 1
          fi
          echo "### AppImage ($GUI_ARCH) on ${{ matrix.os }}: launches and stays up" >> "$GITHUB_STEP_SUMMARY"

  gui-linux-arm64-smoke-appimage:
    name: gui-linux-arm64 AppImage on ${{ matrix.os }}
    if: ${{ !cancelled() && needs.gui-linux-arm64-appimage.outputs.appimage == 'true' }}
    needs: [gui-linux-arm64-appimage]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04-arm
            fuse: libfuse2
          - os: ubuntu-24.04-arm
            fuse: libfuse2t64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GUI_ARCH: arm64
      APPIMAGE_FILE: ${{ needs.gui-linux-arm64-appimage.outputs.appimage_file }}
    steps: *gui-linux-smoke-appimage-steps

  # Attaches the Linux desktop app to the release, mirroring the macOS and
  # Windows attach steps, but only after the .deb smoke passed on both
  # Ubuntu releases. The .deb is fastag-gui_<version>_amd64.deb; the tarball
  # and the AppImage are FASTag-<version>-gui-linux-x64.tar.gz and
  # .AppImage (named in job gui-linux). The AppImage goes up only when it launched on
  # both Ubuntu releases. Rocky/RHEL 9 is not supported by the desktop app
  # (decision of 2026-11-07: glibc 2.34 and WebKitGTK API 4.0 only; the CLI
  # covers RHEL-family systems), so no job tests it. Never on a dry run: that
  # run's artifact FASTag-gui-linux-x64 is the thing to open and check by
  # hand.
  #
  # Ordering with P1 PR b (GUI-DESIGN section 8: "PDEATHSIG and the watchdog
  # ship with the first Linux release"): killing the GUI must end its CLI
  # within 3 s, and on Linux that is PR b's prctl(libc::PR_SET_PDEATHSIG)
  # (#17, lifetime.rs). Until that call is in gui/src-tauri/src (a comment
  # naming it does not count) this job fails before
  # attaching anything, so a tag cut before PR b lands ships no Linux GUI
  # and release-complete turns red on the missing .deb and tarball.
  gui-linux-release:
    if: ${{ !cancelled() && needs.version.outputs.release != '' && needs.version.outputs.promote != 'true' && needs.build-linux-x64.result == 'success' && needs.gui-linux.result == 'success' && needs.gui-linux-smoke-deb.result == 'success' }}
    needs: [version, build-linux-x64, gui-linux, gui-linux-appimage, gui-linux-smoke-deb, gui-linux-smoke-appimage]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            gui/src-tauri/src
            .github/scripts
            tools/release_assets.sh
            tools/check_no_appledouble.sh
          sparse-checkout-cone-mode: false
      - name: The process lifetime of P1 PR b is in this build
        run: |
          grep -rqs 'libc::PR_SET_PDEATHSIG' gui/src-tauri/src || {
            echo "::error::no libc::PR_SET_PDEATHSIG call in gui/src-tauri/src: P1 PR b (process lifetime) must ship with the first Linux release (GUI-DESIGN section 8); not attaching the Linux desktop app"
            exit 1
          }
      # The files the smoke jobs passed, under their release names: the
      # .deb and the GUI tarball, the CLI tarball (the portable one the GUI
      # jobs staged), and the AppImage only when it launched on both Ubuntu
      # releases. Attached by release id, each checked by its digest
      # (release-upload.sh); what went up is recorded for release-complete.
      - name: Attach the Linux x64 files to the draft
        env:
          ID: ${{ needs.version.outputs.release_id }}
          APPIMAGE_OK: ${{ needs.gui-linux-smoke-appimage.result == 'success' }}
          DEB: ${{ needs.gui-linux.outputs.deb }}
          TGZ: ${{ needs.gui-linux.outputs.tarball }}
          APPIMAGE: ${{ needs.gui-linux-appimage.outputs.appimage_file }}
        run: |
          set -euo pipefail
          export FETCH_BUDGET=900
          bash .github/scripts/fetch-artifact.sh "$GITHUB_RUN_ID" FASTag-gui-linux-x64-deb a/deb 3 300
          bash .github/scripts/fetch-artifact.sh "$GITHUB_RUN_ID" FASTag-linux-x64-portable a/cli 3 300
          mkdir -p up
          [ "$DEB" = "fastag-gui_${V}_amd64.deb" ] && [ "$TGZ" = "FASTag-$V-gui-linux-x64.tar.gz" ] \
            || { echo "::error::the artifact's files are '$DEB' and '$TGZ', not this version's"; exit 1; }
          mv "a/deb/$DEB" "a/deb/$TGZ" up/
          mv a/cli/FASTag-linux-x64-portable.tar.gz "up/FASTag-$V-linux-x64.tar.gz"
          if [ "$APPIMAGE_OK" = true ]; then
            bash .github/scripts/fetch-artifact.sh "$GITHUB_RUN_ID" FASTag-gui-linux-x64-appimage a/app 3 300
            mv "a/app/$APPIMAGE" up/
          else
            echo "::warning::no AppImage on this release (not built, or it did not launch on both Ubuntu releases)"
          fi
          find up -type f -exec basename {} \; | tools/release_assets.sh check "$V"
          # The AppImage was checked in its own job, on its own architecture
          # (the check extracts it by running it).
          find up -type f ! -name '*.AppImage' -exec bash tools/check_no_appledouble.sh {} +
          bash .github/scripts/release-upload.sh "$ID" up/*
          names=(); for f in up/*; do names+=("$(basename "$f")=$f"); done
          python3 .github/scripts/rc-manifest.py part --job gui-linux-release --group linux-x64 --artifact release \
            --out rel-part-linux-x64.json "${names[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rel-part-linux-x64
          path: rel-part-linux-x64.json
          if-no-files-found: error

  # Attaches the arm64 bundles as gui-linux-release attaches x64: only on a
  # tag, only after the arm64 .deb smoke passed on both Ubuntu releases, the
  # AppImage only when it launched on both. release-complete requires the
  # arm64 .deb and tarball from 1.15.0 on, as it does the x64 ones.
  gui-linux-arm64-release:
    if: ${{ !cancelled() && needs.version.outputs.release != '' && needs.version.outputs.promote != 'true' && needs.build-linux-arm64.result == 'success' && needs.gui-linux-arm64.result == 'success' && needs.gui-linux-arm64-smoke-deb.result == 'success' }}
    needs: [version, build-linux-arm64, gui-linux-arm64, gui-linux-arm64-appimage, gui-linux-arm64-smoke-deb, gui-linux-arm64-smoke-appimage]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            gui/src-tauri/src
            .github/scripts
            tools/release_assets.sh
            tools/check_no_appledouble.sh
          sparse-checkout-cone-mode: false
      - name: The process lifetime of P1 PR b is in this build
        run: |
          grep -rqs 'libc::PR_SET_PDEATHSIG' gui/src-tauri/src || {
            echo "::error::no libc::PR_SET_PDEATHSIG call in gui/src-tauri/src: P1 PR b (process lifetime) must ship with the first Linux release (GUI-DESIGN section 8); not attaching the Linux desktop app"
            exit 1
          }
      # The files the smoke jobs passed, under their release names: the
      # .deb and the GUI tarball, the CLI tarball (the portable one the GUI
      # jobs staged), and the AppImage only when it launched on both Ubuntu
      # releases. Attached by release id, each checked by its digest
      # (release-upload.sh); what went up is recorded for release-complete.
      - name: Attach the Linux arm64 files to the draft
        env:
          ID: ${{ needs.version.outputs.release_id }}
          APPIMAGE_OK: ${{ needs.gui-linux-arm64-smoke-appimage.result == 'success' }}
          DEB: ${{ needs.gui-linux-arm64.outputs.deb }}
          TGZ: ${{ needs.gui-linux-arm64.outputs.tarball }}
          APPIMAGE: ${{ needs.gui-linux-arm64-appimage.outputs.appimage_file }}
        run: |
          set -euo pipefail
          export FETCH_BUDGET=900
          bash .github/scripts/fetch-artifact.sh "$GITHUB_RUN_ID" FASTag-gui-linux-arm64-deb a/deb 3 300
          bash .github/scripts/fetch-artifact.sh "$GITHUB_RUN_ID" FASTag-linux-arm64-portable a/cli 3 300
          mkdir -p up
          [ "$DEB" = "fastag-gui_${V}_arm64.deb" ] && [ "$TGZ" = "FASTag-$V-gui-linux-arm64.tar.gz" ] \
            || { echo "::error::the artifact's files are '$DEB' and '$TGZ', not this version's"; exit 1; }
          mv "a/deb/$DEB" "a/deb/$TGZ" up/
          mv a/cli/FASTag-linux-arm64-portable.tar.gz "up/FASTag-$V-linux-arm64.tar.gz"
          if [ "$APPIMAGE_OK" = true ]; then
            bash .github/scripts/fetch-artifact.sh "$GITHUB_RUN_ID" FASTag-gui-linux-arm64-appimage a/app 3 300
            mv "a/app/$APPIMAGE" up/
          else
            echo "::warning::no AppImage on this release (not built, or it did not launch on both Ubuntu releases)"
          fi
          find up -type f -exec basename {} \; | tools/release_assets.sh check "$V"
          # The AppImage was checked in its own job, on its own architecture
          # (the check extracts it by running it).
          find up -type f ! -name '*.AppImage' -exec bash tools/check_no_appledouble.sh {} +
          bash .github/scripts/release-upload.sh "$ID" up/*
          names=(); for f in up/*; do names+=("$(basename "$f")=$f"); done
          python3 .github/scripts/rc-manifest.py part --job gui-linux-arm64-release --group linux-arm64 --artifact release \
            --out rel-part-linux-arm64.json "${names[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rel-part-linux-arm64
          path: rel-part-linux-arm64.json
          if-no-files-found: error

  # The macOS files, as build-macos made and checked them: the desktop app's
  # disk image and the CLI's (signed, notarized, stapled), or without the
  # signing secrets the CLI tarball. Attached by release id, recorded for
  # release-complete.
  macos-release:
    if: ${{ !cancelled() && needs.version.outputs.release != '' && needs.version.outputs.promote != 'true' && needs.build-macos.result == 'success' }}
    needs: [version, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            tools/release_assets.sh
          sparse-checkout-cone-mode: false
      - name: Attach the macOS files to the draft
        env:
          ID: ${{ needs.version.outputs.release_id }}
          SIGNED: ${{ needs.build-macos.outputs.signed }}
        run: |
          set -euo pipefail
          export FETCH_BUDGET=900
          mkdir -p up
          if [ "$SIGNED" = true ]; then
            bash .github/scripts/fetch-artifact.sh "$GITHUB_RUN_ID" FASTag-gui-macos-arm64-dmg a/gui 3 300
            bash .github/scripts/fetch-artifact.sh "$GITHUB_RUN_ID" FASTag-macos-arm64-cli-dmg a/cli 3 300
            mv "a/gui/FASTag-$V-gui-macos-arm64.dmg" "a/cli/FASTag-$V-macos-arm64.dmg" up/
          else
            echo "::warning::no macOS signing secrets: the CLI ships as a tarball, the desktop app not at all"
            bash .github/scripts/fetch-artifact.sh "$GITHUB_RUN_ID" FASTag-macos-arm64-tarball a/tgz 3 300
            mv "a/tgz/FASTag-$V-macos-arm64.tar.gz" up/
          fi
          find up -type f -exec basename {} \; | tools/release_assets.sh check "$V"
          bash .github/scripts/release-upload.sh "$ID" up/*
          names=(); for f in up/*; do names+=("$(basename "$f")=$f"); done
          python3 .github/scripts/rc-manifest.py part --job macos-release --group macos-arm64 --artifact release \
            --out rel-part-macos.json "${names[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rel-part-macos
          path: rel-part-macos.json
          if-no-files-found: error

  # ----------------------------------------- GUI argv against the real CLI
  # GUI-DESIGN section 9, "Re-enabled (P1)": gui/src/adversarial/
  # cli-consistency.test.tsx (20 tests, skipped in the gui job, which has no
  # CLI) runs the real App's run requests through the shipped build_args and
  # the FASTag CLI, with the pipe-order helper order_rs, both cargo examples
  # in gui/src-tauri/examples. Run on PRs as well as release validation: the
  # current GUI must work with the current CLI before merging. Both are built
  # from this checkout. release-complete also requires this job to pass.
  gui-cli-consistency:
    if: ${{ !cancelled() && needs.version.outputs.promote != 'true' && (github.event_name == 'pull_request' || needs.version.outputs.release != '' || inputs.gui_dry_run) && needs.version.outputs.code != 'false' }}
    needs: [version, build-linux-x64]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FASTag-linux-x64-portable
          path: ${{ runner.temp }}/cli
      - name: Unpack the portable CLI
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/cli/FASTag-linux-x64-portable.tar.gz" -C "$RUNNER_TEMP/cli"
          rm -f "$RUNNER_TEMP/cli/FASTag-linux-x64-portable.tar.gz"
          B="$RUNNER_TEMP/cli/FASTag/FASTag"
          want=$(sed -n 's/^project(FASTag VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          "$B" --help 2>&1 | grep -q "^Version: $want" || { echo "::error::the portable CLI does not report version $want"; exit 1; }
          echo "FASTAG_BIN=$B" >> "$GITHUB_ENV"
      # PR bundles omit the large reference data. The Characterize and
      # species tests still exercise the real default index, never a mock.
      - name: Supply the pinned taxonomy for non-release bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cli/FASTag"
          if [ ! -s "$root/share-FASTag-taxonomy/tax_k7.taxdb" ]; then
            mkdir -p "$RUNNER_TEMP/taxdb"
            gh release download "$TAXDB_TAG" --repo "$GITHUB_REPOSITORY" -p 'FASTag-taxonomy-k7.tar.gz' -D "$RUNNER_TEMP/taxdb"
            archive="$RUNNER_TEMP/taxdb/FASTag-taxonomy-k7.tar.gz"
            echo "$TAXDB_SHA256  $archive" | sha256sum --check --status
            # linux-1: the pinned tarball was packed on a Mac; GNU tar would unpack its
            # AppleDouble files (._*) into every package. bsdtar turns them into xattrs.
            tar --exclude='._*' -xzf "$archive" -C "$root"
          fi
          test -s "$root/share-FASTag-taxonomy/tax_k7.taxdb"
          cp data/taxonomy/species_call.tsv "$root/share-FASTag-taxonomy/"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Tauri build deps (the examples link fastag_lib)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev
      - name: Build build_args and order_rs
        working-directory: gui/src-tauri
        run: |
          mkdir -p resources/fastag
          cargo build --examples
          test -x target/debug/examples/build_args
          test -x target/debug/examples/order_rs
      - name: cli-consistency (vitest, real CLI)
        working-directory: gui
        run: |
          set -euo pipefail
          npm ci
          npx vitest run src/adversarial/cli-consistency.test.tsx --reporter=default --reporter=json --outputFile.json=cli-consistency.json
          # Skipped is not passed: the file skips itself when anything it
          # needs is missing, and a skipped suite would leave this job green.
          node - <<'JS'
          const r = require(process.cwd() + '/cli-consistency.json')
          const msg = `cli-consistency: ${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numPendingTests + r.numTodoTests} skipped`
          console.log(msg)
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### ${msg} (FASTag CLI ${process.env.FASTAG_BIN})\n`)
          if (r.numPassedTests < 20 || r.numFailedTests || r.numPendingTests || r.numTodoTests) process.exit(1)
          JS

  # ---------------------------------------------------- release data asset
  # Copies the pinned taxonomy tarball onto the new release as a standalone
  # asset (index-only upgrades, GUI bundling, the README download). Its own
  # job, independent of every platform leg: a platform failure must not leave
  # a release without the asset. Creates the release if it is first to arrive
  # (same harmless-race pattern as the attach steps).
  taxonomy-asset:
    if: (needs.version.outputs.release != '' && needs.version.outputs.promote != 'true') || (inputs.gui_dry_run && inputs.gui_full_payload)
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/taxonomy_release_asset.sh
            tools/check_taxonomy_manifest.py
            data/taxonomy/manifests
            .github/scripts
          sparse-checkout-cone-mode: false
      # The data tag's asset keeps its fixed name (FASTag-taxonomy-k7.tar.gz:
      # assets under a data tag are never mutated); the copy on this release
      # is FASTag-<version>-taxonomy-k7.tar.gz (+ .tar.xz, + .sha256 each),
      # with share-FASTag-taxonomy/MANIFEST.json inside: the tarball's own,
      # or for the index of 2026-09-01, which predates it, the reconstructed
      # data/taxonomy/manifests/<TAXDB_TAG>.json. Every pinned file comes out
      # of both archives byte for byte (tools/taxonomy_release_asset.sh). The
      # .tar.xz (xz -9, about 240 MB against 450) is made here rather than on
      # the data tag, whose assets are never mutated. The .tar.gz stays: the
      # CLI's own "index missing" message, the README and installs scripted
      # against 1.11.0 name it.
      - name: Copy the pinned taxonomy asset onto this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -q pigz > /dev/null || echo "::warning::no pigz; the .tar.gz is made by gzip"
          gh release download "$TAXDB_TAG" -p 'FASTag-taxonomy-k7.tar.gz' -D "$RUNNER_TEMP/pinned"
          got=$(sha256sum "$RUNNER_TEMP/pinned/FASTag-taxonomy-k7.tar.gz" | cut -d' ' -f1)
          [ "$got" = "$TAXDB_SHA256" ] || { echo "taxonomy sha256 mismatch: $got"; exit 1; }
          bash tools/taxonomy_release_asset.sh "$RUNNER_TEMP/pinned/FASTag-taxonomy-k7.tar.gz" \
            "data/taxonomy/manifests/$TAXDB_TAG.json" "$V"
          rm -rf "$RUNNER_TEMP/pinned"
          N="FASTag-${V}-taxonomy-k7"
          if [ "$RC_CANDIDATE" = true ]; then
            # A release candidate keeps the four files as an artifact.
            python3 .github/scripts/rc-manifest.py part --job taxonomy-asset --group taxonomy \
              --artifact FASTag-taxonomy-asset --out rc-part-taxonomy.json \
              "$N.tar.gz=$N.tar.gz" "$N.tar.gz.sha256=$N.tar.gz.sha256" "$N.tar.xz=$N.tar.xz" "$N.tar.xz.sha256=$N.tar.xz.sha256"
            exit 0
          fi
          # Attached to the draft by id, digests checked, and recorded for
          # release-complete.
          bash .github/scripts/release-upload.sh "${{ needs.version.outputs.release_id }}" \
            "$N.tar.gz" "$N.tar.gz.sha256" "$N.tar.xz" "$N.tar.xz.sha256"
          python3 .github/scripts/rc-manifest.py part --job taxonomy-asset --group taxonomy --artifact release \
            --out rel-part-taxonomy.json \
            "$N.tar.gz=$N.tar.gz" "$N.tar.gz.sha256=$N.tar.gz.sha256" "$N.tar.xz=$N.tar.xz" "$N.tar.xz.sha256=$N.tar.xz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: env.RC_CANDIDATE != 'true'
        with:
          name: rel-part-taxonomy
          path: rel-part-taxonomy.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: env.RC_CANDIDATE == 'true'
        with:
          name: FASTag-taxonomy-asset
          path: FASTag-*-taxonomy-k7.tar.*
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: env.RC_CANDIDATE == 'true'
        with:
          name: rc-part-taxonomy
          path: rc-part-taxonomy.json
          if-no-files-found: error

  # ------------------------------------------------- prebuilt OpenMS
  # The OpenMS installs the build jobs staged, as immutable assets of the
  # deps release deps-openms-<OPENMS_REF, 8> (created here as a PRERELEASE,
  # never Latest, at this commit; existing assets are never replaced). Only
  # main and v* tag pushes: no pull request or dispatch ever writes it.
  deps-openms:
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [build-linux-x64, build-linux-arm64, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 10
        with:
          pattern: openms-prebuilt-*
          path: prebuilt
          merge-multiple: true
      - name: Upload what the deps release lacks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(prebuilt/*.tar.gz)
          [ ${#files[@]} -gt 0 ] || { echo "nothing staged: the deps release has every install"; exit 0; }
          rel=${OPENMS_DEPS_RELEASE:-deps-openms-${OPENMS_REF:0:8}}
          if ! gh release view "$rel" > /dev/null 2>&1; then
            gh release create "$rel" --prerelease --latest=false --target "$GITHUB_SHA" --title "$rel" \
              --notes "OpenMS $OPENMS_REF, built for FASTag's CI (one install per platform and toolchain, the actions/cache key as the file name, with its sha256). Not a FASTag release." \
              || gh release view "$rel" > /dev/null
          fi
          have=$(gh release view "$rel" --json assets,isPrerelease --jq '.assets[].name')
          [ "$(gh release view "$rel" --json isPrerelease --jq .isPrerelease)" = true ] || { echo "::error::$rel is not a prerelease"; exit 1; }
          for f in "${files[@]}"; do
            n=$(basename "$f")
            if grep -qxF "$n" <<< "$have"; then echo "$rel has $n"; continue; fi
            gh release upload "$rel" "$f" "$f.sha256"
            echo "- uploaded $n to $rel" >> "$GITHUB_STEP_SUMMARY"
          done

  # ------------------------------------------------- Rust dependency cache
  # The release profile's compiled dependencies for the Tauri builds, saved
  # ONLY from main pushes (a branch's or a dispatch's cache would only crowd
  # the 10 GB the OpenMS caches live in; branches and tags restore main's,
  # GitHub's cache scoping). Dependencies only: the app crate (fastag) and
  # everything bundle- or resource-related stay out. Nothing to do -- a
  # lookup of about a second -- unless Cargo.lock or the toolchain changed.
  cargo-warm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Cargo cache key
        id: cargo-key
        shell: bash
        run: echo "key=cargo-release-${{ runner.os }}-${{ runner.arch }}-${ImageOS:-img}-$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Is it there already?
        id: exact
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          lookup-only: true
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            gui/src-tauri/target/release/deps
            gui/src-tauri/target/release/build
            gui/src-tauri/target/release/.fingerprint
            !gui/src-tauri/target/release/deps/*fastag*
            !gui/src-tauri/target/release/build/fastag-*
            !gui/src-tauri/target/release/.fingerprint/fastag-*
          key: ${{ steps.cargo-key.outputs.key }}-${{ hashFiles('gui/src-tauri/Cargo.lock') }}
      - name: Restore the newest one of this toolchain
        if: steps.exact.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            gui/src-tauri/target/release/deps
            gui/src-tauri/target/release/build
            gui/src-tauri/target/release/.fingerprint
            !gui/src-tauri/target/release/deps/*fastag*
            !gui/src-tauri/target/release/build/fastag-*
            !gui/src-tauri/target/release/.fingerprint/fastag-*
          key: ${{ steps.cargo-key.outputs.key }}-${{ hashFiles('gui/src-tauri/Cargo.lock') }}
          restore-keys: ${{ steps.cargo-key.outputs.key }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.exact.outputs.cache-hit != 'true'
        with:
          node-version: 24
      - name: Tauri build deps (Linux)
        if: steps.exact.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev
      # The release build of the app, as the packaging jobs make it (tauri
      # build: the same profile, features and deployment target), without the
      # bundle and with empty resources.
      - name: Build the app's dependencies (release profile)
        if: steps.exact.outputs.cache-hit != 'true'
        working-directory: gui
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MACOS_MIN_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/fastag
          npm ci --ignore-scripts
          npx tauri build --no-bundle
          du -sh src-tauri/target/release/deps src-tauri/target/release/build ~/.cargo/registry || true
      - name: Save the Cargo cache
        if: steps.exact.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            gui/src-tauri/target/release/deps
            gui/src-tauri/target/release/build
            gui/src-tauri/target/release/.fingerprint
            !gui/src-tauri/target/release/deps/*fastag*
            !gui/src-tauri/target/release/build/fastag-*
            !gui/src-tauri/target/release/.fingerprint/fastag-*
          key: ${{ steps.cargo-key.outputs.key }}-${{ hashFiles('gui/src-tauri/Cargo.lock') }}

  # ---------------------------------------------------------- release notes
  # The release body is the CHANGELOG.md section of the tag's version
  # (tools/release_notes.py), not "release notes pending" (1.15.0 went out
  # with that placeholder). Whichever job creates the release first uses a
  # placeholder; this job then sets the body, creating the release itself if
  # it is first. A tag whose version has no CHANGELOG section, or whose
  # CITATION.cff / codemeta.json name another release, is red here. A
  # manual dispatch only renders the notes into the job summary.
  release-notes:
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    needs: [version]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            CITATION.cff
            codemeta.json
            tools/release_notes.py
            tools/check_citation_metadata.py
          sparse-checkout-cone-mode: false
      # CITATION.cff and codemeta.json must name the tag's version, its
      # CHANGELOG date and its release URLs, or "Cite this repository" cites
      # the previous release.
      - name: Citation metadata names this release
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user --break-system-packages pyyaml
          python3 tools/check_citation_metadata.py "$V" .
      - name: Release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.version.outputs.version }}
          # The notes are written only by the tag push that publishes.
          TAG: ${{ needs.version.outputs.publish == 'true' && needs.version.outputs.release || '' }}
          ID: ${{ needs.version.outputs.release_id }}
        run: |
          set -euo pipefail
          python3 tools/release_notes.py "$V" CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          { echo "### Release notes for $V (from CHANGELOG.md)"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$TAG" ]; then
            echo "not a tag: notes rendered into the job summary only"
            exit 0
          fi
          # By id: the draft job version made.
          gh api -X PATCH "repos/$GH_REPO/releases/$ID" -F "body=@$RUNNER_TEMP/notes.md" --jq .body | head -3
      # Ask Software Heritage to archive the repository with this tag. Not
      # blocking: the archive's queue or rate limit must not fail a release.
      - name: Request a Software Heritage save
        if: needs.version.outputs.publish == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 -X POST \
            "https://archive.softwareheritage.org/api/1/origin/save/git/url/https://github.com/okohlbacher/FASTag/" \
            | tee "$RUNNER_TEMP/swh-save.json"
          echo "- Software Heritage save requested: $(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("save_request_status"), d.get("save_task_status"))' "$RUNNER_TEMP/swh-save.json")" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------ release candidate
  # A gui_dry_run + gui_full_payload dispatch is a release CANDIDATE (see
  # RC_CANDIDATE): this job runs when every gate of the run passed -- both
  # suites, every build, the .deb smoke tests with the real-CLI specs, the
  # macOS images notarized, stapled, mounted and started, the GUI's argv
  # against the CLI, the taxonomy asset and the release notes -- and merges
  # the parts the producing jobs wrote into manifest.json: tree, commit,
  # version, run and attempt, every file's artifact, size and sha256. An
  # AppImage enters only when it launched on both Ubuntu releases, as on a
  # tag. A v* tag of the same tree promotes exactly these files (job
  # version, promote-assets).
  release-candidate:
    name: release candidate
    if: ${{ !cancelled() && inputs.gui_dry_run && inputs.gui_full_payload }}
    needs: [version, test, test-macos, build-linux-x64, build-linux-arm64, build-macos, gui-linux, gui-linux-arm64,
            gui-linux-smoke-deb, gui-linux-arm64-smoke-deb, gui-linux-appimage, gui-linux-arm64-appimage,
            gui-linux-smoke-appimage, gui-linux-arm64-smoke-appimage, gui-cli-consistency, taxonomy-asset, release-notes,
            gui, gui-windows, tauri-driver]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Every gate passed
        env:
          RESULTS: >-
            test=${{ needs.test.result }} test-macos=${{ needs.test-macos.result }}
            build-linux-x64=${{ needs.build-linux-x64.result }} build-linux-arm64=${{ needs.build-linux-arm64.result }}
            build-macos=${{ needs.build-macos.result }} gui-linux=${{ needs.gui-linux.result }}
            gui-linux-arm64=${{ needs.gui-linux-arm64.result }} gui-linux-smoke-deb=${{ needs.gui-linux-smoke-deb.result }}
            gui-linux-arm64-smoke-deb=${{ needs.gui-linux-arm64-smoke-deb.result }}
            gui-cli-consistency=${{ needs.gui-cli-consistency.result }} taxonomy-asset=${{ needs.taxonomy-asset.result }}
            release-notes=${{ needs.release-notes.result }}
            gui=${{ needs.gui.result }} gui-windows=${{ needs.gui-windows.result }} tauri-driver=${{ needs.tauri-driver.result }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [ "${r#*=}" = success ] || { echo "::error::${r%%=*} was ${r#*=}: no release candidate"; exit 1; }
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 10
        with:
          pattern: rc-part-*
          path: parts
          merge-multiple: true
      - name: Write the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE_X64: ${{ needs.gui-linux-smoke-appimage.result }}
          APPIMAGE_ARM64: ${{ needs.gui-linux-arm64-smoke-appimage.result }}
        run: |
          set -euo pipefail
          # An AppImage only when it launched on both Ubuntu releases.
          [ "$APPIMAGE_X64" = success ] || rm -f parts/rc-part-gui-linux-x64-appimage.json
          [ "$APPIMAGE_ARM64" = success ] || rm -f parts/rc-part-gui-linux-arm64-appimage.json
          find parts -type f
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          wid=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          req=()
          for f in "FASTag-$V-linux-x64.tar.gz" "FASTag-$V-linux-arm64.tar.gz" \
                   "FASTag-$V-macos-arm64.dmg" "FASTag-$V-gui-macos-arm64.dmg" \
                   "fastag-gui_${V}_amd64.deb" "FASTag-$V-gui-linux-x64.tar.gz" \
                   "fastag-gui_${V}_arm64.deb" "FASTag-$V-gui-linux-arm64.tar.gz" \
                   "FASTag-$V-taxonomy-k7.tar.gz" "FASTag-$V-taxonomy-k7.tar.gz.sha256" \
                   "FASTag-$V-taxonomy-k7.tar.xz" "FASTag-$V-taxonomy-k7.tar.xz.sha256"; do
            req+=(--require "$f")
          done
          mkdir -p rc
          python3 .github/scripts/rc-manifest.py merge --out rc/manifest.json "${req[@]}" \
            --meta "tree=$tree" --meta "version=$V" --meta "run_id=$GITHUB_RUN_ID" --meta "run_attempt=$GITHUB_RUN_ATTEMPT" \
            --meta "workflow_id=$wid" --meta "workflow=$GITHUB_WORKFLOW" --meta "commit=$GITHUB_SHA" --meta "ref=$GITHUB_REF" \
            --meta macos_signed=true parts/*.json
          { echo "### Release candidate $V (tree \`$tree\`)"; echo; echo '| file | sha256 |'; echo '|---|---|'
            python3 .github/scripts/rc-manifest.py list rc/manifest.json | awk -F'\t' '{ print "| " $3 " | `" $4 "` |" }'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-manifest
          path: rc/manifest.json
          retention-days: 30
          if-no-files-found: error

  # ------------------------------------------------------ promotion
  # On a v* tag (or a promote_to dry run) whose tree has a release candidate
  # (job version): the manifest job version selected (its sha256 checked,
  # verified again for this tree, version, run, attempt and workflow), the
  # candidate's files downloaded from its run, each checked against the
  # manifest, attached to the draft by id (digests checked), and staged as
  # this run's artifacts for the smoke jobs, which then need only read access.
  promote-assets:
    if: needs.version.outputs.promote == 'true'
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      RUN: ${{ needs.version.outputs.candidate_run }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            tools/release_assets.sh
          sparse-checkout-cone-mode: false
      - name: Fetch the candidate's files and check every byte
        env:
          MSHA: ${{ needs.version.outputs.manifest_sha256 }}
          ATTEMPT: ${{ needs.version.outputs.candidate_attempt }}
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          export FETCH_BUDGET=1500
          bash .github/scripts/fetch-artifact.sh "$RUN" release-candidate-manifest "$RUNNER_TEMP/m" 3 120
          M="$RUNNER_TEMP/m/manifest.json"
          got=$(sha256sum "$M" | cut -d' ' -f1)
          [ "$got" = "$MSHA" ] || { echo "::error::the manifest is not the one job version selected ($got, not $MSHA)"; exit 1; }
          tree=$(gh api "repos/$GH_REPO/git/commits/$GITHUB_SHA" --jq .tree.sha)
          wid=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          python3 .github/scripts/rc-manifest.py verify "$M" --tree "$tree" --version "$V" --run-id "$RUN" \
            --workflow-id "$wid" --meta "run_attempt=$ATTEMPT" --meta macos_signed=true
          echo "MANIFEST=$M" >> "$GITHUB_ENV"
          pids=()
          for a in $(python3 .github/scripts/rc-manifest.py list "$M" | cut -f1 | sort -u); do
            bash .github/scripts/fetch-artifact.sh "$RUN" "$a" "$RUNNER_TEMP/a/$a" 3 900 & pids+=($!)
          done
          for p in "${pids[@]}"; do wait "$p"; done
          python3 .github/scripts/rc-manifest.py check "$M" --dir "$RUNNER_TEMP/a" --out promoted
          rm -rf "$RUNNER_TEMP/a"
          find promoted -type f -exec basename {} \; | tools/release_assets.sh check "$V"
      - name: Attach them to the draft by id and check its digests
        env:
          ID: ${{ needs.version.outputs.release_id }}
        run: |
          set -euo pipefail
          # Six uploads at a time (each replaces its own name, checks its digest).
          find promoted -type f -print0 | xargs -0 -P 6 -n 1 bash .github/scripts/release-upload.sh "$ID"
          gh api "repos/$GH_REPO/releases/$ID" > "$RUNNER_TEMP/release.json"
          python3 .github/scripts/rc-manifest.py release "$MANIFEST" "$RUNNER_TEMP/release.json"
          cp "$MANIFEST" promoted-manifest.json
          mkdir -p smoke/linux-x64 smoke/linux-arm64 smoke/macos
          cp promoted/fastag-gui_*_amd64.deb promoted/FASTag-*-gui-linux-x64.tar.gz smoke/linux-x64/
          cp promoted/fastag-gui_*_arm64.deb promoted/FASTag-*-gui-linux-arm64.tar.gz smoke/linux-arm64/
          cp promoted/FASTag-*-macos-arm64.dmg smoke/macos/
          echo "### Promoted $(find promoted -type f | wc -l) files of candidate run $RUN onto release $ID (draft), each digest as in the manifest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: promoted-manifest
          path: promoted-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: promoted-linux-x64-gui
          path: smoke/linux-x64
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: promoted-linux-arm64-gui
          path: smoke/linux-arm64
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: promoted-macos-arm64
          path: smoke/macos
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  # The .deb smoke jobs' steps on the promoted .deb and tarball (the bytes
  # promote-assets attached and checked, staged as promoted-linux-<arch>-gui),
  # on both Ubuntu releases and both architectures, with read access only.
  # The AppImages and the other files were launched and checked in the
  # candidate run, and their digests on the release are the candidate's.
  promoted-smoke-deb:
    name: promoted .deb on ${{ matrix.os }}
    if: needs.version.outputs.promote == 'true'
    needs: [version, promote-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, arch: x64, deb_arch: amd64}
          - {os: ubuntu-24.04, arch: x64, deb_arch: amd64}
          - {os: ubuntu-22.04-arm, arch: arm64, deb_arch: arm64}
          - {os: ubuntu-24.04-arm, arch: arm64, deb_arch: arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      GUI_ARCH: ${{ matrix.arch }}
      DEB: fastag-gui_${{ needs.version.outputs.version }}_${{ matrix.deb_arch }}.deb
      TGZ: FASTag-${{ needs.version.outputs.version }}-gui-linux-${{ matrix.arch }}.tar.gz
      SMOKE_ARTIFACT: promoted-linux-${{ matrix.arch }}-gui
    steps: *gui-linux-smoke-deb-steps

  # The promoted macOS images (staged by promote-assets), checked as a user
  # gets them: tickets stapled and valid, Gatekeeper's assessment, the app
  # mounted and started (its self-test runs the bundled CLI), the CLI image's
  # CLI reporting this version, the pinned index in both. Read access only;
  # the token is only in the download step, never beside the app.
  promoted-smoke-macos:
    name: promoted macOS images
    if: needs.version.outputs.promote == 'true'
    needs: [version, promote-assets]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # tools/ whole: check_bundle_notices.sh runs vendor_bundle.py beside it.
          sparse-checkout: |
            CMakeLists.txt
            tools
            data/taxonomy/manifests
            .github/scripts
          sparse-checkout-cone-mode: false
      - name: Fetch the promoted images
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-artifact.sh "$GITHUB_RUN_ID" promoted-macos-arm64 "$RUNNER_TEMP/d" 3 600
      - name: The promoted disk images
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/d"
          want=$(sed -n 's/^project(FASTag VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          PIN="data/taxonomy/manifests/$TAXDB_TAG.json"
          for dmg in "$D/FASTag-$V-gui-macos-arm64.dmg" "$D/FASTag-$V-macos-arm64.dmg"; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          done
          MNT="$RUNNER_TEMP/gui"; mkdir -p "$MNT"
          PAGER='cat' hdiutil attach "$D/FASTag-$V-gui-macos-arm64.dmg" -readonly -nobrowse -noautoopen -mountpoint "$MNT" < <(yes) > /dev/null
          trap 'hdiutil detach "$MNT" -force >/dev/null 2>&1 || true' EXIT
          apps=("$MNT"/*.app); app=${apps[0]}
          codesign --verify --deep --strict --verbose=2 "$app"
          CLI="$app/Contents/Resources/resources/fastag/bin/FASTag"
          bash tools/check_bundle_notices.sh "$(dirname "$(dirname "$CLI")")"
          python3 tools/check_taxonomy_manifest.py --pinned "$PIN" "$(dirname "$(dirname "$CLI")")/share/FASTag/taxonomy"
          env -i HOME="$HOME" "$CLI" --help 2>&1 | grep -q "^Version: $want" || { echo "::error::the app's CLI does not report $want"; exit 1; }
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          st="$RUNNER_TEMP/selftest.json"
          if ! FASTAG_SELFTEST_OUT="$st" perl -e 'alarm 180; exec @ARGV or die "exec: $!"' "$exe" > "$RUNNER_TEMP/selftest.log" 2>&1 \
             || ! grep -q '"ok": true' "$st"; then
            cat "$st" "$RUNNER_TEMP/selftest.log" 2>/dev/null; echo "::error::the promoted app did not run its bundled CLI"; exit 1
          fi
          hdiutil detach "$MNT"; trap - EXIT
          CM="$RUNNER_TEMP/cli"; mkdir -p "$CM"
          PAGER='cat' hdiutil attach "$D/FASTag-$V-macos-arm64.dmg" -readonly -nobrowse -noautoopen -mountpoint "$CM" < <(yes) > /dev/null
          ok=yes
          python3 tools/check_taxonomy_manifest.py --pinned "$PIN" "$CM/FASTag/share-FASTag-taxonomy" || ok=no
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$CM/FASTag/FASTag" --help 2>&1 | grep -q "^Version: $want" || ok=no
          hdiutil detach "$CM" -force > /dev/null 2>&1 || true
          [ "$ok" = yes ] || { echo "::error::the promoted CLI image does not carry the index or does not run"; exit 1; }
          echo "### promoted macOS images: stapled, assessed, the app starts and runs its CLI, the CLI image runs" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------- release completeness
  # No more silently partial releases: v0.19.1 went out with no linux-x64
  # tarball and nobody noticed. Red when any asset THIS workflow owns is
  # missing after all legs finish. The Windows zip is asserted by the mirror
  # job at the end of windows.yml instead -- that workflow is the long pole,
  # so by its end every asset should exist and it checks the FULL list.
  # Non-destructive: the release stays up; the red run is the signal.
  release-complete:
    # !cancelled(), not always(): a cancelled run must not publish.
    if: ${{ !cancelled() && needs.version.outputs.release != '' && needs.version.result == 'success' }}
    needs: [version, test, test-macos, build-linux-x64, build-linux-arm64, build-macos, taxonomy-asset, release-notes,
            gui-linux, gui-linux-arm64, gui-linux-smoke-deb, gui-linux-arm64-smoke-deb,
            gui-linux-release, gui-linux-arm64-release, macos-release, gui-cli-consistency, gui, gui-windows, tauri-driver,
            promote-assets, promoted-smoke-deb, promoted-smoke-macos]
    runs-on: ubuntu-24.04
    # 120: the bounded wait for windows.yml's gates (90 minutes) and the checks.
    timeout-minutes: 120
    # write: the release is a draft (visible only with write access) until
    # the last step publishes it.
    permissions:
      contents: write
      actions: read
    env:
      V: ${{ needs.version.outputs.version }}
      REL: ${{ needs.version.outputs.release }}
      ID: ${{ needs.version.outputs.release_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            CMakeLists.txt
            tools/release_assets.sh
            .github/scripts
          sparse-checkout-cone-mode: false
      # Every job that made, checked or attached a file of this release
      # succeeded: on a promoted release the promotion and its smoke jobs (the
      # candidate passed every gate, or it would have no manifest); on a
      # rebuilt one the suites (or an identical tree's, tested-tree.sh), the
      # builds, the smoke jobs, the uploaders and the unit-test jobs. An asset
      # left by an earlier attempt can never stand in for a failed job.
      - name: Every job of this release passed
        env:
          PROMOTED: ${{ needs.version.outputs.promote }}
          PUBLISH: ${{ needs.version.outputs.publish }}
          PROMOTION: >-
            promote-assets=${{ needs.promote-assets.result }} promoted-smoke-deb=${{ needs.promoted-smoke-deb.result }}
            promoted-smoke-macos=${{ needs.promoted-smoke-macos.result }}
          REBUILD: >-
            test=${{ needs.test.result }} test-macos=${{ needs.test-macos.result }}
            build-linux-x64=${{ needs.build-linux-x64.result }} build-linux-arm64=${{ needs.build-linux-arm64.result }}
            build-macos=${{ needs.build-macos.result }} gui-linux=${{ needs.gui-linux.result }}
            gui-linux-arm64=${{ needs.gui-linux-arm64.result }} gui-linux-smoke-deb=${{ needs.gui-linux-smoke-deb.result }}
            gui-linux-arm64-smoke-deb=${{ needs.gui-linux-arm64-smoke-deb.result }}
            gui-linux-release=${{ needs.gui-linux-release.result }} gui-linux-arm64-release=${{ needs.gui-linux-arm64-release.result }}
            macos-release=${{ needs.macos-release.result }} taxonomy-asset=${{ needs.taxonomy-asset.result }}
            gui-cli-consistency=${{ needs.gui-cli-consistency.result }}
            gui=${{ needs.gui.result }} gui-windows=${{ needs.gui-windows.result }} tauri-driver=${{ needs.tauri-driver.result }}
          NOTES: release-notes=${{ needs.release-notes.result }}
        run: |
          set -u
          list=$REBUILD; [ "$PROMOTED" = true ] && list=$PROMOTION
          [ "$PUBLISH" = true ] && list="$list $NOTES"
          echo "$list"
          for r in $list; do
            [ "${r#*=}" = success ] || { echo "::error::${r%%=*} was ${r#*=}: not publishing"; exit 1; }
          done
      # What this workflow's part of the release is, file by file with its
      # sha256: the candidate's manifest (the one job version selected), or
      # what this run's uploaders attached.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.version.outputs.promote != 'true'
        timeout-minutes: 10
        with:
          pattern: rel-part-*
          path: expect/parts
          merge-multiple: true
      - name: This workflow's files
        env:
          PROMOTED: ${{ needs.version.outputs.promote }}
          RUN: ${{ needs.version.outputs.candidate_run }}
          MSHA: ${{ needs.version.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p expect
          if [ "$PROMOTED" = true ]; then
            bash .github/scripts/fetch-artifact.sh "$RUN" release-candidate-manifest "$RUNNER_TEMP/m" 3 120
            [ "$(sha256sum "$RUNNER_TEMP/m/manifest.json" | cut -d' ' -f1)" = "$MSHA" ] || { echo "::error::not the selected manifest"; exit 1; }
            cp "$RUNNER_TEMP/m/manifest.json" expect/unix.json
          else
            jq -s '{files: (map(.files) | add)}' expect/parts/*.json > expect/unix.json
          fi
          jq -r '.files[] | "\(.sha256)  \(.name)"' expect/unix.json
          # The files every release of this version carries from this
          # workflow (the AppImages are best-effort: in the set only when they
          # launched and were attached, and then exactly those bytes).
          missing=0
          for a in "FASTag-$V-linux-x64.tar.gz" "FASTag-$V-linux-arm64.tar.gz" \
                   "FASTag-$V-macos-arm64.dmg" "FASTag-$V-gui-macos-arm64.dmg" \
                   "fastag-gui_${V}_amd64.deb" "FASTag-$V-gui-linux-x64.tar.gz" \
                   "fastag-gui_${V}_arm64.deb" "FASTag-$V-gui-linux-arm64.tar.gz" \
                   "FASTag-$V-taxonomy-k7.tar.gz" "FASTag-$V-taxonomy-k7.tar.gz.sha256" \
                   "FASTag-$V-taxonomy-k7.tar.xz" "FASTag-$V-taxonomy-k7.tar.xz.sha256"; do
            jq -e --arg n "$a" '.files | any(.name == $n)' expect/unix.json > /dev/null || { echo "MISSING: $a"; missing=1; }
          done
          exit $missing
      # The one publisher waits (bounded) for windows.yml: its run for this
      # commit passed its gates and left its two files' digests
      # (wait-release-gates.sh). No gates in time, or a failed Windows run:
      # the release stays a draft.
      - name: Wait for windows.yml's release gates
        env:
          WAIT_S: ${{ needs.version.outputs.publish == 'true' && '5400' || '3600' }}
        run: bash .github/scripts/wait-release-gates.sh windows.yml "$REL" expect/windows "$WAIT_S"
      # Exactly these files, nothing else: the draft's assets against the
      # union of this workflow's set and windows.yml's, name, size and
      # sha256. An asset of neither (left by an earlier attempt or another
      # tree) is removed from the DRAFT and the check repeated; a missing
      # file or another digest fails the run.
      - name: The release holds exactly the gated files
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$ID" > "$RUNNER_TEMP/release.json"
          [ "$(jq -r .draft "$RUNNER_TEMP/release.json")" = true ] || { echo "::error::release $ID is not a draft"; exit 1; }
          if ! python3 .github/scripts/rc-manifest.py inventory "$RUNNER_TEMP/release.json" expect/unix.json expect/windows/gates.json \
               --unexpected-out "$RUNNER_TEMP/extra"; then
            [ -s "$RUNNER_TEMP/extra" ] || exit 1
            while read -r aid; do
              echo "removing asset $aid from the draft (not a file of this release)"
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$aid"
            done < "$RUNNER_TEMP/extra"
            gh api "repos/$GH_REPO/releases/$ID" > "$RUNNER_TEMP/release.json"
            python3 .github/scripts/rc-manifest.py inventory "$RUNNER_TEMP/release.json" expect/unix.json expect/windows/gates.json
          fi
          jq -r '.assets[].name' "$RUNNER_TEMP/release.json" | tools/release_assets.sh check "$V"
          echo "### $REL: $(jq '.assets | length' "$RUNNER_TEMP/release.json") files, exactly the gated ones (Unix and Windows), every digest checked" >> "$GITHUB_STEP_SUMMARY"
      # Published only now, by id, with the whole release on it and checked:
      # until here it was a draft nobody else could see. Only a tag push.
      - name: Publish the release
        if: needs.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GH_REPO/releases/$ID" -F draft=false --jq '"published: \(.html_url) (draft \(.draft))"'

  # ------------------------------------------------- Homebrew tap (macOS)
  # okohlbacher/homebrew-fastag carries two casks (fastag = the desktop app,
  # fastag-cli = the command line) that download this release's two macOS
  # disk images per architecture (Apple silicon only in 1.8.0-1.14.x; Intel
  # again from 1.15, which needs the tap's arch-dependent url). Its own workflow rewrites
  # version + sha256, audits, installs and commits when this job dispatches
  # it. Dispatching needs a fine-grained PAT (secret HOMEBREW_TAP_TOKEN:
  # repository access ONLY okohlbacher/homebrew-fastag, permission
  # "Actions: Read and write") because GITHUB_TOKEN is scoped to this
  # repository and cannot dispatch a workflow in another one.
  #
  # Ordering: both casked images are built by THIS workflow, and
  # release-complete asserts they are on the release, so gating on it is
  # enough -- the Windows zip (windows.yml) is not part of any cask.
  #
  # FAILS LOUDLY. Up to 1.11.0 a missing token was only a ::notice and the job
  # went green, relying on the tap's 6-hourly schedule; the secret was never
  # set, so every release waited up to 6 h for the schedule (1.10.0 and 1.11.0
  # were dispatched by hand instead). Now a tag build without the token, or
  # with one that cannot dispatch, is red. `secrets.*` cannot appear in an `if:`
  # (0-job startup_failure), so the presence check is a step output, same
  # pattern as the signing gate above.
  #
  # tap_dry_run (workflow_dispatch) runs this job without a tag: it checks the
  # token exists and can see the tap's workflow, and dispatches nothing.
  homebrew-tap:
    if: ${{ !cancelled() && ((needs.release-complete.result == 'success' && needs.version.outputs.publish == 'true') || inputs.tap_dry_run) }}
    needs: [version, release-complete]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Detect the tap token
        id: tap-token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.version.outputs.release }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error title=Homebrew tap not updated::secret HOMEBREW_TAP_TOKEN is not set in okohlbacher/FASTag. Add a fine-grained PAT (repository access: only okohlbacher/homebrew-fastag; permission Actions: Read and write), then publish this release with: gh workflow run update-casks.yml -R okohlbacher/homebrew-fastag -f tag=$TAG"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Check the token can reach the tap's workflow (dry run)
        if: steps.tap-token.outputs.enabled == 'true' && inputs.tap_dry_run
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_REPO: okohlbacher/homebrew-fastag
        run: |
          set -euo pipefail
          # Read-only: proves the secret is a live token with Actions access
          # to the tap. Write access is only provable by dispatching, which a
          # dry run must not do.
          state=$(gh api "repos/$GH_REPO/actions/workflows/update-casks.yml" --jq .state)
          echo "update-casks.yml in $GH_REPO is '$state'; dry run, nothing dispatched"

      - name: Ask the tap to publish this release
        if: steps.tap-token.outputs.enabled == 'true' && !inputs.tap_dry_run && needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_REPO: okohlbacher/homebrew-fastag
          # Through env and quoted below: a tag name is any valid Git ref,
          # not only vX.Y.Z, and the tap validates it again on its side.
          TAG: ${{ needs.version.outputs.release }}
        run: |
          # GitHub disables a scheduled workflow after 60 days without a
          # commit to its repository and then refuses to dispatch it, so
          # re-enable first; that is a no-op on an enabled workflow.
          if gh workflow enable update-casks.yml && gh workflow run update-casks.yml -f "tag=$TAG"; then
            echo "dispatched update-casks.yml in okohlbacher/homebrew-fastag for $TAG"
          else
            echo "::error title=Homebrew tap dispatch failed::could not dispatch update-casks.yml in okohlbacher/homebrew-fastag (expired HOMEBREW_TAP_TOKEN, or missing Actions: Read and write on the tap?). Publish by hand: gh workflow run update-casks.yml -R okohlbacher/homebrew-fastag -f tag=$TAG"
            exit 1
          fi
