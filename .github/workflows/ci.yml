name: build

# Linux x64/arm64 and macOS arm64, tests included.
#
# FASTag 1.7 builds against OpenMS develop at a pinned commit (OPENMS_REF), the
# first OpenMS with MzPeakFile and the OpenMS_CLI library. There is no package
# of it, so each platform's job builds that commit from source against the
# conda-forge libraries in .github/env/openms.yml and caches the install; the
# key is the commit, the platform, the toolchain and that file's hash. A cold
# build takes about an hour; afterwards it is a cache hit. The install is saved
# explicitly right after it is built, so a FASTag failure later in the job
# cannot throw it away, and one platform's failure does not hold back the
# others. Windows builds the same commit in windows.yml.
#
# The shipped bundle is then made to READ and WRITE an mzPeak archive before
# it is accepted; every previous silent loss of that feature presented as a
# green build, and that check is what closes the gap.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # gui_dry_run exists because every desktop-app step below runs ONLY on a v*
  # tag, so their first execution would otherwise be a real release -- the one
  # run where a mistake is expensive. Dispatch this workflow with the switch on
  # to build (and, when the MACOS_* secrets exist, sign and notarize) the .app
  # without cutting a tag. Nothing is uploaded to a release in that mode; the
  # .dmg comes back as a workflow artifact instead.
  workflow_dispatch:
    inputs:
      gui_dry_run:
        description: 'Build the macOS and Linux desktop apps without cutting a tag'
        type: boolean
        default: false
      # Exercises the homebrew-tap job without a tag: checks HOMEBREW_TAP_TOKEN
      # exists and can see the tap's workflow; dispatches nothing.
      tap_dry_run:
        description: 'Check the Homebrew tap token without dispatching the tap'
        type: boolean
        default: false
      # A plain dry run ships no taxonomy index (~450 MB), so its dmg is far
      # smaller than a release dmg and the size ceiling on the ULMO step says
      # nothing about the real payload. With this switch on as well, the
      # macos-arm64 leg embeds the same pinned index a tag build embeds, and
      # the dry run builds, notarizes and size-checks the real release image.
      gui_full_payload:
        description: 'With gui_dry_run: embed the pinned taxonomy index (release-sized dmg)'
        type: boolean
        default: false

# cancel-in-progress is ON, after turning it off caused something worse.
#
# The history is worth keeping, because the first diagnosis was wrong. macos-x64
# never executed across six consecutive runs, and that was read as aggressive
# cancellation starving a scarce runner -- so this was set to `false`.
#
# The real cause was that `macos-13` is RETIRED and no runner would ever pick the
# job up. Turning cancellation off did not fix that; it converted a job that
# could not run into a permanent head-of-line block. Run 29857387912 sat `queued`
# on its macos-x64 job holding the refs/heads/main concurrency group, and EVERY
# subsequent push to main was blocked behind it for about a day. The v0.9.0 tag
# build passed only because tags land in a different group.
#
# Two lessons, both encoded below: an unschedulable runner label is a wedge, not
# a delay; and `cancel-in-progress: false` turns any wedge into an outage.
concurrency:
  # A manual dispatch gets its OWN group. Sharing <workflow>-refs/heads/main
  # with ordinary pushes means cancel-in-progress lets the next push to main
  # kill a validation run mid-flight -- which is exactly what happened to the
  # first gui_dry_run on 2026-09-08: cancelled at 2m17s by a push that landed
  # 13 seconds earlier. A dispatch is user-initiated and bounded, so giving it
  # a unique group cannot reintroduce the head-of-line wedge described above.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # The platform-independent ~430 MB taxonomy k-mer index, embedded into every
  # release tarball at tag time and copied onto each release as a standalone
  # asset. Pinned to a DATA-ONLY release tag + sha256 -- a moving ref would
  # silently change what a release contains (the pinning lesson), and
  # assets under an existing data tag are never mutated. To ship a rebuilt
  # index: create a new taxonomy-k7-YYYYMMDD release carrying the new tarball
  # + .sha256 FIRST, then bump BOTH values here in one commit, then tag.
  #
  # THE DATA RELEASE MUST BE A PRE-RELEASE (`gh release create --prerelease`,
  # or `gh release edit <tag> --prerelease` after the fact). GitHub hands the
  # "Latest" slot to the newest NON-prerelease, and every binary link in the
  # README is a /releases/latest/download/ URL -- publishing this data tag as
  # a normal release silently 404s every platform download until it is
  # demoted. That happened once, on 2026-09-01, and this is the fix.
  # windows.yml carries the same two pins and must stay in lockstep.
  TAXDB_TAG: taxonomy-k7-20260901
  TAXDB_SHA256: 520d93229df807e45b0e6fdf4d8d20c7aad95b73952749cb041c3e54de474a4b
  # The OpenMS this binary is built against: OpenMS/OpenMS develop
  # (3.7.0-dev), after the mzPeak merge. Pinned by SHA -- a moving ref would
  # silently change what a release contains -- and part of the cache key.
  # windows.yml carries the same pin and must move in lockstep.
  OPENMS_REF: 70cebcd14442cecd6bcd9794fb6786d3342cacc6
  # The macOS floor, CHOSEN rather than inherited from whatever SDK the runner
  # image happens to ship. v1.4.2 went out with minos 14.0 on arm64 (macos-14)
  # and 15.0 on x64, while the libOpenMS.dylib bundled beside it asked for
  # 11.3 and the app's Info.plist promised 11.0. dyld refuses to load a
  # Mach-O on a macOS older than its minos -- and the floor moved on its own
  # each time GitHub retired a runner image.
  #
  # 13.4: the floating-point std::to_chars the TSV writer formats numbers with
  # (instead of snprintf, whose macOS implementation serialises every thread
  # on a global locale lock), and that OpenMS develop's std::format uses, is
  # available from 13.4 on in conda-forge's libc++ 19 -- below it the build
  # fails with "'to_chars' is unavailable". Still above every bundled
  # conda-forge dependency's own floor. gui/src-tauri/tauri.conf.json's minimumSystemVersion
  # carries the same value -- the Homebrew casks in okohlbacher/homebrew-fastag
  # read the floor off that plist. OpenMS is built here with the same floor,
  # and the floor is part of its cache key.
  MACOS_MIN_VERSION: "13.4"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # write, not the default: needed only for the tag-triggered release-asset
    # upload below. Scoped to this job rather than the workflow, since nothing
    # else here needs it. GitHub already forces a read-only token for
    # pull_request runs from forks regardless of this setting, so it grants
    # nothing to an untrusted PR -- it only ever matters on an actual tag push.
    permissions:
      contents: write
    # A ceiling, not an estimate. Linux finishes in minutes once OpenMS is
    # cached; this exists so a job that hangs dies rather than holding a
    # concurrency group. It does NOT cover a job stuck waiting for a runner --
    # GitHub only starts this clock once the job is picked up. The protection
    # against that is not naming labels that do not exist.
    #
    # 330: up to 240 minutes for a cold OpenMS build on a 3-4 core runner,
    # plus 90 for FASTag, of which the macOS notarization step below may take
    # 60 on its own.
    # NOTE: this does not cover the one-time exception where a brand-new
    # bundle ID's FIRST notarization submission can take 8-12 hours
    # -- that has to be primed manually, out of band,
    # before the first real signed release.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            compilers: "gxx_linux-64=14.* sysroot_linux-64=2.28.*"
            toolchain: gcc14-glibc2.28
            extra: patchelf
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            compilers: "gxx_linux-aarch64=14.* sysroot_linux-aarch64=2.28.*"
            toolchain: gcc14-glibc2.28
            extra: patchelf
          # dylibbundler (the macOS equivalent of patchelf) is a Homebrew
          # package, not a conda-forge one, and is installed by brew in its
          # own step further down.
          # macos-15, not macos-14: GitHub retired every macOS 14 image on
          # 2026-11-02, and the label then failed at once ("The configuration
          # 'macos-14-arm64-us-default' is not supported"; PR #11 run
          # 42170681139 was cancelled within a second). The image only
          # supplies the SDK and the host; the floor is MACOS_MIN_VERSION
          # (13.4) above, set explicitly, and the "Assert the macOS
          # deployment target" step checks every Mach-O against it, so a
          # newer image cannot raise it silently. The OpenMS cache key carries
          # the floor and the conda toolchain, not the image, so it stays warm.
          - name: macos-arm64
            runner: macos-15
            compilers: "clangxx_osx-arm64=19.* llvm-openmp=19.*"
            toolchain: clang19
            extra: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The same libraries OpenMS was built against (.github/env/openms.yml),
      # the same compilers, plus what packaging needs.
      - name: Install the toolchain and dependencies
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: .github/env/openms.yml
          create-args: ${{ matrix.compilers }} ${{ matrix.extra }}
          init-shell: bash
          cache-environment: true

      # OpenMS: restored from the cache, or built from source and saved at once,
      # so a later FASTag failure in this job cannot keep the build from the
      # cache (actions/cache would save only from a successful job).
      - name: Restore OpenMS
        id: openms-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: openms-install
          key: openms-${{ env.OPENMS_REF }}-${{ matrix.name }}-${{ matrix.toolchain }}-${{ hashFiles('.github/env/openms.yml') }}-osx${{ env.MACOS_MIN_VERSION }}-v1

      - name: Check out OpenMS at the pinned commit
        if: steps.openms-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git init -q openms-src
          cd openms-src
          git remote add origin https://github.com/OpenMS/OpenMS.git
          # GitHub serves a reachable commit by SHA; if that is ever refused,
          # fetch develop shallow and deepen until the commit is there.
          if ! git fetch -q --depth 1 origin "$OPENMS_REF"; then
            git fetch -q --depth 1 origin develop
            for _ in 1 2 3 4 5 6 7 8; do
              git cat-file -e "$OPENMS_REF^{commit}" 2>/dev/null && break
              git fetch -q --deepen=500 origin develop
            done
          fi
          git checkout -q "$OPENMS_REF"
          test -f src/openms/include/OpenMS/FORMAT/MzPeakFile.h

      - name: Build and install OpenMS
        if: steps.openms-cache.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # The flags the cluster build of this commit used, minus the TOPP
          # tools: FASTag links libOpenMS and OpenMS_CLI, which build without
          # them. No GUI, pyOpenMS, docs, tests, Thermo or timsTOF readers.
          # mzPeak ON (the vendored library); Arrow shared, from conda.
          OSX_MIN=()
          if [ "$RUNNER_OS" = macOS ]; then
            export MACOSX_DEPLOYMENT_TARGET="$MACOS_MIN_VERSION"
            OSX_MIN=(-DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_MIN_VERSION")
          fi
          cmake -S openms-src -B openms-build -G Ninja "${OSX_MIN[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/openms-install" \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DOPENMS_USE_VCPKG=OFF \
            -DOPENMS_ENABLE_MZPEAK=ON \
            -DARROW_USE_STATIC=OFF \
            -DWITH_GUI=OFF -DPYOPENMS=OFF -DENABLE_DOCS=OFF -DHAS_XSERVER=OFF \
            -DWITH_OPENTIMS=OFF -DWITH_THERMO_RAW=OFF \
            -DMT_ENABLE_OPENMP=ON -DMT_REQUIRE_OPENMP=ON \
            -DBUILD_TOPP_TOOLS=OFF \
            -DINSTALL_OPENMS_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF
          # One job per core: some OpenMS translation units need well over
          # a gigabyte, and the macOS runner has 7 GB for 3 cores.
          cmake --build openms-build --parallel "$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"
          cmake --install openms-build

      - name: Save OpenMS
        if: steps.openms-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: openms-install
          key: openms-${{ env.OPENMS_REF }}-${{ matrix.name }}-${{ matrix.toolchain }}-${{ hashFiles('.github/env/openms.yml') }}-osx${{ env.MACOS_MIN_VERSION }}-v1

      - name: Verify the OpenMS install
        shell: bash
        run: |
          set -euo pipefail
          test -f openms-install/lib/cmake/OpenMS/OpenMSConfig.cmake
          test -f openms-install/lib/cmake/OpenMS/OpenMSCLITargets.cmake
          test -f openms-install/include/OpenMS/FORMAT/MzPeakFile.h
          test -f openms-install/include/OpenMS/APPLICATIONS/TOPPBase.h
          test -d openms-install/share/OpenMS
          grep -m1 -oE 'PACKAGE_VERSION "[^"]+"' openms-install/lib/cmake/OpenMS/OpenMSConfigVersion.cmake

      - name: Point the build at OpenMS
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # Every downstream step needs the library and its shared-data
          # directory; the tests and the smoke run both load CV terms.
          echo "OPENMS_DIR=$GITHUB_WORKSPACE/openms-install/lib/cmake/OpenMS" >> "$GITHUB_ENV"
          echo "OPENMS_INSTALL=$GITHUB_WORKSPACE/openms-install" >> "$GITHUB_ENV"
          echo "OPENMS_DATA_PATH=$GITHUB_WORKSPACE/openms-install/share/OpenMS" >> "$GITHUB_ENV"

      # The mzPeak fixture of OpenMS's own tests at the pinned commit: 34 MS2
      # spectra, written by the reference converter. The smoke runs read it,
      # and the validator step uses it as its control.
      - name: Fetch the mzPeak test archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-data
          curl -fsSL --retry 3 -o ci-data/small.mzpeak \
            "https://raw.githubusercontent.com/OpenMS/OpenMS/$OPENMS_REF/src/tests/class_tests/openms/data/MzPeakFile_small.mzpeak"
          echo "5af157f1744d13502dbc8f7103ad0d01c4ba5ecc528087756aa09ed75d4b4087  ci-data/small.mzpeak" > ci-data/small.sha256
          if command -v sha256sum >/dev/null; then sha256sum -c ci-data/small.sha256; else shasum -a 256 -c ci-data/small.sha256; fi

      - name: Configure
        shell: bash -el {0}
        run: |
          # pipefail, because the cmake line below is piped into tee. This
          # shell is `bash -el`, which has errexit but NOT pipefail, so a
          # failed configure would otherwise be swallowed by tee.
          set -o pipefail
          # Same floor, same reason (MACOS_MIN_VERSION at the top of this file).
          OSX_MIN=()
          if [ "$RUNNER_OS" = macOS ]; then
            export MACOSX_DEPLOYMENT_TARGET="$MACOS_MIN_VERSION"
            OSX_MIN=(-DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_MIN_VERSION")
          fi
          cmake -S . -B build -G Ninja "${OSX_MIN[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenMS_DIR="$OPENMS_DIR" \
            -DCMAKE_PREFIX_PATH="$OPENMS_INSTALL;$CONDA_PREFIX" 2>&1 | tee configure.log

      - name: Verify OpenMP was found
        shell: bash -el {0}
        run: |
          # Without this, macOS goes GREEN while shipping a serial binary.
          #
          # Missing OpenMP is not a build error. CMakeLists.txt warns and carries
          # on, the #pragmas become no-ops, the omp_* fallback stubs return 1, and
          # the result is a correct tool that ignores -threads while README.md
          # still advertises its scaling. Every test passes. Apple's clang ships
          # no OpenMP runtime, so macOS is precisely where this would happen.
          # (OpenMS is built with MT_REQUIRE_OPENMP, so its config fails first
          # in practice; this checks FASTag's own find_package too.)
          if ! grep -q "FASTag: OpenMP" configure.log; then
            echo "::error::OpenMP was not found. The binary would be serial and"
            echo "::error::the performance claims would not hold. Configure said:"
            grep -i "openmp" configure.log || echo "(no OpenMP line at all)"
            exit 1
          fi
          grep "FASTag: OpenMP" configure.log

      - name: Build
        shell: bash -el {0}
        run: cmake --build build --parallel

      # mzPeakValidator, for every archive this job writes: ctest's
      # mzpeak_validate (the round-trip archives) and the bundle check below.
      # Installed with setup-python's OWN interpreter into its own prefix,
      # deliberately not the conda env: pulling a Python pyarrow into that
      # solve would couple an unrelated tool to the build environment. The requirements file pins the
      # validator to a commit AND its engine to exact versions (see the file
      # for why and how to move the pin), and doubles as the pip cache key.
      # --only-binary: every compiled dependency has a wheel for all five
      # targets, and a source build here would be a silent multi-minute
      # detour on a runner without a compiler for it.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: validator-python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/mzpeak-validator-requirements.txt
      - name: Install mzPeakValidator
        shell: bash
        env:
          PY: ${{ steps.validator-python.outputs.python-path }}
        run: |
          set -euo pipefail
          PY="${PY//\\//}"
          for attempt in 1 2 3; do
            "$PY" -m pip install -q --only-binary=:all: -r test/mzpeak-validator-requirements.txt && break
            [ "$attempt" -lt 3 ] || { echo "::error::pip could not install mzPeakValidator after 3 attempts"; exit 1; }
            echo "pip install failed (attempt $attempt); retrying in 15 s"; sleep 15
          done
          # The console script sits next to the interpreter (bin/ on Unix,
          # Scripts/ on Windows). An absolute path goes into the environment
          # so the conda-activating test shell cannot resolve a different one.
          D=$(dirname "$PY")
          if [ -x "$D/mzpeak-validate" ]; then V="$D/mzpeak-validate"
          elif [ -x "$D/Scripts/mzpeak-validate.exe" ]; then V="$D/Scripts/mzpeak-validate.exe"
          else echo "::error::mzpeak-validate not found next to $PY"; ls "$D" "$D/Scripts" 2>/dev/null; exit 1; fi
          "$V" --help >/dev/null
          echo "MZPEAK_VALIDATE=$V" >> "$GITHUB_ENV"
          echo "validator: $V"

      - name: Test
        shell: bash -el {0}
        run: |
          # pipefail, as in Configure: this shell has errexit but not pipefail.
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log
          # The mzPeak tests SKIP themselves in a build without mzPeak support
          # or without the validator. This job has both, so a skip here would
          # be a broken harness presenting as green -- the very class of
          # failure this coverage exists for. Require a Passed line for each.
          for t in mzpeak_roundtrip mzpeak_validate mzpeak_stream_test; do
            grep -E "Test +#[0-9]+: $t " ctest.log | grep -q 'Passed' \
              || { echo "::error::$t did not pass (skipped, not run or missing)"; grep -E "$t" ctest.log || true; exit 1; }
          done

      # A real mzPeak read. The count is asserted exactly: 34 MS2 in that
      # archive, and a reader that dropped spectra or precursors would report
      # fewer.
      - name: Smoke-test the binary on a real mzPeak archive
        shell: bash -el {0}
        run: |
          set -euo pipefail
          ./build/FASTag --help >/dev/null
          OUT=$(./build/FASTag -in ci-data/small.mzpeak -out /tmp/smoke-mzpeak.tsv \
                  -threads 2 -fragment_tolerance 20 -fragment_tolerance_unit ppm 2>&1)
          echo "$OUT" | grep -E "MS2 spectra" || { echo "$OUT"; exit 1; }
          echo "$OUT" | grep -q "34 MS2 spectra" || { echo "::error::expected 34 MS2 spectra from small.mzpeak"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FASTag-${{ matrix.name }}
          path: build/FASTag
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Bundle runtime dependencies for portability -- EVERY run, not just
      # releases. This is what a real user's download of an earlier release
      # failed on:
      #
      #   dyld: Library not loaded: @rpath/libOpenMS.dylib
      #     tried: '/Users/runner/micromamba/envs/fastag/lib/libOpenMS.dylib'
      #
      # `build/FASTag` as produced above carries an RPATH pointing at THIS
      # JOB's own conda environment, which obviously does not exist on a
      # machine that only downloaded the release tarball -- true on Linux
      # (RPATH /home/runner/micromamba/envs/fastag/lib) exactly as much as
      # macOS. Running this on every push, not just tags, means a regression
      # here fails CI immediately instead of shipping silently to the next
      # release, which is exactly what happened once already.
      #
      # Two things needed bundling that are easy to miss from a single
      # `ldd`/`otool -L` on the executable alone, both found only by actually
      # running the result and reading the error, not by static inspection:
      #   - Linux only: libblas.so.3/libcblas.so.3/liblapack.so.3/
      #     liblapacke.so.3 are all symlinks to ONE real OpenBLAS file,
      #     loaded via dlopen() rather than a normal NEEDED entry -- invisible
      #     to ldd. conda-forge's BLAS/LAPACK "mutex" package pattern.
      #   - Both platforms: OpenMS's own share/ data directory (enzyme,
      #     modification and CV databases) -- needed even just to fail
      #     cleanly on a missing input file, at least on Linux; bundled on
      #     macOS too rather than relying on an unexplained platform
      #     difference (real local testing showed macOS did not hit this,
      #     but the underlying reason is not understood well enough to trust
      #     it holding on a future OpenMS rebuild). A wrapper script
      #     (FASTag -> FASTag.bin) sets OPENMS_DATA_PATH relative to itself
      #     before exec'ing the real binary, rather than assuming an install
      #     location that does not exist on a bare download.
      - name: Bundle runtime dependencies for portability (Linux)
        if: runner.os == 'Linux'
        shell: bash -el {0}
        run: |
          set -e
          rm -rf dist && mkdir -p dist/FASTag/lib
          cp build/FASTag dist/FASTag/FASTag.bin

          # TWO source prefixes. libOpenMS, libOpenMS_CLI and libOpenSwathAlgo
          # come from the OpenMS install built above; everything they in turn
          # need (Arrow, Boost, libxml2, ...) from the conda env. Missing
          # either would bundle every dependency EXCEPT a library the tool is
          # actually built around.
          LIBDIR="$CONDA_PREFIX/lib"
          OMSLIB="$OPENMS_INSTALL/lib"

          # Match on ldd's RESOLVED path rather than the soname, so a library
          # is attributed to whichever prefix it actually came from instead of
          # being looked up in a prefix that may not hold it.
          ldd dist/FASTag/FASTag.bin \
            | sed -n 's/.*=> \(\/[^ ]*\).*/\1/p' \
            | grep -E "^($LIBDIR|$OMSLIB)/" | sort -u > /tmp/needed.txt

          while read -r path; do
            [ -z "$path" ] && continue
            name=$(basename "$path")
            if [ -L "$path" ]; then
              real=$(readlink -f "$path")
              realname=$(basename "$real")
              [ -f "dist/FASTag/lib/$realname" ] || cp -L "$real" "dist/FASTag/lib/$realname"
              [ -e "dist/FASTag/lib/$name" ] || ln -s "$realname" "dist/FASTag/lib/$name"
            else
              [ -f "dist/FASTag/lib/$name" ] || cp -L "$path" "dist/FASTag/lib/$name"
            fi
          done < /tmp/needed.txt

          # dlopen-only BLAS/LAPACK backend aliases -- see the comment above.
          for alias in libblas.so.3 libcblas.so.3 liblapack.so.3 liblapacke.so.3; do
            if [ -L "$LIBDIR/$alias" ] && [ ! -e "dist/FASTag/lib/$alias" ]; then
              real=$(readlink -f "$LIBDIR/$alias")
              realname=$(basename "$real")
              [ -f "dist/FASTag/lib/$realname" ] || cp -L "$real" "dist/FASTag/lib/$realname"
              ln -s "$realname" "dist/FASTag/lib/$alias"
            fi
          done

          patchelf --set-rpath '$ORIGIN/lib' dist/FASTag/FASTag.bin
          for so in dist/FASTag/lib/*.so*; do
            [ -L "$so" ] && continue
            patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
          done

          cp -r "$OPENMS_INSTALL/share/OpenMS" dist/FASTag/share-OpenMS
          # The tag-time taxonomy smoke needs this fixture. It is vendored
          # (test/fixtures) because OpenMS is installed without its examples/
          # tree; assert it on EVERY build so its disappearance fails a cheap
          # main push, not a release.
          mkdir -p dist/FASTag/share-OpenMS/examples/ID
          cp test/fixtures/Ecoli_MS2_small.mzML dist/FASTag/share-OpenMS/examples/ID/
          test -s dist/FASTag/share-OpenMS/examples/ID/Ecoli_MS2_small.mzML

          # The taxonomy -species resolves by default. The pruned NCBI dumps
          # (12 KB) go here for every build; on TAG builds the "Embed taxonomy
          # index" step below replaces this dir with the full pinned index
          # (dumps + tax_k7.taxdb), so release tarballs are -species-complete
          # out of the box. `share-FASTag-taxonomy` (not
          # share/FASTag/taxonomy) because this layout is FLAT -- the executable
          # sits at the root, so there is no ../share to resolve; FASTag looks for
          # both spellings, see taxonomyDir_() in src/FASTag.cpp.
          cp -r data/taxonomy dist/FASTag/share-FASTag-taxonomy
          # The -digest_out models and -massgap_out modifications, found the
          # same way (share-FASTag-digest in this flat layout).
          cp -r data/digest dist/FASTag/share-FASTag-digest
          # FASTag's own licence and the notices of every redistributed
          # library, which BSD/MIT/Apache-2.0 require in a binary
          # distribution (tools/third_party_notices.py maps each bundled
          # library to the conda package that installed it).
          cp LICENSE dist/FASTag/LICENSE
          python3 tools/third_party_notices.py "$CONDA_PREFIX" dist/FASTag/THIRD-PARTY-NOTICES.txt dist/FASTag/lib
          test -s dist/FASTag/THIRD-PARTY-NOTICES.txt
          # printf, not a heredoc: a heredoc's body has to be indented to
          # satisfy YAML's block-scalar rules, but leading whitespace before
          # `#!` breaks shebang recognition -- the kernel requires it at byte
          # offset 0. Each argument is single-quoted so $HERE/$0/$@ are
          # written LITERALLY, meant for the wrapper script to expand when
          # IT runs later, not for this outer shell to expand now.
          # OPENBLAS_NUM_THREADS: libOpenMS pulls in OpenBLAS, which starts a
          # spinning thread per core at load (~2 s CPU on 128 threads, even for
          # --help); FASTag never calls BLAS. A user's own setting still wins.
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)' \
            'export OPENMS_DATA_PATH="$HERE/share-OpenMS"' \
            'export OPENBLAS_NUM_THREADS="${OPENBLAS_NUM_THREADS:-1}"' \
            'exec "$HERE/FASTag.bin" "$@"' \
            > dist/FASTag/FASTag
          chmod +x dist/FASTag/FASTag dist/FASTag/FASTag.bin
          du -sh dist/FASTag

      - name: Install dylibbundler (macOS)
        if: runner.os == 'macOS'
        run: brew install dylibbundler

      - name: Bundle runtime dependencies for portability (macOS)
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: |
          set -e
          rm -rf dist && mkdir -p dist/FASTag
          cp build/FASTag dist/FASTag/FASTag.bin

          dylibbundler -od -b \
            -x dist/FASTag/FASTag.bin \
            -d dist/FASTag/lib \
            -p '@executable_path/lib/' \
            -s "$OPENMS_INSTALL/lib" \
            -s "$CONDA_PREFIX/lib"

          # Deduplicate LC_RPATH on EVERY Mach-O in the bundle, or dyld
          # refuses to launch:
          #
          #   Library not loaded: @executable_path/lib/libOpenMS.dylib
          #   tried: '.../dist/FASTag/lib/libOpenMS.dylib'
          #         (duplicate LC_RPATH '@executable_path/lib/')
          #
          # dylibbundler rewrites each existing rpath to its -p prefix
          # INDIVIDUALLY, so a file carrying several collapses to several
          # identical entries. libOpenMS.dylib had three:
          #
          #   -rpath ".../envs/omsbuild/lib"    "@executable_path/lib/"
          #   -rpath ".../openms-build/lib"     "@executable_path/lib/"
          #   -rpath "@executable_path/../lib/" "@executable_path/lib/"
          #
          # and a duplicate LC_RPATH is fatal, not cosmetic. This got worse
          # with the move to a separately-installed OpenMS, which is simply
          # one more prefix for dylibbundler to collapse. The first fix here
          # only cleaned the executable and missed the library that actually
          # had the problem -- hence "every Mach-O", not a list of suspects.
          dedup_rpath() {
            local f="$1"
            while [ "$(otool -l "$f" \
                        | awk '/LC_RPATH/{g=1;next} g&&/^ *path /{print $2; g=0}' \
                        | grep -cx '@executable_path/lib/')" -gt 1 ]; do
              install_name_tool -delete_rpath '@executable_path/lib/' "$f"
            done
            # install_name_tool invalidates the signature it just edited, and
            # arm64 will not run an improperly signed Mach-O at all. Re-sign
            # ad-hoc; the real Developer ID signing step downstream overwrites
            # this anyway when it is configured.
            codesign --force --sign - "$f" 2>/dev/null || true
          }
          dedup_rpath dist/FASTag/FASTag.bin
          for so in dist/FASTag/lib/*.dylib; do
            [ -e "$so" ] || continue
            [ -L "$so" ] && continue
            dedup_rpath "$so"
          done
          echo "LC_RPATH on FASTag.bin after dedup:"
          otool -l dist/FASTag/FASTag.bin \
            | awk '/LC_RPATH/{g=1;next} g&&/^ *path /{print "  " $2; g=0}'
          echo "LC_RPATH on libOpenMS.dylib after dedup:"
          otool -l dist/FASTag/lib/libOpenMS.dylib \
            | awk '/LC_RPATH/{g=1;next} g&&/^ *path /{print "  " $2; g=0}'

          cp -r "$OPENMS_INSTALL/share/OpenMS" dist/FASTag/share-OpenMS
          # The tag-time taxonomy smoke needs this fixture. It is vendored
          # (test/fixtures) because OpenMS is installed without its examples/
          # tree; assert it on EVERY build so its disappearance fails a cheap
          # main push, not a release.
          mkdir -p dist/FASTag/share-OpenMS/examples/ID
          cp test/fixtures/Ecoli_MS2_small.mzML dist/FASTag/share-OpenMS/examples/ID/
          test -s dist/FASTag/share-OpenMS/examples/ID/Ecoli_MS2_small.mzML

          # Same taxonomy copy as the Linux step above. It lives in BOTH because
          # Linux and macOS have separate bundle steps; adding it to only one
          # shipped two of the four tarballs without it.
          cp -r data/taxonomy dist/FASTag/share-FASTag-taxonomy
          # The -digest_out models and -massgap_out modifications, found the
          # same way (share-FASTag-digest in this flat layout).
          cp -r data/digest dist/FASTag/share-FASTag-digest
          # FASTag's own licence and the notices of every redistributed
          # library, which BSD/MIT/Apache-2.0 require in a binary
          # distribution (tools/third_party_notices.py maps each bundled
          # library to the conda package that installed it).
          cp LICENSE dist/FASTag/LICENSE
          python3 tools/third_party_notices.py "$CONDA_PREFIX" dist/FASTag/THIRD-PARTY-NOTICES.txt dist/FASTag/lib
          test -s dist/FASTag/THIRD-PARTY-NOTICES.txt
          # printf, not a heredoc: a heredoc's body has to be indented to
          # satisfy YAML's block-scalar rules, but leading whitespace before
          # `#!` breaks shebang recognition -- the kernel requires it at byte
          # offset 0. Each argument is single-quoted so $HERE/$0/$@ are
          # written LITERALLY, meant for the wrapper script to expand when
          # IT runs later, not for this outer shell to expand now.
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)' \
            'export OPENMS_DATA_PATH="$HERE/share-OpenMS"' \
            'export OPENBLAS_NUM_THREADS="${OPENBLAS_NUM_THREADS:-1}"' \
            'exec "$HERE/FASTag.bin" "$@"' \
            > dist/FASTag/FASTag
          chmod +x dist/FASTag/FASTag dist/FASTag/FASTag.bin
          du -sh dist/FASTag

      # A floor nobody reads is a floor that moves. This reads it off the
      # Mach-Os that are about to be shipped, because everything that sets it
      # can fail silently: a toolchain that ignores the variable, a runner
      # image upgrade, a cached dylib built before the floor was chosen.
      - name: Assert the macOS deployment target (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          fail=0
          # FASTag and the OpenMS libraries built in this workflow carry the
          # chosen floor; conda-forge's own dylibs carry theirs (lower).
          for f in dist/FASTag/FASTag.bin dist/FASTag/lib/libOpenMS.dylib dist/FASTag/lib/libOpenMS_CLI.dylib; do
            [ -f "$f" ] || { echo "::error::$f is not in the bundle"; fail=1; continue; }
            # LC_BUILD_VERSION's own minos, not the LC_VERSION_MIN_MACOSX an
            # older linker would have emitted -- these are all built by clang
            # on a modern SDK, which emits the former.
            # || true: this shell has -eo pipefail, and a Mach-O with no
            # LC_BUILD_VERSION at all is exactly the case the error below is
            # meant to report -- not one to die on with grep's bare exit 1.
            minos=$(otool -l "$f" | grep -A4 LC_BUILD_VERSION | awk '$1 == "minos" { print $2; exit }') || true
            echo "$f: minos ${minos:-<none>}"
            [ "$minos" = "$MACOS_MIN_VERSION" ] || {
              echo "::error::$f targets ${minos:-nothing} -- expected macOS $MACOS_MIN_VERSION. dyld will refuse to load it below that."
              fail=1
            }
          done
          exit $fail

      # The actual regression guard: run the bundle exactly the way a user
      # who only downloaded the tarball would, and fail the build if it
      # resolves anything from this job's own build environment. Deliberately
      # NOT `bash -el {0}` -- that activates the conda env, which is exactly
      # the crutch a real download does not have. `-in nonexistent.mzML`
      # needs no test fixture: reaching OpenMS's own "file not found" error
      # proves every library AND the shared data directory resolved
      # correctly, since both are needed before that check ever runs.
      - name: Verify the bundle is portable (regression guard)
        shell: bash
        run: |
          set -e
          unset LD_LIBRARY_PATH DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH CONDA_PREFIX
          OUT=$(cd /tmp && "$GITHUB_WORKSPACE/dist/FASTag/FASTag" -in nonexistent.mzML -out /tmp/portability-check.tsv 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -qiE "library not loaded|cannot open shared object|shared data|dyld|error while loading"; then
            echo "::error::Bundle is NOT portable -- still resolves something from the build environment. See output above."
            exit 1
          fi
          echo "$OUT" | grep -q "File not found" || { echo "::error::Unexpected output -- never reached the expected 'file not found' error."; exit 1; }

          # And that the SHIPPED artifact reads mzPeak, by reading one: OpenMS's
          # own fixture, 34 MS2 spectra, run exactly as a download would.
          # Everything above only exercises mzML, and a bundle whose Arrow or
          # Parquet failed to travel would fail HERE with a loader error rather
          # than in a user's terminal.
          OUT2=$(cd /tmp && "$GITHUB_WORKSPACE/dist/FASTag/FASTag" \
                   -in "$GITHUB_WORKSPACE/ci-data/small.mzpeak" \
                   -out /tmp/mzpeak-check.tsv -threads 2 \
                   -fragment_tolerance 20 -fragment_tolerance_unit ppm 2>&1) || true
          echo "$OUT2"
          echo "$OUT2" | grep -q "34 MS2 spectra" || {
            echo "::error::Shipped bundle cannot read mzPeak -- expected 34 MS2 spectra from small.mzpeak."
            exit 1
          }
          # ...and WRITES one, then reads its own output back, still as a bare
          # download would (env -i: nothing of this runner's environment; a
          # minimal PATH only so the wrapper's /bin/sh can resolve dirname
          # and pwd). Reading exercises Parquet's reader and libzip's inflate;
          # writing needs the Parquet writer and zip finalisation -- code a
          # read-only smoke never touches -- so a bundle could read mzPeak and
          # still fail every user who asks for -out_spectra.
          # The tags from the archive must be byte-identical to the tags from
          # the mzML, exactly as ctest's mzpeak_roundtrip demands of the
          # unbundled binary. The archive is validated in the next step.
          BW=/tmp/bundle-mzpeak; rm -rf "$BW"; mkdir -p "$BW"
          MZ="$GITHUB_WORKSPACE/dist/FASTag/share-OpenMS/examples/ID/Ecoli_MS2_small.mzML"
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/FASTag/FASTag" \
            -in "$MZ" -out "$BW/ml.tsv" -out_spectra "$BW/bundle.mzpeak" -threads 2 \
            -fragment_tolerance 20 -fragment_tolerance_unit ppm > "$BW/write.log" 2>&1 \
            || { cat "$BW/write.log"; echo "::error::the shipped bundle cannot WRITE mzPeak"; exit 1; }
          grep -q "Wrote [0-9]* spectra" "$BW/write.log" || { cat "$BW/write.log"; echo "::error::the bundle wrote no spectra"; exit 1; }
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/FASTag/FASTag" \
            -in "$BW/bundle.mzpeak" -out "$BW/mp.tsv" -threads 2 \
            -fragment_tolerance 20 -fragment_tolerance_unit ppm > "$BW/read.log" 2>&1 \
            || { cat "$BW/read.log"; echo "::error::the shipped bundle cannot read the archive it just wrote"; exit 1; }
          cmp -s "$BW/ml.tsv" "$BW/mp.tsv" || { echo "::error::tags from the bundle-written archive differ from the mzML tags"; diff "$BW/ml.tsv" "$BW/mp.tsv" | head; exit 1; }
          [ "$(grep -c . "$BW/mp.tsv")" -gt 1 ] || { echo "::error::the bundle round trip produced no tags"; exit 1; }
          echo "bundle round trip: $(grep -o 'Wrote [0-9]* spectra' "$BW/write.log"), tags byte-identical"
          # ...and finds its shipped digest data: -digest_out without
          # -digest_models must report the shipped background.
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/FASTag/FASTag" \
            -in "$MZ" -out "$BW/dg.tsv" -digest_out "$BW/digest.tsv" -threads 2 > "$BW/digest.log" 2>&1 \
            || { cat "$BW/digest.log"; echo "::error::the shipped bundle cannot write -digest_out"; exit 1; }
          grep -q $'^run\tbackground\tshipped_human\t' "$BW/digest.tsv" \
            || { cat "$BW/digest.log"; echo "::error::-digest_out did not find the shipped digest data"; exit 1; }

          # Listed once into a variable, not `ls | grep -q` three times: this step
          # runs under `shell: bash`, which is pipefail, and grep -q exits at the
          # first match -- so ls dies of SIGPIPE and the pipeline reports failure
          # even though the library IS there. It is a race on how much ls has
          # written, and it failed the Arrow check once with the bundle correct.
          BUNDLED_LIBS=$(ls dist/FASTag/lib)
          for lib in OpenMS arrow parquet; do
            grep -qi "$lib" <<< "$BUNDLED_LIBS" \
              || { echo "::error::no $lib library in the bundle"; echo "$BUNDLED_LIBS"; exit 1; }
          done

          echo "Portability check passed: runs standalone, no build-environment leakage, reads and writes mzPeak."

      # The GUI's parameter manifest (gui/src/params.generated.json) is
      # generated from the CLI's own -write_ini, because the CLI is the source
      # of truth for names, types, defaults and bounds. A committed manifest
      # that lags the CLI is how the GUI drifts: 1.11.0 shipped with one that
      # still said 1.10.0. This regenerates it from the bundle built above and
      # fails on any difference. It needs the full CLI leg, so it runs here,
      # on linux-x64 only (the manifest is platform-independent). On a version
      # bump or a parameter change, run `npm run params` in gui/ (or
      # `node scripts/gen-params.mjs <FASTag> src/params.generated.json`) and
      # commit the result.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.name == 'linux-x64'
        with:
          node-version: 24

      - name: Check the GUI parameter manifest against the built CLI
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          node gui/scripts/gen-params.mjs dist/FASTag/FASTag "$RUNNER_TEMP/params.generated.json"
          if ! diff -u gui/src/params.generated.json "$RUNNER_TEMP/params.generated.json"; then
            echo "::error file=gui/src/params.generated.json::the parameter manifest differs from the built CLI's -write_ini; regenerate it with 'npm run params' in gui/ and commit it"
            exit 1
          fi
          echo "parameter manifest matches the built CLI ($(grep -c '"name":' gui/src/params.generated.json) parameters)"

      # Every mzPeak archive this job wrote, through mzPeakValidator in full
      # mode. ctest's mzpeak_validate already covered the round-trip archives
      # (its reports are collected here); this covers the bundle's. OpenMS's
      # small.mzpeak goes first as a CONTROL: written by the reference
      # converter, it passes the pinned validator, so a failure on it means
      # the validator or its pin is broken, not FASTag.
      #
      # A hard failure on EVERY run, not only tags. The validator and its
      # engine are pinned, so the verdict can only change when FASTag's
      # writer changes -- and an archive other readers reject is a silent
      # failure for every user, exactly the kind this repository's history
      # says must fail a cheap main push rather than a release. The one
      # accepted gap (run references MzPeakFile does not write) is named in
      # test/mzpeak_validate.sh.
      - name: Validate every mzPeak archive this job wrote
        shell: bash
        run: |
          set -euo pipefail
          R=validator-reports; rm -rf "$R"; mkdir -p "$R"
          bash test/mzpeak_validate.sh "$R/control" ci-data/small.mzpeak \
            || { echo "::error::the CONTROL archive (reference converter) fails the pinned validator -- the validator or its pin is broken, not FASTag"; exit 1; }
          bash test/mzpeak_validate.sh "$R/bundle" /tmp/bundle-mzpeak/bundle.mzpeak \
            || { echo "::error::the archive the shipped bundle wrote is not a valid mzPeak archive"; exit 1; }
          cp -r build/mzpeak-roundtrip/validator "$R/ctest"
          ls -R "$R" | head -40

      # The reports, pass or fail: a red validator run is only useful with
      # the findings attached, and `always()` is what makes a failed step's
      # output reach the artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mzpeak-validator-${{ matrix.name }}
          path: validator-reports
          if-no-files-found: warn

      # ---------------------------------------------------------------------
      # macOS code signing + notarization, release builds only.
      #
      # Adapted from a working reference (BALL/BALLView's release.yml), not
      # invented -- but that project ships a Qt .app bundle via macdeployqt
      # and a signed .dmg via create-dmg; FASTag ships a bundled folder, not
      # an .app, so none of that packaging machinery applies, and one thing
      # does NOT carry over: `stapler staple` only works on .app bundles,
      # .pkg installers and disk images, never a lone Mach-O binary or a
      # plain folder -- Apple's own documented limitation, not an oversight
      # here. A notarized standalone binary is verified by Gatekeeper via an
      # ONLINE ticket lookup on first run instead, which needs network
      # access that one time. There is no staple step below because there is
      # nothing for it to attach to.
      #
      # Gated the same way as the release-upload step above and the
      # SignPath step in windows.yml: `secrets.X != ''` directly in an `if:`
      # makes the WHOLE workflow invalid (a 0-job startup_failure on every
      # push), so the secret is mapped into a step env: (legal) and the
      # presence check becomes a step OUTPUT that downstream steps gate on.
      #
      # The MACOS_* secrets exist on this repo since 2026-11; the first run
      # that took the signed branch was the gui_dry_run dispatch of PR #12.
      # Without them a tag build takes the "not configured" branch and ships
      # unsigned. doc/SIGNING-macos-gui.md names the secrets.
      - name: Detect macOS signing readiness
        if: matrix.name == 'macos-arm64' && (startsWith(github.ref, 'refs/tags/v') || inputs.gui_dry_run)
        id: mac-signing
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            echo "::warning title=Unsigned macOS binary::MACOS_CERTIFICATE_BASE64 is not set -- shipping this release unsigned. Gatekeeper will warn on first run. See doc/SIGNING-macos-gui.md for what's needed."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple Developer ID cert into CI keychain (macOS)
        if: steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          # Ephemeral keychain, never the runner's login keychain.
          KEYCHAIN_PATH="${RUNNER_TEMP}/fastag-signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/cert.p12"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"' | xargs)
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -p codesigning -v "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      # Every dylib first, THEN the executable: codesigning it checks its
      # dependencies' own signatures too, so they need a real signature in
      # place beforehand -- dylibbundler's own internal codesign call uses an
      # ad-hoc identity ("-"), which notarization does not accept.
      - name: Codesign FASTag with Developer ID + hardened runtime (macOS)
        if: steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          for dylib in dist/FASTag/lib/*.dylib; do
            [ -L "$dylib" ] && continue
            codesign --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" --timestamp "$dylib"
          done
          codesign --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" --timestamp dist/FASTag/FASTag.bin
          codesign --verify --strict --verbose=2 dist/FASTag/FASTag.bin

      - name: Submit to Apple notary + wait (macOS)
        if: steps.mac-signing.outputs.enabled == 'true'
        timeout-minutes: 60
        shell: bash
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent dist/FASTag "${RUNNER_TEMP}/FASTag-notarize.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/FASTag-notarize.zip" \
            --apple-id "$MACOS_APPLE_ID" --team-id "$MACOS_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" --wait

      # MOVED AHEAD OF THE DESKTOP APP, and that is the whole point: the app's
      # resources are staged from dist/FASTag, so embedding the index after that
      # shipped an .app carrying the 12 KB dumps-only directory and no k-mer
      # index at all. -species then failed inside the installed app with "the
      # taxonomy dumps are present ... but the k-mer index (tax_k7.taxdb) is
      # not" -- reported from /Applications/FASTag.app on 2026-09-09.
      #
      # The original reason for placing it late still holds for the CLI: the
      # index is unsigned data and embedding it before notarization would add
      # ~450 MB to that upload. It does not conflict, because the CLI is
      # notarized further up, before this point.
      # Embed the full taxonomy index into the tarball -- tag builds only;
      # main pushes keep the fast dumps-only bundles nobody installs.
      #
      # Placed AFTER the macOS signing/notarization steps on purpose: the
      # index is unsigned data, and embedding earlier would balloon the
      # notarytool upload by ~450 MB. (That ordering stays theoretical until
      # the MACOS_* secrets exist -- revisit on the first signed run.)
      #
      # Fails the release loudly on ANY error -- a tarball whose -species is
      # silently broken is worse than a red build. The smoke run uses the
      # ion-trap tolerance because the bundled example file is ion-trap MS2;
      # it asserts the taxdb LOADS and a non-empty report is written, not any
      # particular taxon ranking (139 spectra cannot rank stably).
      #
      # A gui_dry_run dispatch with gui_full_payload also runs it, on the
      # macOS leg only, so the release-sized dmg can be built and checked
      # before the tag (see the input's comment).
      - name: Embed taxonomy index (tag builds)
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.gui_dry_run && inputs.gui_full_payload && matrix.name == 'macos-arm64')
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAXDB_TAG" -p 'FASTag-taxonomy-k7.tar.gz' -D /tmp/taxdb
          got=$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" /tmp/taxdb/FASTag-taxonomy-k7.tar.gz)
          [ "$got" = "$TAXDB_SHA256" ] || { echo "taxonomy sha256 mismatch: $got"; exit 1; }
          # The asset's dumps replace the repo copies: they are the ones the
          # index was built against.
          rm -rf dist/FASTag/share-FASTag-taxonomy
          tar -xzf /tmp/taxdb/FASTag-taxonomy-k7.tar.gz -C dist/FASTag
          test -s dist/FASTag/share-FASTag-taxonomy/tax_k7.taxdb
          MZ=dist/FASTag/share-OpenMS/examples/ID/Ecoli_MS2_small.mzML
          test -s "$MZ" || { echo "smoke fixture missing from bundle"; exit 1; }
          dist/FASTag/FASTag -in "$MZ" -out /tmp/smoke.tsv \
            -species -species_out /tmp/smoke.species.tsv \
            -tag_length 7 -extension 2 \
            -fragment_tolerance 0.3 -fragment_tolerance_unit Da
          [ "$(wc -l < /tmp/smoke.species.tsv)" -ge 2 ] || { echo "species smoke wrote an empty report"; exit 1; }

      # ------------------------------------- portable CLI for the Linux GUI
      # The gui-linux job and the release tauri-driver run take the CLI from
      # here (GUI-DESIGN section 8, Linux). Not build/FASTag, the artifact
      # above, which is the unbundled binary with this job's conda RPATH: the
      # verified portable dist/FASTag (wrapper, FASTag.bin, lib/, share-*),
      # after the portability guard and, on a tag, with the taxonomy index
      # embedded by the step above. As a tar archive because upload-artifact
      # drops exec bits and symlinks (lib/ holds soname links). Not on pull
      # requests: nothing there consumes it, and it is several hundred MB.
      - name: Pack the portable CLI for the Linux GUI (linux-x64)
        if: matrix.name == 'linux-x64' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          tar -C dist -czf FASTag-linux-x64-portable.tar.gz FASTag
          ls -l FASTag-linux-x64-portable.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.name == 'linux-x64' && github.event_name != 'pull_request'
        with:
          name: FASTag-linux-x64-portable
          path: FASTag-linux-x64-portable.tar.gz
          # Already gzip: a second compression pass only costs time.
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      # ------------------------------------------------- desktop app (macOS)
      # The .app is a SECOND artifact needing its OWN signature: notarization
      # rejects a bundle containing any unsigned Mach-O, and the CLI plus its
      # whole dylib closure travel inside this one. Those are already signed
      # by the step above, so this restages the finished dist/ tree into the
      # layout the Rust backend expects and lets Tauri do the outer signing,
      # notarization and stapling in one shot.
      #
      # Unlike the CLI, a .app and a .dmg CAN be stapled -- so the desktop app
      # needs no online Gatekeeper lookup on first run, which the CLI does.
      #
      # Runs on a v* tag, or on a workflow_dispatch with gui_dry_run set: see
      # the comment on that input for why an untested tag-only path is a trap.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.mac-signing.outputs.enabled == 'true' || (inputs.gui_dry_run && matrix.name == 'macos-arm64')
        with:
          node-version: 24

      - name: Stage the signed CLI as the app's bundled resources (macOS)
        if: steps.mac-signing.outputs.enabled == 'true' || (inputs.gui_dry_run && matrix.name == 'macos-arm64')
        shell: bash
        run: |
          set -e
          # resolve_binary() in gui/src-tauri/src/fastag.rs looks for
          # <resources>/fastag/bin/FASTag, share/OpenMS and
          # share/FASTag/taxonomy -- match it exactly or the app falls back to
          # whatever `FASTag` is on PATH, which on a user's machine is nothing.
          R=gui/src-tauri/resources/fastag
          rm -rf "$R"; mkdir -p "$R/bin" "$R/share/FASTag"
          cp dist/FASTag/FASTag.bin "$R/bin/FASTag"
          # lib/ goes NEXT TO the executable, not one level up. dist/ was
          # bundled with `-p @executable_path/lib/`, so the loader looks beside
          # the binary; a tidier bin/../lib would break every dylib reference
          # and only show up at first launch on someone else's Mac.
          cp -RL dist/FASTag/lib "$R/bin/lib"
          cp -RL dist/FASTag/share-OpenMS "$R/share/OpenMS"
          cp -RL dist/FASTag/share-FASTag-taxonomy "$R/share/FASTag/taxonomy"
          cp -RL dist/FASTag/share-FASTag-digest "$R/share/FASTag/digest"
          cp dist/FASTag/LICENSE dist/FASTag/THIRD-PARTY-NOTICES.txt "$R/"
          # -L throughout: Tauri's resource bundler silently SKIPS symlinked
          # directories, so a symlink here becomes a missing file in the .app
          # with no error at build time.
          test -x "$R/bin/FASTag"
          # The same fixture the dist/ step above asserts -- proves share/
          # arrived whole, not just that the directory exists.
          test -s "$R/share/OpenMS/examples/ID/Ecoli_MS2_small.mzML"

          # HARD failure on a tag, not a warning. v1.4.1's app shipped with the
          # dumps but no k-mer index, so -species failed for anyone who
          # installed it -- and a warning in a green log is exactly how that
          # reached users. A gui_full_payload dry run embeds the index too and
          # is held to the same rule; a plain dry run stays a warning, because
          # it embeds no index.
          if [ -s "$R/share/FASTag/taxonomy/tax_k7.taxdb" ]; then
            echo "taxonomy index present: $(du -h "$R/share/FASTag/taxonomy/tax_k7.taxdb" | cut -f1)"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') || (inputs.gui_dry_run && inputs.gui_full_payload) }}" = "true" ]; then
            echo "::error::the app bundle has no tax_k7.taxdb -- -species would fail in the shipped app"
            exit 1
          else
            echo "::warning::no taxonomy index (not a tag or full-payload build); -species unavailable in this app"
          fi

          # Run the CLI exactly as the app will: from inside the staged bundle,
          # with nothing from this runner's environment on PATH. A bundle that
          # cannot execute its own binary is the other half of the same class of
          # bug, and it is invisible to any check that only looks at file names.
          env -i HOME="$HOME" "$R/bin/FASTag" --help > /tmp/bundle-help.txt 2>&1 \
            || { echo "::error::the bundled CLI does not run"; cat /tmp/bundle-help.txt; exit 1; }
          # ...and that the version it reports is FASTAG'S, not OpenMS's. A
          # TOPPBase tool inherits VersionInfo::getVersion() unless the
          # constructor overrides version_, so v1.4.1 shipped announcing
          # "3.6.0-pre" to every user. Checking only that SOME version line
          # exists would have passed that build.
          want=$(sed -n 's/^project(FASTag VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$want" || { echo "::error::cannot read the project version"; exit 1; }
          grep -q "^Version: $want" /tmp/bundle-help.txt || {
            echo "::error::bundled CLI reports the wrong version (want $want, likely OpenMS's)"
            grep '^Version: ' /tmp/bundle-help.txt; exit 1; }
          echo "bundled CLI: $(grep '^Version: ' /tmp/bundle-help.txt)"

          # The update check phones home through Qt and prints QIODevice noise
          # on stderr for anyone offline or behind a proxy. main() disables it;
          # this is the regression test for that.
          ! grep -q "QIODevice" /tmp/bundle-help.txt \
            || { echo "::error::update check is live -- QIODevice noise on a plain --help"; exit 1; }
          du -sh "$R"

      # Installed in a step of its own, WITHOUT the signing secrets: npm
      # lifecycle scripts run during `npm ci`, and none of them needs the
      # Developer ID certificate or the notary password in its environment.
      # --ignore-scripts: the lockfile's only install script is fsevents'.
      - name: Install the desktop app's npm dependencies (macOS)
        if: steps.mac-signing.outputs.enabled == 'true' || (inputs.gui_dry_run && matrix.name == 'macos-arm64')
        working-directory: gui
        run: npm ci --ignore-scripts

      - name: Build, sign and notarize the desktop app (macOS)
        if: steps.mac-signing.outputs.enabled == 'true' || (inputs.gui_dry_run && matrix.name == 'macos-arm64')
        timeout-minutes: 120
        working-directory: gui
        # Tauri reads these directly; APPLE_PASSWORD is the app-specific
        # password, never the Apple ID password. When the secrets are absent
        # (a dry run before they are configured) every value is empty, Tauri
        # skips signing, and the build still proves the bundle assembles.
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MACOS_MIN_VERSION }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -e
          npm run tauri build
          ls -la src-tauri/target/release/bundle/dmg/
          # Assert the ticket is attached, HERE rather than at upload time: a
          # dry run skips the upload, and the staple is what the dry run
          # exists to prove.
          #
          # Validate the .APP, not the .dmg. Tauri notarizes and staples the
          # app bundle, then builds the disk image from the stapled app and
          # only SIGNS that -- so `stapler validate` on the .dmg fails on a
          # perfectly good build ("does not have a ticket stapled to it",
          # exit 65), which is how it failed the v1.4.0 tag. Gatekeeper checks
          # the app the user drags out, and that one carries the ticket.
          if [ "${{ steps.mac-signing.outputs.enabled }}" = "true" ]; then
            shopt -s nullglob
            apps=(src-tauri/target/release/bundle/macos/*.app)
            [ ${#apps[@]} -gt 0 ] || { echo "::error::tauri produced no .app"; exit 1; }
            xcrun stapler validate "${apps[0]}"
            dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
            [ ${#dmgs[@]} -gt 0 ] || { echo "::error::tauri produced no .dmg"; exit 1; }
            codesign --verify --strict --verbose=2 "${dmgs[0]}"
          fi

      # Tauri's dmg is UDZO (zlib). Recompressed as ULMO (LZMA) it is about
      # 42% smaller (516.8 MB -> 300.4 MB measured with the full taxonomy
      # index), and ULMO opens on every macOS from 10.15, below the 13.4
      # floor. The conversion writes a new image, so the signature Tauri put
      # on the UDZO one is gone: the ULMO image is signed again, then
      # notarized and stapled AS A DMG. That makes `stapler validate` on the
      # .dmg meaningful for the first time (the step above still validates
      # the .app, which Tauri stapled). The converted image replaces Tauri's
      # in bundle/dmg/, so the release upload and the dry-run artifact below
      # pick it up unchanged.
      #
      # Then the image a user downloads is mounted and its CLI run from
      # there, with an empty environment: the portability check on the
      # shipped artifact, not on the staging folder. The size ceiling (310
      # MB, decimal: 310,000,000 bytes, as GUI-DESIGN.md's P0r acceptance
      # states it) is what keeps a regression of the conversion, or of the
      # bundle, from shipping silently. A plain dry run carries no taxonomy
      # index and is far below it; dispatch with gui_full_payload as well to
      # size-check the real release payload before the tag.
      - name: Recompress the desktop app's dmg as ULMO, sign, notarize, staple (macOS)
        if: steps.mac-signing.outputs.enabled == 'true' || (inputs.gui_dry_run && matrix.name == 'macos-arm64')
        timeout-minutes: 75
        shell: bash
        env:
          SIGNED: ${{ steps.mac-signing.outputs.enabled }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(gui/src-tauri/target/release/bundle/dmg/*.dmg)
          [ ${#dmgs[@]} -eq 1 ] || { echo "::error::expected one .dmg from tauri, found ${#dmgs[@]}"; exit 1; }
          DMG="${dmgs[0]}"
          before=$(stat -f %z "$DMG")
          echo "tauri dmg: $(hdiutil imageinfo "$DMG" | awk '/^Format:/ {print $2}'), $before bytes"

          ULMO="$RUNNER_TEMP/FASTag-ulmo.dmg"
          rm -f "$ULMO"
          hdiutil convert "$DMG" -format ULMO -o "$ULMO"
          fmt=$(hdiutil imageinfo "$ULMO" | awk '/^Format:/ {print $2}')
          [ "$fmt" = "ULMO" ] || { echo "::error::converted image is $fmt, not ULMO"; exit 1; }
          hdiutil verify "$ULMO"
          mv -f "$ULMO" "$DMG"

          if [ "$SIGNED" = "true" ]; then
            codesign --force --sign "$MACOS_SIGNING_IDENTITY" --timestamp "$DMG"
            codesign --verify --strict --verbose=2 "$DMG"
            xcrun notarytool submit "$DMG" \
              --apple-id "$MACOS_APPLE_ID" --team-id "$MACOS_TEAM_ID" \
              --password "$MACOS_NOTARY_PASSWORD" --wait
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          else
            echo "::warning::unsigned dry run: the ULMO dmg is neither signed nor notarized"
          fi

          # Portability on the shipped image: mount it read-only, run the
          # bundled CLI from inside it with nothing from this runner on PATH.
          MNT="$RUNNER_TEMP/fastag-dmg-mnt"
          mkdir -p "$MNT"
          hdiutil attach "$DMG" -readonly -nobrowse -noautoopen -mountpoint "$MNT"
          trap 'hdiutil detach "$MNT" -force >/dev/null 2>&1 || true' EXIT
          apps=("$MNT"/*.app)
          [ ${#apps[@]} -eq 1 ] || { echo "::error::expected one .app in the dmg, found ${#apps[@]}"; exit 1; }
          CLI="${apps[0]}/Contents/Resources/resources/fastag/bin/FASTag"
          [ -x "$CLI" ] || CLI=$(find "${apps[0]}/Contents/Resources" -path '*/fastag/bin/FASTag' -type f -perm -u+x | head -1)
          [ -n "$CLI" ] && [ -x "$CLI" ] || { echo "::error::no bundled CLI in the mounted app"; exit 1; }
          env -i HOME="$HOME" "$CLI" --help > "$RUNNER_TEMP/dmg-help.txt" 2>&1 \
            || { echo "::error::the CLI inside the mounted dmg does not run"; cat "$RUNNER_TEMP/dmg-help.txt"; exit 1; }
          want=$(sed -n 's/^project(FASTag VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          grep -q "^Version: $want" "$RUNNER_TEMP/dmg-help.txt" \
            || { echo "::error::the CLI inside the dmg does not report version $want"; grep '^Version: ' "$RUNNER_TEMP/dmg-help.txt" || true; exit 1; }
          if [ "$SIGNED" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "${apps[0]}"
            xcrun stapler validate "${apps[0]}"
          fi
          hdiutil detach "$MNT"
          trap - EXIT

          size=$(stat -f %z "$DMG")
          limit=$((310 * 1000 * 1000))
          mb() { awk -v b="$1" 'BEGIN { printf "%.1f", b / 1000000 }'; }
          echo "ULMO dmg: $size bytes ($(mb "$size") MB), was $before bytes; ceiling $limit bytes (310 MB)"
          echo "### Desktop dmg: $(mb "$size") MB (ULMO), from $(mb "$before") MB (UDZO); ceiling 310 MB" >> "$GITHUB_STEP_SUMMARY"
          [ "$size" -le "$limit" ] || { echo "::error::the desktop dmg is $(mb "$size") MB, above the 310 MB ceiling"; exit 1; }

      - name: Attach the signed desktop app to the release (macOS)
        if: steps.mac-signing.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(gui/src-tauri/target/release/bundle/dmg/*.dmg)
          [ ${#dmgs[@]} -gt 0 ] || { echo "::error::tauri produced no .dmg"; exit 1; }
          DMG="${dmgs[0]}"
          cp "$DMG" "FASTag-gui-${{ matrix.name }}.dmg"
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Automated binary upload; release notes pending." \
            2>/dev/null || true
          gh release upload "${{ github.ref_name }}" "FASTag-gui-${{ matrix.name }}.dmg" --clobber

      # A dry run has no release to attach to, so the .dmg comes back as a
      # workflow artifact to be opened and checked by hand.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.gui_dry_run && matrix.name == 'macos-arm64'
        with:
          name: FASTag-gui-${{ matrix.name }}-dryrun
          path: gui/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # Filenames deliberately carry no version: the README links
      # /releases/latest/download/FASTag-<platform>.tar.gz, a GitHub URL form
      # that always resolves to whatever the newest release's file of that
      # name is. Each new tag's build overwrites the same name inside its OWN
      # release, so nothing else needs to change when this table gets a new
      # row.
      #
      # `gh release create ... || true`: this job runs once per matrix entry,
      # so whichever platform's build finishes first creates the release (a
      # placeholder, if the real notes have not been written yet -- edited in
      # afterward without touching assets); every later entry's create call
      # fails harmlessly because it already exists, then --clobber lets each
      # attach its own binary regardless of arrival order.
      #
      # Archives the WHOLE dist/FASTag/ folder now, not a single file: users
      # run FASTag/FASTag (the wrapper), not the FASTag.bin it execs.
      # ---------------------------------------------------------------------
      # A signed, notarized, STAPLED disk image of the CLI.
      #
      # Why a .dmg when the tarball already carries the same signed binaries:
      # Apple staples a notarization ticket only to app bundles, installers and
      # DISK IMAGES -- never a lone Mach-O or a plain folder. The tarball is
      # therefore verified by an ONLINE Gatekeeper lookup on first run, which
      # fails for a user who is offline or behind a proxy that blocks Apple.
      # The disk image can carry its ticket, so it opens with no network at all.
      # Both ship: the .dmg for people installing by hand, the tarball for
      # scripts and CI, where mounting an image is a nuisance.
      #
      # Built AFTER the taxonomy embed so the image contains a complete,
      # -species-capable install, and BEFORE the keychain teardown because
      # signing the image needs the identity.
      - name: Package the CLI as a signed, notarized disk image (macOS)
        if: steps.mac-signing.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 90
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="FASTag-${{ matrix.name }}.dmg"
          STAGE="${RUNNER_TEMP}/dmgroot"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R dist/FASTag "$STAGE/FASTag"

          # A custom volume icon needs THREE things, and missing any one leaves
          # the generic white disk: the icon at the volume root named
          # .VolumeIcon.icns, the volume's "has custom icon" Finder flag, and a
          # writable image while both are set -- a UDZO image is read-only, so
          # this builds UDRW first and converts afterwards.
          cp gui/src-tauri/icons/icon.icns "$STAGE/.VolumeIcon.icns"
          RW="${RUNNER_TEMP}/FASTag-rw.dmg"
          rm -f "$RW"
          hdiutil create -volname "FASTag" -srcfolder "$STAGE" -ov -format UDRW "$RW"
          MNT=$(hdiutil attach -readwrite -noverify -noautoopen "$RW" | grep -o '/Volumes/.*' | head -1)
          SetFile -a C "$MNT" || echo "::warning::SetFile unavailable; the disk image will use the generic icon"
          hdiutil detach "$MNT" -quiet
          rm -f "$DMG"
          hdiutil convert "$RW" -format UDZO -o "$DMG"
          rm -f "$RW"

          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$MACOS_APPLE_ID" --team-id "$MACOS_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" --wait
          xcrun stapler staple "$DMG"
          # Refuse to ship an image whose ticket is not attached -- that is the
          # entire reason this artifact exists.
          xcrun stapler validate "$DMG"

      # Placed last on purpose: everything above that needs the identity has
      # run. `always()` so a failure earlier still tears the keychain down.
      - name: Delete signing keychain (macOS)
        if: always() && steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        run: security delete-keychain "${RUNNER_TEMP}/fastag-signing.keychain-db" || true

      - name: Attach binary to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Automated binary upload; release notes pending." \
            2>/dev/null || true
          # macOS ships the DISK IMAGE ONLY. The tarball cannot carry a
          # notarization ticket -- Apple staples one to disk images, installers
          # and app bundles, never a plain folder -- so shipping both meant
          # offering a second artifact that was strictly worse and warned on a
          # machine with no network. One artifact, one behaviour.
          #
          # The tarball is still built and uploaded when signing is NOT
          # configured, because an unsigned .dmg cannot be produced at all and
          # shipping nothing for macOS would be worse than shipping a tarball.
          if [ -f "FASTag-${{ matrix.name }}.dmg" ]; then
            gh release upload "${{ github.ref_name }}" "FASTag-${{ matrix.name }}.dmg" --clobber
          else
            tar -C dist -czf "FASTag-${{ matrix.name }}.tar.gz" FASTag
            gh release upload "${{ github.ref_name }}" "FASTag-${{ matrix.name }}.tar.gz" --clobber
          fi

  # ----------------------------------------------------------- GUI checks
  # Independent on purpose: no `needs:` -- waiting for OpenMS to test
  # TypeScript would make nobody run it. webkit2gtk/rsvg are what the tauri
  # crate links on Linux; without them cargo cannot even typecheck the backend.
  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Tauri build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev
      - name: Frontend typecheck + tests + build
        working-directory: gui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      # Tauri's build script refuses to compile unless every path in
      # tauri.conf.json's bundle.resources exists -- and resources/fastag is
      # the machine-specific 1.4 GB CLI+dylib+taxonomy bundle, gitignored by
      # gui/src-tauri/.gitignore and absent from a fresh checkout. The library
      # tests are pure logic (arg building, settings, species/taxdb parsing,
      # the results browser) and never read it, so an empty placeholder is
      # exactly enough. Verified locally by reproducing the CI condition:
      # without the directory cargo fails with "resource path
      # `resources/fastag` doesn't exist"; with an empty one the lib tests pass
      # (91 on macOS from P0b, 73 from P0a, 54 before). The run lifecycle tests drive
      # gui/testing/stub-fastag, a sh script, instead of the CLI.
      - name: Backend unit tests
        working-directory: gui/src-tauri
        run: |
          mkdir -p resources/fastag
          cargo test --lib
          # The browser bench (P0b) is not run here, only kept compiling.
          cargo check --example browser_bench

  # ------------------------------------------------ tauri-driver (Linux)
  # GUI-DESIGN section 9, layer 4: the real debug app in WebKitGTK through
  # tauri-driver + WebKitWebDriver under xvfb, on ubuntu-22.04 (the oldest
  # supported base). Every push and PR runs gui/e2e-tauri against the stub
  # CLI (gui/testing/stub-fastag); before a tag, gui-linux-smoke-deb runs
  # the same specs against the installed .deb and its real CLI. Probe, run,
  # table, cancel, and two recorded WebKitGTK gates: time to first rows on a
  # generated 1M-row file and the IPC message rate of a chatty run.
  # Informational in P1-P4 (required from P5), hence continue-on-error.
  # Independent of the CLI build, like the gui job.
  tauri-driver:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Tauri build deps, WebKitWebDriver, a display and a session bus
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev \
            webkit2gtk-driver xvfb dbus-x11
          command -v WebKitWebDriver
      - name: Restore tauri-driver
        id: tauri-driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-ubuntu-22.04
      - name: Install tauri-driver
        if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: |
          rustup update stable --no-self-update
          cargo +stable install tauri-driver --version 2.1.0 --locked
      # The debug app with the stub as its CLI (FASTAG_BIN, set by run.sh):
      # resources/fastag only has to exist, as in the gui job.
      - name: Build the debug app
        working-directory: gui
        run: |
          npm ci
          mkdir -p src-tauri/resources/fastag
          npx tauri build --debug --no-bundle
          test -x src-tauri/target/debug/fastag
      - name: tauri-driver specs (stub CLI)
        working-directory: gui
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" bash e2e-tauri/run.sh stub
      - name: Record the WebKitGTK gates
        if: always()
        run: |
          f=gui/e2e-tauri/results/tauri-driver-stub.json
          if [ -f "$f" ]; then
            { echo '### tauri-driver (stub CLI, ubuntu-22.04)'; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: tauri-driver-stub
          path: gui/e2e-tauri/results
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------- desktop app (Linux)
  # GUI-DESIGN section 8, Linux (D4). NOT on the linux-x64 leg: that leg runs
  # every step in the micromamba env with conda's pkg-config, compilers and
  # sysroot 2.28, and webkit2gtk-sys / gtk-sys would resolve against those,
  # not apt's libwebkit2gtk-4.1-dev. This job runs outside conda on
  # ubuntu-22.04 (glibc 2.35, the oldest base Tauri supports with
  # webkit2gtk-4.1, which is the floor the README states) with plain apt.
  #
  # The CLI comes from the linux-x64 leg's portable tarball and is staged in
  # the layout resolve_binary() in gui/src-tauri/src/fastag.rs expects, as
  # the macOS leg stages its signed CLI. Assets: a .deb and a tarball (the
  # .deb's /usr tree, relocatable: tauri finds resources in
  # <exe>/../lib/FASTag), then a best-effort AppImage. Runs on a v* tag and
  # on a gui_dry_run dispatch; nothing is attached here -- the smoke jobs
  # below test the artifact first, and gui-linux-release attaches it.
  gui-linux:
    name: gui-linux-x64
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.gui_dry_run) }}
    needs: [build]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      appimage: ${{ steps.appimage.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FASTag-linux-x64-portable
          path: ${{ runner.temp }}/cli
      - name: Stage the portable CLI as the app's bundled resources
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/cli/FASTag-linux-x64-portable.tar.gz" -C "$RUNNER_TEMP/cli"
          D="$RUNNER_TEMP/cli/FASTag"
          R=gui/src-tauri/resources/fastag
          rm -rf "$R"; mkdir -p "$R/bin" "$R/share/FASTag"
          # bin/FASTag is the real binary, not the wrapper: the app sets
          # OPENMS_DATA_PATH itself. Its RPATH is $ORIGIN/lib, so lib/ goes
          # beside it. -L throughout: Tauri's resource bundler skips
          # symlinks, and lib/ carries soname links.
          cp "$D/FASTag.bin" "$R/bin/FASTag"
          cp -RL "$D/lib" "$R/bin/lib"
          cp -RL "$D/share-OpenMS" "$R/share/OpenMS"
          cp -RL "$D/share-FASTag-taxonomy" "$R/share/FASTag/taxonomy"
          cp -RL "$D/share-FASTag-digest" "$R/share/FASTag/digest"
          cp "$D/LICENSE" "$D/THIRD-PARTY-NOTICES.txt" "$R/"
          test -x "$R/bin/FASTag"
          test -s "$R/share/OpenMS/examples/ID/Ecoli_MS2_small.mzML"
          # A tag build carries the k-mer index (the linux-x64 leg embeds it
          # on tags); a dry run has none, as on macOS.
          if [ -s "$R/share/FASTag/taxonomy/tax_k7.taxdb" ]; then
            echo "taxonomy index present: $(du -h "$R/share/FASTag/taxonomy/tax_k7.taxdb" | cut -f1)"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "::error::the Linux app bundle has no tax_k7.taxdb -- -species would fail in the shipped app"
            exit 1
          else
            echo "::warning::no taxonomy index (not a tag build); -species unavailable in this app"
          fi
          # Run the CLI as the app will, with nothing of this runner's
          # environment, and check it reports FASTag's version.
          env -i HOME="$HOME" OPENMS_DATA_PATH="$R/share/OpenMS" "$R/bin/FASTag" --help > /tmp/bundle-help.txt 2>&1 \
            || { echo "::error::the staged CLI does not run"; cat /tmp/bundle-help.txt; exit 1; }
          want=$(sed -n 's/^project(FASTag VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          grep -q "^Version: $want" /tmp/bundle-help.txt \
            || { echo "::error::the staged CLI does not report version $want"; grep '^Version: ' /tmp/bundle-help.txt || true; exit 1; }
          du -sh "$R"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Tauri build deps (apt, no conda)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev file xdg-utils
          ldd --version | head -1
          pkg-config --modversion webkit2gtk-4.1
      - name: Build the .deb
        working-directory: gui
        run: |
          npm ci
          npx tauri build --bundles deb
          ls -la src-tauri/target/release/bundle/deb/
      # Best-effort (GUI-DESIGN section 8): linuxdeploy also bundles
      # WebKitGTK and GStreamer on top of the resources, and a failure here
      # must not hold back the .deb and the tarball. NO_STRIP: linuxdeploy's
      # bundled strip cannot read the newer ELF sections of the libraries.
      - name: Build the AppImage (best-effort)
        id: appimage
        continue-on-error: true
        working-directory: gui
        env:
          NO_STRIP: 'true'
        run: |
          set -euo pipefail
          npx tauri build --bundles appimage
          ls -la src-tauri/target/release/bundle/appimage/
          compgen -G 'src-tauri/target/release/bundle/appimage/*.AppImage' > /dev/null
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Name the assets, make the tarball, check the .deb
        shell: bash
        run: |
          set -euo pipefail
          B=gui/src-tauri/target/release/bundle
          shopt -s nullglob
          debs=("$B"/deb/*.deb)
          [ ${#debs[@]} -eq 1 ] || { echo "::error::expected one .deb from tauri, found ${#debs[@]}"; exit 1; }
          cp "${debs[0]}" FASTag-gui-linux-x64.deb
          dpkg-deb -I FASTag-gui-linux-x64.deb
          dep=$(dpkg-deb -f FASTag-gui-linux-x64.deb Depends)
          for want in libwebkit2gtk-4.1-0 libgtk-3-0; do
            grep -q "$want" <<< "$dep" || { echo "::error::the .deb does not depend on $want (Depends: $dep)"; exit 1; }
          done
          X="$RUNNER_TEMP/debx"; rm -rf "$X"; dpkg-deb -x FASTag-gui-linux-x64.deb "$X"
          cli=$(find "$X" -path '*/resources/fastag/bin/FASTag' -type f -perm -u+x | head -1)
          [ -n "$cli" ] || { echo "::error::the .deb carries no executable resources/fastag/bin/FASTag"; exit 1; }
          echo "CLI in the .deb: ${cli#"$X"}"
          T="$RUNNER_TEMP/guitar"; rm -rf "$T"; mkdir -p "$T"
          cp -a "$X/usr" "$T/FASTag-gui"
          tar -C "$T" -czf FASTag-gui-linux-x64.tar.gz FASTag-gui
          apps=("$B"/appimage/*.AppImage)
          if [ ${#apps[@]} -eq 1 ]; then cp "${apps[0]}" FASTag-gui-linux-x64.AppImage; fi
          # GitHub refuses a release asset of 2 GiB or more.
          mb() { awk -v b="$1" 'BEGIN { printf "%.1f", b / 1000000 }'; }
          echo "### Linux desktop app (ubuntu-22.04, glibc $(ldd --version | head -1 | awk '{print $NF}'), WebKitGTK $(pkg-config --modversion webkit2gtk-4.1))" >> "$GITHUB_STEP_SUMMARY"
          for f in FASTag-gui-linux-x64.*; do
            size=$(stat -c %s "$f")
            echo "- $f: $(mb "$size") MB" >> "$GITHUB_STEP_SUMMARY"
            [ "$size" -lt 2147483648 ] || { echo "::error::$f is $(mb "$size") MB, at or above GitHub's 2 GiB asset limit"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FASTag-gui-linux-x64
          path: FASTag-gui-linux-x64.*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  # The .deb installs and runs on the oldest and the newest supported Ubuntu
  # LTS (P1 acceptance): apt resolves its dependencies, the bundled CLI runs
  # the E. coli fixture from the installed path with an empty environment,
  # and the app starts under xvfb and stays up. Then the tauri-driver specs
  # run against the installed app and its real CLI (informational, as in the
  # tauri-driver job).
  gui-linux-smoke-deb:
    name: gui-linux .deb on ${{ matrix.os }}
    if: ${{ !cancelled() && needs.gui-linux.result == 'success' }}
    needs: [gui-linux]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FASTag-gui-linux-x64
          path: ${{ runner.temp }}/gui
      - name: Install the .deb
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q "$RUNNER_TEMP/gui/FASTag-gui-linux-x64.deb" xvfb dbus dbus-x11
          PKG=$(dpkg-deb -f "$RUNNER_TEMP/gui/FASTag-gui-linux-x64.deb" Package)
          dpkg -s "$PKG" | head -12
          APP=$(dpkg -L "$PKG" | grep '^/usr/bin/' | head -1)
          [ -x "$APP" ] || { echo "::error::the package installs no program in /usr/bin"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
      - name: The installed CLI runs a fixture
        run: |
          set -euo pipefail
          CLI=$(dpkg -L "$PKG" | grep '/resources/fastag/bin/FASTag$')
          DATA="$(dirname "$(dirname "$CLI")")/share/OpenMS"
          want=$(sed -n 's/^project(FASTag VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          env -i HOME="$HOME" OPENMS_DATA_PATH="$DATA" "$CLI" --help > "$RUNNER_TEMP/help.txt" 2>&1 || true
          grep -q "^Version: $want" "$RUNNER_TEMP/help.txt" \
            || { cat "$RUNNER_TEMP/help.txt"; echo "::error::the installed CLI does not report version $want"; exit 1; }
          W="$RUNNER_TEMP/fixture"; mkdir -p "$W"
          cp test/fixtures/Ecoli_MS2_small.mzML "$W/"
          env -i HOME="$HOME" PATH=/usr/bin:/bin OPENMS_DATA_PATH="$DATA" "$CLI" \
            -in "$W/Ecoli_MS2_small.mzML" -out "$W/ecoli.tags.tsv" -threads 2
          n=$(($(wc -l < "$W/ecoli.tags.tsv") - 1))
          [ "$n" -gt 0 ] || { echo "::error::the installed CLI wrote no tags"; exit 1; }
          echo "installed CLI ($CLI): $n tags from the E. coli fixture"
      - name: The installed app starts and stays up
        run: |
          # The default shell is bash -e: without +e the expected 124 from
          # timeout would end the step before rc is read.
          set +e -uo pipefail
          dbus-run-session -- xvfb-run -a timeout 20 "$APP" > "$RUNNER_TEMP/app.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/app.log"
          [ "$rc" -eq 124 ] || { echo "::error::$APP exited with $rc within 20 s"; exit 1; }
          if grep -qiE 'error while loading shared libraries|cannot open shared object|panicked|Gdk-ERROR|bwrap:' "$RUNNER_TEMP/app.log"; then
            echo "::error::$APP logged a fatal start-up error"; exit 1
          fi
          echo "### .deb on ${{ matrix.os }}: installs, runs the fixture, the app stays up" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: WebKitWebDriver
        run: sudo apt-get install -y -q webkit2gtk-driver
      - name: Restore tauri-driver
        id: tauri-driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ matrix.os }}
      - name: Install tauri-driver
        if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: |
          rustup update stable --no-self-update
          cargo +stable install tauri-driver --version 2.1.0 --locked
      - name: tauri-driver specs against the installed app (real CLI)
        id: real-specs
        continue-on-error: true
        working-directory: gui
        env:
          FASTAG_APP: ${{ env.APP }}
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" bash e2e-tauri/run.sh real
      - name: Record the WebKitGTK gates
        if: always()
        run: |
          f=gui/e2e-tauri/results/tauri-driver-real.json
          if [ -f "$f" ]; then
            { echo "### tauri-driver (real CLI, installed .deb, ${{ matrix.os }}): ${{ steps.real-specs.outcome }}"; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: tauri-driver-real-${{ matrix.os }}
          path: gui/e2e-tauri/results
          if-no-files-found: ignore
          retention-days: 14

  # The AppImage launches on 22.04 and 24.04 with FUSE 2 (libfuse2 /
  # libfuse2t64, absent on a fresh 24.04).
  gui-linux-smoke-appimage:
    name: gui-linux AppImage on ${{ matrix.os }}
    if: ${{ !cancelled() && needs.gui-linux.outputs.appimage == 'true' }}
    needs: [gui-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            fuse: libfuse2
          - os: ubuntu-24.04
            fuse: libfuse2t64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FASTag-gui-linux-x64
          path: ${{ runner.temp }}/gui
      - name: The AppImage launches
        run: |
          # The default shell is bash -e: without +e the expected 124 from
          # timeout would end the step before rc is read.
          set +e -uo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q ${{ matrix.fuse }} xvfb dbus dbus-x11
          A="$RUNNER_TEMP/gui/FASTag-gui-linux-x64.AppImage"
          chmod +x "$A"
          dbus-run-session -- xvfb-run -a timeout 30 "$A" > "$RUNNER_TEMP/app.log" 2>&1
          rc=$?
          tail -100 "$RUNNER_TEMP/app.log"
          [ "$rc" -eq 124 ] || { echo "::error::the AppImage exited with $rc within 30 s"; exit 1; }
          if grep -qiE 'error while loading shared libraries|cannot open shared object|panicked|Gdk-ERROR|bwrap:' "$RUNNER_TEMP/app.log"; then
            echo "::error::the AppImage logged a fatal start-up error"; exit 1
          fi
          echo "### AppImage on ${{ matrix.os }}: launches and stays up" >> "$GITHUB_STEP_SUMMARY"

  # Rocky 9 (RHEL 9): decision Q13 puts the GUI floor at glibc 2.35 /
  # WebKitGTK 4.1 and names Rocky 9 among the supported systems, on the
  # condition that P1 confirms Rocky 9 ships WebKitGTK 4.1. The first step is
  # that confirmation (which package and repository provide
  # libwebkit2gtk-4.1.so.0); the second launches the AppImage. A container
  # has no /dev/fuse, so the AppImage runs extracted
  # (APPIMAGE_EXTRACT_AND_RUN=1).
  gui-linux-smoke-rocky9:
    name: gui-linux AppImage on Rocky 9
    if: ${{ !cancelled() && needs.gui-linux.outputs.appimage == 'true' }}
    needs: [gui-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: rockylinux/rockylinux:9.8@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FASTag-gui-linux-x64
          path: ${{ runner.temp }}/gui
      # A finding, not a launch gate: its answer decides whether the README
      # may name Rocky 9 for the .deb-style (system WebKitGTK) install, and
      # it must not keep the AppImage launch below from running.
      - name: Does Rocky 9 ship WebKitGTK 4.1? (Q13)
        continue-on-error: true
        run: |
          set -euo pipefail
          dnf -y -q install epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y -q makecache
          q() { dnf repoquery -q "$@" --qf '%{name}-%{version}-%{release}.%{arch} from %{repoid}' | sort -u; }
          {
            echo "### Q13: WebKitGTK on $(cat /etc/rocky-release) (BaseOS, AppStream, CRB, EPEL)"
            echo "- libwebkit2gtk-4.1.so.0: $(q --whatprovides 'libwebkit2gtk-4.1.so.0()(64bit)' | paste -sd ' ' -)"
            echo "- pkgconfig(webkit2gtk-4.1): $(q --whatprovides 'pkgconfig(webkit2gtk-4.1)' | paste -sd ' ' -)"
            echo "- libwebkit2gtk-4.0.so.37: $(q --whatprovides 'libwebkit2gtk-4.0.so.37()(64bit)' | paste -sd ' ' -)"
            echo "- webkit2gtk* packages: $(q 'webkit2gtk*' | paste -sd ' ' -)"
          } | tee /tmp/q13.md
          cat /tmp/q13.md >> "$GITHUB_STEP_SUMMARY"
          q --whatprovides 'libwebkit2gtk-4.1.so.0()(64bit)' | grep -q . \
            || { echo "::warning::no Rocky 9 repository provides libwebkit2gtk-4.1.so.0: only the AppImage, which bundles WebKitGTK, can run there"; exit 1; }
      - name: The AppImage launches
        run: |
          # The default shell is bash -e: without +e the expected 124 from
          # timeout would end the step before rc is read.
          set +e -uo pipefail
          dnf -y -q install xorg-x11-server-Xvfb /usr/bin/dbus-run-session mesa-dri-drivers \
            mesa-libGL mesa-libEGL libX11 libxcb fontconfig procps-ng findutils
          A="$RUNNER_TEMP/gui/FASTag-gui-linux-x64.AppImage"
          chmod +x "$A"
          Xvfb :99 -screen 0 1440x900x24 > /tmp/xvfb.log 2>&1 &
          export DISPLAY=:99 APPIMAGE_EXTRACT_AND_RUN=1
          sleep 2
          # The extraction of the 1.4 GB payload counts against the clock.
          dbus-run-session -- timeout 120 "$A" > /tmp/app.log 2>&1
          rc=$?
          tail -100 /tmp/app.log
          [ "$rc" -eq 124 ] || { echo "::error::the AppImage exited with $rc on Rocky 9"; exit 1; }
          if grep -qiE 'error while loading shared libraries|cannot open shared object|panicked|Gdk-ERROR' /tmp/app.log; then
            echo "::error::the AppImage logged a fatal start-up error on Rocky 9"; exit 1
          fi
          echo "### AppImage on Rocky 9: launches and stays up" >> "$GITHUB_STEP_SUMMARY"

  # Attaches the Linux desktop app to the release, mirroring the macOS and
  # Windows attach steps (versionless names, so the README's
  # /releases/latest/download/ links resolve), but only after the .deb smoke
  # passed on both Ubuntu releases. The AppImage goes up only when it
  # launched on all three systems. Never on a dry run: that run's artifact
  # FASTag-gui-linux-x64 is the thing to open and check by hand.
  gui-linux-release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.gui-linux-smoke-deb.result == 'success' }}
    needs: [gui-linux, gui-linux-smoke-deb, gui-linux-smoke-appimage, gui-linux-smoke-rocky9]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FASTag-gui-linux-x64
          path: gui-linux
      - name: Attach the Linux desktop app to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APPIMAGE_OK: ${{ needs.gui-linux-smoke-appimage.result == 'success' && needs.gui-linux-smoke-rocky9.result == 'success' }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Automated binary upload; release notes pending." \
            2>/dev/null || true
          gh release upload "${{ github.ref_name }}" \
            gui-linux/FASTag-gui-linux-x64.deb gui-linux/FASTag-gui-linux-x64.tar.gz --clobber
          if [ "$APPIMAGE_OK" = "true" ] && [ -f gui-linux/FASTag-gui-linux-x64.AppImage ]; then
            gh release upload "${{ github.ref_name }}" gui-linux/FASTag-gui-linux-x64.AppImage --clobber
          else
            echo "::warning::no AppImage on this release (not built, or it did not launch on every smoke system)"
          fi

  # ---------------------------------------------------- release data asset
  # Copies the pinned taxonomy tarball onto the new release as a standalone
  # asset (index-only upgrades, GUI bundling, the README download). Its own
  # job, independent of every platform leg: a platform failure must not leave
  # a release without the asset. Creates the release if it is first to arrive
  # (same harmless-race pattern as the attach steps).
  taxonomy-asset:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Copy the pinned taxonomy asset onto this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Automated binary upload; release notes pending." \
            2>/dev/null || true
          gh release download "$TAXDB_TAG" -p 'FASTag-taxonomy-k7.tar.gz*' -D .
          got=$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" FASTag-taxonomy-k7.tar.gz)
          [ "$got" = "$TAXDB_SHA256" ] || { echo "taxonomy sha256 mismatch: $got"; exit 1; }
          # The same tarball recompressed with xz -9 (449.5 MB -> about 240
          # MB). Made here rather than on the data tag, whose assets are never
          # mutated. The tar stream inside is byte-identical to the pinned
          # one, which is checked before anything is uploaded. The .tar.gz
          # stays for now: the CLI's own "index missing" message, the README
          # and installs scripted against 1.11.0 name it. Drop it once those
          # point at the .tar.xz.
          gzip -dc FASTag-taxonomy-k7.tar.gz | xz -9 -T0 -c > FASTag-taxonomy-k7.tar.xz
          a=$(gzip -dc FASTag-taxonomy-k7.tar.gz | sha256sum | cut -d' ' -f1)
          b=$(xz -dc FASTag-taxonomy-k7.tar.xz | sha256sum | cut -d' ' -f1)
          [ "$a" = "$b" ] || { echo "::error::the .tar.xz does not hold the pinned tar stream"; exit 1; }
          sha256sum FASTag-taxonomy-k7.tar.xz > FASTag-taxonomy-k7.tar.xz.sha256
          ls -l FASTag-taxonomy-k7.tar.gz FASTag-taxonomy-k7.tar.xz
          gh release upload "${{ github.ref_name }}" \
            FASTag-taxonomy-k7.tar.gz FASTag-taxonomy-k7.tar.gz.sha256 \
            FASTag-taxonomy-k7.tar.xz FASTag-taxonomy-k7.tar.xz.sha256 --clobber

  # ------------------------------------------------- release completeness
  # No more silently partial releases: v0.19.1 went out with no linux-x64
  # tarball and nobody noticed. Red when any asset THIS workflow owns is
  # missing after all legs finish. The Windows zip is asserted by the mirror
  # job at the end of windows.yml instead -- that workflow is the long pole,
  # so by its end every asset should exist and it checks the FULL list.
  # Non-destructive: the release stays up; the red run is the signal.
  release-complete:
    # !cancelled(), not always(): cancel-in-progress on a superseding push
    # would otherwise turn the cancelled run's completeness check red for
    # uploads the NEW run will finish.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, taxonomy-asset, gui-linux-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Assert this workflow's assets are on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # macOS ships DISK IMAGES, not tarballs -- a stapled ticket needs a
          # .app/.pkg/.dmg to live on. This list lagged that change and failed
          # v1.4.2 on assets that are deliberately no longer built, which is the
          # gate working: it compares what shipped against what we SAID ships,
          # so it fires on a stale expectation as loudly as on a missing file.
          # The Linux desktop app from 1.13.0 (P1): the .deb and the tarball;
          # the AppImage is best-effort and not asserted.
          want="FASTag-linux-x64.tar.gz FASTag-linux-arm64.tar.gz \
                FASTag-macos-arm64.dmg FASTag-gui-macos-arm64.dmg \
                FASTag-gui-linux-x64.deb FASTag-gui-linux-x64.tar.gz \
                FASTag-taxonomy-k7.tar.gz FASTag-taxonomy-k7.tar.gz.sha256 \
                FASTag-taxonomy-k7.tar.xz FASTag-taxonomy-k7.tar.xz.sha256"
          have=$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name')
          missing=0
          for a in $want; do
            echo "$have" | grep -qx "$a" || { echo "MISSING: $a"; missing=1; }
          done
          exit $missing

  # ------------------------------------------------- Homebrew tap (macOS)
  # okohlbacher/homebrew-fastag carries two casks (fastag = the desktop app,
  # fastag-cli = the command line) that download this release's two macOS
  # disk images (Apple silicon only since 1.8.0). Its own workflow rewrites
  # version + sha256, audits, installs and commits when this job dispatches
  # it. Dispatching needs a fine-grained PAT (secret HOMEBREW_TAP_TOKEN:
  # repository access ONLY okohlbacher/homebrew-fastag, permission
  # "Actions: Read and write") because GITHUB_TOKEN is scoped to this
  # repository and cannot dispatch a workflow in another one.
  #
  # Ordering: both casked images are built by THIS workflow, and
  # release-complete asserts they are on the release, so gating on it is
  # enough -- the Windows zip (windows.yml) is not part of any cask.
  #
  # FAILS LOUDLY. Up to 1.11.0 a missing token was only a ::notice and the job
  # went green, relying on the tap's 6-hourly schedule; the secret was never
  # set, so every release waited up to 6 h for the schedule (1.10.0 and 1.11.0
  # were dispatched by hand instead). Now a tag build without the token, or
  # with one that cannot dispatch, is red. `secrets.*` cannot appear in an `if:`
  # (0-job startup_failure), so the presence check is a step output, same
  # pattern as the signing gate above.
  #
  # tap_dry_run (workflow_dispatch) runs this job without a tag: it checks the
  # token exists and can see the tap's workflow, and dispatches nothing.
  homebrew-tap:
    if: ${{ !cancelled() && (needs.release-complete.result == 'success' || inputs.tap_dry_run) }}
    needs: [release-complete]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Detect the tap token
        id: tap-token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error title=Homebrew tap not updated::secret HOMEBREW_TAP_TOKEN is not set in okohlbacher/FASTag. Add a fine-grained PAT (repository access: only okohlbacher/homebrew-fastag; permission Actions: Read and write), then publish this release with: gh workflow run update-casks.yml -R okohlbacher/homebrew-fastag -f tag=$TAG"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Check the token can reach the tap's workflow (dry run)
        if: steps.tap-token.outputs.enabled == 'true' && inputs.tap_dry_run
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_REPO: okohlbacher/homebrew-fastag
        run: |
          set -euo pipefail
          # Read-only: proves the secret is a live token with Actions access
          # to the tap. Write access is only provable by dispatching, which a
          # dry run must not do.
          state=$(gh api "repos/$GH_REPO/actions/workflows/update-casks.yml" --jq .state)
          echo "update-casks.yml in $GH_REPO is '$state'; dry run, nothing dispatched"

      - name: Ask the tap to publish this release
        if: steps.tap-token.outputs.enabled == 'true' && !inputs.tap_dry_run && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_REPO: okohlbacher/homebrew-fastag
          # Through env and quoted below: a tag name is any valid Git ref,
          # not only vX.Y.Z, and the tap validates it again on its side.
          TAG: ${{ github.ref_name }}
        run: |
          # GitHub disables a scheduled workflow after 60 days without a
          # commit to its repository and then refuses to dispatch it, so
          # re-enable first; that is a no-op on an enabled workflow.
          if gh workflow enable update-casks.yml && gh workflow run update-casks.yml -f "tag=$TAG"; then
            echo "dispatched update-casks.yml in okohlbacher/homebrew-fastag for $TAG"
          else
            echo "::error title=Homebrew tap dispatch failed::could not dispatch update-casks.yml in okohlbacher/homebrew-fastag (expired HOMEBREW_TAP_TOKEN, or missing Actions: Read and write on the tap?). Publish by hand: gh workflow run update-casks.yml -R okohlbacher/homebrew-fastag -f tag=$TAG"
            exit 1
          fi
