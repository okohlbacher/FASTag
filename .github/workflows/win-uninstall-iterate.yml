# TEMPORARY (post1133/win-install): measure the uninstaller's leftovers after
# the app and CLI ran, against the installer of dry run 43350327135.
# Removed before the branch is proposed.
name: win-uninstall-iterate
on:
  push:
    branches: [post1133/win-install]
    paths: ['.github/workflows/win-uninstall-iterate.yml', 'tools/windows_uninstall_probe.ps1']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, variant: plain }
          - { os: windows-11-arm, variant: plain }
          - { os: windows-11-arm, variant: xtastop }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            tools
            test/fixtures
            CMakeLists.txt
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FASTag-gui-windows-x64-installer-check
          path: installer
          run-id: 43350327135
          github-token: ${{ github.token }}
      - name: Installed-app check (per user, kept)
        shell: pwsh
        run: |
          $i = Get-ChildItem installer -Recurse -Filter *-setup.exe | Select-Object -First 1
          ./tools/windows_installed_check.ps1 -Installer $i.FullName -Scope CurrentUser -Out "$env:RUNNER_TEMP\installed-check" -Keep
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Uninstall probe
        shell: pwsh
        run: ./tools/windows_uninstall_probe.ps1 -Dir x -Variant ${{ matrix.variant }}
