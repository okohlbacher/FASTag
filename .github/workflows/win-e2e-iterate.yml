# TEMPORARY (post1131/win-crash): iterate on windows.yml's installed-app job
# against the installer of dispatch run 43210084212 without rebuilding.
# Removed before the branch is proposed.
name: win-e2e-iterate
on:
  push:
    branches: [post1131/win-crash]
    paths: ['.github/workflows/win-e2e-iterate.yml', 'gui/e2e-tauri/**', 'tools/windows_installed_check.ps1']
permissions:
  contents: read
  actions: read
jobs:
  installed-app:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            tools
            test/fixtures
            gui/e2e-tauri
            CMakeLists.txt
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FASTag-gui-windows-x64-installer-check
          path: installer
          run-id: ${{ vars.E2E_ITERATE_RUN || '43210084212' }}
          github-token: ${{ github.token }}
      - name: Installed-app check
        shell: pwsh
        run: |
          $i = Get-ChildItem installer -Recurse -Filter *-setup.exe | Select-Object -First 1
          ./tools/windows_installed_check.ps1 -Installer $i.FullName -Dest "$env:RUNNER_TEMP\FASTag-app" -Out "$env:RUNNER_TEMP\installed-check" -Keep
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: The zip's FASTag.bat
        shell: pwsh
        run: |
          $bin = "$env:RUNNER_TEMP\FASTag-app\resources\fastag\bin"
          Copy-Item "$bin\FASTag.exe" "$bin\FASTag.core.exe"
          Copy-Item (Get-ChildItem installer -Recurse -Filter FASTag.bat | Select-Object -First 1).FullName "$bin\FASTag.bat"
          $o = cmd /c "`"$bin\FASTag.bat`" --help" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host ("FASTag.bat --help: exit {0} (0x{0:X8}); PROCESSOR_ARCHITECTURE={1}; PROCESSOR_IDENTIFIER={2}" -f $code, $env:PROCESSOR_ARCHITECTURE, $env:PROCESSOR_IDENTIFIER)
          Remove-Item "$bin\FASTag.core.exe", "$bin\FASTag.bat"
          if ($code -ne 0 -or $o -notmatch 'Version:\s*[0-9]') { Write-Host $o; Write-Host "::error::FASTag.bat cannot start the CLI"; exit 1 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: tauri-driver
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/$(if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }) -OutFile rustup-init.exe
            ./rustup-init.exe -y --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          cargo install tauri-driver --version 2.1.0 --locked
      - name: GUI end-to-end (installed app, real CLI)
        shell: pwsh
        run: |
          ./gui/e2e-tauri/run-windows.ps1 -App "$env:RUNNER_TEMP\FASTag-app\fastag.exe" -Out "$env:RUNNER_TEMP\e2e"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: FASTag-gui-e2e-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/e2e/screens
            ${{ runner.temp }}/e2e/windows-e2e.json
            ${{ runner.temp }}/e2e/tauri-driver.log*
            ${{ runner.temp }}/installed-check
          if-no-files-found: warn
      - name: Uninstall
        if: always()
        shell: pwsh
        run: if (Test-Path "$env:RUNNER_TEMP\FASTag-app\uninstall.exe") { Start-Process "$env:RUNNER_TEMP\FASTag-app\uninstall.exe" -ArgumentList '/S' -Wait }


  # x64 run time before (v1.13.2 zip) vs after (installer of run 43210084212,
  # the fix's build): same fixture, alternating, 7 repetitions each; the tags
  # TSVs must be identical apart from # lines.
  timing-x64:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: test/fixtures
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FASTag-gui-windows-x64-installer-check
          path: installer
          run-id: ${{ vars.E2E_ITERATE_RUN || '43210084212' }}
          github-token: ${{ github.token }}
      - name: Time before vs after
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.13.2 -R ${{ github.repository }} -p FASTag-windows-x64.zip -D old
          Expand-Archive old/FASTag-windows-x64.zip -DestinationPath old -Force
          $oldBat = (Resolve-Path old/FASTag/FASTag.bat).Path
          $i = Get-ChildItem installer -Recurse -Filter *-setup.exe | Select-Object -First 1
          $dest = "$env:RUNNER_TEMP\app"
          Start-Process $i.FullName -ArgumentList '/S', "/D=$dest" -Wait
          # The new CLI in the zip's layout: FASTag.core.exe + the new FASTag.bat + share-OpenMS.
          $new = "$env:RUNNER_TEMP\new"
          Copy-Item -Recurse "$dest\resources\fastag\bin" $new
          Move-Item "$new\FASTag.exe" "$new\FASTag.core.exe"
          Copy-Item -Recurse "$dest\resources\fastag\share\OpenMS" "$new\share-OpenMS"
          Copy-Item (Get-ChildItem installer -Recurse -Filter FASTag.bat | Select-Object -First 1).FullName "$new\FASTag.bat"
          $newBat = "$new\FASTag.bat"
          & $oldBat --help | Select-String 'Version' | Select-Object -First 1
          & $newBat --help | Select-String 'Version' | Select-Object -First 1
          $mz = (Resolve-Path test/fixtures/Ecoli_MS2_small.mzML).Path
          & $oldBat -in $mz -out "$env:RUNNER_TEMP\warm.tsv" | Out-Null
          & $newBat -in $mz -out "$env:RUNNER_TEMP\warm.tsv" | Out-Null
          $t = @{ old = @(); new = @() }
          foreach ($k in 1..7) {
            foreach ($w in 'old', 'new') {
              $bat = if ($w -eq 'old') { $oldBat } else { $newBat }
              $o = "$env:RUNNER_TEMP\$w.tags.tsv"
              $s = [Diagnostics.Stopwatch]::StartNew()
              & $bat -in $mz -out $o | Out-Null
              $s.Stop()
              if ($LASTEXITCODE) { Write-Host "::error::$w exited $LASTEXITCODE"; exit 1 }
              $t[$w] += $s.Elapsed.TotalSeconds
            }
          }
          foreach ($w in 'old', 'new') {
            $v = $t[$w] | Sort-Object
            Write-Host ("TIMING {0}: median {1:N3} s, min {2:N3}, max {3:N3}; all {4}" -f $w, $v[3], $v[0], $v[6], (($t[$w] | ForEach-Object { '{0:N3}' -f $_ }) -join ' '))
          }
          $a = Get-Content "$env:RUNNER_TEMP\old.tags.tsv" | Where-Object { -not $_.StartsWith('#') }
          $b = Get-Content "$env:RUNNER_TEMP\new.tags.tsv" | Where-Object { -not $_.StartsWith('#') }
          $d = Compare-Object $a $b -SyncWindow 0
          Write-Host ("TSV rows old {0}, new {1}; differing lines {2}" -f $a.Count, $b.Count, @($d).Count)
          Get-Content "$env:RUNNER_TEMP\old.tags.tsv" | Where-Object { $_.StartsWith('#') } | ForEach-Object { "old# $_" }
          Get-Content "$env:RUNNER_TEMP\new.tags.tsv" | Where-Object { $_.StartsWith('#') } | ForEach-Object { "new# $_" }
          if (@($d).Count) { $d | Select-Object -First 10 | Format-List | Out-String | Write-Host; exit 1 }
