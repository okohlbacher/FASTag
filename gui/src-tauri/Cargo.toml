[package]
name = "fastag"
version = "1.11.1"
description = "FASTag desktop GUI"
authors = ["Oliver Kohlbacher and contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "fastag_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[dev-dependencies]
# The accelerator parser of tauri's menus (tauri drops an accelerator it cannot
# parse without a word): menu.rs tests its strings with it. Same version as
# tauri's own.
muda = { version = "=0.19.3", default-features = false }
# getrusage for the peak-memory figures of examples/browser_bench.rs.
libc = "0.2"
