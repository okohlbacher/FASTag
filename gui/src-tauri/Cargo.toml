[package]
name = "fastag"
version = "1.12.0"
description = "FASTag desktop GUI"
authors = ["Oliver Kohlbacher and contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "fastag_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
