<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="FASTag">
  <title>FASTag</title>
  <!-- App icon: the mark from gui/src/assets/logo.svg (dark-theme colours) on a dark plate.
       The plate is 824 px inset in the 1024 canvas, as Apple's icon grid asks, so the icon
       has the same visual size as other apps in the Dock. Regenerate the icons with
       `npx tauri icon src-tauri/icon-source.svg` from gui/. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a33"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(214.9 224.1) scale(9.286)">
    <g fill="#939cab">
      <rect x="4" y="30" width="6" height="26" rx="3"/>
      <rect x="16" y="20" width="6" height="36" rx="3"/>
      <rect x="28" y="34" width="6" height="22" rx="3"/>
      <rect x="42" y="40" width="6" height="16" rx="3"/>
      <rect x="54" y="16" width="6" height="40" rx="3"/>
    </g>
    <g fill="#5c9dff">
      <rect x="4" y="6" width="14" height="8" rx="4"/>
      <rect x="20" y="6" width="12" height="8" rx="4"/>
    </g>
    <g fill="#f7b23b">
      <rect x="36" y="6" width="4" height="8" rx="2"/>
      <rect x="44" y="6" width="4" height="8" rx="2"/>
      <rect x="52" y="6" width="4" height="8" rx="2"/>
    </g>
  </g>
</svg>
