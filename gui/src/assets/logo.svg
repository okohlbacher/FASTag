<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FASTag">
  <title>FASTag</title>
  <!-- A gapped sequence tag over a spectrum: grey peaks are the evidence; the two blue
       bars are residues read from the mass differences between neighbouring peaks; the
       amber dots are a gap whose mass matches no single residue, spanning an unexplained peak. -->
  <style>
    .peak { fill: #5f6878 } .res { fill: #2f6fe0 } .gap { fill: #b56d00 }
    @media (prefers-color-scheme: dark) {
      .peak { fill: #939cab } .res { fill: #5c9dff } .gap { fill: #f7b23b }
    }
  </style>
  <g class="peak">
    <rect x="4" y="30" width="6" height="26" rx="3"/>
    <rect x="16" y="20" width="6" height="36" rx="3"/>
    <rect x="28" y="34" width="6" height="22" rx="3"/>
    <rect x="42" y="40" width="6" height="16" rx="3"/>
    <rect x="54" y="16" width="6" height="40" rx="3"/>
  </g>
  <g class="res">
    <rect x="4" y="6" width="14" height="8" rx="4"/>
    <rect x="20" y="6" width="12" height="8" rx="4"/>
  </g>
  <g class="gap">
    <rect x="36" y="6" width="4" height="8" rx="2"/>
    <rect x="44" y="6" width="4" height="8" rx="2"/>
    <rect x="52" y="6" width="4" height="8" rx="2"/>
  </g>
</svg>
